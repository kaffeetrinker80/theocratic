/* v0.4.0 outline table priority layout */
/* v0.4.2 issue navigator + contact validation */
.outline-table{min-width:980px;table-layout:fixed}
.outline-table th,.outline-table td{vertical-align:middle}
.outline-table th:nth-child(1),.outline-table td:nth-child(1){width:54px}
.outline-table th:nth-child(2),.outline-table td:nth-child(2){width:auto}
.outline-table th:nth-child(3),.outline-table td:nth-child(3){width:138px}
.outline-table th:nth-child(4),.outline-table td:nth-child(4){width:150px}
.outline-table th:nth-child(5),.outline-table td:nth-child(5){width:96px}
.outline-table th:nth-child(6),.outline-table td:nth-child(6){width:105px}
.outline-table th:nth-child(7),.outline-table td:nth-child(7){width:32px;text-align:center}
.outline-table th:nth-child(8),.outline-table td:nth-child(8){width:38px;text-align:center}
.outline-title-wrap{display:flex;gap:6px;align-items:center;min-width:0}
.outline-title-wrap textarea{flex:1;min-width:320px;width:100%;font-size:13.5px;line-height:1.35}
.outline-note-btn{width:28px;height:28px;padding:0;border-radius:8px;flex:none;background:#faf6ef;border:1px solid var(--line);color:var(--muted);font-weight:800}
.outline-note-btn.has-note{background:#f4ece0;color:var(--accent2);border-color:#decdb7}
.outline-note-btn:hover{background:#efe5d8;color:var(--accent2)}
.outline-change-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#d8cec0;vertical-align:middle}
.outline-change-dot.changed{background:var(--warn);box-shadow:0 0 0 3px rgba(180,118,42,.12)}
.outline-delete-x{width:28px;height:28px;padding:0;border-radius:8px;background:transparent!important;border:1px solid transparent!important;color:#b45b47!important;font-size:20px;line-height:1;font-weight:500;box-shadow:none!important}
.outline-delete-x:hover{background:#fae6e1!important;border-color:#e7bcae!important;color:#8b3a28!important}
.outline-table td select,.outline-table td input[type=date],.outline-table td input[type=number]{padding:7px 8px}
@media(max-width:1100px){.outline-table{min-width:930px}.outline-title-wrap textarea{min-width:280px}}

.imp-drop{margin-top:12px;border:1.5px dashed #d8cab4;border-radius:14px;background:#faf6ef;padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;text-align:center}
.imp-drop.over{border-color:var(--accent);background:#f6ece2}
.imp-card .card-head h3{margin:0}
.imp-target{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.imp-target select{max-width:520px;flex:1;min-width:240px}
.imp-count{font-size:11.5px;color:var(--muted)}
.imp-count.on{color:var(--accent2);font-weight:700}
.imp-block{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.imp-row{display:grid;grid-template-columns:22px 168px minmax(0,1fr) 18px minmax(0,1.2fr);gap:8px;align-items:start;padding:6px 8px;border-radius:9px;font-size:12.5px}
.imp-row:hover{background:#faf6ef}
.imp-row input[type=checkbox]{width:auto;margin:2px 0 0}
.imp-row.miss{grid-template-columns:22px minmax(0,1fr) minmax(0,260px)}
.imp-row.miss .imp-label{grid-column:2}
.imp-row.warnrow{background:#fdf5ee}
.imp-label{font-weight:650}
.imp-old{color:var(--muted);word-break:break-word}
.imp-arrow{color:var(--muted);text-align:center}
.imp-new{color:var(--accent2);font-weight:600;word-break:break-word}
.imp-row.sp{grid-template-columns:22px 260px minmax(0,1fr)}
.imp-spgroup{border:1px solid var(--line);border-radius:11px;padding:6px 4px;margin:7px 0;background:#fffdfa}
.imp-spname{padding:2px 8px 4px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.imp-badge{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;border-radius:999px;padding:2px 7px;font-weight:800}
.imp-badge.new{background:#e8f0e5;color:#3f6136}.imp-badge.ok{background:#eef1f5;color:#3f5a75}.imp-badge.miss{background:#fae6e1;color:#8b3a28}
.imp-preview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:10px}
.imp-splist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.imp-sp{border:1px solid var(--line);border-radius:11px;padding:8px 10px;background:#fffdfa}
.imp-footer{position:sticky;bottom:10px;margin-top:12px;display:flex;gap:9px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.imp-raw{max-height:52vh;overflow:auto;background:#faf6ef;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11.5px;white-space:pre-wrap;word-break:break-word}
@media(max-width:900px){.imp-row,.imp-row.sp,.imp-row.miss{grid-template-columns:22px minmax(0,1fr)}.imp-arrow{display:none}.imp-preview,.imp-splist{grid-template-columns:1fr}}

const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),clone=x=>JSON.parse(JSON.stringify(x)),uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)}),today=()=>new Date().toISOString().slice(0,10);
const dateDE=v=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v||''));return m?`${m[3]}.${m[2]}.${m[1]}`:String(v||'')},dateISO=v=>{const x=String(v||'').trim();let m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(x);if(m)return `${m[3]}-${m[2]}-${m[1]}`;m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(x);return m?x:''};

const state={master:null,outlines:null,outlineBaseline:null,fileHandle:null,dirty:false,lastSaved:null,saveMode:'none',selected:null,tab:'home',openCountries:new Set(),expandedSpeakers:new Set(),congOpen:true,showTalkTitles:(localStorage.getItem('ptcOrganizerShowTalkTitles')==='1'),outlineEditMode:false,import:{items:[],busy:false,error:'',lastRaw:''}};
function editor(){return $('editorName').value.trim()||'unknown'}
function freshMaster(){return{schemaVersion:3,generated_at:new Date().toISOString(),countries:DEFAULT_COUNTRIES.map(([code,name])=>({code,name})),circuits:[],congregations:[],people:[],changelog:[]}}
function countryName(code){const c=safeText(code).trim().toUpperCase();const found=(state.master?.countries||[]).find(x=>safeText(x?.code).trim().toUpperCase()===c);return safeText(found?.name||DEFAULT_COUNTRY_NAMES[c]||c||'Not set')}

function touch(action,detail,entity){if(action)log(action,detail,entity);state.dirty=true;renderSave();clearTimeout(touch.t);touch.t=setTimeout(save,900);try{localStorage.setItem(LS_MASTER,JSON.stringify(state.master))}catch(e){}}
async function save(){if(!state.master)return;const text=JSON.stringify(state.master,null,2);try{localStorage.setItem(LS_MASTER,text)}catch(e){};if(state.fileHandle){try{let p=await state.fileHandle.queryPermission({mode:'readwrite'});if(p!=='granted')p=await state.fileHandle.requestPermission({mode:'readwrite'});if(p==='granted'){const w=await state.fileHandle.createWritable();await w.write(text);await w.close();state.saveMode='file';state.dirty=false;state.lastSaved=new Date();renderSave();return}}catch(e){console.warn(e)}}state.saveMode='local';state.dirty=false;state.lastSaved=new Date();renderSave()}
function renderSave(){const d=$('saveDot'),t=$('saveText');if(!state.master){d.className='dot';t.textContent='No master loaded.';return}if(state.dirty){d.className='dot pending';t.textContent='Saving…';return}if(state.saveMode==='file'&&state.fileHandle){d.className='dot ok';t.innerHTML='Saved to <b>'+esc(state.fileHandle.name)+'</b>';return}d.className='dot local';t.innerHTML='<b>Browser working copy</b> · changes are saved automatically; use Export for a portable copy.'}
function normalizeMaster(m){if(!m||typeof m!=='object')throw new Error('Invalid master JSON.');m.schemaVersion=3;const defaults=new Map(DEFAULT_COUNTRIES);if(Array.isArray(m.countries)&&m.countries.length){m.countries=m.countries.map(x=>{if(typeof x==='string'){const code=safeText(x).trim().toUpperCase();return {code,name:defaults.get(code)||code}}const code=safeText(x?.code||x?.country_code||x?.iso||'').trim().toUpperCase();let name=safeText(x?.name||x?.country||x?.label||'').trim();if(!name||name.toUpperCase()===code)name=defaults.get(code)||name||code||'Unknown';return {code,name}}).filter(x=>x.code)}else m.countries=DEFAULT_COUNTRIES.map(([code,name])=>({code,name}));const seenCountries=new Set();m.countries=m.countries.filter(x=>{x.code=safeText(x.code).trim().toUpperCase();x.name=safeText(x.name||defaults.get(x.code)||x.code).trim()||x.code;if(defaults.has(x.code)&&x.name.toUpperCase()===x.code)x.name=defaults.get(x.code);if(!x.code||seenCountries.has(x.code))return false;seenCountries.add(x.code);return true});m.congregations=Array.isArray(m.congregations)?m.congregations:[];m.people=Array.isArray(m.people)?m.people:[];m.changelog=Array.isArray(m.changelog)?m.changelog.filter(x=>x&&typeof x==='object').map(e=>({id:e.id||uuid(),at:safeText(e.at||new Date().toISOString()),by:safeText(e.by||'unknown'),action:safeText(e.action||''),detail:safeText(e.detail||''),entity:e.entity||null})):[];
 // migrate nested v0.2 speakers to global people
 const known=new Map(m.people.map(p=>[p.id,p]));
 m.congregations.forEach(c=>{c.id=c.id||uuid();c.name=String(c.name||'Unnamed congregation');c.country_code=safeText(c.country_code||c.country||'').trim().toUpperCase();c.address=(c.address&&typeof c.address==='object')?c.address:{street:'',postal_code:'',city:''};c.address.street=safeText(c.address.street);c.address.postal_code=safeText(c.address.postal_code);c.address.city=safeText(c.address.city);c.geo=c.geo||{lat:null,lon:null,resolved_address:'',status:'',source:''};c.ptc=c.ptc||{name:'',jwpub_email:'',email:'',mobile:'',home:'',speaker_id:''};c.cobe=c.cobe||{name:'',phone:'',email:''};c.cobe.email=safeText(c.cobe.email||'');c.meetings=Array.isArray(c.meetings)?c.meetings.filter(x=>x&&typeof x==='object'):[];c.type=(c.type==='group'?'group':'congregation');c.parent_congregation_id=safeText(c.parent_congregation_id||'');c.status=(c.status==='dissolved'?'dissolved':'active');c.dissolved_on=safeText(c.dissolved_on||'');c.note=c.note||'';c.speaker_ids=Array.isArray(c.speaker_ids)?c.speaker_ids:[];
   (c.speakers||[]).forEach(s=>{s.id=s.id||uuid();if(!known.has(s.id)){const p={id:s.id,name:s.name||'',appointment:s.role||s.appointment||'elder',status:s.status||'active',status_since:s.status_since||'',status_reason:s.status_reason||'',congregation_id:c.id,talks:Array.isArray(s.talks)?s.talks:[],special_talks:Array.isArray(s.special_talks)?s.special_talks:[],contact:s.contact||{mobile:'',home:'',email:''},availability:s.availability||{max_distance_km:null,zoom:'both',zoom_months:'',raw:''},note:s.note||'',raw_block:s.raw_block||'',membership_history:[{congregation_id:c.id,from:'',to:null,reason:'imported'}]};m.people.push(p);known.set(p.id,p)}if(!c.speaker_ids.includes(s.id))c.speaker_ids.push(s.id)});delete c.speakers;c.meetings.forEach(me=>{me.weekday=Number(me.weekday)||0;me.time=me.time||'';if(me.address_override&&!me.venue)me.venue={enabled:true,address:{street:me.address_override,postal_code:'',city:'',country_code:c.country_code},geo:{lat:null,lon:null,resolved_address:'',status:'',source:''}};delete me.address_override;if(me.venue){me.venue.enabled=true;me.venue.address=me.venue.address||{street:'',postal_code:'',city:'',country_code:c.country_code};me.venue.geo=me.venue.geo||{lat:null,lon:null,resolved_address:'',status:'',source:''};me.venue.valid_from=me.venue.valid_from||me.valid_from||'';me.venue.valid_to=me.venue.valid_to||me.valid_to||'';me.venue.reason=me.venue.reason||me.reason||''}delete me.valid_from;delete me.valid_to;delete me.reason});if(c.meetings.length>1){const base=c.meetings[0],alt=c.meetings.find(x=>x.venue?.enabled)||c.meetings.find(x=>x!==base&&(x.valid_from||x.valid_to));if(alt&&alt!==base&&!base.venue)base.venue=alt.venue||{enabled:true,address:{street:'',postal_code:'',city:'',country_code:c.country_code},geo:{lat:null,lon:null,resolved_address:'',status:'',source:''},valid_from:alt.valid_from||'',valid_to:alt.valid_to||'',reason:alt.reason||''};c.meetings=[base]}});
 m.people.forEach(p=>{p.id=p.id||uuid();p.name=String(p.name||'');p.appointment=p.appointment||p.role||'elder';delete p.role;p.status=p.status||'active';p.congregation_id=safeText(p.congregation_id||'');p.deleted_at=safeText(p.deleted_at||'');p.deleted_from_congregation_id=safeText(p.deleted_from_congregation_id||'');p.deleted_by=safeText(p.deleted_by||'');p.deleted_reason=safeText(p.deleted_reason||'');p.talks=Array.isArray(p.talks)?p.talks:[];p.special_talks=Array.isArray(p.special_talks)?p.special_talks:[];p.contact=p.contact||{mobile:'',home:'',email:''};p.availability=p.availability||{max_distance_km:null,zoom:'both',raw:''};const z=safeText(p.availability.zoom||'').toLowerCase();p.availability.zoom=(!z||z==='no'||z==='seasonal'||z==='possible')?'both':(z==='preferred'?'beyond':(z==='in-person'||z==='in_person_only'?'in_person':z));p.membership_history=Array.isArray(p.membership_history)?p.membership_history.filter(x=>x&&typeof x==='object').map(x=>({congregation_id:safeText(x.congregation_id||''),from:safeText(x.from||''),to:x.to==null?null:safeText(x.to),reason:safeText(x.reason||'')})):[];if(p.congregation_id&&!p.membership_history.some(x=>x.congregation_id===p.congregation_id&&x.to==null))p.membership_history.push({congregation_id:p.congregation_id,from:'',to:null,reason:'migrated current assignment'})});
 m.circuits=Array.isArray(m.circuits)?m.circuits.map(x=>safeText(typeof x==='string'?x:(x?.name||x?.code||'')).trim()).filter(Boolean):[];for(const c of m.congregations){const val=safeText(c.circuit||'').trim();if(val&&!m.circuits.some(x=>x.toLowerCase()===val.toLowerCase()))m.circuits.push(val)}m.circuits=[...new Map(m.circuits.map(x=>[x.toLowerCase(),x])).values()].sort(safeCompare);
 // rebuild speaker_ids from people; IDs remain stable and a person belongs to one congregation only
 m.congregations.forEach(c=>c.speaker_ids=[]);m.people.forEach(p=>{if(p.deleted_at)return;const c=m.congregations.find(x=>x.id===p.congregation_id);if(c&&!c.speaker_ids.includes(p.id))c.speaker_ids.push(p.id)});return m}
function loadMaster(obj){let normalized;try{normalized=normalizeMaster(obj)}catch(err){throw new Error('Master migration failed: '+(err?.message||err))}state.master=normalized;state.selected=state.master.congregations.some(c=>c.id===state.selected)?state.selected:(state.master.congregations[0]?.id||null);state.tab='home';state.saveMode='local';state.dirty=false;try{renderAll()}catch(err){console.error('Master render failed',err);throw new Error('Master loaded, but the view could not be built: '+(err?.message||err))}save()}
function peopleFor(c){return state.master.people.filter(p=>!p.deleted_at&&p.congregation_id===c.id)}
function current(){return state.master?.congregations.find(c=>c.id===state.selected)||null}
function outlineInfo(n){const o=state.outlines?.outlines?.[String(n)];return o||null}
function issues(c){const out=[];if(c.status==='dissolved')return out;const add=(sev,text,tab='congregation',personId=null,kind='general')=>out.push({sev,text,tab,personId,kind,congId:c.id,congName:c.name});if(!c.ptc?.name)add('bad','No PTC on record','congregation',null,'ptc');if(c.geo?.lat==null||c.geo?.lon==null)add('bad','No coordinates','congregation',null,'geo');if(!c.meetings?.length||!c.meetings[0]?.time)add('warn','No Weekend Meeting time','congregation',null,'meeting');peopleFor(c).filter(p=>p.status!=='inactive').forEach(p=>{if(!p.talks.length&&!p.special_talks.length)add('warn',p.name+': no talks','speakers',p.id,'talks');if(!p.contact?.mobile&&!p.contact?.home&&!p.contact?.email)add('warn',p.name+': no contact details','speakers',p.id,'contact');else if(!p.contact?.email)add('info',p.name+': email address missing','speakers',p.id,'email');p.talks.forEach(n=>{const o=outlineInfo(n);if(o?.status==='do_not_use')add('bad',p.name+': #'+n+' do not use','speakers',p.id,'outline');else if(state.outlines&&!o)add('warn',p.name+': #'+n+' unknown','speakers',p.id,'outline')})});return out}
function worst(c){const a=issues(c);return a.some(x=>x.sev==='bad')?'bad':a.some(x=>x.sev==='warn')?'warn':a.length?'info':''}
function allIssues(){return state.master?state.master.congregations.flatMap(c=>issues(c)):[]}
function goToIssue(i){closeModal();state.selected=i.congId;state.tab=i.tab||'congregation';if(i.personId)state.expandedSpeakers.add(i.personId);renderAll();setTimeout(()=>{if(i.personId){const el=document.querySelector(`[data-sp-toggle=\"${i.personId}\"]`);el?.closest('.speaker-card')?.scrollIntoView({behavior:'smooth',block:'center'})}else document.getElementById('workspaceMain')?.scrollIntoView({behavior:'smooth',block:'start'})},80)}
function showIssuesModal(onlyCong=null){const arr=onlyCong?issues(onlyCong):allIssues(),bad=arr.filter(i=>i.sev==='bad').length,warn=arr.filter(i=>i.sev==='warn').length,contact=arr.filter(i=>i.kind==='contact').length;const body=arr.length?`<div class=\"issue-summary\"><span>${bad} critical</span><span>${warn} warnings</span>${contact?`<span>${contact} without contact details</span>`:''}</div><div class=\"issue-list\">${arr.map((i,n)=>`<div class=\"issue-row\"><span class=\"sev ${i.sev}\"></span><div><div class=\"issue-title\">${esc(i.text)}</div><div class=\"issue-sub\">${esc(i.congName)}${i.tab==='speakers'?' · Speaker':' · Congregation data'}</div></div><button class=\"ghost tiny\" data-goissue=\"${n}\">Go to</button></div>`).join('')}</div>`:'<div class=\"notice\">No current validation issues.</div>';const m=modal(`<h3>${onlyCong?'Issues — '+esc(onlyCong.name):'Master issues'}</h3><p class=\"small muted\">Issues flag incomplete or inconsistent master data. For speakers, at least one contact method is required. A missing email address is shown separately as a softer information item because email is the preferred contact method.</p>${body}`);m?.querySelectorAll('[data-goissue]').forEach(b=>b.onclick=()=>goToIssue(arr[Number(b.dataset.goissue)]))}
function renderFacts(){if(!state.master){['fCongs','fPeople','fSpeakers','fCountries','fIssues'].forEach(x=>$(x).textContent='–');return}const active=state.master.people.filter(p=>!p.deleted_at&&p.status==='active').length;$('fCongs').textContent=state.master.congregations.length;$('fPeople').textContent=state.master.people.filter(p=>!p.deleted_at).length;$('fSpeakers').textContent=active;$('fCountries').textContent=new Set(state.master.congregations.map(c=>c.country_code).filter(Boolean)).size;$('fOutlines').textContent=state.outlines?Object.keys(state.outlines.outlines||{}).length:'–';$('fIssues').textContent=state.master.congregations.reduce((n,c)=>n+issues(c).length,0)}

    if(/^coordinator of the body of elders/i.test(l)||/^\s*COBE\b/i.test(l)){mode='cobe';const t=l.replace(/^coordinator of the body of elders\s*:?\s*/i,'').replace(/^COBE\s*:?\s*/i,'').trim();if(t)cobeL.push(t);return}
    if(/^last updated/i.test(l)){h.last_updated=l.replace(/^last updated:?\s*/i,'').trim();return}

}
/* Table cells are vertically centred, so a contact line can sit slightly above the speaker's
   name line. Rows are therefore first grouped into table bands by vertical gap, and a band is
   only split further when it really contains more than one speaker name. */
function impSpeakerRows(bodyRows,t){
  const rows=bodyRows.filter(r=>r.text&&!/^page \d+/i.test(r.text)&&!/^printed\b/i.test(r.text)&&!/^last updated/i.test(r.text));
  if(!rows.length)return[];
  const gaps=[];for(let i=1;i<rows.length;i++)gaps.push(rows[i-1].y-rows[i].y);
  const sorted=gaps.slice().sort((a,b)=>a-b),med=sorted.length?sorted[Math.floor(sorted.length/2)]:12,limit=Math.max(med*1.75,med+4);
  const bands=[[rows[0]]];
  for(let i=1;i<rows.length;i++){
    if(rows[i-1].y-rows[i].y>limit)bands.push([rows[i]]);else bands[bands.length-1].push(rows[i]);
  }
  const cellOf=r=>{const b={name:[],contact:[],talks:[],note:[]};r.items.forEach(it=>b[impCell(it.x,t)].push(it));return{name:impJoin(b.name),contact:impJoin(b.contact),talks:impJoin(b.talks),note:impJoin(b.note)}};
  const isName=s=>!!s&&!/^\(/.test(s)&&/[A-Za-zÀ-ÿ]/.test(s);
  const recs=[];
  const push=cells=>{
    const r={name:[],contact:[],talks:[],note:[]};
    cells.slice().sort((a,b)=>b.y-a.y).forEach(x=>['name','contact','talks','note'].forEach(k=>{if(x.c[k])r[k].push(x.c[k])}));
    recs.push(r);
  };
  bands.forEach(band=>{
    const cells=band.map(r=>({y:r.y,c:cellOf(r)})),anchors=cells.filter(x=>isName(x.c.name)).map(x=>x.y);
    if(!anchors.length){
      if(!recs.length)return;
      const last=recs[recs.length-1];
      cells.slice().sort((a,b)=>b.y-a.y).forEach(x=>['name','contact','talks','note'].forEach(k=>{if(x.c[k])last[k].push(x.c[k])}));
      return;
    }
    if(anchors.length===1){push(cells);return}
    const groups=anchors.map(()=>[]);
    cells.forEach(x=>{
      let best=0,dist=Infinity;
      anchors.forEach((a,i)=>{const d=Math.abs(a-x.y);if(d<dist){dist=d;best=i}});
      groups[best].push(x);
    });
    groups.forEach(g=>{if(g.length)push(g)});
  });
  return recs.map(r=>{
    const rawName=r.name.join(' ').replace(/\s+/g,' ').trim();
    const ap=/\((elder|ms|ministerial servant)\)/i.exec(rawName);
    const name=rawName.replace(/\((elder|ms|ministerial servant)\)/ig,'').replace(/\s+/g,' ').replace(/[,;]$/,'').trim();
    const talksTxt=impGlue(r.talks);
    const special=[...new Set((talksTxt.match(/S-\d{1,3}-\d{2}(?:_[A-Za-z]{1,3})?/gi)||[]).map(x=>x.toUpperCase()))];
    const talks=[...new Set((talksTxt.replace(/S-\d{1,3}-\d{2}(?:_[A-Za-z]{1,3})?/gi,' ').match(/\d{1,3}/g)||[]).map(Number).filter(n=>n>0&&n<400))].sort((a,b)=>a-b);
    return{name,appointment:ap&&/^m/i.test(ap[1])?'ms':'elder',contact:impContact(r.contact),talks,special,note:impGlue(r.note),raw:[rawName,impGlue(r.contact),talksTxt].filter(Boolean).join(' · ')};
  }).filter(s=>s.name);
}

/* ---------- KHS Public Speakers PDF parsing ---------- */
function impKhsAvailability(raw){
  const t=safeText(raw).trim(),a={max_distance_km:null,zoom:'both',raw:''};
  const km=/(?:<|up to|about|approx\.?|max\.?\s*)\s*(\d{1,4})\s*km/i.exec(t)||/(\d{1,4})\s*km/i.exec(t);
  if(km)a.max_distance_km=Number(km[1]);
  if(/zoom\s*only/i.test(t))a.zoom='only';
  else if(/(?:or|beyond|over|outside).*zoom|zoom.*(?:beyond|over|outside)|\bkm\s*or\s*zoom/i.test(t))a.zoom='beyond';
  else if(/in[- ]?person\s*only|no\s*zoom/i.test(t))a.zoom='no';
  a.raw=t;
  return a;
}
function impKhsSpeakerName(raw){
  let x=safeText(raw).replace(/\s+/g,' ').trim(),note='';
  const markers=[/\s+(?=<\s*\d+\s*km\b)/i,/\s+(?=-\s*)/];
  let cut=-1;
  markers.forEach(re=>{const m=re.exec(x);if(m&&(cut<0||m.index<cut))cut=m.index});
  if(cut>=0){note=x.slice(cut).replace(/^\s*-\s*/,'').trim();x=x.slice(0,cut).trim()}
  return{name:x,note};
}
function impParseKhsPages(pages,file){
  const raw=[],out=[];let cur=null;
  pages.forEach((items,idx)=>{
    const rows=impRows(items);raw.push('───── '+file.name+' · page '+(idx+1)+' ─────',...rows.map(r=>r.text));
    const all=rows.map(r=>r.text).join(' ');
    if(!/\bPublic Speakers\b/i.test(all))return;
    let rightX=null;
    rows.forEach(r=>r.items.forEach(it=>{if(rightX==null&&/^public talk coordinator$/i.test(it.s.trim()))rightX=it.x}));
    if(rightX==null){const xs=rows.flatMap(r=>r.items.map(i=>i.x));rightX=xs.length?(Math.min(...xs)+Math.max(...xs))/2:300}
    const split=r=>({left:impJoin(r.items.filter(i=>i.x<rightX-8)),right:impJoin(r.items.filter(i=>i.x>=rightX-8))});
    const lr=rows.map(r=>Object.assign({row:r},split(r)));
    const congLabel=lr.findIndex(z=>/^congregation$/i.test(z.left));
    const circuitLabel=lr.findIndex(z=>/^circuit$/i.test(z.left));
    const eldersIdx=lr.findIndex(z=>/^elders$/i.test(z.left)||/^elders$/i.test(z.row.text));
    if(congLabel<0||eldersIdx<0)return;
    const h={name:'',street:'',postal_code:'',city:'',circuit:'',phone:'',last_updated:'',meetings:[],meeting:null,
      ptc:{name:'',mobile:'',home:'',email:'',jwpub_email:''},cobe:{name:'',mobile:'',home:'',email:''}};
    const upd=/last updated\s*:\s*([^\n]+)/i.exec(rows.slice(0,3).map(r=>r.text).join(' '));if(upd)h.last_updated=upd[1].trim();
    const headerRows=lr.slice(congLabel+1,eldersIdx);
    const leftLines=[],ptcLines=[],cobeLines=[];let mode='ptc';
    headerRows.forEach(z=>{
      if(/^circuit$/i.test(z.left)){mode='cobe';return}
      if(z.left)leftLines.push(z.left);
      if(z.right){
        if(/^coordinator of the body of elders$/i.test(z.right)){mode='cobe';return}
        if(/^public talk coordinator$/i.test(z.right)){mode='ptc';return}
        (mode==='cobe'?cobeLines:ptcLines).push(z.right);
      }
    });
    if(leftLines.length){h.name=leftLines.shift().trim()}
    const cleanLeft=leftLines.filter(x=>!/^germany$|^austria$|^switzerland$|^belgium$|^netherlands$|^france$|^italy$|^spain$|^portugal$|^united kingdom$/i.test(x));
    cleanLeft.forEach(l=>{
      if(/^EU-[A-Z0-9-]+$/i.test(l)){h.circuit=l.trim();return}
      const meet=impMeetingFrom(l);if(meet.weekday&&meet.time){h.meetings.push({year:0,raw:l,...meet});return}
      if(/^\+?[\d][\d\s()\/.\-]{5,}$/.test(l)){if(!h.phone)h.phone=l.trim();return}
      const cm=/^([A-Z]{0,2}[- ]?\d{3,6})\s+(.+)$/.exec(l);if(cm){h.postal_code=cm[1].trim();h.city=cm[2].trim();return}
      if(!h.street)h.street=l.trim();
    });
    if(circuitLabel>=0){const after=lr[circuitLabel+1];if(after?.left&&/^EU-/i.test(after.left))h.circuit=after.left.trim()}
    h.meeting=h.meetings[0]||null;
    if(ptcLines.length)h.ptc=impContact(ptcLines);
    if(cobeLines.length)h.cobe=impContact(cobeLines);
    cur=Object.assign(h,{speakers:[],warnings:[],source:{file:file.name,page:idx+1,format:'khs'},raw:['───── page '+(idx+1)+' ─────',...rows.map(r=>r.text)]});
    /* speaker area: KHS has name/contact in the left column and outlines in a second column */
    const body=rows.slice(eldersIdx+1).filter(r=>r.text&&!/^page\s+\d+/i.test(r.text)&&!/^printed\b/i.test(r.text));
    let talkX=null;
    for(const r of body){
      const candidates=r.items.filter(it=>/^\d{1,3}(?:,|$)/.test(it.s.trim()));
      if(candidates.length){talkX=Math.min(...candidates.map(it=>it.x));break}
    }
    if(talkX==null)talkX=rightX;
    let sp=null;
    const finish=()=>{if(!sp)return;sp.talks=[...new Set(sp.talks)].sort((a,b)=>a-b);sp.contact=impContact(sp.contactLines);delete sp.contactLines;cur.speakers.push(sp);sp=null};
    body.forEach(r=>{
      const left=impJoin(r.items.filter(i=>i.x<talkX-8)),right=impJoin(r.items.filter(i=>i.x>=talkX-8));
      const nums=(right.match(/\d{1,3}/g)||[]).map(Number).filter(n=>n>0&&n<400);
      const isContact=/^(?:m|h)\s*:/i.test(left)||/@/.test(left);
      const isName=left&&/[A-Za-zÀ-ÿ]/.test(left)&&!isContact&&!/^elders$/i.test(left);
      if(isName){
        finish();const nn=impKhsSpeakerName(left),av=impKhsAvailability(nn.note);
        sp={name:nn.name,appointment:'elder',contactLines:[],talks:nums,special:[],note:nn.note,availability:av,raw:left+(right?' · '+right:'')};
      }else if(sp){
        if(left)sp.contactLines.push(left);if(nums.length)sp.talks.push(...nums);if(right&&!nums.length)sp.note=[sp.note,right].filter(Boolean).join(' · ');
      }
    });finish();
    cur.country_code=impGuessCountry([cur.ptc.mobile,cur.ptc.home,cur.cobe.mobile,cur.cobe.home,cur.phone,...cur.speakers.map(s=>s.contact.mobile+' '+s.contact.home)].join(' '));
    if(!cur.speakers.length)cur.warnings.push('No speaker rows recognised in this KHS PDF.');
    if(!cur.meeting||!cur.meeting.time)cur.warnings.push('No Weekend Meeting time recognised.');
    if(!cur.ptc.name)cur.warnings.push('No Public Talk Coordinator recognised.');
    if(!cur.country_code)cur.warnings.push('Country could not be derived from the phone numbers — please select it.');
    out.push(cur);
  });
  if(!out.length)raw.unshift('No KHS congregation header recognised.');
  return{congs:out,raw:raw.join('\n')};
}

async function impParseFile(file){
  const pages=await impPdfPages(file),firstText=(pages[0]?impRows(pages[0]).map(r=>r.text).join(' '):'');
  if(/\bPublic Speakers\b/i.test(firstText)&&/\bElders\b/i.test(firstText)&&/Last updated/i.test(firstText))return impParseKhsPages(pages,file);
  const out=[],raw=[];
  let cur=null;
  pages.forEach((items,idx)=>{
    const rows=impRows(items);
    raw.push('───── '+file.name+' · page '+(idx+1)+' ─────',...rows.map(r=>r.text));
    const t=impTable(rows),hdr=impHeader(t?rows.slice(0,t.i):rows);
    if(hdr.name&&(!cur||impNorm(hdr.name)!==impNorm(cur.name))){
      cur=Object.assign(hdr,{speakers:[],warnings:[],source:{file:file.name,page:idx+1},raw:[]});
      out.push(cur);
    }
    if(!cur)return;
    cur.raw.push('───── page '+(idx+1)+' ─────',...rows.map(r=>r.text));
    if(t)cur.speakers.push(...impSpeakerRows(rows.slice(t.i+1),t));
  });
  out.forEach(c=>{
    c.country_code=impGuessCountry([c.ptc.mobile,c.ptc.home,c.cobe.mobile,c.cobe.home,c.phone,...c.speakers.map(s=>s.contact.mobile+' '+s.contact.home)].join(' '));
    if(!c.speakers.length)c.warnings.push('No speaker rows recognised in this PDF.');
    if(!c.meeting||!c.meeting.time)c.warnings.push('No Weekend Meeting time recognised.');
    if(!c.ptc.name)c.warnings.push('No Public Talk Coordinator recognised.');
    if(!c.country_code)c.warnings.push('Country could not be derived from the phone numbers — please select it.');
    const others=c.meetings.filter(m=>m!==c.meeting&&m.time&&(m.time!==c.meeting?.time||m.weekday!==c.meeting?.weekday));
    others.forEach(m=>c.warnings.push(`Different meeting time listed for ${m.year||'another year'}: ${DAYS[m.weekday]||''} ${m.time} (not imported — the Organizer stores one Weekend Meeting).`));
    const seen=new Set();
    c.speakers.forEach(s=>{const k=impNorm(s.name);if(seen.has(k))c.warnings.push('Speaker appears twice in the PDF: '+s.name);seen.add(k)});
  });
  if(!out.length)raw.unshift('No congregation header recognised.');
  return{congs:out,raw:raw.join('\n')};
}

/* ---------- matching + difference ---------- */
function impCandidates(p){
  return state.master.congregations.filter(c=>c.status!=='dissolved').map(c=>{
    let s=impSim(c.name,p.name)*100;
    if(impNorm(c.name)===impNorm(p.name))s=140;
    if(p.city&&impNorm(c.address?.city)===impNorm(p.city))s+=22;
    if(p.postal_code&&safeText(c.address?.postal_code).trim()===p.postal_code)s+=10;
    if(p.ptc.name&&impNorm(c.ptc?.name)===impNorm(p.ptc.name))s+=18;
    if(p.circuit&&safeText(c.circuit).toUpperCase()===p.circuit.toUpperCase())s+=8;
    return{c,s:Math.round(s)};
  }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,12);
}

    if(s.availability?.zoom&&s.availability.zoom!=='both'&&safeText(m.availability?.zoom||'both')!==s.availability.zoom)ch.push({key:'zoom',label:'Meeting mode',cur:safeText(m.availability?.zoom||'both'),val:s.availability.zoom,apply:true,set:p=>{p.availability=p.availability||{};p.availability.zoom=s.availability.zoom;p.availability.raw=s.availability.raw||p.availability.raw||''}});
    const adds=s.talks.filter(n=>!m.talks.includes(n)),rem=m.talks.filter(n=>!s.talks.includes(n)),
          spAdd=(s.special||[]).filter(code=>!(m.special_talks||[]).some(x=>safeText(x.code||x.raw).toUpperCase()===code));
    d.speakers.push({kind:'match',src:s,person:m,changes:ch,adds,rem,spAdd,addApply:true,remApply:false});
  });
  pool.filter(x=>!used.has(x.id)).forEach(x=>d.missing.push({person:x,action:'keep'}));
  return d;
}
function impPending(item){
  if(item.applied||item.target==='skip')return 0;
  if(item.target==='new')return 1+item.parsed.speakers.length;
  const d=item.diff||{fields:[],speakers:[],missing:[]};
  return d.fields.filter(f=>f.apply).length
    +d.speakers.reduce((n,s)=>n+(s.kind==='new'?(s.apply?1:0):s.changes.filter(x=>x.apply).length+((s.addApply&&s.adds.length)?1:0)+((s.remApply&&s.rem.length)?1:0)+((s.addApply&&s.spAdd.length)?1:0)),0)
    +d.missing.filter(m=>m.action!=='keep').length;
}

/* ---------- apply ---------- */
function impCreatePerson(c,s){
  const p={id:uuid(),name:s.name,appointment:s.appointment||'elder',status:'active',status_reason:'',status_since:'',congregation_id:c.id,
    talks:s.talks.slice(),special_talks:(s.special||[]).map(code=>({code,raw:code})),
    contact:{mobile:s.contact.mobile||'',home:s.contact.home||'',email:s.contact.email||''},
    availability:{max_distance_km:s.availability?.max_distance_km??null,zoom:s.availability?.zoom||'both',raw:s.availability?.raw||''},note:s.note||'',
    membership_history:[{congregation_id:c.id,from:today(),to:null,reason:'imported from speaker list'}]};
  state.master.people.push(p);
  c.speaker_ids=c.speaker_ids||[];
  if(!c.speaker_ids.includes(p.id))c.speaker_ids.push(p.id);
  log('import_person',`${p.name} imported into ${c.name}`,{cong:c.id,name:c.name,person:p.id});
  return p;
}
function impLinkPtc(c){
  if(!c.ptc?.name||c.ptc.speaker_id)return;
  const m=state.master.people.find(p=>!p.deleted_at&&p.congregation_id===c.id&&impNorm(p.name)===impNorm(c.ptc.name));
  if(m)c.ptc.speaker_id=m.id;
}
function impApplyAll(){
  const items=state.import.items.filter(i=>!i.applied&&i.target!=='skip');
  if(!items.length)return;
  const total=items.reduce((n,i)=>n+impPending(i),0);
  if(!total)return alert('Nothing selected to apply.');
  if(!confirm(`Apply ${total} change${total===1?'':'s'} to the master?\n\nEverything is written to the history and can be reviewed there.`))return;
  let n=0;
  items.forEach(item=>{
    const p=item.parsed;
    if(item.target==='new'){
      const cc=item.country||p.country_code||'';
      const c={id:uuid(),name:p.name||'Imported congregation',type:'congregation',parent_congregation_id:'',country_code:cc,circuit:p.circuit||'',phone:p.phone||'',
        status:'active',dissolved_on:'',address:{street:p.street||'',postal_code:p.postal_code||'',city:p.city||''},
        geo:{lat:null,lon:null,resolved_address:'',status:'',source:''},
        meetings:[{weekday:p.meeting?.weekday||7,time:p.meeting?.time||'',venue:null}],
        ptc:{name:p.ptc.name||'',jwpub_email:p.ptc.jwpub_email||'',email:p.ptc.email||'',mobile:p.ptc.mobile||'',home:p.ptc.home||'',speaker_id:''},
        cobe:{name:p.cobe.name||'',phone:p.cobe.mobile||p.cobe.home||'',email:p.cobe.email||''},
        note:'',speaker_ids:[],
        import_source:{format:p.source?.format||'nws',file:p.source.file,page:p.source.page,at:new Date().toISOString(),last_updated:p.last_updated||''}};
      state.master.circuits=state.master.circuits||[];
      if(c.circuit&&!state.master.circuits.some(x=>x.toLowerCase()===c.circuit.toLowerCase())){state.master.circuits.push(c.circuit);state.master.circuits.sort(safeCompare)}
      state.master.congregations.push(c);
      log('import_congregation',`${c.name} created from ${p.source.file}`,{cong:c.id,name:c.name});n++;
      p.speakers.forEach(s=>{impCreatePerson(c,s);n++});
      impLinkPtc(c);
      if(c.country_code)state.openCountries.add(c.country_code);
      item.createdId=c.id;
    }else{
      const c=state.master.congregations.find(x=>x.id===item.target);
      if(!c)return;
      const d=item.diff;
      d.fields.filter(f=>f.apply).forEach(f=>{f.set(c,f.val);log('import_edit',`${f.label}: "${f.cur||'–'}" → "${f.val}"`,{cong:c.id,name:c.name});n++});
      d.speakers.forEach(sp=>{
        if(sp.kind==='new'){if(sp.apply){impCreatePerson(c,sp.src);n++}return}
        const per=sp.person;
        sp.changes.filter(x=>x.apply).forEach(x=>{x.set(per,x.val);log('import_edit',`${per.name}: ${x.label} "${x.cur||'–'}" → "${x.val}"`,{cong:c.id,name:c.name,person:per.id});n++});
        if(sp.addApply&&sp.adds.length){per.talks=[...new Set([...per.talks,...sp.adds])].sort((a,b)=>a-b);log('import_talks',`${per.name}: added #${sp.adds.join(', #')}`,{cong:c.id,name:c.name,person:per.id});n++}
        if(sp.remApply&&sp.rem.length){per.talks=per.talks.filter(x=>!sp.rem.includes(x));log('import_talks',`${per.name}: removed #${sp.rem.join(', #')}`,{cong:c.id,name:c.name,person:per.id});n++}
        if(sp.addApply&&sp.spAdd.length){per.special_talks=per.special_talks||[];sp.spAdd.forEach(code=>per.special_talks.push({code,raw:code}));log('import_talks',`${per.name}: added ${sp.spAdd.join(', ')}`,{cong:c.id,name:c.name,person:per.id});n++}
      });
      d.missing.filter(m=>m.action!=='keep').forEach(m=>{
        const per=m.person,old=per.status;
        per.status=m.action==='left'?'inactive':'paused';
        if(per.status==='paused'&&!per.status_reason)per.status_reason='not listed in '+p.source.file;
        log('import_status',`${per.name}: status "${old}" → "${per.status}" (not listed in the imported PDF)`,{cong:c.id,name:c.name,person:per.id});n++;
      });
      c.import_source={format:p.source?.format||'nws',file:p.source.file,page:p.source.page,at:new Date().toISOString(),last_updated:p.last_updated||''};
      impLinkPtc(c);
    }
    item.applied=true;
  });
  touch('import_pdf',`Speaker list PDF import applied · ${n} change${n===1?'':'s'}`);
  renderAll();
}

/* ---------- UI ---------- */
async function impLoadFiles(files){
  if(!state.master){alert('Open or create a master first.');return}
  state.import.busy=true;state.import.error='';if(state.tab==='import')renderImport();
  try{
    for(const f of files){
      const{congs,raw}=await impParseFile(f);
      if(!congs.length){state.import.error=`No congregation recognised in "${f.name}". Use "Show extracted text" to check the layout.`;state.import.lastRaw=raw;continue}
      congs.forEach(parsed=>{
        const cand=impCandidates(parsed),best=cand[0];
        const item={id:uuid(),parsed,cand,target:best&&best.s>=70?best.c.id:'new',country:parsed.country_code||'',open:true,applied:false,rawText:parsed.raw.join('\n')};
        item.diff=impDiff(item);
        state.import.items.push(item);
      });
    }
  }catch(err){state.import.error=safeText(err?.message||err)}
  state.import.busy=false;if(state.tab==='import')renderImport();else{state.tab='import';renderWorkspace()}
}

}

><button class="ghost" id="exportMasterAdmin">Export master JSON</button></div><div id="adminResult" style="margin-top:10px"></div></div></div></div>`;$('addCountry').onclick=()=>{const code=(prompt('ISO country code (2 letters):')||'').trim().toUpperCase(),name=(code&&(prompt('Country name:')||'').trim())||'';if(!/^[A-Z]{2}$/.test(code)||!name)return;if(state.master.countries.some(x=>x.code===code))return alert('Country already exists.');state.master.countries.push({code,name});touch('add_country',`${name} (${code}) added`);renderAdmin();renderTree();renderFacts()};$('countries').querySelectorAll('[data-country-name]').forEach(el=>el.onchange=()=>{const x=state.master.countries.find(z=>z.code===el.dataset.countryName),old=x.name;x.name=el.value.trim();touch('edit_country',`${old} → ${x.name}`);renderTree()});$('countries').querySelectorAll('[data-country-code]').forEach(el=>el.onchange=()=>{const old=el.dataset.countryCode,n=el.value.trim().toUpperCase();if(!/^[A-Z]{2}$/.test(n)||state.master.countries.some(x=>x.code===n&&x.code!==old)){alert('Use a unique 2-letter ISO code.');renderAdmin();return}state.master.congregations.forEach(c=>{if(c.country_code===old)c.country_code=n;c.meetings.forEach(m=>{if(m.venue?.address?.country_code===old)m.venue.address.country_code=n})});const x=state.master.countries.find(z=>z.code===old);x.code=n;touch('edit_country',`${old} → ${n}`);renderAll()});$('countries').querySelectorAll('[data-country-del]').forEach(b=>b.onclick=()=>{const code=b.dataset.countryDel;if(state.master.congregations.some(c=>c.country_code===code))return alert('This country is still used by one or more congregations.');if(confirm(`Delete ${countryName(code)}?`)){state.master.countries=state.master.countries.filter(x=>x.code!==code);touch('delete_country',`${code} deleted`);renderAdmin();renderFacts()}});$('addCircuit').onclick=()=>{const name=(prompt('Circuit name:')||'').trim();if(!name)return;if((state.master.circuits||[]).some(x=>x.toLowerCase()===name.toLowerCase()))return alert('This circuit already exists.');state.master.circuits=state.master.circuits||[];state.master.circuits.push(name);state.master.circuits.sort(safeCompare);touch('add_circuit',`${name} added`);renderAdmin()};$('circuits').querySelectorAll('[data-circuit-old]').forEach(el=>el.onchange=()=>{const old=el.dataset.circuitOld,n=el.value.trim();if(!n){alert('Circuit name cannot be empty.');renderAdmin();return}if((state.master.circuits||[]).some(x=>x.toLowerCase()===n.toLowerCase()&&x.toLowerCase()!==old.toLowerCase())){alert('A circuit with this name already exists.');renderAdmin();return}const idx=state.master.circuits.indexOf(old);if(idx>=0)state.master.circuits[idx]=n;state.master.congregations.forEach(c=>{if(c.circuit===old)c.circuit=n});state.master.circuits.sort(safeCompare);touch('edit_circuit',`${old} → ${n}`);renderAdmin();renderTree()});$('validateAll').onclick=()=>{const arr=state.master.congregations.flatMap(c=>issues(c).map(i=>`${c.name}: ${i.text}`));$('adminResult').innerHTML=arr.length?`<div class="notice warn">${arr.map(esc).join('<br>')}</div>`:'<div class="notice">No current validation issues.</div>'};$('dupCheck').onclick=()=>{const pairs=[];const dupPeople=state.master.people.filter(p=>!p.deleted_at);for(let i=0;i<dupPeople.length;i++)for(let j=i+1;j<dupPeople.length;j++){const a=dupPeople[i],b=dupPeople[j],na=safeText(a?.name).toLowerCase().replace(/[^a-z0-9]/g,''),nb=safeText(b?.name).toLowerCase().replace(/[^a-z0-9]/g,'');if(na&&nb&&(na===nb||na.includes(nb)||nb.includes(na)))pairs.push(`${a.name} ↔ ${b.name}`)}$('adminResult').innerHTML=pairs.length?`<div class="notice warn"><b>Possible duplicates</b><br>${pairs.map(esc).join('<br>')}</div>`:'<div class="notice">No obvious duplicate names found.</div>'};$('exportMasterAdmin').onclick=exportMaster}
function renderHistory(){const logs=state.master.changelog||[];$('tabContent').innerHTML=`<div class="card"><div class="card-head"><h3>Master History</h3><span class="spacer"></span><button class="ghost tiny" id="exportLog">Export log</button><button class="danger tiny" id="clearLog">Clear all</button></div><div class="card-body"><div class="notice">This is the central maintenance history. Congregation pages show only the entries that affect that congregation.</div><div class="log-list" style="margin-top:8px">${logs.slice(0,1000).map(e=>`<div class="log-line"><span>${new Date(e.at).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}</span><span><b>${esc(e.by)}</b> · ${esc(e.detail)}${e.entity?.name?` <span class="muted">(${esc(e.entity.name)})</span>`:''}</span><button class="danger tiny" data-logdel="${esc(e.id||'')}">×</button></div>`).join('')||'<div class="empty">No history entries.</div>'}</div></div></div>`;$('clearLog').onclick=()=>{if(confirm('Clear the entire maintenance history?\n\nCurrent master data will remain unchanged.')){state.master.changelog=[];touch();renderHistory()}};$('exportLog').onclick=()=>download('ptc-history_'+today()+'.txt',logs.map(e=>`${e.at}	${e.by}	${e.detail}`).join('\r\n'));$('tabContent').querySelectorAll('[data-logdel]').forEach(b=>b.onclick=()=>{const entry=state.master.changelog.find(e=>e.id===b.dataset.logdel);if(!entry)return;if(!confirm('Delete this history entry?\n\n'+(entry.detail||'This action cannot be undone.')))return;state.master.changelog=state.master.changelog.filter(e=>e.id!==b.dataset.logdel);touch();renderHistory()})}
function showHelp(){
  const sections=[
    {title:'Home & navigation',kicker:'Start here',body:`<p>The <b>house icon</b> opens the global Home view. You can also click <b>PTC Organizer</b> in the header at any time. Home is independent of the congregation currently selected on the left.</p><ul><li>Use Home for an overview of congregations, groups, people, unassigned speakers and data health.</li><li><b>Outlines</b>, <b>Master History</b> and <b>Administration</b> are global areas.</li><li>Selecting a congregation or group on the left opens its local <b>Congregation</b> and <b>Speakers</b> tabs.</li></ul>`},
    {title:'Congregations & groups',kicker:'Local master data',body:`<p>Each record is defined as either a <b>Congregation</b> or a <b>Group</b>. Groups can be linked to the congregation they are attached to. The local editor stores the data needed by the PTC master without trying to manage local PTC policies.</p><ul><li>Address and coordinates belong to the record itself.</li><li>Meeting periods can describe permanent or temporary arrangements.</li><li>Country and circuit are selected from centrally maintained lists.</li><li>The normal status is shown as <b>Active</b>; dissolution is handled as a deliberate action instead of a routine dropdown.</li></ul>`},
    {title:'Speakers',kicker:'One person · one ID',body:`<p>Speakers are global people with stable IDs. A person exists only once in the master, even when he changes congregation.</p><ul><li>Talk numbers, contacts, notes and availability stay attached to the person.</li><li><b>In-person & Zoom</b> is the standard participation setting. Use <b>Zoom beyond distance</b>, <b>Zoom only</b> or <b>In-person only</b> only when that restriction is explicitly known.</li><li><b>Move to congregation…</b> reassigns the existing person rather than creating a copy.</li><li>The final, separated choice in that dialog is <b>Unassigned Speakers</b>.</li><li>Talk chips show only the number; hover for title and outline status. The remove control appears only on hover.</li></ul>`},
    {title:'Unassigned speakers',kicker:'Keep people without forcing an assignment',body:`<p>The Unassigned Speakers pool is for people who should remain in the master but are currently not assigned to an English congregation or group.</p><ul><li>Dissolving a congregation or group moves its speakers here automatically.</li><li>You can also move an individual speaker here manually from his speaker card.</li><li>Nothing about the person is deleted: ID, talks, contacts and membership history stay intact.</li><li>An unassigned person can later be assigned to another congregation without recreating him.</li></ul>`},
    {title:'Recycle Bin',kicker:'Safe speaker deletion',body:`<p>Deleting a speaker first moves him to the <b>Recycle Bin</b>. This is separate from Unassigned Speakers.</p><ul><li>ID, talks, contacts, notes and membership history are retained.</li><li><b>Restore</b> returns the speaker to the original congregation if it is still active; otherwise he is restored as Unassigned.</li><li><b>Move to congregation/group…</b> restores the same person directly into a different record.</li><li><b>Delete permanently</b> is available only inside the Recycle Bin and requires two confirmations.</li></ul>`},
    {title:'Membership history',kicker:'Automatic history',body:`<p>Membership history records where a person has been assigned over time. It is maintained automatically when you move or reassign a speaker.</p><ul><li>The previous membership is closed when the person leaves.</li><li>A new current membership is opened when he is assigned elsewhere.</li><li>Moving a person to Unassigned closes the previous membership without inventing a new congregation.</li><li>This history belongs to the person and survives congregation changes.</li></ul>`},
    {title:'Outlines',kicker:'Global foundation',body:`<p>Outline Management is global and independent of any congregation. It maintains the separate <b>outline-data.json</b> used for talk titles and statuses.</p><ul><li>Outline data is read-only by default. Use <b>✎ Edit official data</b> and confirm the warning before changing title, status, effective date, replacement or maintenance notes.</li><li>Only make changes that reflect official S-99 information or announced updates.</li><li>Import an S-99 PDF for comparison before applying title changes.</li><li>Existing maintenance data is kept separate from the congregation master.</li><li>The Organizer cross-checks speaker talk numbers against the current outline data and can show affected speakers.</li></ul>`},
    {title:'Import PDF',kicker:'NW Scheduler speaker lists',body:`<p><b>Import PDF</b> reads a congregation's <b>Public Speakers List</b> PDF (NW Scheduler or KHS layout; detected automatically), compares it with the master and shows the exact differences before anything is written.</p><ul><li>One file may contain several congregations, and one congregation may span several pages.</li><li>The Organizer proposes a target record by name, city, post code, PTC and circuit. You can always override it, create a new congregation, or skip the entry.</li><li>Every difference has its own checkbox. Empty PDF values never overwrite existing master data.</li><li>Talk numbers found in the PDF are offered as additions; talks missing from the PDF are offered as removals and are switched off by default.</li><li>Speakers in the master that do not appear in the PDF can be kept, marked <b>paused</b> or marked <b>left</b> — they are never deleted.</li><li>Country is derived from the phone country codes and can be corrected before a new congregation is created.</li><li>KHS notes such as <b>&lt;50km or Zoom</b> are retained; a clear distance + Zoom rule is also mapped to the speaker availability fields.</li><li><b>Show extracted text</b> reveals what the parser actually read from the PDF, which is the quickest way to check an unrecognised field.</li><li>All applied changes are written to the Master History.</li></ul>`},
    {title:'Master History',kicker:'Global audit trail',body:`<p>Master History collects changes across the complete PTC master. Local congregation history is simply a filtered view of the same central log.</p><ul><li>Use it to see who changed what and when.</li><li>Moving a speaker is logged as a real reassignment.</li><li>Deleting a log entry asks for confirmation and changes only the history entry — not the current master data.</li><li>The history can be exported with the master for handover and review.</li></ul>`},
    {title:'Countries & circuits',kicker:'Central reference lists',body:`<p>Countries and circuits are maintained centrally in <b>Administration</b> so local records do not create spelling variants.</p><ul><li>Congregations and groups select a country and circuit from dropdowns.</li><li>Country codes remain visible as a compact reference, while the country name is the primary label.</li><li>Renaming a circuit centrally updates the records currently using that circuit name.</li><li>Circuit deletion/merge is intentionally not part of the current test version.</li></ul>`},
    {title:'Temporary venues',kicker:'Date-aware locations',body:`<p>The regular Weekend Meeting has one day and time. A temporary venue is added separately only when the meeting location changes for a defined period, for example during Kingdom Hall renovation.</p><ul><li>Street, post code, city and country can be stored separately.</li><li>The temporary venue can have its own coordinates.</li><li>The temporary venue carries its own <b>from / until</b> dates in German display format (DD.MM.YYYY).</li></ul>`},
    {title:'Dissolved records',kicker:'Preserve instead of delete',body:`<p>Marking a congregation or group as <b>Dissolved</b> keeps the historical record instead of deleting it.</p><ul><li>Its speakers are moved to Unassigned Speakers, not deleted.</li><li>The dissolved record remains available from Home.</li><li>If the record is restored later, speakers stay unassigned until you deliberately reassign them.</li></ul>`},
    {title:'Saving & export',kicker:'Working copy & handover',body:`<p>The Organizer keeps a browser working copy automatically. In supported browsers you can additionally connect a JSON file for direct writing.</p><ul><li><b>Open PTC Master</b> loads an existing master file.</li><li><b>Open PTC Master</b> also connects that file for automatic writing in Chrome/Edge.</li><li>Export remains the portable way to back up or hand the current master to another editor.</li><li>Outline data is exported separately as <b>outline-data.json</b>.</li><li><b>NWS-compatible CSV</b> uses a two-step handover without touching the encrypted NWS backup format: <b>1.</b> export/import <b>Neighbor Congregations</b> first so NWS creates the congregation structure; <b>2.</b> select that Neighbor Congregation in NWS and import its matching <b>Public Speakers</b> CSV. For country/all speaker exports, the Organizer creates a ZIP with one clearly named CSV per congregation.</li></ul>`},
    {title:'Validation',kicker:'Data quality',body:`<p>Validation is designed to catch maintenance problems before they become PTC Tool problems.</p><ul><li>Missing PTC, coordinates or meeting information can be flagged.</li><li>Unknown, retiring or do-not-use outline assignments can be identified.</li><li>Duplicate checks help spot people who may have been entered more than once.</li><li>Validation never silently deletes or rewrites records.</li></ul>`}
  ];
  modal(`<h3>Help</h3><div class="small muted" style="margin:4px 0 14px">Choose a topic on the left. Only the selected topic is shown.</div><div class="help-grid"><div class="help-nav">${sections.map((x,i)=>`<button type="button" data-help="${i}" class="${i===0?'active':''}">${esc(x.title)}</button>`).join('')}</div><div class="help-pane">${sections.map((x,i)=>`<section class="help-section ${i===0?'active':''}" data-help-section="${i}"><span class="help-kicker">${esc(x.kicker)}</span><h4>${esc(x.title)}</h4>${x.body}</section>`).join('')}</div></div>`,m=>{
    const buttons=[...m.querySelectorAll('[data-help]')],panes=[...m.querySelectorAll('[data-help-section]')];
    buttons.forEach(b=>b.onclick=()=>{
      const id=b.dataset.help;
      buttons.forEach(x=>x.classList.toggle('active',x===b));
      panes.forEach(x=>x.classList.toggle('active',x.dataset.helpSection===id));
    });
  })
}

function nwsCsvEscape(v){
  const s=safeText(v).replace(/\r?\n/g,'\r\n');
  return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function nwsSplitName(full){
  const parts=safeText(full).trim().replace(/\s+/g,' ').split(' ').filter(Boolean);
  if(!parts.length)return['',''];
  if(parts.length===1)return[parts[0],''];
  return[parts.slice(0,-1).join(' '),parts.at(-1)];
}
function nwsPhone(primary,secondary){return[primary,secondary].map(x=>safeText(x).trim()).filter(Boolean).join(', ')}
function nwsAddress(c){
  const a=c.address||{},street=safeText(a.street).trim(),postal=safeText(a.postal_code).trim(),city=safeText(a.city).trim();
  const line2=[postal,city].filter(Boolean).join(' ');
  return[street,line2].filter(Boolean).join('\r\n');
}
function buildNwsNeighborCsv(congregations){
  const headers=['Name','Circuit','KingdomHallAddress','WeekendMeetingDay','WeekendMeetingTime','COBEFirstName','COBELastName','COBEPhone','COBEEmail','PTCFirstName','PTCLastName','PTCPhone','PTCEmail','Notes'];
  const rows=[headers];
  congregations.forEach(c=>{
    const m=c.meetings?.[0]||{},[cobeFirst,cobeLast]=nwsSplitName(c.cobe?.name),[ptcFirst,ptcLast]=nwsSplitName(c.ptc?.name);
    rows.push([
      c.name||'',c.circuit||'None',nwsAddress(c),DAYS[Number(m.weekday)]||'',m.time||'',
      cobeFirst,cobeLast,c.cobe?.phone||'',c.cobe?.email||'',ptcFirst,ptcLast,
      nwsPhone(c.ptc?.mobile,c.ptc?.home),c.ptc?.email||c.ptc?.jwpub_email||'',c.note||''
    ]);
  });
  return '\ufeff'+rows.map(r=>r.map(nwsCsvEscape).join(',')).join('\r\n')+'\r\n';
}
function nwsPublicNote(p){
  const notes=[];
  const own=safeText(p.note).trim();if(own)notes.push(own);
  const km=Number(p.availability?.max_distance_km);if(Number.isFinite(km)&&km>0)notes.push(`limit: about ${km}km distance`);
  const z=safeText(p.availability?.zoom||'both');
  if(z==='beyond')notes.push('Zoom beyond distance');
  else if(z==='only')notes.push('Zoom only');
  else if(z==='in_person')notes.push('In-person only');
  return notes.join(' · ');
}
function buildNwsPublicSpeakersCsv(congregations){
  const headers=['Congregation','FirstName','LastName','Privilege','PhoneHome','PhoneMobile','Email','PublicTalksCanGive','PublicNotes','AwayFrequencyPeriod','AwayFrequencyType'];
  const rows=[headers];
  congregations.forEach(c=>{
    peopleFor(c).filter(p=>!p.deleted_at&&p.status!=='inactive').sort((a,b)=>safeCompare(a?.name,b?.name)).forEach(p=>{
      const [first,last]=nwsSplitName(p.name);
      rows.push([
        c.name||'',first,last,p.appointment==='ms'?'MS':'E',p.contact?.home||'',p.contact?.mobile||'',p.contact?.email||'',
        (p.talks||[]).slice().sort((a,b)=>a-b).join(','),nwsPublicNote(p),'','0'
      ]);
    });
  });
  return '\ufeff'+rows.map(r=>r.map(nwsCsvEscape).join(',')).join('\r\n')+'\r\n';
}
function nwsScopeCongregations(scope='all'){
  if(!state.master)return[];
  let list=state.master.congregations.filter(c=>c.status!=='dissolved');
  if(scope==='current'){
    const c=current();list=c&&c.status!=='dissolved'?[c]:[];
  }else if(scope==='country'){
    const c=current(),cc=c?.country_code||'';list=list.filter(x=>x.country_code===cc);
  }
  return list.slice().sort((a,b)=>safeCompare(a?.name,b?.name));
}
function nwsStamp(){const d=new Date();return[String(d.getDate()).padStart(2,'0'),String(d.getMonth()+1).padStart(2,'0'),d.getFullYear()].join('.')}

}
function nwsFileSafe(v){return safeText(v).trim().replace(/[\/:*?"<>|]/g,'_').replace(/\s+/g,' ').slice(0,120)||'Congregation'}
function crc32(bytes){let c=0xffffffff;for(const b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^0xffffffff)>>>0}
function u16(n){return[n&255,(n>>>8)&255]}function u32(n){return[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]}
function zipStore(files){
  const enc=new TextEncoder(),parts=[],central=[];let offset=0;
  for(const f of files){
    const name=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(data);
    const local=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...name]);
    parts.push(local,data);
    const cen=new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...name]);
    central.push(cen);offset+=local.length+data.length;
  }
  const centralSize=central.reduce((n,x)=>n+x.length,0),end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(centralSize),...u32(offset),...u16(0)]);
  return new Blob([...parts,...central,end],{type:'application/zip'});
}
function downloadBlob(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2500)}
function exportNwsPublicSpeakersCsv(scope='all'){
  const list=nwsScopeCongregations(scope).filter(c=>peopleFor(c).some(p=>!p.deleted_at&&p.status!=='inactive'));
  if(!list.length)return alert('No public speakers match this export scope.');
  const count=list.reduce((n,c)=>n+peopleFor(c).filter(p=>!p.deleted_at&&p.status!=='inactive').length,0);
  if(scope==='current'||list.length===1){
    const c=list[0];
    download(`NWS_Export_Public_Speakers_${nwsFileSafe(c.name)}_${nwsStamp()}.csv`,buildNwsPublicSpeakersCsv([c]),'text/csv;charset=utf-8');
    log('export_nws_public_speakers_csv',`NWS Public Speakers CSV exported · ${count} speaker${count===1?'':'s'} · ${c.name}`);touch();return;
  }
  const files=list.map(c=>({name:`NWS_Export_Public_Speakers_${nwsFileSafe(c.name)}_${nwsStamp()}.csv`,data:buildNwsPublicSpeakersCsv([c])}));
  const label=scope==='country'?(current()?.country_code||'Country'):'All';
  downloadBlob(`NWS_Export_Public_Speakers_${nwsFileSafe(label)}_${nwsStamp()}.zip`,zipStore(files));
  log('export_nws_public_speakers_zip',`NWS Public Speakers package exported · ${count} speakers · ${files.length} congregation files · scope ${scope}`);touch();
}

window.addEventListener('beforeunload',e=>{if(state.master&&state.dirty){e.preventDefault();e.returnValue=''}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
async function loadPublishedOutlines(){
  // On GitHub Pages / any http(s) host, outline-data.json is expected next to this HTML file.
  // A browser working copy is kept when present; the published file becomes its comparison baseline.
  if(location.protocol!=='http:'&&location.protocol!=='https:')return false;
  try{
    const url=new URL('outline-data.json',location.href);
    url.searchParams.set('_ptc',Date.now());
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const published=normalizeOut(await res.json());
    const cachedRaw=localStorage.getItem(LS_OUT);
    if(cachedRaw){
      try{
        const cached=normalizeOut(JSON.parse(cachedRaw));
        state.outlines=cached;
        state.outlineBaseline=clone(published);
      }catch(e){
        state.outlines=published;
        state.outlineBaseline=clone(published);
        localStorage.setItem(LS_OUT,JSON.stringify(published));
      }
    }else{
      state.outlines=published;
      state.outlineBaseline=clone(published);
      localStorage.setItem(LS_OUT,JSON.stringify(published));
    }
    renderFacts();
    if(state.tab==='outlines')renderOutlines();
    console.info('PTC Organizer: loaded',url.pathname);
    return true;
  }catch(err){
    console.warn('PTC Organizer: automatic outline-data.json load failed:',err);
    return false;
  }
}

(async function init(){
  $('editorName').value=localStorage.getItem(LS_EDITOR)||'';
  try{state.openCountries=new Set(JSON.parse(localStorage.getItem(LS_OPEN)||'[]'))}catch(e){}
  // Restore the local outline working copy immediately, then check for the published Git/HTTP file.
  try{const o=JSON.parse(localStorage.getItem(LS_OUT)||'null');if(o)setOutlines(o)}catch(e){}
  try{const m=JSON.parse(localStorage.getItem(LS_MASTER)||'null');if(m)loadMaster(m)}catch(e){}
  await loadPublishedOutlines();
  if(!state.master){const b=document.createElement('button');b.className='primary';b.textContent='Create new master';b.onclick=()=>loadMaster(freshMaster());$('workspaceEmpty').append(document.createElement('br'),document.createElement('br'),b)}
  renderSave();
})();
