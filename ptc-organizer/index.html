d var(--line);border-radius:12px;background:#fff;margin-top:7px}.venuebox{margin-top:8px;padding:9px;border:1px dashed #d8c7b0;border-radius:11px;background:#faf6ef}.geo-line{font-size:11.5px;color:var(--muted);margin-top:6px}.geo-results{margin-top:6px;border:1px solid var(--line);border-radius:10px;overflow:hidden}.geo-hit{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:#fff;font-weight:500;font-size:12px}.geo-hit:last-child{border-bottom:0}

.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.log-list{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:460px}.log-line{padding:7px 9px;border-bottom:1px solid var(--line);font-size:12px;display:grid;grid-template-columns:120px 1fr auto;gap:8px;align-items:start}.log-line:last-child{border-bottom:0}.country-row{display:grid;grid-template-columns:1fr 110px auto;gap:8px;margin-top:6px}.country-name-wrap,.country-code-wrap{display:flex;flex-direction:column;gap:3px}.country-row .mini-label{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}.notice{padding:9px 11px;border-radius:10px;background:#faf6ef;border:1px solid var(--line);font-size:11.5px;color:var(--muted)}.notice.warn{background:#faf0da;border-color:#e8cf96;color:#8a5a14}.overlay{position:fixed;inset:0;background:rgba(40,30,22,.48);display:flex;align-items:center;justify-content:center;padding:18px;z-index:60}.modal{width:min(920px,100%);max-height:88vh;overflow:auto;background:var(--card);border-radius:16px;box-shadow:0 24px 60px rgba(58,40,28,.32);padding:16px 18px}.modal h3{font:600 20px var(--display);margin:0}.hidden{display:none!important}

<body>
<div class="container">
<section class="header"><div class="headrow"><div><h1><button type="button" id="homeTitle" class="home-title" title="Back to Home">PTC Organizer</button></h1><p>Master maintenance for congregations, people, speaker assignments and public talk outlines.</p></div><div class="header-actions"><button id="btnOpen">Open PTC Master</button><button id="btnExport">Export</button><button id="btnAdmin">Administration</button><button id="btnHelp">Help</button></div></div><div class="facts"><div class="fact"><label>Congregations</label><b id="fCongs">–</b></div><div class="fact"><label>People</label><b id="fPeople">–</b></div><div class="fact"><label>Speakers</label><b id="fSpeakers">–</b></div><div class="fact"><label>Countries</label><b id="fCountries">–</b></div><div class="fact"><label>Outlines</label><b id="fOutlines">–</b></div><div class="fact"><label>Issues</label><b id="fIssues">–</b></div></div></section>
<div class="savebar"><span id="saveDot" class="dot"></span><span id="saveText" class="small muted">No master loaded.</span><span class="spacer"></span><span class="small muted">Editor</span><input id="editorName" style="width:150px" placeholder="Your name"></div>
<div class="global-nav" id="globalNav"><button class="ghost home-nav" data-global="home" title="Home" aria-label="Home">⌂</button><button class="ghost" data-global="outlines">Outlines</button><button class="ghost" data-global="history">Master History</button><button class="ghost" data-global="admin">Administration</button></div>

 m.people.forEach(p=>{p.id=p.id||uuid();p.name=String(p.name||'');p.appointment=p.appointment||p.role||'elder';delete p.role;p.status=p.status||'active';p.congregation_id=safeText(p.congregation_id||'');p.talks=Array.isArray(p.talks)?p.talks:[];p.special_talks=Array.isArray(p.special_talks)?p.special_talks:[];p.contact=p.contact||{mobile:'',home:'',email:''};p.availability=p.availability||{max_distance_km:null,zoom:'no',raw:''};p.membership_history=Array.isArray(p.membership_history)?p.membership_history.filter(x=>x&&typeof x==='object').map(x=>({congregation_id:safeText(x.congregation_id||''),from:safeText(x.from||''),to:x.to==null?null:safeText(x.to),reason:safeText(x.reason||'')})):[];if(p.congregation_id&&!p.membership_history.some(x=>x.congregation_id===p.congregation_id&&x.to==null))p.membership_history.push({congregation_id:p.congregation_id,from:'',to:null,reason:'migrated current assignment'})});

function renderFacts(){if(!state.master){['fCongs','fPeople','fSpeakers','fCountries','fIssues'].forEach(x=>$(x).textContent='–');return}const active=state.master.people.filter(p=>p.status==='active').length;$('fCongs').textContent=state.master.congregations.length;$('fPeople').textContent=state.master.people.length;$('fSpeakers').textContent=active;$('fCountries').textContent=new Set(state.master.congregations.map(c=>c.country_code).filter(Boolean)).size;$('fOutlines').textContent=state.outlines?Object.keys(state.outlines.outlines||{}).length:'–';$('fIssues').textContent=state.master.congregations.reduce((n,c)=>n+issues(c).length,0)}

function renderTree(){const h=$('tree');if(!state.master){h.innerHTML='';return}const q=$('search').value.trim().toLowerCase(),f=$('filter').value,list=state.master.congregations.filter(c=>c.status!=='dissolved'&&match(c,q)&&pass(c,f)),groups={};list.forEach(c=>(groups[c.country_code||'??']=groups[c.country_code||'??']||[]).push(c));const force=q||f;h.innerHTML=Object.keys(groups).sort((a,b)=>safeCompare(countryName(a),countryName(b))).map(code=>{const arr=groups[code].sort((a,b)=>safeCompare(a?.name,b?.name)),open=force||state.openCountries.has(code),sp=arr.reduce((n,c)=>n+peopleFor(c).filter(p=>p.status==='active').length,0),cg=arr.filter(c=>c.type!=='group').length,gp=arr.filter(c=>c.type==='group').length;return`<button class="tree-country" data-country="${esc(code)}"><span>${open?'▾':'▸'}</span><span class="country-label"><b>${esc(countryName(code))}</b><span class="country-code">${esc(code)}</span></span><span class="count">${cg} congregation${cg===1?'':'s'}${gp?` · ${gp} group${gp===1?'':'s'}`:''}<br>${sp} speaker${sp===1?'':'s'}</span></button><div class="tree-items ${open?'':'hidden'}">${arr.map(c=>`<button class="tree-item ${c.id===state.selected&&!['home','outlines','history','admin','unassigned'].includes(state.tab)?'active':''}" data-cong="${c.id}">${esc(c.name)}${c.type==='group'?' <span class="pill" style="font-size:8.5px;padding:1px 5px">Group</span>':''}${worst(c)?`<span class="flag ${worst(c)}"></span>`:''}<span class="meta">${esc(c.address?.city||'–')} · ${peopleFor(c).filter(p=>p.status==='active').length} speakers</span></button>`).join('')}</div>`}).join('')||'<div class="empty small">Nothing found.</div>';h.querySelectorAll('[data-country]').forEach(b=>b.onclick=()=>{const x=b.dataset.country;state.openCountries.has(x)?state.openCountries.delete(x):state.openCountries.add(x);localStorage.setItem(LS_OPEN,JSON.stringify([...state.openCountries]));renderTree()});h.querySelectorAll('[data-cong]').forEach(b=>b.onclick=()=>{state.selected=b.dataset. ><button class="ghost" id="exportMasterAdmin">Export master JSON</button></div><div id="adminResult" style="margin-top:10px"></div></div></div></div>`;$('addCountry').onclick=()=>{const code=(prompt('ISO country code (2 letters):')||'').trim().toUpperCase(),name=(code&&(prompt('Country name:')||'').trim())||'';if(!/^[A-Z]{2}$/.test(code)||!name)return;if(state.master.countries.some(x=>x.code===code))return alert('Country already exists.');state.master.countries.push({code,name});touch('add_country',`${name} (${code}) added`);renderAdmin();renderTree();renderFacts()};$('countries').querySelectorAll('[data-country-name]').forEach(el=>el.onchange=()=>{const x=state.master.countries.find(z=>z.code===el.dataset.countryName),old=x.name;x.name=el.value.trim();touch('edit_country',`${old} → ${x.name}`);renderTree()});$('countries').querySelectorAll('[data-country-code]').forEach(el=>el.onchange=()=>{const old=el.dataset.countryCode,n=el.value.trim().toUpperCase();if(!/^[A-Z]{2}$/.test(n)||state.master.countries.some(x=>x.code===n&&x.code!==old)){alert('Use a unique 2-letter ISO code.');renderAdmin();return}state.master.congregations.forEach(c=>{if(c.country_code===old)c.country_code=n;c.meetings.forEach(m=>{if(m.venue?.address?.country_code===old)m.venue.address.country_code=n})});const x=state.master.countries.find(z=>z.code===old);x.code=n;touch('edit_country',`${old} → ${n}`);renderAll()});$('countries').querySelectorAll('[data-country-del]').forEach(b=>b.onclick=()=>{const code=b.dataset.countryDel;if(state.master.congregations.some(c=>c.country_code===code))return alert('This country is still used by one or more congregations.');if(confirm(`Delete ${countryName(code)}?`)){state.master.countries=state.master.countries.filter(x=>x.code!==code);touch('delete_country',`${code} deleted`);renderAdmin();renderFacts()}});$('addCircuit').onclick=()=>{const name=(prompt('Circuit name:')||'').trim();if(!name)return;if((state.master.circuits||[]).some(x=>x.toLowerCase()===name.toLowerCase()))return alert('This circuit already exists.');state.master.circuits=state.master.circuits||[];state.master.circuits.push(name);state.master.circuits.sort(safeCompare);touch('add_circuit',`${name} added`);renderAdmin()};$('circuits').querySelectorAll('[data-circuit-old]').forEach(el=>el.onchange=()=>{const old=el.dataset.circuitOld,n=el.value.trim();if(!n){alert('Circuit name cannot be empty.');renderAdmin();return}if((state.master.circuits||[]).some(x=>x.toLowerCase()===n.toLowerCase()&&x.toLowerCase()!==old.toLowerCase())){alert('A circuit with this name already exists.');renderAdmin();return}const idx=state.master.circuits.indexOf(old);if(idx>=0)state.master.circuits[idx]=n;state.master.congregations.forEach(c=>{if(c.circuit===old)c.circuit=n});state.master.circuits.sort(safeCompare);touch('edit_circuit',`${old} → ${n}`);renderAdmin();renderTree()});$('validateAll').onclick=()=>{const arr=state.master.congregations.flatMap(c=>issues(c).map(i=>`${c.name}: ${i.text}`));$('adminResult').innerHTML=arr.length?`<div class="notice warn">${arr.map(esc).join('<br>')}</div>`:'<div class="notice">No current validation issues.</div>'};$('dupCheck').onclick=()=>{const pairs=[];for(let i=0;i<state.master.people.length;i++)for(let j=i+1;j<state.master.people.length;j++){const a=state.master.people[i],b=state.master.people[j],na=safeText(a?.name).toLowerCase().replace(/[^a-z0-9]/g,''),nb=safeText(b?.name).toLowerCase().replace(/[^a-z0-9]/g,'');if(na&&nb&&(na===nb||na.includes(nb)||nb.includes(na)))pairs.push(`${a.name} ↔ ${b.name}`)}$('adminResult').innerHTML=pairs.length?`<div class="notice warn"><b>Possible duplicates</b><br>${pairs.map(esc).join('<br>')}</div>`:'<div class="notice">No obvious duplicate names found.</div>'};$('exportMasterAdmin').onclick=exportMaster}
function renderHistory(){const logs=state.master.changelog||[];$('tabContent').innerHTML=`<div class="card"><div class="card-head"><h3>Master History</h3><span class="spacer"></span><button class="ghost tiny" id="exportLog">Export log</button><button class="danger tiny" id="clearLog">Clear all</button></div><div class="card-body"><div class="notice">This is the central maintenance history. Congregation pages show only the entries that affect that congregation.</div><div class="log-list" style="margin-top:8px">${logs.slice(0,1000).map(e=>`<div class="log-line"><span>${new Date(e.at).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}</span><span><b>${esc(e.by)}</b> · ${esc(e.detail)}${e.entity?.name?` <span class="muted">(${esc(e.entity.name)})</span>`:''}</span><button class="danger tiny" data-logdel="${esc(e.id||'')}">×</button></div>`).join('')||'<div class="empty">No history entries.</div>'}</div></div></div>`;$('clearLog').onclick=()=>{if(confirm('Clear the entire maintenance history?\n\nCurrent master data will remain unchanged.')){state.master.changelog=[];touch();renderHistory()}};$('exportLog').onclick=()=>download('ptc-history_'+today()+'.txt',logs.map(e=>`${e.at}	${e.by}	${e.detail}`).join('\r\n'));$('tabContent').querySelectorAll('[data-logdel]').forEach(b=>b.onclick=()=>{const entry=state.master.changelog.find(e=>e.id===b.dataset.logdel);if(!entry)return;if(!confirm('Delete this history entry?\n\n'+(entry.detail||'This action cannot be undone.')))return;state.master.changelog=state.master.changelog.filter(e=>e.id!==b.dataset.logdel);touch();renderHistory()})}
function showHelp(){
  const sections=[
    {title:'Home & navigation',kicker:'Start here',body:`<p>The <b>house icon</b> opens the global Home view. You can also click <b>PTC Organizer</b> in the header at any time. Home is independent of the congregation currently selected on the left.</p><ul><li>Use Home for an overview of congregations, groups, people, unassigned speakers and data health.</li><li><b>Outlines</b>, <b>Master History</b> and <b>Administration</b> are global areas.</li><li>Selecting a congregation or group on the left opens its local <b>Congregation</b> and <b>Speakers</b> tabs.</li></ul>`},
    {title:'Congregations & groups',kicker:'Local master data',body:`<p>Each record is defined as either a <b>Congregation</b> or a <b>Group</b>. Groups can be linked to the congregation they are attached to. The local editor stores the data needed by the PTC master without trying to manage local PTC policies.</p><ul><li>Address and coordinates belong to the record itself.</li><li>Meeting periods can describe permanent or temporary arrangements.</li><li>Country and circuit are selected from centrally maintained lists.</li><li>The normal status is shown as <b>Active</b>; dissolution is handled as a deliberate action instead of a routine dropdown.</li></ul>`},
    {title:'Speakers',kicker:'One person · one ID',body:`<p>Speakers are global people with stable IDs. A person exists only once in the master, even when he changes congregation.</p><ul><li>Talk numbers, contacts, notes and availability stay attached to the person.</li><li><b>Move to congregation…</b> reassigns the existing person rather than creating a copy.</li><li>The final, separated choice in that dialog is <b>Unassigned Speakers</b>.</li><li>Talk chips show only the number; hover for title and outline status. The remove control appears only on hover.</li></ul>`},
    {title:'Unassigned speakers',kicker:'Keep people without forcing an assignment',body:`<p>The Unassigned Speakers pool is for people who should remain in the master but are currently not assigned to an English congregation or group.</p><ul><li>Dissolving a congregation or group moves its speakers here automatically.</li><li>You can also move an individual speaker here manually from his speaker card.</li><li>Nothing about the person is deleted: ID, talks, contacts and membership history stay intact.</li><li>An unassigned person can later be assigned to another congregation without recreating him.</li></ul>`},
    {title:'Membership history',kicker:'Automatic history',body:`<p>Membership history records where a person has been assigned over time. It is maintained automatically when you move or reassign a speaker.</p><ul><li>The previous membership is closed when the person leaves.</li><li>A new current membership is opened when he is assigned elsewhere.</li><li>Moving a person to Unassigned closes the previous membership without inventing a new congregation.</li><li>This history belongs to the person and survives congregation changes.</li></ul>`},
    {title:'Outlines',kicker:'Global foundation',body:`<p>Outline Management is global and independent of any congregation. It maintains the separate <b>outline-data.json</b> used for talk titles and statuses.</p><ul><li>Edit title, status, effective date, replacement and maintenance notes.</li><li>Import an S-99 PDF for comparison before applying title changes.</li><li>Existing maintenance data is kept separate from the congregation master.</li><li>The Organizer cross-checks speaker talk numbers against the current outline data and can show affected speakers.</li></ul>`},
    {title:'Master History',kicker:'Global audit trail',body:`<p>Master History collects changes across the complete PTC master. Local congregation history is simply a filtered view of the same central log.</p><ul><li>Use it to see who changed what and when.</li><li>Moving a speaker is logged as a real reassignment.</li><li>Deleting a log entry asks for confirmation and changes only the history entry — not the current master data.</li><li>The history can be exported with the master for handover and review.</li></ul>`},
    {title:'Countries & circuits',kicker:'Central reference lists',body:`<p>Countries and circuits are maintained centrally in <b>Administration</b> so local records do not create spelling variants.</p><ul><li>Congregations and groups select a country and circuit from dropdowns.</li><li>Country codes remain visible as a compact reference, while the country name is the primary label.</li><li>Renaming a circuit centrally updates the records currently using that circuit name.</li><li>Circuit deletion/merge is intentionally not part of the current test version.</li></ul>`},
    {title:'Temporary venues',kicker:'Date-aware locations',body:`<p>The regular Weekend Meeting has one day and time. A temporary venue is added separately only when the meeting location changes for a defined period, for example during Kingdom Hall renovation.</p><ul><li>Street, post code, city and country can be stored separately.</li><li>The temporary venue can have its own coordinates.</li><li>The temporary venue carries its own <b>from / until</b> dates in German display format (DD.MM.YYYY).</li></ul>`},
    {title:'Dissolved records',kicker:'Preserve instead of delete',body:`<p>Marking a congregation or group as <b>Dissolved</b> keeps the historical record instead of deleting it.</p><ul><li>Its speakers are moved to Unassigned Speakers, not deleted.</li><li>The dissolved record remains available from Home.</li><li>If the record is restored later, speakers stay unassigned until you deliberately reassign them.</li></ul>`},
    {title:'Saving & export',kicker:'Working copy & handover',body:`<p>The Organizer keeps a browser working copy automatically. In supported browsers you can additionally connect a JSON file for direct writing.</p><ul><li><b>Open PTC Master</b> loads an existing master file.</li><li><b>Open PTC Master</b> also connects that file for automatic writing in Chrome/Edge.</li><li>Export remains the portable way to back up or hand the current master to another editor.</li><li>Outline data is exported separately as <b>outline-data.json</b>.</li></ul>`},
    {title:'Validation',kicker:'Data quality',body:`<p>Validation is designed to catch maintenance problems before they become PTC Tool problems.</p><ul><li>Missing PTC, coordinates or meeting information can be flagged.</li><li>Unknown, retiring or do-not-use outline assignments can be identified.</li><li>Duplicate checks help spot people who may have been entered more than once.</li><li>Validation never silently deletes or rewrites records.</li></ul>`}
  ];
  modal(`<h3>Help</h3><div class="small muted" style="margin:4px 0 14px">Choose a topic on the left. Only the selected topic is shown.</div><div class="help-grid"><div class="help-nav">${sections.map((x,i)=>`<button type="button" data-help="${i}" class="${i===0?'active':''}">${esc(x.title)}</button>`).join('')}</div><div class="help-pane">${sections.map((x,i)=>`<section class="help-section ${i===0?'active':''}" data-help-section="${i}"><span class="help-kicker">${esc(x.kicker)}</span><h4>${esc(x.title)}</h4>${x.body}</section>`).join('')}</div></div>`,m=>{
    const buttons=[...m.querySelectorAll('[data-help]')],panes=[...m.querySelectorAll('[data-help-section]')];
    buttons.forEach(b=>b.onclick=()=>{
      const id=b.dataset.help;

}

async function loadPublishedOutlines(){
  // On GitHub Pages / any http(s) host, outline-data.json is expected next to this HTML file.
  // A browser working copy is kept when present; the published file becomes its comparison baseline.
  if(location.protocol!=='http:'&&location.protocol!=='https:')return false;
  try{
    const url=new URL('outline-data.json',location.href);
    url.searchParams.set('_ptc',Date.now());
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const published=normalizeOut(await res.json());
    const cachedRaw=localStorage.getItem(LS_OUT);
    if(cachedRaw){
      try{
        const cached=normalizeOut(JSON.parse(cachedRaw));
        state.outlines=cached;
        state.outlineBaseline=clone(published);
      }catch(e){
        state.outlines=published;
        state.outlineBaseline=clone(published);
        localStorage.setItem(LS_OUT,JSON.stringify(published));
      }
    }else{
      state.outlines=published;
      state.outlineBaseline=clone(published);
      localStorage.setItem(LS_OUT,JSON.stringify(published));
    }
    renderFacts();
    if(state.tab==='outlines')renderOutlines();
    console.info('PTC Organizer: loaded',url.pathname);
    return true;
  }catch(err){
    console.warn('PTC Organizer: automatic outline-data.json load failed:',err);
    return false;
  }
}

(async function init(){
  $('editorName').value=localStorage.getItem(LS_EDITOR)||'';
  try{state.openCountries=new Set(JSON.parse(localStorage.getItem(LS_OPEN)||'[]'))}catch(e){}
  // Restore the local outline working copy immediately, then check for the published Git/HTTP file.
  try{const o=JSON.parse(localStorage.getItem(LS_OUT)||'null');if(o)setOutlines(o)}catch(e){}
  try{const m=JSON.parse(localStorage.getItem(LS_MASTER)||'null');if(m)loadMaster(m)}catch(e){}
  await loadPublishedOutlines();
  if(!state.master){const b=document.createElement('button');b.className='primary';b.textContent='Create new master';b.onclick=()=>loadMaster(freshMaster());$('workspaceEmpty').append(document.createElement('br'),document.createElement('br'),b)}
  renderSave();
})();
