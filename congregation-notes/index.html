<!DOCTYPE html>
<html lang="en">
<head>
<!-- Icons -->
<link rel="icon" type="image/png" sizes="any" href="favicon.png">
<link rel="apple-touch-icon" href="congregation-notes.png">
<meta name="theme-color" content="#f3f6fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#f3f6fa" media="(prefers-color-scheme: dark)">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Congregation Notes</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Congregation Notes palette – sky blue + green + orange,
     deliberately different from the RC (orange/green/blue) and CA (gold/plum) tools. */
  --bg:        #f3f6fa;
  --card:      #ffffff;
  --border:    #dde5ee;
  --text:      #17212b;
  --text-sub:  #5b6878;
  --text-ref:  #93a0ae;

  --bar:   #2f80ed;
  --talk:  #2f6fd1;
  --wt:    #2e8b62;
  --kids:  #e0782a;
  --cnt:   #8a4fd6;

  --notes-bg:     #fbfdff;
  --notes-border: #d7e3f0;
  --chip-bg:      #e8f1fd;
  --chip-text:    #1f4f96;
  --chip-border:  #b9d2f3;

  --radius: 10px;
  --shadow: 0 1px 4px rgba(0,0,0,.07);
  --fs: 15px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  font-size: var(--fs); line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
}
body.kid { --fs: 17px; }

button { font-family: inherit; }

/* ── HEADER ─────────────────────────────── */
.app-header {
  position: sticky; top: 0; z-index: 100;
  background: #fff;
  border-top: 4px solid var(--bar);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 10px rgba(0,0,0,.09);
  padding-top: env(safe-area-inset-top, 0px);
}
.header-top, .header-sub {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  max-width: 760px; margin: 0 auto;
}
.header-top { padding: 9px 14px 5px; }
.header-sub { padding: 3px 14px 9px; }
.app-branding { cursor: pointer; min-width: 0; }
.app-title { font-size: 15px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; display: flex; align-items: center; gap: 7px; }
.app-kicker {
  font-size: 10px; font-weight: 900; letter-spacing: .05em;
  background: var(--bar); color: #fff; border-radius: 5px; padding: 2px 5px;
}
.app-subtitle { font-size: 10.5px; color: var(--text-sub); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header-actions { display: flex; gap: 5px; flex-shrink: 0; align-items: center; }

.btn-hdr {
  border: 1px solid var(--border); background: var(--bg);
  border-radius: 8px; padding: 5px 9px;
  font-size: 11.5px; font-weight: 600; color: var(--text-sub);
  cursor: pointer; white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.btn-hdr:active { background: var(--border); color: var(--text); }
.btn-hdr.danger { color: #c0392b; }

.lang-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.lang-toggle button {
  border: none; background: var(--bg); color: var(--text-sub);
  font-size: 11px; font-weight: 700; padding: 5px 8px; cursor: pointer;
}
.lang-toggle button.active { background: var(--bar); color: #fff; }

.search {
  flex: 1; min-width: 0;
  border: 1px solid var(--border); border-radius: 20px;
  padding: 7px 13px; font-size: 14px; background: var(--bg); outline: none;
}
.search:focus { border-color: var(--bar); background: #fff; }
.hs-date { flex: 1; text-align: center; font-weight: 800; font-size: 13.5px; }

/* ── MAIN ───────────────────────────────── */
main { max-width: 760px; margin: 0 auto; padding: 14px 12px 20px; }

.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  margin-bottom: 10px; overflow: hidden;
}

/* History */
.h-card { display: flex; gap: 12px; padding: 12px 13px; cursor: pointer; align-items: flex-start; }
.h-card:active { background: var(--bg); }
.h-date {
  flex-shrink: 0; width: 54px; text-align: center;
  background: var(--chip-bg); color: var(--chip-text);
  border-radius: 9px; padding: 5px 0 6px; line-height: 1.1;
}
.h-date .d { font-size: 20px; font-weight: 900; display: block; }
.h-date .m { font-size: 10.5px; font-weight: 700; text-transform: uppercase; }
.h-date .y { font-size: 9.5px; opacity: .75; display: block; }
.h-body { flex: 1; min-width: 0; }
.h-theme { font-weight: 800; font-size: 14.5px; line-height: 1.3; }
.h-meta { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
.h-snip { font-size: 12.5px; color: var(--text-ref); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.h-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
.h-tag { font-size: 10.5px; font-weight: 700; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 1px 7px; color: var(--text-sub); }

.empty { text-align: center; color: var(--text-sub); padding: 50px 20px; }
.empty .big { font-size: 46px; display: block; margin-bottom: 10px; }

.fab {
  position: fixed; right: 18px; bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  width: 58px; height: 58px; border-radius: 50%;
  background: var(--bar); color: #fff; border: none;
  font-size: 30px; font-weight: 400; line-height: 1;
  box-shadow: 0 4px 14px rgba(47,128,237,.45);
  cursor: pointer; z-index: 90;
}
.fab:active { transform: scale(.94); }

/* Entry – meta */
.meta { padding: 12px 13px; display: grid; gap: 9px; }
.meta-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.fld label { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-ref); margin-bottom: 3px; }
.fld input {
  width: 100%; border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; font-size: 15px; background: var(--notes-bg); outline: none;
  font-family: inherit; color: var(--text);
}
.fld input:focus { border-color: var(--sec, var(--bar)); background: #fff; }
.fld input[type=date] { min-height: 38px; }

/* Sections */
.sec-hdr {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 13px 8px;
  border-left: 4px solid var(--sec);
  background: linear-gradient(90deg, color-mix(in srgb, var(--sec) 9%, white), #fff 60%);
}
.sec-title { font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--sec); }
.sec-body { padding: 10px 13px 12px; display: grid; gap: 9px; }

.blocks { display: grid; gap: 8px; }
.blk { position: relative; }
.blk-x {
  position: absolute; top: 5px; right: 5px; z-index: 2;
  width: 24px; height: 24px; border-radius: 50%;
  border: 1px solid var(--border); background: #fff; color: var(--text-ref);
  font-size: 11px; cursor: pointer; line-height: 1;
}
.blk-x:active { background: #fdecea; color: #c0392b; }

.rt {
  min-height: 60px; padding: 9px 34px 9px 11px;
  border: 1px solid var(--notes-border); border-radius: 8px;
  background: var(--notes-bg); outline: none;
  font-size: var(--fs); line-height: 1.5;
  overflow-wrap: anywhere;
}
.rt:focus { border-color: var(--sec, var(--bar)); background: #fff; box-shadow: 0 0 0 3px color-mix(in srgb, var(--sec, var(--bar)) 14%, transparent); }
.rt:empty::before { content: attr(data-ph); color: var(--text-ref); pointer-events: none; }
.rt ul, .rt ol { padding-left: 22px; }
.rt.single { min-height: 44px; }

.blk-ref { display: flex; }
.ref-chip {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--chip-bg); border: 1px solid var(--chip-border); color: var(--chip-text);
  border-radius: 18px; padding: 5px 6px 5px 12px; font-size: 14px; font-weight: 700;
}
.ref-chip a { color: inherit; text-decoration: none; }
.ref-del { border: none; background: transparent; color: var(--chip-text); opacity: .6; font-size: 15px; cursor: pointer; padding: 0 5px; }

/* Pen */
.blk-pen { border: 1px solid var(--notes-border); border-radius: 8px; background: #fff; overflow: hidden; }
.pen-bar, .pen-foot {
  display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
  padding: 6px 36px 6px 8px; background: var(--bg); border-bottom: 1px solid var(--border);
}
.pen-foot { border-bottom: none; border-top: 1px solid var(--border); padding-right: 8px; justify-content: flex-end; }
.pb {
  min-width: 32px; height: 32px; border-radius: 8px;
  border: 1px solid var(--border); background: #fff; cursor: pointer;
  font-size: 15px; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px;
  -webkit-tap-highlight-color: transparent;
}
.pb.active { border-color: var(--sec, var(--bar)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--sec, var(--bar)) 30%, transparent); }
.pb.txt { font-size: 12px; font-weight: 700; color: var(--text-sub); }
.pb-sep { width: 1px; height: 22px; background: var(--border); margin: 0 2px; }
.dot { width: 18px; height: 18px; border-radius: 50%; display: block; }
.sz { border-radius: 50%; background: var(--text); display: block; }
.pen-wrap { position: relative; line-height: 0; }
.pen-cv {
  display: block; width: 100%; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.pen-print { display: none; }

.sec-actions { display: flex; gap: 7px; flex-wrap: wrap; }
.btn-add {
  border: 1.5px dashed color-mix(in srgb, var(--sec, var(--bar)) 55%, white);
  background: transparent; color: var(--sec, var(--bar));
  border-radius: 18px; padding: 6px 12px; font-size: 12.5px; font-weight: 700; cursor: pointer;
}
.btn-add:active { background: color-mix(in srgb, var(--sec, var(--bar)) 10%, white); }
body.kid .btn-add { padding: 9px 15px; font-size: 14px; }

/* Songs */
.songs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px 13px 12px; }
.songs .fld input { text-align: center; font-weight: 800; font-size: 17px; }

/* Mood */
.mood { display: flex; gap: 8px; flex-wrap: wrap; }
.mood button {
  font-size: 28px; width: 50px; height: 50px; border-radius: 14px;
  border: 2px solid var(--border); background: #fff; cursor: pointer; opacity: .55;
}
.mood button.active { opacity: 1; border-color: var(--kids); background: color-mix(in srgb, var(--kids) 12%, white); transform: scale(1.06); }

/* Counter */
.cnt-card { --sec: var(--cnt); }
.cnt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; padding: 10px 13px 12px; }
.cnt {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px;
  padding: 10px 6px 8px; border-radius: 14px; cursor: pointer;
  border: 2px solid color-mix(in srgb, var(--cnt) 30%, white);
  background: color-mix(in srgb, var(--cnt) 6%, white);
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  transition: transform .08s;
}
.cnt:active { transform: scale(.95); }
.cnt-e { font-size: 28px; line-height: 1.1; }
.cnt-w { font-size: 13px; font-weight: 700; color: var(--text-sub); text-align: center; }
.cnt-n { font-size: 24px; font-weight: 900; color: var(--cnt); line-height: 1.1; }
.cnt.pop .cnt-n { animation: pop .35s ease; }
@keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.5)} 100%{transform:scale(1)} }
.cnt-rm {
  position: absolute; top: -7px; right: -7px; width: 24px; height: 24px; border-radius: 50%;
  border: none; background: #c0392b; color: #fff; font-size: 12px; cursor: pointer;
}
.cnt-add { display: flex; gap: 6px; padding: 0 13px 12px; flex-wrap: wrap; }
.cnt-add input { border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; font-size: 14px; }
.cnt-add input.emo { width: 54px; text-align: center; }
.cnt-add input.word { flex: 1; min-width: 120px; }
.cnt-total { font-size: 12px; font-weight: 800; color: var(--cnt); }
body.kid .cnt-e { font-size: 34px; }
body.kid .cnt-n { font-size: 30px; }

/* Format toolbar */
.fmt {
  position: fixed; left: 50%; transform: translateX(-50%);
  top: 0; display: none; z-index: 250;
  background: #1d2733; border-radius: 12px; padding: 5px;
  gap: 4px; box-shadow: 0 6px 20px rgba(0,0,0,.25);
}
.fmt.show { display: flex; }
.fmt button {
  min-width: 38px; height: 36px; border: none; border-radius: 8px;
  background: transparent; color: #fff; font-size: 16px; cursor: pointer;
}
.fmt button.on { background: rgba(255,255,255,.2); }
.fmt .sep { width: 1px; background: rgba(255,255,255,.2); margin: 4px 2px; }

/* Modals */
.modal-bg {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(15,22,30,.45);
  display: none; align-items: flex-end; justify-content: center;
}
.modal-bg.show { display: flex; }
@media (min-width: 640px) { .modal-bg { align-items: center; } }
.modal-box {
  background: #fff; width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto;
  border-radius: 16px 16px 0 0; padding: 16px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -4px 24px rgba(0,0,0,.2);
}
@media (min-width: 640px) { .modal-box { border-radius: 16px; } }
.modal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.modal-top h3 { font-size: 16px; font-weight: 800; }
.modal-x { border: none; background: var(--bg); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; color: var(--text-sub); }
.form-row { margin-bottom: 10px; }
.form-row label { display: block; font-size: 11px; font-weight: 700; color: var(--text-sub); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
.form-row select, .form-row input { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 16px; background: #fff; font-family: inherit; }
.form-inline { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ref-preview { padding: 10px; background: var(--bg); border-radius: 8px; font-size: 14px; color: var(--text-sub); }
.ref-preview a { color: var(--chip-text); font-weight: 700; }
.modal-btns { display: flex; gap: 9px; margin-top: 16px; }
.btn-cancel { padding: 12px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--text-sub); }
.btn-insert { flex: 1; padding: 12px; background: var(--bar); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; }

/* Glossary */
.g-item { border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; margin-bottom: 7px; }
.g-terms { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.g-main { font-weight: 800; font-size: 15px; }
.g-alt { font-size: 13px; color: var(--text-sub); font-style: italic; }
.g-x { font-size: 13.5px; color: var(--text); margin-top: 3px; line-height: 1.4; }
.g-links { display: flex; gap: 10px; margin-top: 5px; font-size: 12px; align-items: center; }
.g-links a { color: var(--chip-text); font-weight: 700; text-decoration: none; }
.g-links button { margin-left: auto; border: none; background: none; color: var(--text-ref); cursor: pointer; font-size: 12px; }
.g-own { font-size: 10px; font-weight: 800; color: var(--kids); text-transform: uppercase; letter-spacing: .05em; }
.g-add { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 12px; }
.g-add .row { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 7px; }
.g-add input { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 14px; font-family: inherit; }

/* Profiles */
.p-row { display: flex; gap: 8px; align-items: center; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; margin-bottom: 7px; }
.p-row.active { border-color: var(--bar); background: var(--chip-bg); }
.p-row input[type=text] { flex: 1; min-width: 0; border: 1px solid var(--border); border-radius: 7px; padding: 7px 9px; font-size: 15px; background: #fff; }
.p-kid { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-sub); white-space: nowrap; }
.p-sel { border: none; background: var(--bar); color: #fff; border-radius: 7px; padding: 7px 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
.p-row.active .p-sel { background: var(--wt); }
.p-del { border: none; background: none; font-size: 16px; cursor: pointer; }
.hint { font-size: 12px; color: var(--text-sub); line-height: 1.45; margin-top: 8px; }

/* Toast */
.toast {
  position: fixed; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); left: 50%;
  transform: translateX(-50%) translateY(90px);
  background: #1d2733; color: #fff; padding: 8px 18px; border-radius: 22px;
  font-size: 13px; z-index: 400; transition: transform .28s ease; pointer-events: none; white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* Footer */
.app-footer { text-align: center; padding: 18px 16px 90px; font-size: 11px; color: var(--text-ref); }
.app-footer a { color: var(--text-sub); text-decoration: none; }

.print-head { display: none; }

@media (max-width: 420px) {
  .hdr-label { display: none; }
  .meta-row { grid-template-columns: 1fr; }
}

/* ── PRINT ───────────────────────────────── */
@page { size: A4 portrait; margin: 12mm; }
@media print {
  body { background: #fff !important; font-size: 11px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .app-header, .fab, .app-footer, .toast, .modal-bg, .fmt, .blk-x, .ref-del,
  .sec-actions, .pen-bar, .pen-foot, .cnt-add, .cnt-rm, .no-print { display: none !important; }
  main { max-width: none; padding: 0; }
  .card { box-shadow: none; break-inside: avoid-page; }
  .print-head { display: block; font-size: 17px; font-weight: 900; border-bottom: 1.5pt solid #111; padding-bottom: 2mm; margin-bottom: 3mm; }
  .print-head small { display: block; font-size: 10px; font-weight: 600; color: #555; }
  .rt:empty { display: none; }
  .rt { border: none; padding: 1mm 0; min-height: 0; background: none; }
  .fld input { border: none; padding: 0; background: none; font-weight: 700; }
  .pen-cv { display: none !important; }
  .pen-print { display: block !important; width: 100%; }
  .blk-pen { border: 1px solid #ddd; }
  .mood button:not(.active) { display: none; }
  .mood button { border: none; }
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- ── HEADER ── -->
<header class="app-header">
  <div class="header-top">
    <div class="app-branding" onclick="goHome()">
      <div class="app-title"><span class="app-kicker">CN</span><span data-i18n="title">Congregation Notes</span></div>
      <div class="app-subtitle" id="app-subtitle"></div>
    </div>
    <div class="header-actions">
      <span class="lang-toggle" aria-label="Language / Sprache">
        <button type="button" id="lang-en" onclick="setLang('en')">EN</button>
        <button type="button" id="lang-de" onclick="setLang('de')">DE</button>
      </span>
      <button class="btn-hdr" onclick="openGloss()" data-i18n-title="glossary">📘</button>
      <button class="btn-hdr" id="btn-prof" onclick="openProfiles()">👤</button>
    </div>
  </div>
  <div class="header-sub" id="header-sub"></div>
</header>

<main id="view"></main>

<button class="fab" id="fab" onclick="createEntry()" aria-label="New">＋</button>

<footer class="app-footer">
  <span>Congregation Notes · V1.0.0 · Made with Love ©</span><br>
  <a href="mailto:cryptopower@outlook.de?subject=Feedback%3A%20Congregation%20Notes%20V1.0.0">✉ Feedback</a>
</footer>

<!-- ── FORMAT TOOLBAR ── -->
<div class="fmt" id="fmt">
  <button data-cmd="bold" style="font-weight:900">B</button>
  <button data-cmd="italic" style="font-style:italic;font-family:Georgia,serif">I</button>
  <button data-cmd="underline" style="text-decoration:underline">U</button>
  <button data-cmd="insertUnorderedList">•</button>
  <span class="sep"></span>
  <button data-act="translate">🌐</button>
  <button data-act="gloss">📘</button>
</div>

<!-- ── BIBLE PICKER ── -->
<div class="modal-bg" id="modal-bible" onclick="if(event.target===this)closeModal('modal-bible')">
  <div class="modal-box">
    <div class="modal-top"><h3 data-i18n="modalTitle">📖 Add Bible Reference</h3><button class="modal-x" onclick="closeModal('modal-bible')">✕</button></div>
    <div class="form-row"><label data-i18n="book">Book</label><select id="bp-book" onchange="previewRef()"></select></div>
    <div class="form-inline">
      <div class="form-row"><label data-i18n="chapter">Chapter</label><input type="number" inputmode="numeric" id="bp-chapter" min="1" oninput="previewRef()"></div>
      <div class="form-row"><label data-i18n="verse">Verse</label><input type="number" inputmode="numeric" id="bp-verse" min="1" oninput="previewRef()"></div>
      <div class="form-row"><label data-i18n="vend">To verse</label><input type="number" inputmode="numeric" id="bp-vend" min="1" oninput="previewRef()"></div>
    </div>

// ═══════════════════════════════════════════
//  INDEXEDDB (local, in the browser – no server)
// ═══════════════════════════════════════════
let dbp = null;
function db() {
  if (!dbp) dbp = new Promise((res, rej) => {
    const r = indexedDB.open('cong-notes', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('entries')) d.createObjectStore('entries', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'k' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function idb(store, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction(store, mode);
    const req = fn(tx.objectStore(store));
    tx.oncomplete = () => res(req ? req.result : undefined);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error);
  });
}
const idbGetAll = s => idb(s, 'readonly', st => st.getAll());
const idbGet = (s, k) => idb(s, 'readonly', st => st.get(k));
const idbPut = (s, v) => idb(s, 'readwrite', st => st.put(v));
const idbDel = (s, k) => idb(s, 'readwrite', st => st.delete(k));

function scheduleSave() {
  const e = E(); if (!e) return;
  e.updated = Date.now();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 400);
}
async function flushSave() {
  clearTimeout(saveTimer); saveTimer = null;
  const e = E(); if (!e) return;
  try { await idbPut('entries', JSON.parse(JSON.stringify(e))); }
  catch (err) { console.error(err); toast(t('saveErr')); }
}
function saveSettings() {
  clearTimeout(setTimer);
  setTimer = setTimeout(() => idbPut('meta', { k: 'settings', ...JSON.parse(JSON.stringify(settings)) }).catch(console.error), 250);
}
document.addEventListener('visibilitychange', () => { if (document.hidden && saveTimer) flushSave(); });
window.addEventListener('pagehide', () => { if (saveTimer) flushSave(); });

function isoLocal(d) {
  const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset());
  return x.toISOString().slice(0, 10);
}
function defaultDate() {
  const d = new Date();
  d.setDate(d.getDate() + ((7 - d.getDay()) % 7));   // today if Sunday, otherwise next Sunday
  return isoLocal(d);
}
const dObj = iso => new Date(iso + 'T12:00:00');
const loc = () => curLang === 'de' ? 'de-DE' : 'en-GB';
function fmtDate(iso, long) {
  if (!iso) return '';
  return dObj(iso).toLocaleDateString(loc(), long
    ? { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }
    : { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}

const plain = html => { const d = document.createElement('div'); d.innerHTML = html || ''; return (d.textContent || '').replace(/\s+/g, ' ').trim(); };

function entryText(e) {
  const parts = [e.talk.speaker, e.talk.cong, e.talk.theme, e.wt.title, e.kids.fav, e.kids.question];
  ['talk', 'wt', 'kids'].forEach(s => e[s].blocks.forEach(b => {
    if (b.type === 'text') parts.push(plain(b.html));
    if (b.type === 'ref') parts.push(b.label);
  }));
  return parts.map(plain).join(' ');
}

  const q = searchQ.trim().toLowerCase();

function insertPos(sec) {
  const n = E()[sec].blocks.length;

  const arr = E()[sec].blocks;

  arr.splice(pos, 0, b);
  activeIdx[sec] = pos;
  scheduleSave();
  rerenderSec(sec, pos);
}

function blockHasContent(b) {
  if (b.type === 'text') return plain(b.html).length > 0;
  if (b.type === 'pen') return b.strokes.length > 0;
  return false;
}

function delBlock(sec, i, noConfirm) {
  const arr = E()[sec].blocks;
  const b = arr[i]; if (!b) return;
  if (!noConfirm && blockHasContent(b) && !confirm(t('confirmDelBlock'))) return;
  arr.splice(i, 1);
  activeIdx[sec] = Math.max(0, i - 1);
  scheduleSave();
  rerenderSec(sec);
}

//  RICH TEXT
// ═══════════════════════════════════════════
const ALLOWED = new Set(['B','STRONG','I','EM','U','BR','DIV','P','UL','OL','LI']);
function sanitize(html) {
  const tpl = document.createElement('template');
  tpl.innerHTML = html || '';
  (function walk(node) {
    [...node.childNodes].forEach(ch => {
      if (ch.nodeType === 3) return;
      if (ch.nodeType !== 1) { ch.remove(); return; }
      const tag = ch.tagName;
      if (tag === 'SCRIPT' || tag === 'STYLE') { ch.remove(); return; }
      walk(ch);
      if (ALLOWED.has(tag)) { [...ch.attributes].forEach(a => ch.removeAttribute(a.name)); return; }
      // keep Safari-style spans as real tags
      const st = (ch.getAttribute && ch.getAttribute('style')) || '';
      let repl = document.createDocumentFragment();
      while (ch.firstChild) repl.appendChild(ch.firstChild);
      [[/font-weight:\s*(bold|[6-9]00)/i,'b'],[/font-style:\s*italic/i,'i'],[/text-decoration[^;]*underline/i,'u']].forEach(([re, tg]) => {
        if (re.test(st)) { const w = document.createElement(tg); w.appendChild(repl); repl = document.createDocumentFragment(); repl.appendChild(w); }
      });
      ch.replaceWith(repl);
    });
  })(tpl.content);
  return tpl.innerHTML;
}

function normRT(el) {
  if (!plain(el.innerHTML) && !el.querySelector('li')) { if (el.innerHTML) el.innerHTML = ''; return ''; }
  return el.innerHTML;
}

function onRT(el) {

function onPaste(ev) {

function focusRT(el) {

}
function blurRT() {

    const a = document.activeElement;
    if (!a || !a.classList || !a.classList.contains('rt')) hideFmt();
  }, 150);
}
function hideFmt() { $('fmt').classList.remove('show'); }

function placeFmt() {
  const f = $('fmt');
  if (!f.classList.contains('show')) return;
  const vv = window.visualViewport;
  const top = vv ? vv.offsetTop + vv.height - f.offsetHeight - 10 : window.innerHeight - f.offsetHeight - 10;
  f.style.top = Math.max(0, top) + 'px';
}
if (window.visualViewport) {
  visualViewport.addEventListener('resize', placeFmt);
  visualViewport.addEventListener('scroll', placeFmt);
}
window.addEventListener('scroll', placeFmt, { passive: true });

function updFmtState() {
  document.querySelectorAll('#fmt [data-cmd]').forEach(b => {
    let on = false; try { on = document.queryCommandState(b.dataset.cmd); } catch (_) {}
    b.classList.toggle('on', on);
  });
}
document.addEventListener('selectionchange', () => { if ($('fmt').classList.contains('show')) updFmtState(); });

$('fmt').addEventListener('pointerdown', ev => ev.preventDefault());   // keep focus/selection
$('fmt').addEventListener('mousedown', ev => ev.preventDefault());
$('fmt').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.cmd) {
    document.execCommand(b.dataset.cmd, false, null);
    if (lastRT) lastRT.dispatchEvent(new Event('input'));
    updFmtState();
  } else if (b.dataset.act === 'translate') {
    const sel = String(window.getSelection() || '').trim();
    if (!sel) { toast(t('selectWord')); return; }
    openTranslate(sel);
  } else if (b.dataset.act === 'gloss') {

function penBarInner() {
  const hl = tool.mode === 'hl';
  const cols = hl ? HL_COLORS : COLORS;
  return `
    <button class="pb ${tool.mode === 'pen' ? 'active' : ''}" onclick="setTool('mode','pen')" title="Pen">✏️</button>
    <button class="pb ${hl ? 'active' : ''}" onclick="setTool('mode','hl')" title="Highlighter">🖍️</button>
    <button class="pb ${tool.mode === 'eraser' ? 'active' : ''}" onclick="setTool('mode','eraser')" title="Eraser">🧽</button>
    <span class="pb-sep"></span>
    ${cols.map(c => `<button class="pb ${tool.color === c ? 'active' : ''}" onclick="setTool('color','${c}')"><span class="dot" style="background:${c}"></span></button>`).join('')}
    <span class="pb-sep"></span>
    ${SIZES.map(s => `<button class="pb ${tool.size === s ? 'active' : ''}" onclick="setTool('size',${s})"><span class="sz" style="width:${s + 3}px;height:${s + 3}px"></span></button>`).join('')}
    <span class="pb-sep"></span>
    <button class="pb ${settings.finger ? 'active' : ''}" onclick="toggleFinger()" title="${esc(t('finger'))}">👆</button>`;
}
function refreshPenBars() { document.querySelectorAll('.pen-bar').forEach(b => b.innerHTML = penBarInner()); }

function setTool(k, v) {
  if (k === 'mode') {
    const was = tool.mode;
    tool.mode = v;
    if (v === 'hl' && !HL_COLORS.includes(tool.color)) { tool._pc = tool.color; tool.color = HL_COLORS[0]; }
    if (v === 'pen' && was === 'hl') tool.color = tool._pc || COLORS[0];
  } else {
    tool[k] = v;
    if (k === 'color' && tool.mode === 'eraser') tool.mode = HL_COLORS.includes(v) ? 'hl' : 'pen';
  }
  refreshPenBars();
}
function toggleFinger() {
  settings.finger = !settings.finger;
  saveSettings(); refreshPenBars();
  toast((settings.finger ? '👆 ' : '✏️ ') + t('finger') + (settings.finger ? ' ✓' : ' ✕'));
}

const cvBlock = cv => E()?.[cv.dataset.sec]?.blocks[+cv.dataset.i];

function initCanvases(root) {
  root.querySelectorAll('canvas.pen-cv').forEach(cv => {
    if (!cv._init) { attachPen(cv); cv._init = true; }
    sizeCanvas(cv); redraw(cv);
  });
}

function sizeCanvas(cv) {
  const b = cvBlock(cv); if (!b) return;
  const w = cv.parentElement.clientWidth || 300;
  const scale = w / LW;
  const h = b.h * scale;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.height = h + 'px';
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv._scale = scale;
  cv.getContext('2d').setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
}

function redraw(cv) {
  const b = cvBlock(cv); if (!b) return;
  const ctx = cv.getContext('2d');
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.restore();
  // ruled lines
  ctx.save(); ctx.strokeStyle = '#e6eef7'; ctx.lineWidth = 1.2;
  for (let y = 48; y < b.h; y += 48) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(LW, y); ctx.stroke(); }
  ctx.restore();
  b.strokes.filter(s => s.hl).forEach(s => drawStroke(ctx, s));
  b.strokes.filter(s => !s.hl).forEach(s => drawStroke(ctx, s));
}

const wAt = (s, p) => s.pen ? s.s * (0.35 + (p || 0.5) * 1.3) : s.s;

function drawStroke(ctx, s) {
  const P = s.pts; if (!P.length) return;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = s.c; ctx.fillStyle = s.c;
  if (s.hl) {
    ctx.globalAlpha = .38; ctx.lineWidth = s.s * 5;
    ctx.beginPath(); ctx.moveTo(P[0][0], P[0][1]);
    if (P.length === 1) ctx.lineTo(P[0][0] + .1, P[0][1]);
    for (let i = 1; i < P.length - 1; i++) {
      const mx = (P[i][0] + P[i + 1][0]) / 2, my = (P[i][1] + P[i + 1][1]) / 2;
      ctx.quadraticCurveTo(P[i][0], P[i][1], mx, my);
    }
    if (P.length > 1) ctx.lineTo(P[P.length - 1][0], P[P.length - 1][1]);
    ctx.stroke();
  } else if (P.length === 1) {
    ctx.beginPath(); ctx.arc(P[0][0], P[0][1], wAt(s, P[0][2]) / 2, 0, Math.PI * 2); ctx.fill();
  } else {
    for (let i = 1; i < P.length; i++) segment(ctx, s, i);
  }
  ctx.restore();
}

function segment(ctx, s, i) {
  const a = s.pts[i - 1], b = s.pts[i];
  ctx.lineWidth = (wAt(s, a[2]) + wAt(s, b[2])) / 2;
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
}

function ptOf(cv, e) {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / cv._scale, y = (e.clientY - r.top) / cv._scale;
  const p = e.pointerType === 'pen' ? (e.pressure || 0.5) : 0.5;
  return [Math.round(x * 10) / 10, Math.round(y * 10) / 10, Math.round(p * 100) / 100];
}

function segDist(px, py, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const l2 = dx * dx + dy * dy;
  let tt = l2 ? ((px - a[0]) * dx + (py - a[1]) * dy) / l2 : 0;
  tt = Math.max(0, Math.min(1, tt));
  return Math.hypot(px - (a[0] + tt * dx), py - (a[1] + tt * dy));
}

function eraseAt(cv, pt) {
  const b = cvBlock(cv); const R = 14;
  const before = b.strokes.length;
  b.strokes = b.strokes.filter(s => {
    const lim = R + (s.hl ? s.s * 2.5 : s.s);
    if (s.pts.length === 1) return Math.hypot(pt[0] - s.pts[0][0], pt[1] - s.pts[0][1]) > lim;
    for (let i = 1; i < s.pts.length; i++) if (segDist(pt[0], pt[1], s.pts[i - 1], s.pts[i]) < lim) return false;
    return true;
  });
  if (b.strokes.length !== before) { redraw(cv); scheduleSave(); }
}

function attachPen(cv) {
  cv.addEventListener('pointerdown', e => {
    const b = cvBlock(cv); if (!b) return;
    activeIdx[cv.dataset.sec] = +cv.dataset.i;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    if (e.pointerType === 'touch') {
      if (penActive) return;                         // palm rejection while pen is writing
      if (!settings.finger) {                         // finger scrolls the page
        cv._pan = { id: e.pointerId, y: e.clientY };
        try { cv.setPointerCapture(e.pointerId); } catch (_) {}
        return;
      }
    }
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    cv._pid = e.pointerId;
    const pt = ptOf(cv, e);
    if (tool.mode === 'eraser') { cv._erasing = true; eraseAt(cv, pt); return; }
    const s = { c: tool.color, s: tool.size, hl: tool.mode === 'hl', pen: e.pointerType === 'pen', pts: [pt] };
    b.strokes.push(s);
    cv._stroke = s;
    penActive = e.pointerType === 'pen';
    if (!s.hl) drawStroke(cv.getContext('2d'), s);
  });

  cv.addEventListener('pointermove', e => {
    if (cv._pan && e.pointerId === cv._pan.id) {
      window.scrollBy(0, cv._pan.y - e.clientY);
      cv._pan.y = e.clientY;
      return;
    }
    if (e.pointerId !== cv._pid) return;
    const evs = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
    if (cv._erasing) { evs.forEach(ev => eraseAt(cv, ptOf(cv, ev))); return; }
    const s = cv._stroke; if (!s) return;
    e.preventDefault();
    const ctx = cv.getContext('2d');
    evs.forEach(ev => {
      const p = ptOf(cv, ev);
      const last = s.pts[s.pts.length - 1];
      if (Math.hypot(p[0] - last[0], p[1] - last[1]) < 0.8) return;
      s.pts.push(p);
      if (!s.hl) { ctx.save(); ctx.lineCap = 'round'; ctx.strokeStyle = s.c; segment(ctx, s, s.pts.length - 1); ctx.restore(); }
    });
    if (s.hl) redraw(cv);
  });

  const end = e => {
    if (cv._pan && e.pointerId === cv._pan.id) { cv._pan = null; return; }
    if (e.pointerId !== cv._pid) return;
    cv._pid = null;
    if (cv._erasing) { cv._erasing = false; return; }
    const s = cv._stroke; cv._stroke = null;
    penActive = false;
    if (!s) return;
    const b = cvBlock(cv);
    const maxY = Math.max(...s.pts.map(p => p[1]));
    if (maxY > b.h - 60) { b.h += 180; sizeCanvas(cv); }     // auto-grow near the bottom
    redraw(cv);
    scheduleSave();
  };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  cv.addEventListener('contextmenu', e => e.preventDefault());
}

const cvFor = (sec, i) => document.querySelector(`canvas.pen-cv[data-sec="${sec}"][data-i="${i}"]`);
function penUndo(sec, i) { const b = E()[sec].blocks[i]; if (!b.strokes.length) return; b.strokes.pop(); redraw(cvFor(sec, i)); scheduleSave(); }
function penMore(sec, i) { const b = E()[sec].blocks[i]; b.h += 240; const cv = cvFor(sec, i); sizeCanvas(cv); redraw(cv); scheduleSave(); }
function penClear(sec, i) {
  const b = E()[sec].blocks[i];
  if (!b.strokes.length || !confirm(t('confirmClearPen'))) return;
  b.strokes = []; b.h = 420; const cv = cvFor(sec, i); sizeCanvas(cv); redraw(cv); scheduleSave();
}

let rsT;
window.addEventListener('resize', () => {
  clearTimeout(rsT);
  rsT = setTimeout(() => document.querySelectorAll('canvas.pen-cv').forEach(cv => { sizeCanvas(cv); redraw(cv); }), 150);
});

// ═══════════════════════════════════════════
//  WORD COUNTER
// ═══════════════════════════════════════════
function renderCounter() {
  const e = E();
  const open = cntOpen ?? !!prof().kid;
  const total = e.counter.reduce((n, w) => n + w.c, 0);
  return `<div class="card cnt-card" id="cnt-card">
    <div class="sec-hdr" onclick="toggleCnt(event)" style="cursor:pointer">
      <span class="sec-title">${esc(t('counter'))} ${open ? '▾' : '▸'}</span>
      <span style="display:flex;gap:6px;align-items:center">
        <span class="cnt-total" id="cnt-total">${total} ${esc(t('total'))}</span>
        ${open ? `<button class="btn-hdr no-print" onclick="cntUndo(event)">↶</button>
        <button class="btn-hdr no-print" onclick="toggleCntEdit(event)">${esc(cntEdit ? t('done') : t('edit'))}</button>` : ''}
      </span>
    </div>
    ${open ? `<div class="cnt-grid">
      ${e.counter.map((w, i) => `<div class="cnt" id="cnt-${i}" onclick="bump(${i})">
          ${cntEdit ? `<button class="cnt-rm" onclick="event.stopPropagation();rmWord(${i})">✕</button>` : ''}
          <span class="cnt-e">${esc(w.e || '•')}</span>
          <span class="cnt-w">${esc(w.w)}</span>
          <span class="cnt-n">${w.c}</span>
        </div>`).join('')}
    </div>
    ${cntEdit ? `<div class="cnt-add">
      <input class="emo" id="cw-e" placeholder="🙂" maxlength="4">
      <input class="word" id="cw-w" placeholder="${esc(t('wordPh'))}" onkeydown="if(event.key==='Enter')addWord()">
      <button class="btn-hdr" onclick="addWord()">${esc(t('addWord'))}</button>
      <button class="btn-hdr danger" onclick="resetCounts()">${esc(t('resetCounts'))}</button>
    </div>` : ''}` : ''}
  </div>`;
}
function reCounter() {
  const c = $('cnt-card'); if (!c) return;
  c.outerHTML = renderCounter();
}
function toggleCnt(ev) {
  if (ev.target.closest('button')) return;
  cntOpen = !(cntOpen ?? !!prof().kid);
  reCounter();
}
function toggleCntEdit(ev) { ev.stopPropagation(); cntEdit = !cntEdit; reCounter(); }

function bump(i) {
  if (cntEdit) return;
  const w = E().counter[i]; w.c++;
  bumpStack.push(i);
  const el = $('cnt-' + i);
  if (el) {
    el.querySelector('.cnt-n').textContent = w.c;
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  }
  updTotal();
  if (navigator.vibrate) navigator.vibrate(15);
  scheduleSave();
}
function cntUndo(ev) {
  ev.stopPropagation();
  const i = bumpStack.pop(); if (i == null) return;
  const w = E().counter[i]; if (!w || !w.c) return;
  w.c--;
  const el = $('cnt-' + i); if (el) el.querySelector('.cnt-n').textContent = w.c;
  updTotal(); scheduleSave();
}
function updTotal() { const el = $('cnt-total'); if (el) el.textContent = E().counter.reduce((n, w) => n + w.c, 0) + ' ' + t('total'); }
function syncWordsToProfile() { prof().words = E().counter.map(w => ({ e: w.e, w: w.w })); saveSettings(); }
function addWord() {
  const w = $('cw-w').value.trim(); if (!w) return;
  E().counter.push({ e: $('cw-e').value.trim() || '•', w, c: 0 });
  syncWordsToProfile(); scheduleSave(); reCounter();
  requestAnimationFrame(() => $('cw-w')?.focus());
}
function rmWord(i) { E().counter.splice(i, 1); bumpStack = []; syncWordsToProfile(); scheduleSave(); reCounter(); }
function resetCounts() { E().counter.forEach(w => w.c = 0); bumpStack = []; scheduleSave(); reCounter(); }

function setMood(m) {
  const e = E(); e.kids.mood = e.kids.mood === m ? '' : m;
  document.querySelectorAll('#mood button').forEach(b => b.classList.toggle('active', b.textContent === e.kids.mood));
  scheduleSave();
}

// ═══════════════════════════════════════════
//  BIBLE PICKER
// ═══════════════════════════════════════════
function fillBookSelect() {
  const sel = $('bp-book'); const v = sel.value;
  sel.innerHTML = BOOKS.map(b => `<option value="${b.n}">${esc(b.name)}</option>`).join('');
  if (v) sel.value = v;
}
function buildUrl(book, ch, v, ve) {
  const first = `${String(book.n).padStart(2,'0')}${String(ch).padStart(3,'0')}${String(v || 1).padStart(3,'0')}`;
  const lastVerse = ve || v;
  const range = lastVerse ? `${first}-${String(book.n).padStart(2,'0')}${String(ch).padStart(3,'0')}${String(lastVerse).padStart(3,'0')}` : first;
  const locale = curLang === 'de' ? 'X' : 'E';
  return `https://www.jw.org/finder?wtlocale=${locale}&pub=nwtsty&bible=${range}`;
}
function buildLabel(name, ch, v, ve) {
  if (!v) return `${name} ${ch}`;
  if (!ve) return `${name} ${ch}:${v}`;
  return `${name} ${ch}:${v}–${ve}`;
}
function readBP() {
  const book = BOOKS[parseInt($('bp-book').value) - 1];
  const ch = $('bp-chapter').value, v = $('bp-verse').value, ve = $('bp-vend').value;
  if (!book || !ch) return null;
  return {
    label: buildLabel(book.name, ch, v || null, ve || null),
    url: buildUrl(book, +ch, v ? +v : null, ve ? +ve : null)
  };
}
function openBP(sec) {
  bpSec = sec;
  ['bp-chapter', 'bp-verse', 'bp-vend'].forEach(i => $(i).value = '');
  $('bp-preview').textContent = t('choose');
  $('modal-bible').style.setProperty('--bar', getComputedStyle(document.body).getPropertyValue(sec === 'wt' ? '--wt' : sec === 'kids' ? '--kids' : '--talk'));
  openModal('modal-bible');
  setTimeout(() => $('bp-chapter').focus(), 250);
}
function previewRef() {
  const r = readBP();
  $('bp-preview').innerHTML = r ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.label)}</a> ↗` : esc(t('choose'));
}
function insertRef() {
  const r = readBP();
  if (!r) { toast(t('selectBookChapter')); return; }
  const sec = bpSec, arr = E()[sec].blocks;
  const pos = insertPos(sec);
  arr.splice(pos, 0, { id: uid(), type: 'ref', ...r });
  // note field after the scripture, like in the CA tools
  let focus = pos + 1;
  if (!arr[pos + 1] || arr[pos + 1].type !== 'text' || blockHasContent(arr[pos + 1])) arr.splice(pos + 1, 0, tb());
  activeIdx[sec] = focus;
  scheduleSave();
  closeModal('modal-bible');
  toast(`✓ ${r.label} ${t('added')}`);
  rerenderSec(sec, focus);
}
function openScripture(url, e) {
  e.preventDefault();
  const mobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || window.innerWidth < 640 || navigator.maxTouchPoints > 1;
  if (mobile) { window.open(url, '_blank'); return; }
  const w = 440, h = 640;
  window.open(url, 'scripture_popup', `width=${w},height=${h},left=${Math.round((screen.width - w) / 2)},top=${Math.round((screen.height - h) / 2)},scrollbars=yes,resizable=yes`);
}

// ═══════════════════════════════════════════
//  GLOSSARY / TRANSLATE
// ═══════════════════════════════════════════
const wolSearch = q => curLang === 'de'
  ? `https://wol.jw.org/de/wol/s/r10/lp-x?q=${encodeURIComponent(q)}`
  : `https://wol.jw.org/en/wol/s/r1/lp-e?q=${encodeURIComponent(q)}`;
const translateUrl = q => `https://translate.google.com/?sl=auto&tl=${curLang === 'de' ? 'en' : 'de'}&text=${encodeURIComponent(q)}&op=translate`;
function openTranslate(q) { window.open(translateUrl(q), '_blank', 'noopener'); }

function allGloss() {
  const own = (settings.glossary || []).map(g => ({ ...g, own: true }));
  const built = GLOSS.map(([en, de, xen, xde]) => ({ en, de, xen, xde }));
  return [...own, ...built];
}

function openGloss(q = '') {
  $('g-search').value = q;
  renderGloss();
  openModal('modal-gloss');
  if (!q) setTimeout(() => $('g-search').focus(), 250);
}

function renderGloss() {
  const q = $('g-search').value.trim().toLowerCase();
  const list = allGloss().filter(g => !q || g.en.toLowerCase().includes(q) || g.de.toLowerCase().includes(q));
  const main = g => curLang === 'de' ? g.de : g.en;
  const alt = g => curLang === 'de' ? g.en : g.de;
  $('g-extra').innerHTML = q ? `<div class="g-links" style="margin:0 0 10px">
      <a href="${esc(translateUrl(q))}" target="_blank" rel="noopener">${esc(t('translateOnline'))}: „${esc(q)}“</a>
      <a href="${esc(wolSearch(q))}" target="_blank" rel="noopener">${esc(t('searchWol'))}</a></div>` : '';
  $('g-list').innerHTML = list.map(g => {
    const x = curLang === 'de' ? (g.xde || g.xen) : (g.xen || g.xde);
    const idx = g.own ? settings.glossary.indexOf(settings.glossary.find(o => o.id === g.id)) : -1;
    return `<div class="g-item">
      ${g.own ? `<div class="g-own">${esc(t('own'))}</div>` : ''}
      <div class="g-terms"><span class="g-main">${esc(main(g))}</span><span class="g-alt">${esc(alt(g))}</span></div>
      ${x ? `<div class="g-x">${esc(x)}</div>` : ''}
      <div class="g-links">
        <a href="${esc(wolSearch(curLang === 'de' ? g.de.split(' / ')[0] : g.en))}" target="_blank" rel="noopener">${esc(t('searchWol'))}</a>
        ${g.own ? `<button onclick="rmGloss(${idx})">🗑</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

function addGloss() {
  const en = $('ga-en').value.trim(), de = $('ga-de').value.trim(), x = $('ga-x').value.trim();
  if (!en && !de) return;
  settings.glossary = settings.glossary || [];
  settings.glossary.unshift({ id: uid(), en: en || de, de: de || en, xen: x, xde: x });
  saveSettings();
  ['ga-en', 'ga-de', 'ga-x'].forEach(i => $(i).value = '');
  renderGloss();
}
function rmGloss(i) { if (i < 0) return; settings.glossary.splice(i, 1); saveSettings(); renderGloss(); }

// ═══════════════════════════════════════════
//  PROFILES
// ═══════════════════════════════════════════
function openProfiles() { renderProfiles(); openModal('modal-prof'); }
function renderProfiles() {
  $('p-list').innerHTML = settings.profiles.map((p, i) => {
    const act = p.id === settings.activeProfile;
    return `<div class="p-row ${act ? 'active' : ''}">
      <input type="text" value="${esc(p.name)}" oninput="renameProfile(${i},this.value)">
      <label class="p-kid"><input type="checkbox" ${p.kid ? 'checked' : ''} onchange="kidProfile(${i},this.checked)"> ${esc(t('kidMode'))}</label>
      <button class="p-sel" onclick="useProfile(${i})">${esc(act ? t('active') : t('use'))}</button>
      ${settings.profiles.length > 1 ? `<button class="p-del" onclick="delProfile(${i})">🗑</button>` : ''}
    </div>`;
  }).join('');
}
function renameProfile(i, v) { settings.profiles[i].name = v || '?'; saveSettings(); $('app-subtitle').textContent = '👤 ' + prof().name; }
function kidProfile(i, v) { settings.profiles[i].kid = v; saveSettings(); if (settings.profiles[i].id === prof().id) render(); }
function useProfile(i) {
  if (saveTimer) flushSave();
  settings.activeProfile = settings.profiles[i].id; saveSettings();
  closeModal('modal-prof'); goHome();
}
function addProfile() {
  settings.profiles.push({ id: uid(), name: t('newPerson'), kid: true, words: DEFAULT_WORDS[curLang].map(w => ({ ...w })) });
  saveSettings(); renderProfiles();
  requestAnimationFrame(() => { const ins = document.querySelectorAll('#p-list input[type=text]'); const last = ins[ins.length - 1]; last.focus(); last.select(); });
}
async function delProfile(i) {
  const p = settings.profiles[i];
  if (!confirm(t('confirmDelProfile') + '\n\n' + p.name)) return;
  const gone = entries.filter(e => e.profileId === p.id);
  entries = entries.filter(e => e.profileId !== p.id);
  for (const e of gone) await idbDel('entries', e.id).catch(console.error);
  settings.profiles.splice(i, 1);
  if (settings.activeProfile === p.id) settings.activeProfile = settings.profiles[0].id;
  saveSettings(); renderProfiles(); if (view === 'home') render(); else goHome();
}

// ═══════════════════════════════════════════
//  MODALS
// ═══════════════════════════════════════════
function openModal(id) { hideFmt(); $(id).classList.add('show'); }
function closeModal(id) { $(id).classList.remove('show'); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.modal-bg.show').forEach(m => m.classList.remove('show'));
});

// ═══════════════════════════════════════════
//  EXPORT / IMPORT / PRINT
// ═══════════════════════════════════════════
async function shareOrDownload(blob, name) {
  const touch = window.matchMedia('(pointer: coarse)').matches;
  const file = new File([blob], name, { type: blob.type });
  if (touch && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return true; }
    catch (e) { if (e.name === 'AbortError') return false; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  return true;
}

async function exportAll() {
  if (saveTimer) await flushSave();
  const data = { app: 'congregation-notes', version: 1, exported: new Date().toISOString(), settings, entries };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  if (await shareOrDownload(blob, `congregation-notes-${isoLocal(new Date())}.json`)) toast(t('exported'));
}

async function doImport(ev) {
  const f = ev.target.files[0]; ev.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (data.app !== 'congregation-notes' || !Array.isArray(data.entries)) throw new Error('format');
    if (!confirm(t('confirmImport'))) return;
    // merge profiles
    (data.settings?.profiles || []).forEach(p => { if (!settings.profiles.some(x => x.id === p.id)) settings.profiles.push(p); });
    (data.settings?.glossary || []).forEach(g => {
      settings.glossary = settings.glossary || [];
      if (!settings.glossary.some(x => x.id === g.id)) settings.glossary.push(g);
    });
    // merge entries (newer wins)
    for (const e of data.entries) {
      if (!e || !e.id || !e.talk || !e.wt || !e.kids) continue;
      if (!settings.profiles.some(p => p.id === e.profileId)) e.profileId = settings.profiles[0].id;
      const cur = entries.find(x => x.id === e.id);
      if (cur && cur.updated >= e.updated) continue;
      entries = entries.filter(x => x.id !== e.id).concat(e);
      await idbPut('entries', e);
    }
    saveSettings();
    toast(t('imported')); goHome();
  } catch (err) {
    console.error(err); toast(t('importFailed'));
  }
}

function printEntry() {
  hideFmt();
  document.querySelectorAll('.pen-print').forEach(i => i.remove());
  document.querySelectorAll('canvas.pen-cv').forEach(cv => {
    const img = new Image(); img.className = 'pen-print'; img.src = cv.toDataURL('image/png');
    cv.after(img);
  });
  setTimeout(() => window.print(), 60);
}
window.addEventListener('afterprint', () => document.querySelectorAll('.pen-print').forEach(i => i.remove()));

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
async function init() {
  setLang(curLang);
  try {
    const s = await idbGet('meta', 'settings');
    if (s) { delete s.k; settings = s; }
    entries = await idbGetAll('entries');
  } catch (err) {
    console.error(err); toast(t('saveErr'));
  }
  if (!settings || !Array.isArray(settings.profiles) || !settings.profiles.length) {
    const id = uid();
    settings = { activeProfile: id, finger: false, glossary: [],
      profiles: [{ id, name: t('me'), kid: false, words: DEFAULT_WORDS[curLang].map(w => ({ ...w })) }] };
    saveSettings();
  }
  // ask the browser to keep the data (important for Safari)
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  render();
}
init();
