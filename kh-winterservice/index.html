<style>
:root{
  --bg:#eef3f7;--card:#fff;--text:#172033;--muted:#687386;--line:#dfe6ee;
  --accent:#1f5f8b;--accent2:#174b6d;--ok:#2d7a4b;--warn:#ad7218;--risk:#bd4b32;
  --open:#b83a3a;--soft:#f6f8fb;--shadow:0 8px 24px rgba(20,35,55,.08)
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.app{max-width:780px;margin:auto;min-height:100vh;padding:16px 12px 92px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:14px;background:#dcecf6;display:grid;place-items:center;font-size:23px}
h1{font-size:21px;margin:0}.brand h1{white-space:nowrap;line-height:1.1}.sub{font-size:12px;color:var(--muted);margin-top:2px}.langs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.lang{border:0;background:transparent;color:var(--muted);padding:5px 6px;border-radius:7px;font-size:12px}.lang.active{background:#dce8f1;color:var(--accent);font-weight:800}
.card{background:#fff;border:1px solid rgba(217,225,235,.9);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.heroHead,.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.sectionTitle{font-size:13px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:#4f5b6f;margin:18px 2px 8px}
.temp{font-size:34px;font-weight:800}.weatherText,.muted{color:var(--muted)}.weatherText{font-size:13px;margin-top:4px}
.badge,.pill{display:inline-flex;align-items:center;border-radius:999px;font-size:12px;font-weight:800}.badge{padding:7px 10px}.pill{padding:5px 8px}
.forecastWrap{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.forecastTitle{font-size:11px;font-weight:850;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.forecastGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.forecastDay{border:1px solid var(--line);border-radius:12px;padding:9px;background:#fafbfd;min-width:0}
.forecastDay.watch{background:#fffaf0;border-color:#f1dfb6}
.forecastDay.risky{background:#fff3f1;border-color:#efc8c1}
.forecastDate{font-size:11px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.forecastWeather{display:flex;align-items:center;gap:5px;margin-top:4px}
.forecastIcon{font-size:18px}.forecastTemp{font-size:12px;font-weight:800}
.forecastStatus{font-size:10px;margin-top:4px;color:var(--muted);font-weight:750}
.forecastOpen{font-size:10px;margin-top:5px;color:var(--risk);font-weight:850}
.badge.ok,.pill.covered{background:#e9f5ee;color:var(--ok)}.badge.warn{background:#fff4df;color:var(--warn)}.badge.risk{background:#fdece8;color:var(--risk)}.pill.open{background:#fdeaea;color:#a73f3f}
.btn{border:0;border-radius:11px;padding:9px 12px;background:var(--accent);color:#fff;font-weight:750}.btn.ghost{background:#edf3f7;color:var(--accent)}.btn.small{padding:7px 9px;font-size:12px}
.openItem,.dayItem,.personItem{display:grid;grid-template-columns:78px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.openItem:first-child,.dayItem:first-child,.personItem:first-child{border-top:0}
.dateBox{font-weight:800}.dateBox small{display:block;color:var(--muted);font-weight:600}.openTxt{font-size:13px;color:var(--open);font-weight:800}.name{font-weight:800}.helperText{font-size:12px;color:var(--muted);margin-top:3px}.weekHead{font-size:12px;color:var(--muted);font-weight:800;margin-top:12px}
.adminStrip{background:#f3eafa;color:#6b3a89;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:800;margin:12px 0}.adminTools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.footerNav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20}
.footerInner{width:min(780px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom))}.navBtn{border:0;background:none;padding:7px 3px;color:var(--muted);font-size:11px}.navBtn span{display:block;font-size:19px}.navBtn.active{color:var(--accent);font-weight:800}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.58);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}.overlay.show{display:flex}
.modal{background:#fff;border-radius:20px;padding:20px;width:min(500px,100%);max-height:90vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.24)}.modal h2{margin:0 0 7px}.modal p{color:var(--muted);font-size:13px}
.field{width:100%;border:1px solid #cfd8e3;border-radius:12px;padding:11px 12px;margin:6px 0 10px;background:#fff}.modalActions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.login{max-width:420px;margin:8vh auto}.login .card{text-align:center;padding:26px}.pin{font-size:22px;text-align:center;letter-spacing:.2em}.notice{font-size:12px;color:var(--muted);margin-top:10px}.error{color:var(--risk);font-size:13px;margin-top:8px}
.switchRow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.switchRow:first-child{border-top:0}
.empty{text-align:center;color:var(--muted);padding:16px 4px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.monthGrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.monthDow{text-align:center;font-size:11px;font-weight:800;color:var(--muted);padding:5px 0}
.monthCell{min-height:72px;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px;display:flex;flex-direction:column;gap:3px;position:relative}.monthCell.tap{cursor:pointer}.monthCell .s{overflow-wrap:break-word}.nmShort{display:none}
.monthCell.emptyDay{visibility:hidden}.monthCell.openDay{background:#fff3f3;border-color:#efc8c8}.monthCell.coveredDay{background:#f0f8f3;border-color:#cde6d5}.monthCell.groupDay{background:#f5f0fa;border-color:#ddcdeb}
.monthCell .n{font-size:12px;font-weight:850}.monthCell .s{font-size:10px;line-height:1.15}.monthCell button{margin-top:auto;border:0;background:transparent;color:var(--accent);font-size:10px;padding:0;text-align:left}
.areaBoard{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.areaCard{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fafbfd}.areaCard.missing{border-color:#efc8c8;background:#fff5f5}.areaCard .areaHead{font-size:12px;font-weight:850}.areaCard .areaNames{font-size:11px;color:var(--muted);margin-top:3px}
button.areaCard{font:inherit;color:inherit;text-align:left;width:100%;cursor:pointer;transition:transform .08s ease,border-color .15s ease}button.areaCard:active{transform:scale(.97)}
.areaCard.mine{border-color:var(--accent);background:#eef6fb}.areaCta{font-size:11px;font-weight:850;color:var(--accent);margin-top:7px}.areaCard.missing .areaCta{color:var(--open)}
.stampBtn{border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:750;padding:2px 0;white-space:nowrap}.stampBtn.spin .ico{display:inline-block;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.appFooter{text-align:center;color:var(--muted);font-size:11px;padding:24px 4px 8px}.appFooter a{color:var(--accent);text-decoration:none;font-weight:800;display:inline-block;margin-top:6px;padding:6px 12px;border-radius:999px;background:#edf3f7}
.modal.wide{width:min(1200px,100%);max-height:94vh}
.mapFrame{overflow:auto;max-height:72vh;border-radius:14px;border:1px solid var(--line);background:#f6f9fb;cursor:zoom-in;-webkit-overflow-scrolling:touch}
.mapFrame img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.mapFrame.zoomed{cursor:zoom-out}.mapFrame.zoomed img{width:250%;max-width:none}
.mapHint{font-size:12px;color:var(--muted);margin:8px 0 0}
@media (hover:none){.mapHint{display:none}}
.crew{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:850;white-space:nowrap;line-height:1.2}
.crew.low{background:#fde2e2;color:#a12626}.crew.mid{background:#fff1d6;color:#8a5a00}.crew.good{background:#dcf3e4;color:#1d6b3a}
.crew.alert{box-shadow:0 0 0 2px #e05252 inset}
#toastHost{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:400;pointer-events:none;padding:0 14px}
.toast{max-width:460px;width:100%;background:#173a2a;color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:700;line-height:1.35;box-shadow:0 12px 34px rgba(0,0,0,.28);display:flex;gap:10px;align-items:flex-start;opacity:0;transform:translateY(14px);transition:opacity .2s ease,transform .2s ease;pointer-events:auto}
.toast.show{opacity:1;transform:none}.toast.error{background:#7a1f1f}.toast.busy{background:#24364d}
.toast .ti{font-size:17px;line-height:1.1}
.toast.busy .ti{display:inline-block;animation:spin .9s linear infinite}
body.isBusy button{cursor:progress}
.unassignBtn{border:1px solid #f0c9c9;background:#fff5f5;color:var(--open);border-radius:999px;width:24px;height:24px;padding:0;font-size:12px;font-weight:900;line-height:1;cursor:pointer;flex:none}.unassignBtn:hover{background:#fde2e2}
.planTabs{position:sticky;top:0;z-index:15;display:flex;gap:6px;overflow-x:auto;padding:10px 2px 10px;margin:0 -2px 6px;background:var(--bg,#eef3f7);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.planTabs::-webkit-scrollbar{display:none}
.planTab{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:999px;padding:8px 13px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap}
.planTab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.planTab .tb{font-size:11px;font-weight:850;border-radius:999px;padding:1px 7px;background:#fde2e2;color:#a12626}
.planTab .tb.ok{background:#dcf3e4;color:#1d6b3a}
.planTab.active .tb{background:rgba(255,255,255,.22);color:#fff}
.pastToggle{width:100%;margin:6px 0 2px}
#toTopBtn{position:fixed;right:14px;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.92);backdrop-filter:blur(8px);color:var(--accent);font-size:20px;font-weight:900;box-shadow:0 6px 18px rgba(15,23,42,.14);cursor:pointer;z-index:30;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s ease,transform .2s ease}
#toTopBtn.show{opacity:1;pointer-events:auto;transform:none}
.tapHint{font-size:12px;color:var(--muted);margin-top:10px}
.helpStep{display:grid;grid-template-columns:36px 1fr;gap:11px;padding:11px 0;border-top:1px solid var(--line)}.helpStep:first-child{border-top:0}
.helpIcon{width:36px;height:36px;border-radius:12px;background:#dcecf6;display:grid;place-items:center;font-size:18px}
.helpBox{background:#f2f8fc;border:1px solid #d5e6f1;border-radius:14px;padding:12px;margin-top:12px}.helpBox.admin{background:#f3eafa;border-color:#e2d2ee}
.keyCode{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:10px;background:#fff;border:1px solid #d5e6f1;font-size:14px}
.helpBtn{width:34px;height:34px;padding:0;border-radius:11px;font-size:16px;font-weight:850}
details summary::-webkit-details-marker{display:none}
details[open] summary span:last-child{transform:rotate(180deg)}
details summary span:last-child{transition:transform .2s ease}
@media(max-width:520px){
  .brand h1{font-size:16.5px}
  .brand{gap:8px}.logo{width:38px;height:38px;font-size:21px;border-radius:12px}
  .topbar{gap:8px}
}
@media(max-width:390px){.brand h1{font-size:15px}.logo{width:34px;height:34px;font-size:19px}.forecastGrid{gap:4px}.forecastDay{padding:7px 5px}.forecastDate{font-size:10px}.forecastTemp{font-size:11px}.forecastStatus,.forecastOpen{font-size:9px}}
@media(max-width:520px){.monthGrid{gap:3px}.monthCell{min-height:60px;padding:4px}.monthCell .s{font-size:9px}.monthCell button{display:none}.nmFull{display:none}.nmShort{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.monthCell .crew{font-size:9px!important;padding:0 4px!important}.areaBoard{grid-template-columns:1fr}.openItem,.dayItem,.personItem{grid-template-columns:64px 1fr}.openItem>*:last-child,.dayItem>*:last-child,.personItem>*:last-child{grid-column:2;justify-self:start}.adminTools{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="loginView" class="app">
  <div class="login">
    <div class="card">
      <div class="logo" style="margin:0 auto 12px">❄️</div>
      <h1 id="loginTitle"></h1>
      <div class="sub"><span id="loginHallName"></span> · Hirblinger Str. 99 · Augsburg</div>
      <div style="height:18px"></div>
      <input id="pinInput" class="field pin" type="password" autocomplete="current-password" placeholder="•••••">
      <button id="loginBtn" class="btn" style="width:100%"></button>
      <div id="loginError" class="error hidden"></div>
      <div id="loginNote" class="notice"></div>
      <div class="langs" id="loginLangs" style="justify-content:center;margin-top:14px"></div>
    </div>
  </div>
  <footer class="appFooter"></footer>
</div>

<div id="mainView" class="app hidden">
  <div class="topbar">
    <div class="brand"><div class="logo">❄️</div><div><h1 id="brandTitle"></h1><div class="sub">Hirblinger Str. 99 · Augsburg</div><div id="roleBadge" class="pill covered" style="margin-top:6px"></div></div></div>
    <div style="display:flex;gap:6px;align-items:center"><button id="helpBtn" class="btn ghost helpBtn" type="button">?</button><select id="mainLangSelect" class="field" style="width:auto;margin:0;padding:7px 9px;font-size:12px"></select></div>
  </div>

  <div id="adminStrip" class="adminStrip hidden">
    <div class="row"><span id="adminModeLabel"></span><div class="actions"><button class="btn ghost small" id="adminMonthsBtn"></button><button class="btn ghost small" id="adminWeekendsBtn"></button><button class="btn ghost small" id="adminSeasonBtn"></button><button class="btn ghost small" id="adminPeopleBtn"></button></div></div>
    <div id="adminTip" class="helperText" style="margin-top:6px"></div>
  </div>

  <div id="viewToday">
  <div class="card">
    <div class="heroHead">
      <div><div class="sectionTitle" style="margin:0 0 8px" id="todayLabel"></div><div id="todayDate" style="font-weight:850;font-size:18px"></div><div id="weatherText" class="weatherText"></div></div>
      <div style="text-align:right"><div id="weatherBadge" class="badge"></div><div id="temperature" class="temp" style="margin-top:8px">--°</div></div>
    </div>
    <div id="forecastWrap" class="forecastWrap hidden">
      <div class="row" style="margin-bottom:8px;align-items:baseline"><div id="forecastTitle" class="forecastTitle" style="margin:0"></div><button id="stampBtn" class="stampBtn" type="button"><span class="ico">↻</span> <span id="stampText"></span></button></div>
      <div id="forecastGrid" class="forecastGrid"></div>
    </div>
  </div>

  <div id="myAssignmentsWrap" class="hidden">
    <div class="sectionTitle" id="myAssignmentsTitle"></div>
    <div class="card" id="myAssignments"></div>
  </div>

  <details class="card" id="areaReferenceCard" style="padding:0;overflow:hidden">
    <summary style="list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px">
      <div>
        <div class="name" id="areaRefTitle"></div>
        <div class="helperText" id="areaRefIntro"></div>
      </div>
      <span style="font-size:18px;color:var(--accent)">⌄</span>
    </summary>
    <div style="padding:0 16px 16px">
      <div class="areaBoard">
        <div class="areaCard">
          <div class="areaHead">🔵 <span id="areaRefBlueTitle"></span></div>
          <div class="areaNames" id="areaRefBlueText"></div>
        </div>
        <div class="areaCard">
          <div class="areaHead">🔴 <span id="areaRefRedTitle"></span></div>
          <div class="areaNames" id="areaRefRedText"></div>
        </div>
        <div class="areaCard">
          <div class="areaHead">🟢 <span id="areaRefGreenTitle"></span></div>
          <div class="areaNames" id="areaRefGreenText"></div>
        </div>
        <div class="areaCard hidden">
          <div class="areaHead">⚪ <span id="areaRefFlexTitle"></span></div>
          <div class="areaNames" id="areaRefFlexText"></div>
        </div>
      </div>
      <div id="materialInfo" class="helperText" style="margin-top:12px"></div>
      <div class="actions" style="margin-top:12px">
        <button id="topMapBtn" class="btn">🗺</button>
      </div>
    </div>
  </details>

  <div class="row" style="margin-top:18px"><div class="sectionTitle" id="todayServiceTitle" style="margin:0"></div><button id="mapBtn" class="btn ghost small">🗺</button></div><div class="card" id="todayService"></div>
  <div id="whatsappCard" class="card hidden">
    <div class="row">
      <div>
        <div class="name" id="whatsappTitle"></div>
        <div class="helperText" id="whatsappText"></div>
      </div>
      <a id="whatsappBtn" class="btn" href="#" target="_blank" rel="noopener noreferrer" style="text-decoration:none"></a>
    </div>
  </div>
  </div>

  <div id="viewOpen" class="hidden">
    <div class="sectionTitle" id="openTitle"></div><div class="card" id="openAssignments"></div>
  </div>

  <div id="viewPlan" class="hidden">
    <div class="sectionTitle" id="scheduleTitle"></div><div class="planTabs" id="planTabs"></div><div class="card" id="schedule"></div>
  </div>

  <footer class="appFooter"></footer>
</div>

<div class="footerNav hidden" id="footerNav">
  <div class="footerInner">
    <button class="navBtn active" data-scroll="top"><span>🏠</span><b id="navHome"></b></button>
    <button class="navBtn" data-scroll="open"><span>⚠️</span><b id="navOpen"></b></button>
    <button class="navBtn" data-scroll="plan"><span>📅</span><b id="navPlan"></b></button>
    <button class="navBtn" id="logoutBtn"><span>↩️</span><b id="navLogout"></b></button>
  </div>
</div>


<div id="firstLoginModal" class="overlay"><div class="modal">
  <h2 id="firstTitle"></h2>
  <p id="firstText"></p>

  <label id="firstNameLabel" class="hidden"></label>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <div><label id="firstGivenLabel"></label><input id="firstGivenInput" class="field" type="text" autocomplete="given-name"></div>
    <div><label id="firstFamilyLabel"></label><input id="firstFamilyInput" class="field" type="text" autocomplete="family-name"></div>
  </div>
  <div id="firstDupHint" class="hidden" style="background:#eef6fb;border:1px solid #cfe3f0;border-radius:12px;padding:10px;margin:4px 0 6px"></div>

  <label id="firstCongLabel"></label>
  <select id="firstCongSelect" class="field"></select>

  <div style="border-top:1px solid var(--line);margin:14px 0 10px;padding-top:12px">
    <div class="muted" style="font-size:12px;margin-bottom:6px" id="firstExistingLabel"></div>
    <select id="firstExistingSelect" class="field"></select>
  </div>

  <div class="modalActions">
    <button class="btn" id="firstSaveBtn"></button>
  </div>
</div></div>

<div id="personModal" class="overlay"><div class="modal">
  <h2 id="personModalTitle"></h2><p id="personModalText"></p>
  <select id="personSelect" class="field"></select>
  <label><input id="rememberPerson" type="checkbox" checked> <span id="rememberText"></span></label>
  <div class="modalActions"><button class="btn ghost" data-close="personModal" id="cancelPersonBtn"></button><button class="btn" id="confirmPersonBtn"></button></div>
</div></div>



<div id="monthModal" class="overlay"><div class="modal" style="width:min(720px,100%)">
  <div class="row" style="align-items:flex-start">

function seasonMonths(){
  const s=S.data?.settings?.season||{};
  const a=(s.start||"2026-11-01").slice(0,7),b=(s.end||"2027-03-31").slice(0,7);
  const out=[];let [y,m]=a.split("-").map(Number);
  while(out.length<24){const ym=`${y}-${String(m).padStart(2,"0")}`;if(ym>b)break;out.push(ym);m++;if(m>12){m=1;y++}}
  return out;
}
function activeMonths(){
  const saved=S.data?.settings?.display?.active_months;
  if(Array.isArray(saved)&&saved.length)return [...saved].sort();
  if(!S.data){try{const c=JSON.parse(localStorage.getItem(K.months)||"null");if(Array.isArray(c)&&c.length)return c}catch(e){}}
  return seasonMonths();
}

async function api(action,payload={}){
  const quiet=["bootstrap","login","logout","admin_season_status"].includes(action);
  let closeBusy=null,timer=null;
  if(!quiet){S.busyCount=(S.busyCount||0)+1;document.body.classList.add("isBusy");timer=setTimeout(()=>{closeBusy=toast(t("saving"),"busy",0)},300)}
  try{
    const h={"Content-Type":"application/json"};if(S.token)h.Authorization="Bearer "+S.token;
    const r=await fetch(API_URL,{method:"POST",headers:h,body:JSON.stringify({action,...payload})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw Object.assign(new Error(d.error||"API"),{status:r.status,data:d});
    return d;
  }finally{
    if(!quiet){clearTimeout(timer);if(closeBusy)closeBusy();S.busyCount--;if(!S.busyCount)document.body.classList.remove("isBusy")}

function toggleMapZoom(e){
  const f=$("mapFrame"),img=$("mapImage");
  if(f.classList.contains("zoomed")){f.classList.remove("zoomed");f.scrollTo(0,0);return}
  const r=img.getBoundingClientRect();
  const px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
  f.classList.add("zoomed");
  requestAnimationFrame(()=>{f.scrollLeft=px*img.offsetWidth-f.clientWidth/2;f.scrollTop=py*img.offsetHeight-f.clientHeight/2});
}

function icsEscape(v){
  return String(v||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");
}
function addOneDay(iso){
  const d=new Date(iso+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+1); return d.toISOString().slice(0,10);
}
function ymd(iso){return iso.replaceAll("-","")}
function downloadICS(id){
  const a=(S.data.assignments||[]).find(x=>x.id===id);
  if(!a)return;
  const personId=currentPersonId();
  const isResp=a.responsible_person_id===personId;
  const myHelper=(a.helpers||[]).find(h=>h.id===personId);
  const role=isResp?t("calendarRoleResponsible"):t("calendarRoleHelper");
  const area=myHelper?areaLabel(myHelper.area_preference||"flexible"):"";
  const desc=[t("calendarDesc"),role,area].filter(Boolean).join(" · ");
  const uid=`winter-${a.id}-${personId}@hirblinger99`;
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d{3}Z/,"Z");
  const content=[
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Winter Service//Bärenkeller//EN",
    "CALSCALE:GREGORIAN","BEGIN:VEVENT",
    `UID:${uid}`,`DTSTAMP:${stamp}`,
    `DTSTART;VALUE=DATE:${ymd(a.service_date)}`,
    `DTEND;VALUE=DATE:${ymd(addOneDay(a.service_date))}`,
    `SUMMARY:${icsEscape(t("calendarTitle"))}`,
    `LOCATION:${icsEscape("Hirblinger Str. 99, Augsburg")}`,
    `DESCRIPTION:${icsEscape(desc)}`,
    "END:VEVENT","END:VCALENDAR"
  ].join("\r\n");
  const blob=new Blob([content],{type:"text/calendar;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  link.href=url;link.download=`winterdienst-${a.service_date}.ics`;
  document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function openMonth(ym){
  const months=activeMonths();
  if(!months.includes(ym)) return;
  S.monthView=ym;
  const idx=months.indexOf(ym);
  $("monthPrevBtn").disabled=idx<=0;
  $("monthNextBtn").disabled=idx<0||idx>=months.length-1;
  $("monthPrevBtn").style.opacity=idx<=0?".35":"1";
  $("monthNextBtn").style.opacity=(idx<0||idx>=months.length-1)?".35":"1";
  const [y,m]=ym.split("-").map(Number);
  const first=new Date(y,m-1,1);
  const days=new Date(y,m,0).getDate();
  const offset=(first.getDay()+6)%7;
  const dow=[];
  const base=new Date(2026,0,5);
  for(let i=0;i<7;i++){const d=new Date(base);d.setDate(base.getDate()+i);dow.push(new Intl.DateTimeFormat(locale(),{weekday:"short"}).format(d))}
  let html=dow.map(x=>`<div class="monthDow">${x}</div>`).join("");
  for(let i=0;i<offset;i++)html+=`<div class="monthCell emptyDay"></div>`;
  for(let day=1;day<=days;day++){
    const iso=`${ym}-${String(day).padStart(2,"0")}`;
    const a=(S.data.assignments||[]).find(x=>x.service_date===iso);
    let cls="",status="",action="";
    if(!a){cls="";status="—";}
    else if(a.coverage_type==="regular"&&!a.responsible){cls="openDay";status="⚠ "+t("openNav");}
    else if(a.coverage_type==="regular"&&a.responsible){cls="coveredDay";const n=crewCount(a);status="✓ "+`<span class="nmFull">${esc(a.responsible.name)}</span><span class="nmShort">${esc(String(a.responsible.name).split(/\s+/)[0])}</span>`+` <span class="crew ${n>=CREW_GOOD?"good":n>=2?"mid":"low"}" style="padding:1px 6px;font-size:10px">👥${n}</span>`;}
    else if(a.coverage_type==="cleaning_team"){cls="groupDay";status="FSG";}
    else if(a.coverage_type==="morning_congregations"){cls="groupDay";status=esc(t("morningShort"));}
    else {cls="groupDay";status=esc(coverageText(a));}
    let tap="";
    if(a){
      if(S.level==="admin") tap=`closeMonthThen(()=>openEdit(${a.id}))`;
      else if(a.coverage_type==="regular"&&!a.responsible) tap=`closeMonthThen(()=>startPerson('take',${a.id}))`;
      if(tap) action=`<button type="button">${S.level==="admin"?t("edit"):t("take")}</button>`;
    }
    html+=`<div class="monthCell ${cls}${tap?" tap":""}"${tap?` onclick="${tap}"`:""}><div class="n">${day}</div><div class="s">${status}</div>${action}</div>`;
  }
  $("monthModalTitle").textContent=fmt(ym+"-01",{month:"long",year:"numeric"});
  const lp=t("monthLegend").split(" · "),mdays=(S.data.assignments||[]).filter(x=>x.service_date.slice(0,7)===ym);
  $("monthLegend").textContent=[lp[0],lp[1],mdays.some(x=>x.coverage_type==="cleaning_team")?lp[2]:null,mdays.some(x=>x.coverage_type==="morning_congregations")?lp[3]:null].filter(Boolean).join(" · ");
  $("monthGrid").innerHTML=html;
  $("monthModal").classList.add("show");
}

    renderSeasonInfo();
  }catch(e){$("seasonStatus").textContent=e.data?.error==="Unknown action"?t("seasonBackend"):(e.data?.error||t("server"));renderSeasonInfo()}
}
const WEEKEND_DEFAULT={6:"cleaning_team",0:"morning_congregations"};
function weekendDays(dow){
  const today=todayISO();
  return (S.data?.assignments||[]).filter(a=>a.service_date>=today&&new Date(a.service_date+"T12:00:00").getDay()===dow);
}
function renderWeekendsAdmin(){
  $("weekendsStatus").textContent="";
  $("weekendsSaveBtn").disabled=false;
  $("weekendsList").innerHTML=[[6,"satLabel"],[0,"sunLabel"]].map(([dow,lk])=>{
    const days=weekendDays(dow),reg=days.filter(a=>a.coverage_type==="regular").length;
    const all=days.length&&reg===days.length,part=reg>0&&!all;
    return `<label class="switchRow"><span>${esc(t(lk))}${part?` <span class="muted" style="font-size:12px">(${esc(t("weekendsMixed"))}: ${reg}/${days.length})</span>`:""}</span><span><input type="checkbox" class="weekendCheck" data-dow="${dow}" ${all?"checked":""}> ${esc(t("individually"))}</span></label>`;
  }).join("");
}
function weekendPlan(){
  const changes=[];let skipped=0;
  document.querySelectorAll(".weekendCheck").forEach(cb=>{
    const dow=Number(cb.dataset.dow),target=cb.checked?"regular":WEEKEND_DEFAULT[dow];
    for(const a of weekendDays(dow)){
      if(cb.checked){if(a.coverage_type!=="regular")changes.push({a,type:"regular"});}
      else if(a.coverage_type==="regular"){
        if(a.responsible_person_id||(a.helpers||[]).length)skipped++;
        else changes.push({a,type:target});
      }
    }
  });
  return {changes,skipped};
}
async function saveWeekends(){
  const {changes,skipped}=weekendPlan();
  if(!changes.length){$("weekendsStatus").textContent=t("weekendsNothing")+(skipped?" "+t("weekendsSkipped").replace("{n}",skipped):"");return}
  let msg=t("weekendsConfirm").replace("{n}",changes.length);
  if(skipped)msg+="\n"+t("weekendsSkipped").replace("{n}",skipped);
  if(!confirm(msg))return;
  $("weekendsSaveBtn").disabled=true;
  let done=0;
  try{
    for(let i=0;i<changes.length;i+=4){
      await Promise.all(changes.slice(i,i+4).map(({a,type})=>api("admin_update_assignment",{
        assignment_id:a.id,coverage_type:type,person_id:null,coverage_label:null,note:a.note||null
      }).then(()=>{done++;$("weekendsStatus").textContent=`${done}/${changes.length}`})));
    }
    await refresh();
    $("weekendsStatus").textContent=t("weekendsDone").replace("{n}",done)+(skipped?" "+t("weekendsSkipped").replace("{n}",skipped):"");
    renderWeekendsAdmin();
    $("weekendsStatus").textContent=t("weekendsDone").replace("{n}",done)+(skipped?" "+t("weekendsSkipped").replace("{n}",skipped):"");
  }catch(e){
    await refresh().catch(()=>{});
    alert((e.data?.error||t("server"))+` (${done}/${changes.length})`);
    renderWeekendsAdmin();
  }finally{$("weekendsSaveBtn").disabled=false}
}
function renderMonthsAdmin(){
  const active=new Set(activeMonths());
  const defaults=[...new Set([...seasonMonths(),...active])].sort();
  $("monthsList").innerHTML=defaults.map(ym=>`<label class="switchRow"><span>${fmt(ym+"-01",{month:"long",year:"numeric"})}</span><span><input type="checkbox" class="monthCheck" value="${ym}" ${active.has(ym)?"checked":""}> ${t("monthActive")}</span></label>`).join("");
}
async function saveMonths(){
  const months=[...document.querySelectorAll(".monthCheck:checked")].map(x=>x.value);
  if(!months.length){alert(t("chooseCoverage"));return}
  try{
    await api("admin_update_settings",{active_months:months});
    $("monthsModal").classList.remove("show");
    await refresh();toast(t("toastSaved"));
  }catch(e){showError(e)}
}

function contactInfo(){return S.data?.settings?.contact||{}}
function whatsappUrl(){const u=String(contactInfo().whatsapp_url||"");return /^https:\/\/chat\.whatsapp\.com\//.test(u)?u:""}
function renderMaterial(){
  const code=contactInfo().keysafe_code;
  $("materialInfo").innerHTML=`🧰 ${esc(t("materialShort"))}${code?` · 🔑 ${esc(t("matCode"))}: <b>${esc(code)}</b>`:""}`;
}
function tf(k){return t(k).replace(/\{(\w+)\}/g,(_,x)=>t(x))}
function renderHelp(first){
  const code=contactInfo().keysafe_code,wa=whatsappUrl();
  const steps=[["🌦️","h1t","h1x"],["🙋","h2t","h2x"],["🤝","h3t","h3x"],["👤","myAssignments","h4x"],["✅","h5t","h5x"],["💬","h6t","h6x"]];
  let h=steps.map(([i,a,b])=>`<div class="helpStep"><div class="helpIcon">${i}</div><div><div class="name">${esc(tf(a))}</div><div class="helperText">${esc(tf(b))}</div>${b==="h6x"&&wa?`<div class="actions"><a class="btn ghost small" style="text-decoration:none" href="${esc(wa)}" target="_blank" rel="noopener noreferrer">💬 ${esc(t("waOpen"))}</a></div>`:""}</div></div>`).join("");
  h+=`<div class="helpBox" style="background:#fff4f4;border-color:#f3d0d0"><div class="name">⚖️ ${esc(t("lawT"))}</div><div class="helperText">${esc(t("lawX"))}</div></div>`;
  h+=`<div class="helpBox"><div class="name">🧰 ${esc(t("matT"))}</div><div class="helperText">${esc(t("matX"))}</div>${code?`<div class="keyCode">🔑 ${esc(t("matCode"))}: <b>${esc(code)}</b></div>`:""}</div>`;
  if(S.level==="admin")h+=`<div class="helpBox admin"><div class="name">🔐 ${esc(t("admT"))}</div><div class="helperText">${esc(tf("admX"))}</div></div>`;
  $("helpBody").innerHTML=h;
  $("helpCloseBtn").textContent=first?t("helpStart"):t("close");
}
function openHelp(first=false){S.helpFirst=first;renderHelp(first);$("helpModal").classList.add("show")}
function closeHelp(){$("helpModal").classList.remove("show");S.helpFirst=false;try{localStorage.setItem(K.help,"1")}catch(e){}}
function renderWhatsappCard(){
  const card=$("whatsappCard");
  const wa=whatsappUrl();
  if(!S.data||!wa){card.classList.add("hidden");return}
  $("whatsappBtn").href=wa;
  const today=todayISO();const open=(S.data.assignments||[]).filter(a=>activeMonths().includes(a.service_date.slice(0,7))&&a.service_date>=today&&a.coverage_type==="regular"&&!a.responsible);
  let show=false;
  if(open.length>=3) show=true;
  if(S.weather){
    const q=risk(S.weather.daily||{});
    if(q[1]==="likely"||q[1]==="action") show=true;
  }
  card.classList.toggle("hidden",!show);
}
function riskAt(d,i=0){
  const min=d?.temperature_2m_min?.[i],snow=d?.snowfall_sum?.[i]||0,pr=d?.precipitation_sum?.[i]||0;
  if(snow>=2||(min<=-1&&pr>1))return["risk","action"];
  if(snow>0||min<=0)return["warn","likely"];
  if(min<=2)return["warn","watch"];
  return["ok","low"]
}
function risk(d){return riskAt(d,0)}
function weatherIcon(d,i){
  const snow=d?.snowfall_sum?.[i]||0,pr=d?.precipitation_sum?.[i]||0,min=d?.temperature_2m_min?.[i];
  if(snow>0)return "❄️";
  if(pr>=3)return "🌧️";
  if(pr>0)return "🌦️";
  if(min!=null&&min<=0)return "🥶";
  return "☁️"
}
function forecastAssignment(date){
  return (S.data?.assignments||[]).find(a=>a.service_date===date)
}
async function loadWeather(){
  try{
    const lat=48.3896,lon=10.8588;
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&daily=temperature_2m_min,temperature_2m_max,precipitation_sum,snowfall_sum&timezone=Europe%2FBerlin&forecast_days=4`);
    S.weather=await r.json();S.weatherAt=Date.now();renderWeather();if(S.data){renderSchedule();renderToday()}
  }catch(e){S.weather=null;renderWeather()}
  renderStamp();
}
function renderForecast(){
  const wrap=$("forecastWrap"),grid=$("forecastGrid");
  const d=S.weather?.daily;
  if(!d?.time?.length){wrap.classList.add("hidden");grid.innerHTML="";return}
  const rows=[];
  for(let i=1;i<Math.min(4,d.time.length);i++){
    const q=riskAt(d,i),date=d.time[i],a=forecastAssignment(date);
    const isOpen=q[1]!=="low"&&q[1]!=="watch"&&a&&a.coverage_type==="regular"&&!a.responsible;
    const cls=q[0]==="risk"?"risky":q[0]==="warn"?"watch":"";
    const min=d.temperature_2m_min?.[i],max=d.temperature_2m_max?.[i];
    const temps=(max!=null&&min!=null)?`${Math.round(max)}° / ${Math.round(min)}°`:"";
    const day=fmt(date,{weekday:"short",day:"2-digit",month:"2-digit"});
    rows.push(`<div class="forecastDay ${cls}">
      <div class="forecastDate">${day}</div>
      <div class="forecastWeather"><span class="forecastIcon">${weatherIcon(d,i)}</span><span class="forecastTemp">${temps}</span></div>
      <div class="forecastStatus">${q[0]==="ok"?"🟢":q[0]==="warn"?"🟡":"🔴"} ${t(q[1])}</div>
      ${isOpen?`<div class="forecastOpen">⚠️ ${t("forecastOpen")}</div>`:""}
    </div>`)
  }
  grid.innerHTML=rows.join("");
  wrap.classList.toggle("hidden",rows.length===0)
}
function renderWeather(){
  if(!S.weather){
    $("weatherText").textContent=t("loadingWeather");
    $("forecastWrap").classList.add("hidden");
    renderWhatsappCard();return
  }
  const c=S.weather.current||{},d=S.weather.daily||{},q=risk(d);
  $("temperature").textContent=Math.round(c.temperature_2m??0)+"°";
  $("weatherBadge").className="badge "+q[0];
  $("weatherBadge").textContent=(q[0]==="ok"?"🟢 ":q[0]==="warn"?"🟡 ":"🔴 ")+t(q[1]);
  const a=[];
  if((d.snowfall_sum?.[0]||0)>0)a.push(`${t("snow")}: ${d.snowfall_sum[0]} cm`);
  if(d.temperature_2m_min?.[0]!=null)a.push(`Min ${Math.round(d.temperature_2m_min[0])}°`);
  if((d.precipitation_sum?.[0]||0)>0)a.push(`${t("rain")}: ${d.precipitation_sum[0]} mm`);
  $("weatherText").textContent=a.join(" · ")||t("low");
  renderForecast();
  renderWhatsappCard()
}

document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>$(b.dataset.close).classList.remove("show"));
function showView(name){
  $("viewToday").classList.toggle("hidden",name!=="top");
  $("viewOpen").classList.toggle("hidden",name!=="open");
  $("viewPlan").classList.toggle("hidden",name!=="plan");

function renderFooter(){
  const subject=encodeURIComponent(`Feedback: ${APP_NAME} V${APP_VERSION}`);
  const html=`<div>${esc(APP_NAME)} · V${esc(APP_VERSION)} · ${esc(t("made"))}</div><a href="mailto:${FEEDBACK_MAIL}?subject=${subject}">✉ Feedback</a>`;
  document.querySelectorAll(".appFooter").forEach(f=>f.innerHTML=html);
}
function renderStamp(){
  const ts=Math.min(S.loadedAt||Date.now(),S.weatherAt||Date.now());
  const time=new Date(ts).toLocaleTimeString(locale(),{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Berlin"});
  $("stampText").textContent=`${t("updatedAt")} ${time}`;
  $("stampBtn").title=t("refreshNow");$("stampBtn").setAttribute("aria-label",t("refreshNow"));
}
async function softRefresh(force=false){
  if(!S.token||!S.data||S.refreshing)return;
  if(document.visibilityState!=="visible")return;
  const stale=force||todayISO()!==S.loadedDay||Date.now()-(S.loadedAt||0)>STALE_MS||Date.now()-(S.weatherAt||0)>STALE_MS;
  if(!stale)return;
  S.refreshing=true;$("stampBtn").classList.add("spin");
  try{
    await loadData();fillPeople();translate();renderAll();
    await loadWeather();
  }catch(e){if(e.status===401)logout(false)}
  finally{S.refreshing=false;$("stampBtn").classList.remove("spin");renderStamp()}
}
document.addEventListener("visibilitychange",()=>softRefresh());
window.addEventListener("focus",()=>softRefresh());
window.addEventListener("pageshow",e=>{if(e.persisted)softRefresh()});
window.addEventListener("online",()=>softRefresh(true));
setInterval(()=>softRefresh(),60*1000);
$("stampBtn").onclick=()=>softRefresh(true);
translate();if(S.token)enter();else renderLangs();
</script>
