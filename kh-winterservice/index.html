<style>
:root{
  --bg:#eef3f7;--card:#fff;--text:#172033;--muted:#687386;--line:#dfe6ee;
  --accent:#1f5f8b;--accent2:#174b6d;--ok:#2d7a4b;--warn:#ad7218;--risk:#bd4b32;
  --open:#b83a3a;--soft:#f6f8fb;--shadow:0 8px 24px rgba(20,35,55,.08)
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.app{max-width:780px;margin:auto;min-height:100vh;padding:16px 12px 92px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:14px;background:#dcecf6;display:grid;place-items:center;font-size:23px}
h1{font-size:21px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:2px}.langs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.lang{border:0;background:transparent;color:var(--muted);padding:5px 6px;border-radius:7px;font-size:12px}.lang.active{background:#dce8f1;color:var(--accent);font-weight:800}
.card{background:#fff;border:1px solid rgba(217,225,235,.9);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.heroHead,.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.sectionTitle{font-size:13px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:#4f5b6f;margin:18px 2px 8px}
.temp{font-size:34px;font-weight:800}.weatherText,.muted{color:var(--muted)}.weatherText{font-size:13px;margin-top:4px}
.badge,.pill{display:inline-flex;align-items:center;border-radius:999px;font-size:12px;font-weight:800}.badge{padding:7px 10px}.pill{padding:5px 8px}
.badge.ok,.pill.covered{background:#e9f5ee;color:var(--ok)}.badge.warn{background:#fff4df;color:var(--warn)}.badge.risk{background:#fdece8;color:var(--risk)}.pill.open{background:#fdeaea;color:#a73f3f}
.btn{border:0;border-radius:11px;padding:9px 12px;background:var(--accent);color:#fff;font-weight:750}.btn.ghost{background:#edf3f7;color:var(--accent)}.btn.small{padding:7px 9px;font-size:12px}
.openItem,.dayItem,.personItem{display:grid;grid-template-columns:78px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.openItem:first-child,.dayItem:first-child,.personItem:first-child{border-top:0}
.dateBox{font-weight:800}.dateBox small{display:block;color:var(--muted);font-weight:600}.openTxt{font-size:13px;color:var(--open);font-weight:800}.name{font-weight:800}.helperText{font-size:12px;color:var(--muted);margin-top:3px}.weekHead{font-size:12px;color:var(--muted);font-weight:800;margin-top:12px}
.adminStrip{background:#f3eafa;color:#6b3a89;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:800;margin:12px 0}.adminTools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.footerNav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20}
.footerInner{width:min(780px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom))}.navBtn{border:0;background:none;padding:7px 3px;color:var(--muted);font-size:11px}.navBtn span{display:block;font-size:19px}.navBtn.active{color:var(--accent);font-weight:800}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.58);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}.overlay.show{display:flex}
.modal{background:#fff;border-radius:20px;padding:20px;width:min(500px,100%);max-height:90vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.24)}.modal h2{margin:0 0 7px}.modal p{color:var(--muted);font-size:13px}
.field{width:100%;border:1px solid #cfd8e3;border-radius:12px;padding:11px 12px;margin:6px 0 10px;background:#fff}.modalActions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.login{max-width:420px;margin:8vh auto}.login .card{text-align:center;padding:26px}.pin{font-size:22px;text-align:center;letter-spacing:.2em}.notice{font-size:12px;color:var(--muted);margin-top:10px}.error{color:var(--risk);font-size:13px;margin-top:8px}
.switchRow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.switchRow:first-child{border-top:0}
.empty{text-align:center;color:var(--muted);padding:16px 4px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.monthGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.monthDow{text-align:center;font-size:11px;font-weight:800;color:var(--muted);padding:5px 0}
.monthCell{min-height:72px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px;display:flex;flex-direction:column;gap:3px;position:relative}
.monthCell.emptyDay{visibility:hidden}.monthCell.openDay{background:#fff3f3;border-color:#efc8c8}.monthCell.coveredDay{background:#f0f8f3;border-color:#cde6d5}.monthCell.groupDay{background:#f5f0fa;border-color:#ddcdeb}
.monthCell .n{font-size:12px;font-weight:850}.monthCell .s{font-size:10px;line-height:1.15}.monthCell button{margin-top:auto;border:0;background:transparent;color:var(--accent);font-size:10px;padding:0;text-align:left}
.areaBoard{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.areaCard{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fafbfd}.areaCard.missing{border-color:#efc8c8;background:#fff5f5}.areaCard .areaHead{font-size:12px;font-weight:850}.areaCard .areaNames{font-size:11px;color:var(--muted);margin-top:3px}
@media(max-width:520px){.monthGrid{gap:3px}.monthCell{min-height:60px;padding:4px}.monthCell .s{font-size:9px}.areaBoard{grid-template-columns:1fr}.openItem,.dayItem,.personItem{grid-template-columns:64px 1fr}.openItem>*:last-child,.dayItem>*:last-child,.personItem>*:last-child{grid-column:2;justify-self:start}.adminTools{grid-template-columns:1fr}}
</style>
</head>

function activeMonths(){
  const saved=S.data?.settings?.display?.active_months;
  return Array.isArray(saved)&&saved.length?saved:["2026-11","2026-12","2027-01","2027-02","2027-03"];
}
function firstActiveDate(){return activeMonths()[0]+"-01"}
function lastDayOfMonth(ym){
  const [y,m]=ym.split("-").map(Number);
  return new Date(y,m,0).toISOString().slice(0,10);
}
function planningStart(){
  const today=todayISO(), months=activeMonths(), ym=today.slice(0,7);
  if(months.includes(ym))return today;
  return firstActiveDate();
}

}

function renderAll(){if(!S.data)return;$("todayDate").textContent=fmt(todayISO(),{weekday:"long",day:"2-digit",month:"long"});$("roleBadge").textContent=(S.level==="admin"?"🔐 ":"🤝 ")+(S.level==="admin"?t("roleAdmin"):t("roleHelper"));renderMyAssignments();renderToday();renderOpen();renderSchedule();renderWeather();renderWhatsappCard();if(S.level==="admin")renderPeople()}
function editBtn(a){return S.level==="admin"?`<button class="btn ghost small" onclick="openEdit(${a.id})">✏️ ${t("edit")}</button>`:""}



function helpersByArea(a, area){
  return (a.helpers||[]).filter(h=>(h.area_preference||"flexible")===area);
}
function areaBoardHtml(a){
  if(!a || a.coverage_type!=="regular" || !a.responsible) return "";
  const specs=[
    ["red","🔴",t("areaRed"),false],
    ["blue","🔵",t("areaBlue"),false],
    ["green","🟢",t("areaGreen"),true],
    ["flexible","⚪",t("flexHelpers"),true]
  ];
  return `<div class="areaBoard">`+specs.map(([area,icon,label,optional])=>{
    const hs=helpersByArea(a,area);
    const missing=!optional && hs.length===0;
    const status=hs.length?hs.map(h=>esc(h.name)).join(", "):(optional?t("areaOptional"):t("areaOpen"));
    return `<div class="areaCard ${missing?"missing":""}">
      <div class="areaHead">${icon} ${label}</div>
      <div class="areaNames">${status}</div>
    </div>`;
  }).join("")+`</div>`;
}
function areaLabel(area){
  return area==="blue"?"🔵 "+t("areaBlue"):area==="red"?"🔴 "+t("areaRed"):area==="green"?"🟢 "+t("areaGreen"):"⚪ "+t("areaFlexible");
}

function renderMyAssignments(){
  const personId=currentPersonId();
  const wrap=$("myAssignmentsWrap");
  if(!personId){wrap.classList.add("hidden");return}
  const items=(S.data.assignments||[]).filter(a=>{
    if(!activeMonths().includes(a.service_date.slice(0,7)))return false;
    const responsible=a.responsible_person_id===personId;
    const helper=(a.helpers||[]).some(h=>h.id===personId);
    return responsible||helper;
  });
  wrap.classList.remove("hidden");
  if(!items.length){$("myAssignments").innerHTML=`<div class="empty">${t("noMine")}</div>`;return}
  $("myAssignments").innerHTML=items.map(a=>{
    const isResp=a.responsible_person_id===personId;
    const isHelper=(a.helpers||[]).some(h=>h.id===personId);
    const labels=[];
    if(isResp)labels.push(t("responsibleOnly"));
    const myHelper=(a.helpers||[]).find(h=>h.id===personId);
    if(isHelper)labels.push(t("helperOnly")+" · "+areaLabel(myHelper?.area_preference||"flexible"));
    const acts=[];
    acts.push(`<button class="btn ghost small" onclick="downloadICS(${a.id})">📅 ${t("calendarAdd")}</button>`);
    if(isResp)acts.push(`<button class="btn ghost small" onclick="releaseAssignment(${a.id})">${t("release")}</button>`);
    if(isHelper)acts.push(`<button class="btn ghost small" onclick="changeMyArea(${a.id})">${t("changeArea")}</button>`);
    const action=acts.join(" ");
    return `<div class="dayItem"><div class="dateBox">${fmt(a.service_date,{weekday:"short"})}<small>${fmt(a.service_date,{day:"2-digit",month:"2-digit"})}</small></div><div><div class="name">${labels.join(" · ")}</div>${a.note?`<div class="helperText">${esc(a.note)}</div>`:""}</div><div>${action}</div></div>`;
  }).join("");
}

function icsEscape(v){
  return String(v||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");
}
function addOneDay(iso){
  const d=new Date(iso+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+1); return d.toISOString().slice(0,10);
}
function ymd(iso){return iso.replaceAll("-","")}
function downloadICS(id){
  const a=(S.data.assignments||[]).find(x=>x.id===id);
  if(!a)return;
  const personId=currentPersonId();
  const isResp=a.responsible_person_id===personId;
  const myHelper=(a.helpers||[]).find(h=>h.id===personId);
  const role=isResp?t("calendarRoleResponsible"):t("calendarRoleHelper");
  const area=myHelper?areaLabel(myHelper.area_preference||"flexible"):"";
  const desc=[t("calendarDesc"),role,area].filter(Boolean).join(" · ");
  const uid=`winter-${a.id}-${personId}@hirblinger99`;
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d{3}Z/,"Z");
  const content=[
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Winter Service//Bärenkeller//EN",
    "CALSCALE:GREGORIAN","BEGIN:VEVENT",
    `UID:${uid}`,`DTSTAMP:${stamp}`,
    `DTSTART;VALUE=DATE:${ymd(a.service_date)}`,
    `DTEND;VALUE=DATE:${ymd(addOneDay(a.service_date))}`,
    `SUMMARY:${icsEscape(t("calendarTitle"))}`,
    `LOCATION:${icsEscape("Hirblinger Str. 99, Augsburg")}`,
    `DESCRIPTION:${icsEscape(desc)}`,
    "END:VEVENT","END:VCALENDAR"
  ].join("\r\n");
  const blob=new Blob([content],{type:"text/calendar;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  link.href=url;link.download=`winterdienst-${a.service_date}.ics`;
  document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

}

function renderOpen(){const months=activeMonths();const o=(S.data.assignments||[]).filter(a=>months.includes(a.service_date.slice(0,7))&&a.coverage_type==="regular"&&!a.responsible);$("openAssignments").innerHTML=o.length?`<div class="helperText" style="padding-bottom:8px">${fmt(planningStart(),{day:"2-digit",month:"long"})} → ${fmt(S.data.assignments[S.data.assignments.length-1]?.service_date||planningStart(),{day:"2-digit",month:"long"})}</div>`+o.map(a=>`<div class="openItem"><div class="dateBox">${fmt(a.service_date,{weekday:"short"})}<small>${fmt(a.service_date,{day:"2-digit",month:"2-digit"})}</small></div><div class="openTxt">${t("needed")}</div><div class="actions"><button class="btn small" onclick="startPerson('take',${a.id})">${t("take")}</button>${editBtn(a)}</div></div>`).join(""):`<div class="empty">✅ ${t("allCovered")}</div>`}
function renderSchedule(){let currentMonth="",h="";for(const a of (S.data.assignments||[]).filter(x=>activeMonths().includes(x.service_date.slice(0,7)))){const k=a.service_date.slice(0,7);if(k!==currentMonth){currentMonth=k;h+=`<div class="row" style="margin-top:18px"><div class="weekHead" style="font-size:16px;color:var(--text);margin:0">${fmt(k+"-01",{month:"long",year:"numeric"})}</div><button class="btn ghost small" onclick="openMonth('${k}')">▦ ${t("monthView")}</button></div>`}let c="",r="";if(a.coverage_type==="regular"){c=a.responsible?`<div class="name">${esc(a.responsible.name)}</div><div class="helperText">${a.helpers?.length?"🤝 "+a.helpers.map(x=>`${esc(x.name)} · ${areaLabel(x.area_preference)}`).join("<br>"):""}</div>${areaBoardHtml(a)}`:`<div class="openTxt">${t("needed")}</div>`;r=a.responsible?`<div class="actions"><button class="btn ghost small" onclick="startPerson('helper',${a.id})">+ ${t("helper")}</button>${editBtn(a)}</div>`:`<div class="actions"><button class="btn small" onclick="startPerson('take',${a.id})">${t("take")}</button>${editBtn(a)}</div>`}else{c=`<div class="name">${esc(coverageText(a))}</div>${a.note?`<div class="helperText">${esc(a.note)}</div>`:""}`;r=`<div class="actions"><span class="pill covered">${t("covered")}</span>${editBtn(a)}</div>`}h+=`<div class="dayItem"><div class="dateBox">${fmt(a.service_date,{weekday:"short"})}<small>${fmt(a.service_date,{day:"2-digit",month:"2-digit"})}</small></div><div>${c}</div><div>${r}</div></div>`}$("schedule").innerHTML=h}

function startPerson(type,id){

  if(type==="helper"&&r){S.helperTarget={assignmentId:id,personId:Number(r),mode:"join"};$("areaModal").classList.add("show");return}

    await api("take_responsibility",{assignment_id:S.pending.id,person_id:personId});
    if($("rememberPerson").checked)localStorage.setItem(K.person,String(personId));

  }

async function saveEdit(){try{await api("admin_update_assignment",{assignment_id:S.editId,coverage_type:$("coverageType").value,person_id:$("adminPersonSelect").value||null,coverage_label:(["cleaning_team","morning_congregations"].includes($("coverageType").value)?null:($("groupName").value||null)),note:$("assignmentNote").value||null});$("editModal").classList.remove("show");await refresh()}catch(e){alert(e.data?.error||t("server"))}}
function renderPeople(){const p=S.data?.people||[];$("peopleList").innerHTML=p.map(x=>`<div class="personItem"><div></div><div><div class="name">${esc(x.name)}</div><div class="helperText">${esc(x.congregation||"")}</div></div><button class="btn ghost small" onclick="togglePerson(${x.id},${x.active!==false})">${x.active!==false?t("active"):t("inactive")}</button></div>`).join("")||`<div class="empty">${t("none")}</div>`}

function openMonth(ym){
  const [y,m]=ym.split("-").map(Number);
  const first=new Date(y,m-1,1);
  const days=new Date(y,m,0).getDate();
  const offset=(first.getDay()+6)%7;
  const dow=[];
  const base=new Date(2026,0,5);
  for(let i=0;i<7;i++){const d=new Date(base);d.setDate(base.getDate()+i);dow.push(new Intl.DateTimeFormat(locale(),{weekday:"short"}).format(d))}
  let html=dow.map(x=>`<div class="monthDow">${x}</div>`).join("");
  for(let i=0;i<offset;i++)html+=`<div class="monthCell emptyDay"></div>`;
  for(let day=1;day<=days;day++){
    const iso=`${ym}-${String(day).padStart(2,"0")}`;
    const a=(S.data.assignments||[]).find(x=>x.service_date===iso);
    let cls="",status="",action="";
    if(!a){cls="";status="—";}
    else if(a.coverage_type==="regular"&&!a.responsible){cls="openDay";status="⚠ "+t("openNav");}
    else if(a.coverage_type==="regular"&&a.responsible){cls="coveredDay";status="✓ "+esc(a.responsible.name);}
    else if(a.coverage_type==="cleaning_team"){cls="groupDay";status="FSG";}
    else if(a.coverage_type==="morning_congregations"){cls="groupDay";status=S.lang==="de"?"VM":S.lang==="en"?"AM":"•";}
    else {cls="groupDay";status=esc(coverageText(a));}
    if(a){
      if(S.level==="admin") action=`<button onclick="closeMonthThen(()=>openEdit(${a.id}))">${t("edit")}</button>`;
      else if(a.coverage_type==="regular"&&!a.responsible) action=`<button onclick="closeMonthThen(()=>startPerson('take',${a.id}))">${t("take")}</button>`;
    }
    html+=`<div class="monthCell ${cls}"><div class="n">${day}</div><div class="s">${status}</div>${action}</div>`;
  }
  $("monthModalTitle").textContent=fmt(ym+"-01",{month:"long",year:"numeric"});
  $("monthLegend").textContent=t("monthLegend");
  $("monthGrid").innerHTML=html;
  $("monthModal").classList.add("show");
}
function closeMonthThen(fn){
  $("monthModal").classList.remove("show");
  setTimeout(fn,50);
}

function renderWhatsappCard(){
  const card=$("whatsappCard");
  if(!S.data){card.classList.add("hidden");return}
  const open=(S.data.assignments||[]).filter(a=>activeMonths().includes(a.service_date.slice(0,7))&&a.coverage_type==="regular"&&!a.responsible);
  let show=false;
  if(open.length>=3) show=true;
  if(S.weather){
    const q=risk(S.weather.daily||{});
    if(q[1]==="likely"||q[1]==="action") show=true;
  }
  card.classList.toggle("hidden",!show);
}
function risk(d){const min=d?.temperature_2m_min?.[0],snow=d?.snowfall_sum?.[0]||0,pr=d?.precipitation_sum?.[0]||0;if(snow>=2||(min<=-1&&pr>1))return["risk","action"];if(snow>0||min<=0)return["warn","likely"];if(min<=2)return["warn","watch"];return["ok","low"]}
async function loadWeather(){try{const lat=48.3896,lon=10.8588;const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&daily=temperature_2m_min,temperature_2m_max,precipitation_sum,snowfall_sum&timezone=Europe%2FBerlin&forecast_days=2`);S.weather=await r.json();renderWeather()}catch(e){S.weather=null;renderWeather()}}
function renderWeather(){if(!S.weather){$("weatherText").textContent=t("loadingWeather");renderWhatsappCard();return}const c=S.weather.current||{},d=S.weather.daily||{},q=risk(d);$("temperature").textContent=Math.round(c.temperature_2m??0)+"°";$("weatherBadge").className="badge "+q[0];$("weatherBadge").textContent=(q[0]==="ok"?"🟢 ":q[0]==="warn"?"🟡 ":"🔴 ")+t(q[1]);const a=[];if((d.snowfall_sum?.[0]||0)>0)a.push(`${t("snow")}: ${d.snowfall_sum[0]} cm`);if(d.temperature_2m_min?.[0]!=null)a.push(`Min ${Math.round(d.temperature_2m_min[0])}°`);if((d.precipitation_sum?.[0]||0)>0)a.push(`${t("rain")}: ${d.precipitation_sum[0]} mm`);$("weatherText").textContent=a.join(" · ")||t("low");renderWhatsappCard()}
