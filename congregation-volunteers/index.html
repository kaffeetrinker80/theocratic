<!DOCTYPE html>
<html lang="en" data-group="Brothers">
<head>
<!-- Icons + Manifest -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#172f4d">
<meta name="apple-mobile-web-app-title" content="Volunteers List">
<meta name="application-name" content="Congregation Volunteers">

<!-- Link-Vorschau -->
<meta property="og:type" content="website">
<meta property="og:title" content="Congregation Volunteers">
<meta property="og:url" content="https://kaffeetrinker80.github.io/theocratic/congregation-volunteers/">
<meta property="og:image" content="https://kaffeetrinker80.github.io/theocratic/congregation-volunteers/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Volunteers List</title>
<style>
    :root{
      /* neutral base */
      --bg:#eef2f8;
      --bg2:#f8fafd;
      --panel:#ffffff;
      --stroke:#dde6f2;
      --stroke2:#c9d6e8;
      --text:#141c28;
      --muted:#54637a;
      --muted2:#7b8aa1;
      --btn:#f2f6fc;
      --btn2:#e6eef8;

      /* group accent (overwritten by data-group) */
      --accent:#2f6fb3;
      --accentDark:#1c4f85;
      --accentSoft: rgba(47,111,179,.12);
      --accentLine: rgba(47,111,179,.30);

      --shadow: 0 10px 26px rgba(18, 38, 63, .10);
      --shadowSoft: 0 2px 8px rgba(18, 38, 63, .06);
      --radius: 16px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial;
    }

    /* --- Group identities: Brothers = blue, Sisters = plum --- */
    :root[data-group="Brothers"]{
      --accent:#2f6fb3;
      --accentDark:#1c4f85;
      --accentSoft: rgba(47,111,179,.12);
      --accentLine: rgba(47,111,179,.30);
    }
    :root[data-group="Sisters"]{
      --accent:#7a4bb8;
      --accentDark:#5a3390;
      --accentSoft: rgba(122,75,184,.12);
      --accentLine: rgba(122,75,184,.30);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:var(--sans);
      color:var(--text);
      background:
        radial-gradient(1200px 420px at 50% -180px, var(--accentSoft), transparent 70%),
        var(--bg);
      background-attachment: fixed;
      -webkit-text-size-adjust:100%;
    }

    header{
      background: linear-gradient(180deg, var(--accentSoft), rgba(255,255,255,.55) 60%, var(--bg2));
      border-bottom:1px solid var(--stroke);
      transition: background .25s ease;
    }
    .wrap{ max-width:1140px; margin:0 auto; padding:20px 16px 12px; }
    .headrow{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap; }

    .eyebrow{
      font-size:11px;
      letter-spacing:.16em;
      text-transform:uppercase;
      font-weight:800;
      color:var(--accentDark);
      margin-bottom:6px;
      display:flex; align-items:center; gap:8px;
    }
    .eyebrow::after{
      content:"";
      flex:0 0 46px;
      height:2px;
      border-radius:2px;
      background:var(--accentLine);
    }

    /* Editable header blocks (multi-line, print-safe) */
    .titleBox{ display:flex; flex-direction:column; gap:6px; min-width: 280px; flex:1; }
    .editBlock{
      border:1px solid transparent;
      background: transparent;
      padding:4px 8px;
      margin-left:-8px;
      border-radius:10px;
      outline:none;
      max-width: 760px;
      overflow-wrap:anywhere;
      word-break: break-word;
      white-space: pre-wrap;
      transition: background .15s ease, border-color .15s ease;
      cursor:text;
    }
    .editBlock:hover{ background: rgba(255,255,255,.75); border-color: var(--stroke); }
    .editTitle{
      font-weight:800;
      font-size:26px;
      letter-spacing:-.02em;
      color:#0e1a2c;
      line-height:1.15;
    }
    .editSubtitle{
      font-size:13px;
      color: var(--muted);
      line-height:1.35;
    }
    .editBlock:focus{
      background:#fff;
      border-color: var(--accentLine);
      box-shadow: 0 0 0 3px var(--accentSoft);
    }
    .hint{ font-size:11.5px; color:var(--muted2); margin-top:2px; }

    .meta{ margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; color:var(--muted2); font-size:12px; }
    .pill{
      background:rgba(255,255,255,.85);
      border:1px solid var(--stroke);
      padding:5px 10px;
      border-radius:999px;
      display:inline-flex; gap:7px; align-items:center;
      box-shadow: var(--shadowSoft);
    }
    .pill strong{ color:var(--text); font-variant-numeric: tabular-nums; }

    /* ---------- SIGNATURE: big group switch ---------- */
    .groupSwitch{
      max-width:1140px;
      margin:14px auto 0;
      padding:0 16px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
    }
    .gTab{
      position:relative;
      text-align:left;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.7);
      border-radius:16px;
      padding:13px 16px;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:12px;
      font-family:inherit;
      color:var(--muted);
      transition: transform .12s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
      overflow:hidden;
    }
    .gTab:hover{ transform: translateY(-1px); border-color: var(--stroke2); background:#fff; }
    .gTab:focus-visible{ outline:3px solid var(--accentLine); outline-offset:2px; }
    .gTab .gText{ display:flex; flex-direction:column; gap:1px; min-width:0; }
    .gTab .gName{ font-weight:800; font-size:16px; color:var(--text); letter-spacing:-.01em; }
    .gTab .gSub{ font-size:11.5px; color:var(--muted2); }
    .gTab .gCount{
      margin-left:auto;
      font-weight:800;
      font-size:17px;
      font-variant-numeric: tabular-nums;
      background:#eef2f8;
      border:1px solid var(--stroke);
      border-radius:999px;
      padding:3px 12px;
      color:var(--muted);
    }
    /* active state uses the group's own colour, not the current accent */
    .gTab[data-g="Brothers"].active{
      background: linear-gradient(180deg, rgba(47,111,179,.14), #fff 70%);
      border-color: rgba(47,111,179,.42);
      box-shadow: 0 8px 20px rgba(47,111,179,.16);
    }
    .gTab[data-g="Sisters"].active{
      background: linear-gradient(180deg, rgba(122,75,184,.14), #fff 70%);
      border-color: rgba(122,75,184,.42);
      box-shadow: 0 8px 20px rgba(122,75,184,.16);
    }
    .gTab[data-g="Brothers"].active .gCount{ background: rgba(47,111,179,.14); border-color: rgba(47,111,179,.30); color:#1c4f85; }
    .gTab[data-g="Sisters"].active .gCount{ background: rgba(122,75,184,.14); border-color: rgba(122,75,184,.30); color:#5a3390; }
    .gTab.active{ padding-left:19px; }
    .gTab.active::before{
      content:"";
      position:absolute; left:0; top:0; bottom:0;
      width:5px;
      background: var(--accent);
    }
    .gTab[data-g="Brothers"].active::before{ background:#2f6fb3; }
    .gTab[data-g="Sisters"].active::before{ background:#7a4bb8; }
    .gTab.active .gSub{ color:var(--muted); }

    main{ max-width:1140px; margin:0 auto; padding:14px 16px 8px; }
    .panel{
      background:var(--panel);
      border:1px solid var(--stroke);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    /* stat strip */
    .statBar{
      display:flex; gap:8px; flex-wrap:wrap;
      padding:10px 14px;
      background: linear-gradient(180deg, var(--accentSoft), transparent);
      border-bottom:1px solid var(--stroke);
    }
    .stat{
      display:inline-flex; align-items:baseline; gap:6px;
      background:#fff;
      border:1px solid var(--stroke);
      border-radius:999px;
      padding:4px 11px;
      font-size:12px;
      color:var(--muted);
    }
    .stat b{ font-size:13.5px; color:var(--accentDark); font-variant-numeric: tabular-nums; }

    .toolbar{
      padding:10px 12px;
      border-bottom:1px solid var(--stroke);
      background:#fbfdff;
      display:flex; gap:8px; flex-wrap:wrap; align-items:center;
      position: sticky;
      top:0;
      z-index: 20;
    }

    .input, select{
      border:1px solid var(--stroke2);
      background:#fff;
      color:var(--text);
      padding:8px 10px;
      border-radius:10px;
      font-size:13px;
      outline:none;
      font-family:inherit;
    }
    .input:focus, select:focus{
      border-color: var(--accentLine);
      box-shadow: 0 0 0 3px var(--accentSoft);
    }
    .searchWrap{ position:relative; flex:1; min-width:220px; display:flex; }
    .searchWrap .input{ width:100%; padding-left:30px; }
    .searchWrap::before{
      content:"🔍";
      position:absolute; left:9px; top:50%; transform:translateY(-50%);
      font-size:12px; opacity:.65; pointer-events:none;
    }

    .btn{
      border:1px solid var(--stroke2);
      background:var(--btn);
      color:var(--text);
      padding:8px 11px;
      border-radius:10px;
      font-size:13px;
      cursor:pointer;
      display:inline-flex;
      gap:7px;
      align-items:center;
      white-space:nowrap;
      font-family:inherit;
      transition: background .15s ease, transform .1s ease;
    }
    .btn:hover{ background:var(--btn2); }
    .btn:active{ transform: translateY(1px); }
    .btn:focus-visible{ outline:3px solid var(--accentLine); outline-offset:2px; }
    .btn.primary{
      background: var(--accent);
      border-color: var(--accent);
      color:#fff;
      font-weight:700;
      box-shadow: 0 6px 16px var(--accentSoft);
    }
    .btn.primary:hover{ background: var(--accentDark); border-color: var(--accentDark); }
    .btn.ghost{
      background: var(--accentSoft);
      border-color: var(--accentLine);
      color: var(--accentDark);
      font-weight:600;
    }
    .btn.danger{
      background: rgba(190, 35, 60, .08);
      border-color: rgba(190, 35, 60, .20);
      color:#8a1f2f;
    }
    .btn.small{ padding:6px 9px; font-size:12px; border-radius:10px; }
    .spacer{ flex:1; }

    /* quick filter chips */
    .chipRow{
      display:flex; gap:7px; flex-wrap:wrap; align-items:center;
      padding:9px 14px;
      border-bottom:1px solid var(--stroke);
      background:#fff;
    }
    .chipLabel{ font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted2); font-weight:700; margin-right:2px; }
    .chip{
      border:1px solid var(--stroke2);
      background:#fff;
      color:var(--muted);
      border-radius:999px;
      padding:5px 11px;
      font-size:12.5px;
      cursor:pointer;
      font-family:inherit;
      transition: all .15s ease;
    }
    .chip:hover{ border-color: var(--accentLine); color:var(--accentDark); }
    .chip:focus-visible{ outline:3px solid var(--accentLine); outline-offset:2px; }
    .chip.on{
      background: var(--accentSoft);
      border-color: var(--accentLine);
      color: var(--accentDark);
      font-weight:700;
    }
    .chip.reset{ margin-left:auto; border-style:dashed; }

    .content{ padding: 10px 12px 14px; }

    table{ width:100%; border-collapse:separate; border-spacing:0 8px; font-size:13px; }
    thead{ display:none; }
    tbody td{
      padding:8px 10px 6px;
      background:#fff;
      border:1px solid var(--stroke);
      border-left:4px solid var(--accentLine);
      border-radius:12px;
      vertical-align:middle;
      box-shadow: var(--shadowSoft);
      transition: border-color .15s ease, box-shadow .15s ease, transform .1s ease;
    }
    tbody tr:hover td{
      border-color: var(--stroke2);
      border-left-color: var(--accent);
      box-shadow: 0 6px 16px rgba(18,38,63,.09);
    }
    tbody tr:focus-within td{
      border-left-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accentSoft);
    }

    .rowTop{
      display:grid;
      grid-template-columns: 1.65fr 0.9fr 2.05fr 2.25fr auto;
      gap:6px;
      align-items:center;
    }
    .rowTop.sisters{
      grid-template-columns: 1.55fr 2.25fr 2.10fr auto;
    }
    .rowBottom{
      display:grid;
      grid-template-columns: 1fr auto;
      gap:10px;
      align-items:center;
      padding: 6px 0 2px;
    }

    .mono{ font-family: var(--mono); font-size:12.5px; }
    .field{ min-width:0; }
    .field .input, .field select{ width:100%; min-width:0; }
    .field input[data-field="name"]{ font-weight:700; }

    .copyField{ display:flex; align-items:center; gap:5px; min-width:0; }
    .miniBtn{
      border: 1px solid var(--accentLine);
      background: var(--accentSoft);
      color: var(--accentDark);
      padding: 5px 7px;
      border-radius: 9px;
      font-size: 12px;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      line-height: 1;
      user-select:none;
      transition: background .15s ease;
    }
    .miniBtn:hover{ background:#fff; }
    .miniBtn:focus-visible{ outline:3px solid var(--accentLine); outline-offset:2px; }
    .copyField input{ flex:1; min-width:0; }

    .notesLine{
      width:100%;
      border:1px solid var(--stroke2);
      border-radius:10px;
      padding:7px 9px;
      font-size:13px;
      outline:none;
      font-family:inherit;
      background:#fcfdff;
    }
    .notesLine:focus{
      background:#fff;
      border-color: var(--accentLine);
      box-shadow: 0 0 0 3px var(--accentSoft);
    }

    .checks{
      display:flex;
      gap:7px;
      flex-wrap:wrap;
      align-items:center;
      color: var(--muted);
      font-size:12.5px;
      white-space:nowrap;
    }
    .checks label{
      display:inline-flex;
      gap:5px;
      align-items:center;
      padding: 3px 8px;
      border: 1px solid var(--stroke);
      background: #fbfdff;
      border-radius: 999px;
      cursor:pointer;
    }
    .checks label:hover{ border-color: var(--stroke2); }
    .checks label:has(input:checked){
      background: var(--accentSoft);
      border-color: var(--accentLine);
      color: var(--accentDark);
      font-weight:600;
    }
    input[type="checkbox"]{ width: 14px; height: 14px; accent-color: var(--accent); }

    .standingWrap{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding: 2px 6px 2px 9px;
      border: 1px solid var(--stroke);
      background: #fbfdff;
      border-radius: 999px;
    }
    .standingWrap span{ color: var(--muted); font-size:12.5px; line-height:1; white-space:nowrap; }
    .standingSelect{
      border:1px solid var(--stroke2);
      background: var(--panel);
      color:var(--text);
      padding:4px 8px;
      border-radius:999px;
      font-size:12.5px;
      line-height:1;
      outline:none;
      font-family:inherit;
    }
    .standingPill{
      display:inline-flex;
      align-items:center;
      gap:5px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--accentLine);
      background: var(--accentSoft);
      color: var(--accentDark);
      font-size:12.5px;
      font-weight:700;
      white-space:nowrap;
    }

    .lblShort{ display:none; }
    .actions{ display:flex; justify-content:flex-end; gap:8px; white-space:nowrap; }

    .emptyState{
      display:none;
      color: var(--muted);
      padding: 26px 14px;
      font-size: 13.5px;
      text-align:center;
      border:1px dashed var(--stroke2);
      border-radius:14px;
      background:#fbfdff;
    }
    .emptyState strong{ color:var(--accentDark); }

    .toast{
      position: fixed;
      right: 16px;
      bottom: 16px;
      background: #ffffff;
      border: 1px solid var(--stroke2);
      border-left:4px solid var(--accent);
      box-shadow: var(--shadow);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 12.5px;
      color: var(--text);
      display:none;
      z-index: 999;
      max-width: min(420px, calc(100vw - 32px));
    }
    .toast.show{ display:block; animation: toastIn .22s ease; }
    @keyframes toastIn{ from{ opacity:0; transform: translateY(8px);} to{ opacity:1; transform:none; } }

    footer{
      max-width:1140px;
      margin:0 auto;
      padding: 14px 16px 30px;
      color: var(--muted2);
      font-size: 12px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }
    .footerStorage{ font-family:var(--mono); }

    .printGroup{ display:none; font-weight:800; font-size:15px; padding: 4px 0 0; color:#000; }
    .groupHeadRow{ display:none; }

    @media (prefers-reduced-motion: reduce){
      *{ animation:none !important; transition:none !important; }
    }

    @media (max-width: 980px){
      .rowTop, .rowTop.sisters{ grid-template-columns: 1fr; }
      .rowBottom{ grid-template-columns: 1fr; }
      .actions{ justify-content:flex-start; }
      .editBlock{ max-width: 100%; }
      .editTitle{ font-size:21px; }
      .groupSwitch{ grid-template-columns: 1fr; gap:8px; }
      .gTab{ padding:11px 14px; }
      .toolbar{ position:static; }
    }

    @media print{
      .headerActions, .groupSwitch, .statBar, .chipRow{ display:none !important; }
      header .meta, .hint, .eyebrow{ display:none !important; }
      .toolbar, .toast{ display:none !important; }

      body{ background:#fff !important; margin:0 !important; }
      main{ max-width:none; padding:0; }
      .panel{ border:none; box-shadow:none; padding: 0 4px !important; }
      .content{ padding:0 !important; }

      .actions, .miniBtn{ display:none !important; }

      table{ font-size: 11.5px !important; border-spacing:0 !important; border-collapse:collapse !important; }
      tbody td{
        padding:4px 6px !important;
        border:none !important;
        border-bottom:1px solid #d1d5db !important;
        border-radius:0 !important;
        box-shadow:none !important;
        background:transparent !important;
      }

      .notesLine{ font-size: 11px !important; padding: 2px 6px !important; }

      @page{ margin: 10mm 10mm 16mm 10mm; }
      footer{
        position: fixed !important;
        left: 0; right: 0;
        bottom: 3mm;
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
        justify-content: center !important;
        text-align: center !important;
        display:block !important;
      }
      footer > div{ width:100%; }
      footer .footerStorage{ display:none !important; }
      body{ padding-bottom: 14mm !important; }

      /* keep each volunteer entry together */
      tbody tr, tr, td, .rowTop, .rowBottom{
        break-inside: avoid !important;
        page-break-inside: avoid !important;
      }
      /* max 18 entries per page (single-group print only) */
      body:not(.printBoth) tbody tr:nth-child(18n){
        break-after: page;
        page-break-after: always;
      }
      /* group headings when printing both lists */
      .groupHeadRow{ display:table-row !important; }
      .groupHeadRow td{
        border:none !important;
        border-bottom:2px solid #000 !important;
        padding: 2px 0 3px !important;
        font-size: 14pt !important;
        font-weight:800 !important;
        color:#000 !important;
      }
      .groupHeadRow.breakBefore td{ padding-top: 4mm !important; }
      .groupHeadRow.breakBefore{ break-before: page !important; page-break-before: always !important; }

      .rowTop{ grid-template-columns: 2.3fr 0.95fr 1.45fr 2.3fr; gap:6px !important; }
      .rowTop.sisters{ grid-template-columns: 2.5fr 1.7fr 2.8fr; gap:6px !important; }
      .rowBottom{
        grid-template-columns: 1fr auto;
        gap:6px !important;
        padding: 1px 0 2px !important;
        align-items:center !important;
      }
      .rowBottom .checks{ justify-self:end !important; text-align:right !important; }

      .checks{
        gap:6px !important;
        font-size:10.5px !important;
        white-space:nowrap !important;
        flex-wrap:nowrap !important;
      }
      .checks label{
        padding:0 !important;
        border:none !important;
        background:transparent !important;
        border-radius:0 !important;
        margin:0 !important;
        font-weight:400 !important;
        color:#000 !important;
      }
      input[type="checkbox"]{ width: 12px !important; height: 12px !important; }

      .standingWrap, .standingPill{
        border:none !important;
        background:transparent !important;
        padding:0 !important;
        color:#000 !important;
        font-weight:400 !important;
      }

      .editBlock{
        border:none !important;
        box-shadow:none !important;
        background:transparent !important;
        padding:0 !important;
        margin:0 !important;
        max-width: none !important;
        width: 100% !important;
        overflow: visible !important;
        white-space: pre-wrap !important;
        overflow-wrap:anywhere !important;
        word-break: break-word !important;
      }
      .editTitle{ font-size: 17pt !important; font-weight: 800 !important; }
      .editSubtitle{ font-size: 11.5px !important; color:#000 !important; }

      .printGroup{ display:block !important; font-size: 15pt !important; color:#000 !important; }
      body.printBoth .printGroup{ display:none !important; }

      input, select, .notesLine{
        border:none !important;
        box-shadow:none !important;
        background:transparent !important;
        padding:0 !important;
        font-size: 11.5px !important;
      }

      .lblLong{ display:inline !important; }
      .lblShort{ display:none !important; }

      /* neutral colours even if dark mode is on */
      :root{
        --bg:#ffffff;
        --panel:#ffffff;
        --text:#000000;
        --muted:#1f2937;
        --muted2:#374151;
        --stroke:#d1d5db;
        --stroke2:#cbd5e1;
        --btn:#ffffff;

<header>
<div class="wrap">
<div class="headrow">
<div class="titleBox">

<div class="hint" id="hintLine">Tip: you can write multiple lines (Enter) – printing will wrap without cutting.</div>

<span class="pill"><strong id="countLabel">0</strong> <span id="countUnit">volunteers</span></span>
<span class="pill"><span id="viewPrefix">View:</span> <strong id="viewLabel">Brothers</strong></span>
<span class="pill"><span id="lastSavedPrefix">Last saved:</span> <strong id="lastSaved">—</strong></span>

</span><span class="pill" title="Theme" style="padding:2px 4px;">

</div>
</div>

<!-- SIGNATURE: two big roster tabs, impossible to miss -->

      firstAidTitle: "Erste-Hilfe-Kurs nicht älter als 2 Jahre (ausgebildeter Ersthelfer).",
      filters: "Filter",

      langTitle: "Sprache",

      toggleDark: "Dunkel",
      toggleLight: "Hell",
      exportJson: "JSON exportieren",
      exportCsv: "CSV exportieren",
      importJson: "JSON importieren",
      clear: "Leeren",
      delete: "Löschen",
      deleteConfirm: "{name} löschen?",
      added: "Hinzugefügt ✔",
      deleted: "Gelöscht ✔",
      exported: "JSON exportiert ✔",
      exportedCsv: "CSV exportiert ✔",
      imported: "{n} importiert ✔",
      cleared: "Geleert ✔",
      noPhone: "Keine Telefonnummer",
      noEmail: "Keine E-Mail-Adresse",
      nothingCopy: "Nichts zum Kopieren",
      copied: "Kopiert ✔",
      importFailed: "Import fehlgeschlagen. Bitte eine gültige JSON-Datei aus diesem Tool auswählen.",
      clearConfirm: "ALLE Freiwilligen (Brüder + Schwestern) auf diesem Gerät löschen?",
      exemplaryTip: "Älteste und Dienstamtgehilfen gelten durch Ernennung als vorbildlich.",
      csvName: "Name", csvGroup: "Gruppe", csvPrivilege: "Vorrecht", csvStanding: "Ruf",
      csvPhone: "Telefon", csvEmail: "E-Mail", csvNotes: "Notizen", csvYes: "ja", csvNo: "nein"
    }
  };

  let currentLang = "en";
  function t(key, vars){
    let s = (LANG[currentLang] && LANG[currentLang][key]) ? LANG[currentLang][key] : key;
    if(vars && typeof s === "string"){
      for(const k of Object.keys(vars)){
        s = s.replaceAll("{" + k + "}", String(vars[k]));
      }
    }
    return s;
  }

  const $ = (id) => document.getElementById(id);
  const tbody = $("tbody");
  const emptyState = $("emptyState");

  const groupFilter = $("groupFilter");
  const search = $("search");
  const privFilter = $("privFilter");

  const countLabel = $("countLabel");
  const viewLabel = $("viewLabel");
  const lastSaved = $("lastSaved");
  const printGroup = $("printGroup");

  const hdrTitle = $("hdrTitle");
  const hdrSubtitle = $("hdrSubtitle");

  function applyLang(lang){
    if(!LANG[lang]) lang = "en";
    currentLang = lang;
    try{ localStorage.setItem(KEY_LANG, lang); }catch(e){}

    const set = (id, txt) => { const el = $(id); if(el) el.textContent = txt; };

    set("countUnit", t("volunteersUnit"));
    set("viewPrefix", t("viewPrefix"));
    set("lastSavedPrefix", t("lastSavedPrefix"));
    set("hintLine", t("hintLine"));
    set("eyebrow", t("eyebrow"));

    const langPill = $("langPill");
    if(langPill) langPill.title = t("langTitle");
    const themeBtn = $("themeBtn");
    if(themeBtn) themeBtn.title = t("ttTheme");

    set("emptyText", t("emptyText"));
    set("emptyText2", t("emptyClick"));
    set("emptyAddWord", t("add"));
    set("emptyText3", t("emptyOrImport"));

    set("addBtn", "➕ " + t("add"));
    set("printBtn", "🖨️ " + t("print"));
    set("printBothBtn", "🖨️ " + t("printBoth"));
    const pb = $("printBothBtn"); if(pb) pb.title = t("printBothTitle");
    set("exportBtn", "⬇️ " + t("exportJson"));
    set("csvBtn", "📄 " + t("exportCsv"));
    set("importBtn", "⬆️ " + t("importJson"));
    set("clearBtn", "🧹 " + t("clear"));

    if(search) search.placeholder = t("searchPh");

    set("optBrothers", t("brothers"));
    set("optSisters", t("sisters"));
    set("tabBrothersName", t("brothers"));
    set("tabSistersName", t("sisters"));
    set("tabBrothersSub", t("brothersSub"));
    set("tabSistersSub", t("sistersSub"));

    set("optAllPriv", t("allPrivileges"));
    set("optElder", t("elder"));
    set("optMS", t("ms"));
    set("optPublisher", t("publisher"));

    const tb = $("themeBtn");
    if(tb){
      const darkOn = document.documentElement.getAttribute("data-theme") === "dark";
      tb.textContent = darkOn ? ("☀️ " + t("toggleLight")) : ("🌙 " + t("toggleDark"));
    }

    render();
  }

  function initLang(){
    let lang = null;
    try{ lang = localStorage.getItem(KEY_LANG); }catch(e){}
    if(lang !== "de" && lang !== "en"){
      const nav = (navigator.language || "").toLowerCase();
      lang = nav.startsWith("de") ? "de" : "en";
    }
    const ls = $("langSwitch");
    if(ls){
      ls.value = lang;
      ls.addEventListener("change", () => applyLang(ls.value));
    }
    applyLang(lang);
  }

  // Theme
  function applyTheme(mode){
    const root = document.documentElement;
    if(mode === "dark") root.setAttribute("data-theme","dark");
    else root.removeAttribute("data-theme");
    try{ localStorage.setItem(KEY_THEME, mode); }catch(e){}
    const b = $("themeBtn");
    if(b){
      const darkOn = (mode === "dark");
      b.textContent = darkOn ? ("☀️ " + t("toggleLight")) : ("🌙 " + t("toggleDark"));
      b.title = t("ttTheme");
    }
  }
  function initTheme(){
    let mode = null;
    try{ mode = localStorage.getItem(KEY_THEME); }catch(e){}
    if(mode !== "dark" && mode !== "light"){
      mode = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    }
    applyTheme(mode);
  }

  const pad = (n) => String(n).padStart(2, "0");
  function nowStamp(ts = Date.now()){
    const d = new Date(ts);
    return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function toast(msg){
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 1600);
  }
  function uid(){
    return "v_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16);
  }
  function normalize(str){ return (str || "").toString().toLowerCase().trim(); }
  function escapeHtml(s){
    return (s ?? "").toString()
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }
  function escapeAttr(s){ return escapeHtml(s).replaceAll("\n"," "); }

  function cleanTel(s){
    const raw = (s || "").toString().trim();
    return raw.replace(/(?!^\+)[^0-9]/g, "").replace(/\s+/g,"");
  }

  function load(){
    try{
      const rawCfg = localStorage.getItem(KEY_CFG);
      if(rawCfg){
        const parsed = JSON.parse(rawCfg);
        if(parsed && typeof parsed === "object") cfg = { ...cfg, ...parsed };
      }
    }catch(e){}

    hdrTitle.textContent = cfg.title || "";
    hdrSubtitle.textContent = cfg.subtitle || "";
    document.title = (cfg.title || "Volunteers List");

    try{
      const raw = localStorage.getItem(KEY_DATA);
      if(raw){
        const parsed = JSON.parse(raw);
        if(Array.isArray(parsed)) data = parsed;
      } else {
        data = [];
        localStorage.setItem(KEY_DATA, JSON.stringify(data));
      }
    }catch(e){
      console.warn(e);
      data = [];
    }
    lastSaved.textContent = nowStamp(Date.now());
  }

  function persist(){
    localStorage.setItem(KEY_DATA, JSON.stringify(data));
    lastSaved.textContent = nowStamp(Date.now());
  }

  function persistCfg(){
    cfg.title = (hdrTitle.textContent || "").trim();
    cfg.subtitle = (hdrSubtitle.textContent || "").trim();
    localStorage.setItem(KEY_CFG, JSON.stringify(cfg));
    document.title = (cfg.title || "Volunteers List");
  }

  function currentGroup(){ return groupFilter.value; }

  function matches(v, groupOverride){
    const g = groupOverride || currentGroup();
    if(v.group !== g) return false;

    const q = normalize(search.value);
    const pf = privFilter.value;

    if(g === "Brothers" && pf && v.privilege !== pf) return false;

    for(const flag of activeFlags){
      if(flag === "exemplary"){ if(v.standing !== "exemplary") return false; }
      else if(!v[flag]) return false;
    }

    if(!q) return true;
    const hay = [v.name, v.privilege, v.standing, v.phone, v.email, v.notes].map(normalize).join(" | ");
    return hay.includes(q);
  }

  function getById(id){ return data.find(x => x.id === id); }

  function setHeaderState(){
    const g = currentGroup();
    document.documentElement.setAttribute("data-group", g);

    viewLabel.textContent = (g === "Brothers") ? t("brothers") : t("sisters");
    printGroup.textContent = (g === "Brothers") ? t("brothers") : t("sisters");

    const th = $("tableHeadLabel");
    if(th){
      if(currentLang === "de") th.textContent = (g === "Brothers") ? "Freiwilliger" : "Freiwillige";
      else th.textContent = t("volunteerHead");
    }

    privFilter.style.display = (g === "Brothers") ? "inline-block" : "none";
    if(g !== "Brothers") privFilter.value = "";

    // tabs
    document.querySelectorAll(".gTab").forEach(btn => {
      const on = btn.getAttribute("data-g") === g;
      btn.classList.toggle("active", on);
      btn.setAttribute("aria-pressed", on ? "true" : "false");
    });
    $("tabBrothersCount").textContent = data.filter(v => v.group === "Brothers").length;
    $("tabSistersCount").textContent  = data.filter(v => v.group === "Sisters").length;
  }

  function renderChips(){
    const g = currentGroup();
    const flags = (g === "Brothers")
      ? [["exemplary", t("exemplary")], ["single", t("single")], ["familyHead", t("familyHead")], ["smallChildren", t("smallChildren")]]
      : [["exemplary", t("exemplary")], ["single", t("single")], ["smallChildren", t("smallChildren")], ["medicalExperience", t("firstAidShort")]];

    // drop flags that don't exist in this group
    for(const f of Array.from(activeFlags)){
      if(!flags.some(x => x[0] === f)) activeFlags.delete(f);
    }

    const chips = flags.map(([key, label]) =>
      `<button class="chip ${activeFlags.has(key) ? "on" : ""}" data-flag="${key}" type="button">${escapeHtml(label)}</button>`
    ).join("");

    const reset = activeFlags.size
      ? `<button class="chip reset" data-reset="1" type="button">✕ ${escapeHtml(t("resetFilters"))}</button>`
      : "";

    $("chipRow").innerHTML = `<span class="chipLabel">${escapeHtml(t("filters"))}</span>${chips}${reset}`;
  }

  function renderStats(){
    const g = currentGroup();
    const list = data.filter(v => v.group === g);
    const n = (fn) => list.filter(fn).length;

    const items = (g === "Brothers")
      ? [
          [t("statTotal"), list.length],
          [t("statElders"), n(v => v.privilege === "Elder")],
          [t("statMS"), n(v => v.privilege === "MS")],
          [t("statPublishers"), n(v => v.privilege === "Publisher")],
          [t("statPhone"), n(v => cleanTel(v.phone).length > 4)]
        ]
      : [
          [t("statTotal"), list.length],
          [t("statExemplary"), n(v => v.standing === "exemplary")],
          [t("statFirstAid"), n(v => v.medicalExperience)],
          [t("smallChildren"), n(v => v.smallChildren)],
          [t("statPhone"), n(v => cleanTel(v.phone).length > 4)]
        ];

    $("statBar").innerHTML = items
      .map(([label, val]) => `<span class="stat"><b>${val}</b> ${escapeHtml(label)}</span>`)
      .join("");
  }

  function rowHtml(v, g){
    const topClass = (g === "Sisters") ? "rowTop sisters" : "rowTop";

    const phoneField = `
      <div class="field copyField">
        <input class="input mono" data-field="phone" value="${escapeAttr(v.phone||"")}" placeholder="${escapeAttr(t("phonePh"))}" />
        <button class="miniBtn" data-copy="phone" title="${escapeAttr(t("ttCopyMobile"))}">⧉</button>
        <button class="miniBtn" data-call="1" title="${escapeAttr(t("ttCall"))}">📞</button>
        <button class="miniBtn" data-wa="1" title="${escapeAttr(t("ttWhatsApp"))}">💬</button>
      </div>`;

    const mailField = `
      <div class="field copyField">
        <input class="input mono" data-field="email" value="${escapeAttr(v.email||"")}" placeholder="${escapeAttr(t("emailPh"))}" />
        <button class="miniBtn" data-copy="email" title="${escapeAttr(t("ttCopyEmail"))}">⧉</button>
        <button class="miniBtn" data-mail="1" title="${escapeAttr(t("ttWriteEmail"))}">✉️</button>
      </div>`;

    const nameField = `
      <div class="field">
        <input class="input" data-field="name" value="${escapeAttr(v.name||"")}" placeholder="${escapeAttr(t("namePh"))}" />
      </div>`;

    const delField = `
      <div class="actions">
        <button class="btn small danger" data-del="1" title="${escapeAttr(t("ttDelete"))}">🗑️</button>
      </div>`;

    const top = (g === "Brothers")
      ? `<div class="${topClass}">
           ${nameField}
           <div class="field">
             <select data-field="privilege">
               <option value="Elder" ${v.privilege==="Elder"?"selected":""}>${t("elder")}</option>
               <option value="MS" ${v.privilege==="MS"?"selected":""}>${t("ms")}</option>
               <option value="Publisher" ${v.privilege==="Publisher"?"selected":""}>${t("publisher")}</option>
             </select>
           </div>
           ${phoneField}
           ${mailField}
           ${delField}
         </div>`
      : `<div class="${topClass}">
           ${nameField}
           ${phoneField}
           ${mailField}
           ${delField}
         </div>`;

    const standingSelect = `
      <span class="standingWrap">
        <span>${t("standing")}:</span>
        <select class="standingSelect" data-field="standing" title="${escapeAttr(t("standing"))}">
          <option value="" ${(!v.standing) ? "selected" : ""}>—</option>
          <option value="good" ${(v.standing==="good")?"selected":""}>${t("goodStanding")}</option>
          <option value="exemplary" ${(v.standing==="exemplary")?"selected":""}>${t("exemplary")}</option>
        </select>
      </span>`;

    const checks = (g === "Brothers")
      ? `${
          (v.privilege === "Elder" || v.privilege === "MS")
            ? `<span class="standingPill" title="${escapeAttr(t("exemplaryTip"))}">★ ${t("exemplary")}</span>`
            : standingSelect
        }
        <label><input type="checkbox" data-check="single" ${v.single ? "checked":""}/> ${t("single")}</label>
        <label><input type="checkbox" data-check="familyHead" ${v.familyHead ? "checked":""}/> <span class="lblLong">${t("familyHead")}</span></label>
        <label><input type="checkbox" data-check="smallChildren" ${v.smallChildren ? "checked":""}/> <span class="lblLong">${t("smallChildren")}</span></label>`
      : `${standingSelect}
        <label><input type="checkbox" data-check="single" ${v.single ? "checked":""}/> ${t("single")}</label>
        <label><input type="checkbox" data-check="smallChildren" ${v.smallChildren ? "checked":""}/> <span class="lblLong">${t("smallChildren")}</span></label>
        <label title="${escapeAttr(t("firstAidTitle"))}"><input type="checkbox" data-check="medicalExperience" ${v.medicalExperience ? "checked":""}/> <span class="faShort">${t("firstAid")}</span></label>`;

    return `
      <tr data-id="${escapeAttr(v.id)}">
        <td>
          ${top}
          <div class="rowBottom">
            <input class="notesLine" data-field="notes" value="${escapeAttr(v.notes||"")}" placeholder="${escapeAttr(t("notesPh"))}" />
            <div class="checks">${checks}</div>
          </div>
        </td>
      </tr>`;
  }

  function sorted(list){
    return list.slice().sort((a,b) => (a.name||"").localeCompare(b.name||"", undefined, {sensitivity:"base"}));
  }

  function render(){
    setHeaderState();
    renderChips();
    renderStats();

    // appointed brothers are exemplary
    for(const v of data){
      if(v && v.group === "Brothers" && (v.privilege === "Elder" || v.privilege === "MS")){
        v.standing = "exemplary";
      }
    }

    if(printBoth){
      const bro = sorted(data.filter(v => v.group === "Brothers"));
      const sis = sorted(data.filter(v => v.group === "Sisters"));
      let html = "";
      if(bro.length){
        html += `<tr class="groupHeadRow"><td>${t("brothers")}</td></tr>` + bro.map(v => rowHtml(v, "Brothers")).join("");
      }
      if(sis.length){
        html += `<tr class="groupHeadRow${bro.length ? " breakBefore" : ""}"><td>${t("sisters")}</td></tr>` + sis.map(v => rowHtml(v, "Sisters")).join("");
      }
      tbody.innerHTML = html;
      countLabel.textContent = bro.length + sis.length;
      emptyState.style.display = "none";
      return;
    }

    const g = currentGroup();
    const filtered = sorted(data.filter(v => matches(v, g)));
    countLabel.textContent = filtered.length;
    tbody.innerHTML = filtered.map(v => rowHtml(v, g)).join("");
    emptyState.style.display = filtered.length ? "none" : "block";
  }

  function addRow(){
    const g = currentGroup();
    const base = {
      id: uid(),
      group: g,
      name:"",
      phone:"",
      email:"",
      notes:"",
      single:false,
      smallChildren:false,
      standing:"good",
      updatedAt: Date.now()
    };

    if(g === "Brothers"){
      base.privilege = "Publisher";
      base.familyHead = false;
    } else {
      base.medicalExperience = false;
    }

    data.push(base);
    persist();
    toast(t("added"));
    render();

    setTimeout(() => {
      const rows = tbody.querySelectorAll("tr");
      const last = rows[rows.length - 1];
      last?.querySelector('input[data-field="name"]')?.focus();
    }, 0);
  }

  function removeRow(id){
    const v = getById(id);
    const nm = (v?.name || "this volunteer").trim();
    if(!confirm(t("deleteConfirm",{name:nm}))) return;
    data = data.filter(x => x.id !== id);
    persist();
    toast(t("deleted"));
    render();
  }

  // Header editing
  hdrTitle.addEventListener("input", persistCfg);
  hdrSubtitle.addEventListener("input", persistCfg);

  function pastePlain(e){
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData("text/plain");
    document.execCommand("insertText", false, text);
  }
  hdrTitle.addEventListener("paste", pastePlain);
  hdrSubtitle.addEventListener("paste", pastePlain);

  // Group tabs -> keep hidden select as the single source of truth
  $("groupSwitch").addEventListener("click", (e) => {
    const btn = e.target.closest(".gTab");
    if(!btn) return;
    const g = btn.getAttribute("data-g");
    if(!g || groupFilter.value === g) return;
    groupFilter.value = g;
    activeFlags.clear();
    render();
  });

  // Toolbar events
  $("addBtn").addEventListener("click", addRow);
  $("printBtn").addEventListener("click", () => window.print());
  $("printBothBtn").addEventListener("click", () => {
    printBoth = true;
    document.body.classList.add("printBoth");
    render();
    setTimeout(() => window.print(), 30);
    // fallback: some mobile browsers never fire afterprint
    setTimeout(restoreFromPrintBoth, 20000);
  });
  function restoreFromPrintBoth(){
    if(!printBoth) return;
    printBoth = false;
    document.body.classList.remove("printBoth");
    render();
  }
  window.addEventListener("focus", restoreFromPrintBoth);
  window.addEventListener("afterprint", () => {
    if(printBoth){
      printBoth = false;
      document.body.classList.remove("printBoth");
      render();
    }
  });

  $("themeBtn").addEventListener("click", () => {
    const dark = document.documentElement.getAttribute("data-theme") === "dark";
    applyTheme(dark ? "light" : "dark");
  });
  groupFilter.addEventListener("change", render);
  search.addEventListener("input", render);
  privFilter.addEventListener("change", render);

  // quick filter chips
  $("chipRow").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if(!chip) return;
    if(chip.dataset.reset){ activeFlags.clear(); render(); return; }
    const f = chip.dataset.flag;
    if(!f) return;
    if(activeFlags.has(f)) activeFlags.delete(f); else activeFlags.add(f);
    render();
  });

  // Delegated edits + copy + delete
  tbody.addEventListener("input", (e) => {
    const el = e.target;
    const tr = el.closest("tr");
    if(!tr) return;
    const id = tr.getAttribute("data-id");
    if(!id) return;

    if(el.matches("input[data-field]")){
      const field = el.getAttribute("data-field");
      const v = getById(id);
      if(!v) return;
      v[field] = el.value;
      v.updatedAt = Date.now();
      persist();
    }
  });

  tbody.addEventListener("change", (e) => {
    const el = e.target;
    const tr = el.closest("tr");
    if(!tr) return;
    const id = tr.getAttribute("data-id");
    if(!id) return;

    if(el.matches("select[data-field]")){
      const field = el.getAttribute("data-field");
      const v = getById(id);
      if(!v) return;

      v[field] = el.value;

      if(field === "privilege"){
        if(v.privilege === "Elder" || v.privilege === "MS"){
          v.standing = "exemplary";
        }
        v.updatedAt = Date.now();
        persist();
        render();
        return;
      }

      v.updatedAt = Date.now();
      persist();
      renderStats();
    }

    if(el.matches('input[type="checkbox"][data-check]')){
      const key = el.getAttribute("data-check");
      const v = getById(id);
      if(!v) return;
      v[key] = !!el.checked;
      v.updatedAt = Date.now();
      persist();
      renderStats();
    }
  });

  tbody.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if(!btn) return;
    const tr = btn.closest("tr");
    if(!tr) return;
    const id = tr.getAttribute("data-id");
    if(!id) return;

    if(btn.dataset.call){
      const v = getById(id);
      if(!v) return;
      const tel = cleanTel(v.phone);
      if(!tel){ toast(t("noPhone")); return; }
      window.location.href = `tel:${tel}`;
      return;
    }
    if(btn.dataset.wa){
      const v = getById(id);
      if(!v) return;
      const tel = cleanTel(v.phone).replace(/^\+/, "");
      if(!tel){ toast(t("noPhone")); return; }
      window.location.href = `https://wa.me/${tel}`;
      return;
    }
    if(btn.dataset.mail){
      const v = getById(id);
      if(!v) return;
      const mail = (v.email || "").trim();
      if(!mail){ toast(t("noEmail")); return; }
      window.location.href = `mailto:${encodeURI(mail)}`;
      return;
    }
    if(btn.dataset.copy){
      const v = getById(id);
      if(!v) return;
      const val = (v[btn.dataset.copy] || "").trim();
      if(!val){ toast(t("nothingCopy")); return; }
      navigator.clipboard.writeText(val).then(()=>toast(t("copied"))).catch(()=>toast(t("copied")));
      return;
    }
    if(btn.dataset.del){
      removeRow(id);
      return;
    }
  });

  // Export / Import / Clear
  $("exportBtn").addEventListener("click", () => {
    const payload = {
      app: "Volunteers List (Universal)",
      version: "1.0",
      exportedAt: new Date().toISOString(),
      header: { title: cfg.title, subtitle: cfg.subtitle },
      lang: currentLang,
      count: data.length,
      data
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `volunteers_list_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast(t("exported"));
  });

  // CSV export (semicolon + UTF-8 BOM -> opens cleanly in German Excel)
  $("csvBtn").addEventListener("click", () => {
    const yn = (b) => b ? t("csvYes") : t("csvNo");
    const q = (s) => `"${String(s ?? "").replaceAll('"','""')}"`;
    const head = [
      t("csvGroup"), t("csvName"), t("csvPrivilege"), t("csvStanding"),
      t("csvPhone"), t("csvEmail"),
      t("single"), t("familyHead"), t("smallChildren"), t("firstAidShort"),
      t("csvNotes")
    ];
    const rows = sorted(data).map(v => [
      v.group === "Sisters" ? t("sisters") : t("brothers"),
      v.name || "",
      v.group === "Brothers" ? t(v.privilege === "Elder" ? "elder" : v.privilege === "MS" ? "ms" : "publisher") : "",
      v.standing === "exemplary" ? t("exemplary") : (v.standing === "good" ? t("goodStanding") : ""),
      v.phone || "",
      v.email || "",
      yn(v.single), yn(v.familyHead), yn(v.smallChildren), yn(v.medicalExperience),
      v.notes || ""
    ]);
    const csv = "\uFEFF" + [head, ...rows].map(r => r.map(q).join(";")).join("\r\n");
    const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `volunteers_list_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast(t("exportedCsv"));
  });

  const importFile = $("importFile");
  $("importBtn").addEventListener("click", () => importFile.click());

  importFile.addEventListener("change", async () => {
    const file = importFile.files?.[0];
    if(!file) return;
    try{
      const text = await file.text();
      const parsed = JSON.parse(text);

      if(parsed && typeof parsed.lang === "string"){
        const ls = $("langSwitch");
        if(ls && (parsed.lang === "de" || parsed.lang === "en")){
          ls.value = parsed.lang;
          applyLang(parsed.lang);
        }
      }

      if(parsed && parsed.header && typeof parsed.header === "object"){
        cfg.title = String(parsed.header.title || cfg.title);
        cfg.subtitle = String(parsed.header.subtitle || cfg.subtitle);
        hdrTitle.textContent = cfg.title;
        hdrSubtitle.textContent = cfg.subtitle;
        persistCfg();
      }

      let incoming = null;
      if(Array.isArray(parsed)) incoming = parsed;
      else if(parsed && Array.isArray(parsed.data)) incoming = parsed.data;
      if(!incoming) throw new Error("JSON format not recognized");

      const cleaned = incoming
        .filter(x => x && typeof x === "object")
        .map(x => ({
          id: String(x.id || uid()),
          group: (x.group === "Sisters") ? "Sisters" : "Brothers",
          name: String(x.name || "").trim(),
          privilege: (x.privilege === "Elder" || x.privilege === "MS") ? x.privilege : "Publisher",
          phone: String(x.phone || "").trim(),
          email: String(x.email || "").trim(),
          notes: String(x.notes || "").trim(),
          single: !!x.single,
          familyHead: !!x.familyHead,
          smallChildren: !!x.smallChildren,
          medicalExperience: !!x.medicalExperience,
          standing: ((x.privilege === "Elder" || x.privilege === "MS") ? "exemplary" : ((x.standing === "exemplary" || x.standing === "good") ? x.standing : "")),
          updatedAt: Number(x.updatedAt || Date.now())
        }));

      const map = new Map(data.map(v => [v.id, v]));
      for(const v of cleaned) map.set(v.id, v);
      data = Array.from(map.values());

      persist();
      toast(t("imported",{n: cleaned.length}));
      render();
    }catch(err){
      console.error(err);
      alert(t("importFailed"));
    }finally{
      importFile.value = "";
    }
  });

  $("clearBtn").addEventListener("click", () => {
    if(!confirm(t("clearConfirm"))) return;
    data = [];
    persist();
    toast(t("cleared"));
    render();
  });

  // PRINT: trim notes so the checkbox line stays on one row
  const __printNotes = new Map();
  function __truncateNotesForPrint(){
    __printNotes.clear();
    document.querySelectorAll(".notesLine").forEach(inp => {
      const orig = inp.value || "";
      __printNotes.set(inp, orig);
      const max = 45;
      if(orig.length > max){
        inp.value = orig.slice(0, max-1) + "…";
      }
    });
  }
  function __restoreNotesAfterPrint(){
    for(const [inp, orig] of __printNotes.entries()){
      if(inp) inp.value = orig;
    }
    __printNotes.clear();
  }
  window.addEventListener("beforeprint", __truncateNotesForPrint);
  window.addEventListener("afterprint", __restoreNotesAfterPrint);

  // Keyboard: Ctrl/Cmd+K = search, Ctrl/Cmd+Enter = add
  document.addEventListener("keydown", (e) => {
    const mod = e.ctrlKey || e.metaKey;
    if(mod && e.key.toLowerCase() === "k"){ e.preventDefault(); search.focus(); search.select(); }
    if(mod && e.key === "Enter"){ e.preventDefault(); addRow(); }
  });

  initLang();
  initTheme();
  load();
  groupFilter.value = "Brothers";
  render();

  }catch(err){
    console.error(err);
    try{ alert('Error: ' + (err && err.message ? err.message : err)); }catch(e){}
  }
})();
</script>
</body>
</html>
