      '<div id="pickList"></div>';
    const q = $('#pickQ');
    q.value = S.pickQuery;
    guardSearch(q);
    q.addEventListener('input', () => { S.pickQuery = cleanQuery(q); renderPickList(slot); });
  }
  renderPickList(slot);
}

function renderPickList(slot) {
  const box = $('#pickList');
  if (!box) return;
  const team = positionTeam(slot.pos);
  const q = norm(S.pickQuery.trim());

  let list = q.length >= 2
    ? D.attendants.filter(a => nameMatch(a.name, q))
    : (team ? D.attendants.filter(a => a.team === team) : []);
  list = list.filter(a => a.id !== slot.id).sort(byName).slice(0, 40);
  const reserves = q.length >= 2 ? [] :
    D.attendants.filter(a => isReserve(a.team) && a.id !== slot.id && String(a.team || '').trim()).sort(byName);

  let html = slot.id
    ? '<button class="btn block" type="button" data-act="assign" data-id="">Leave this shift open</button>'
    : '';

  if (q.length < 2) {
    html += '<div class="h3">' + (team ? 'Team ' + esc(team) + ' – or search any name above' : 'Type at least two letters') + '</div>';
  }

  const rowsHtml = arr => '<div class="results">' + arr.map(a => {
      const busy = overlaps(a.id, slot);
      return '<button class="result" type="button" data-act="assign" data-id="' + esc(a.id) + '">' +
        '<span class="dot" style="background:' + teamColor(a.team) + '"></span>' +
        '<span><span class="result-name">' + esc(a.name) + '</span>' +
        '<span class="result-sub' + (busy.length ? ' busy' : '') + '">' + esc(a.team || 'No team') + ' · ' +
        (busy.length ? 'Busy ' + esc(timeText(busy[0])) + ' at ' + esc(busy[0].pos.label) : 'Free at this time') +
        '</span></span></button>';
    }).join('') + '</div>';

  if (list.length) {
    html += rowsHtml(list);
  } else if (q.length >= 2) {
    html += '<div class="empty">No attendant found.</div>';
  }
  if (reserves.length) {
    html += '<div class="h3">Reserve</div>' + rowsHtml(reserves);
  }

  box.innerHTML = html;
}

function askAssign(id) {
  const top = topPanel();
  const slot = top && findSlot(top.row);
  if (!slot) return;

  const warnings = [];
  let moveTeam = '';
  if (id) {
    const a = D.att[id];
    overlaps(id, slot).forEach(x => warnings.push('Already on duty ' + timeText(x) + ' at ' + x.pos.label + '.'));
    const team = positionTeam(slot.pos);
    if (team && isReserve(a.team)) {
      moveTeam = team;
    } else if (team && a.team && a.team !== team) {
      warnings.push('He is in team ' + a.team + ', this position is usually team ' + team + '.');
    }
  }

  const text = '<p class="muted">' + esc(timeText(slot)) + ' · ' + esc(slot.pos.label) + ' · ' + esc(slot.pos.area) +
    '<br>Currently: ' + esc(slotName(slot)) + '</p>' +
    (warnings.length ? '<div class="warn-list">' + warnings.map(esc).join('<br>') + '</div>' : '') +
    (moveTeam ? '<label class="check-line"><input type="checkbox" id="moveTeam" checked> Also move him from reserve to team ' + esc(moveTeam) + '</label>' : '');

  confirmBox(id ? 'Assign ' + D.att[id].name + '?' : 'Leave this shift open?', text,
    id ? 'Assign' : 'Leave open', () => {
      const box = $('#moveTeam');
      doAssign(slot, id, moveTeam && box && box.checked ? moveTeam : '');
    });
}

  if (!S.admin.pins) return h + '<div class="note">' + esc(S.admin.error || 'Could not load the codes.') + '</div>';

  const pins = S.admin.pins;
  h += '<p class="muted" style="margin:0 2px 12px">Codes are stored securely and cannot be shown again. Changing a code signs out every phone that uses the old one.</p>';
  ['viewer', 'checkin', 'editor', 'admin'].forEach(r => {
    h += '<div class="form-card"><div class="code-head"><strong>' + ROLE_LABEL[r] + '</strong>' +
      '<span class="code-state ' + (pins[r] ? 'set' : 'unset') + '">' + (pins[r] ? 'Set' : 'Not set') + '</span></div>' +
      '<p class="muted">' + ROLE_DESC[r] + '</p>' +
      '<div class="form-row"><input id="pin-' + r + '" name="aa-new-code-' + r + '" type="password" autocomplete="new-password" data-lpignore="true" autocapitalize="off" placeholder="New code" aria-label="New ' + ROLE_LABEL[r] + ' code">' +
      '<button class="btn primary" type="button" data-act="setpin" data-role="' + r + '">Save</button></div>' +
      ((r === 'checkin' || r === 'editor') && pins[r]
        ? '<button class="linkish" type="button" data-act="clearpin" data-role="' + r + '">Remove this code</button>' : '') +
      '</div>';
  });
  return h;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  switch (act) {
    case 'tab':
      clearPanels();
      S.tab = el.dataset.tab;
      if (!S.ignorePop) history.replaceState(history.state, '', '#' + S.tab);
      render();
      window.scrollTo(0, 0);
      break;

    case 'person': pushPanel({ type: 'person', id: el.dataset.id }); break;

    case 'pos':
      S.panelMap = false;
      pushPanel({ type: 'pos', key: el.dataset.key, row: el.dataset.row ? Number(el.dataset.row) : null });
      break;

    case 'edit-slot':
      S.pickQuery = '';
      pushPanel({ type: 'pick', row: Number(el.dataset.row) });
      break;

    case 'assign': askAssign(el.dataset.id); break;
    case 'back': backPanel(); break;
    case 'area': S.area = el.dataset.area; S.block = 'all'; render(); window.scrollTo(0, 0); break;
    case 'pblock': S.block = el.dataset.block; render(); break;
    case 'ptoggle': {
      const k = el.dataset.key;
      if (S.openPos[k]) delete S.openPos[k]; else S.openPos[k] = true;
      render();
      break;
    }
    case 'team': S.team = el.dataset.team; renderTeamsBody(clock()); break;
    case 'cifilter': S.ciFilter = el.dataset.f; renderCheckinBody(clock()); break;

    case 'identify': {
      const a = D.att[el.dataset.id];
      if (!a) break;
      confirmBox('Are you ' + a.name + '?',
        '<p class="muted">Team: ' + esc(a.team || 'No team') + '<br>Only choose your own name. It is saved on this phone.</p>',
        'Yes, that’s me', () => {
          S.me = a.id;
          store.set(KEY.me, a.id);
          S.meQuery = '';
          S.team = null;
          render();
          window.scrollTo(0, 0);
        });
      break;
    }

    case 'guest':
      S.me = GUEST;
      store.set(KEY.me, GUEST);
      S.meQuery = '';
      S.area = null;
      S.team = null;
      render();
      window.scrollTo(0, 0);
      break;

    case 'goto-pos':
      S.tab = 'positions';
      S.area = el.dataset.area;
      S.block = 'all';
      history.replaceState(history.state, '', '#positions');
      render();
      window.scrollTo(0, 0);
      break;

    case 'change-me':
      if (isGuest()) {
        S.me = null;
        store.del(KEY.me);
        S.meQuery = '';
        render();
        window.scrollTo(0, 0);
        break;
      }
      confirmBox('Change the name?',
        '<p class="muted">Do this only if the wrong name was chosen or this is not your phone.</p>',
        'Change name', () => {
          S.me = null;
          store.del(KEY.me);
          S.meQuery = '';
          render();
          window.scrollTo(0, 0);
        });
      break;

    case 'ci': {
      const a = D.att[el.dataset.id];
      if (!a || S.pending[a.id]) break;
      if (a.checkedIn) {
        confirmBox('Undo check-in for ' + a.name + '?',
          '<p class="muted">Only if he was checked in by mistake.</p>',
          'Undo check-in', () => doCheckin(a.id, false));
      } else {
        doCheckin(a.id, true);
      }
      break;
    }

    case 'find':
      if (!S.pin || !D) break;
      pushPanel({ type: 'find' });
      break;

    case 'emergency':
      if (!S.pin || !D) break;
      pushPanel({ type: 'emergency' });
      break;

    case 'evac-ack':
      store.set(KEY.evacAck, clock().date);
      render();
      break;

    case 'setcontacts': {
      const val = k => (($('#ec-' + k) || {}).value || '').trim();
      const payload = { overseer: val('overseer'), assistant: val('assistant'), firstaid: val('firstaid') };
      (async () => {
        try {
          await api('setContacts', payload);
          buzz(60);
          toast('Emergency contacts saved for today');
          await load(true);
          renderPanel(clock(), true);
        } catch (err) {
          if (err.code === 'unauthorized') { logout(ERR.unauthorized); return; }
          toast(errorText(err), 'error');
        }
      })();
      break;
    }

    case 'access':
      if (!S.pin || !D) break;
      S.admin = null;
      pushPanel({ type: 'access' });
      break;

    case 'upgrade': upgradeCode(); break;

    case 'theme': {
      const t = el.dataset.theme;
      if (t === 'auto') store.del(KEY.theme); else store.set(KEY.theme, t);
      applyTheme(t);
      el.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === el));
      break;
    }

    case 'setpin': {
      const r = el.dataset.role;
      const input = $('#pin-' + r);
      const v = input ? input.value.trim() : '';
      if (!v) { toast('Enter the new code first', 'error'); break; }
      confirmBox('Change the ' + ROLE_LABEL[r] + ' code?',
        '<p class="muted">Phones using the old code are signed out and need the new one.</p>',
        'Change code', () => savePin(r, v));
      break;
    }

    case 'print-map': printMap(el.dataset.src, el.dataset.title); break;

    case 'count-start': {
      const label = el.dataset.label;
      confirmBox('Start the ' + COUNT_LABEL[label].toLowerCase() + ' count?',
        '<p class="muted">Everyone with a counting assignment now sees an input field and gets a short vibration.</p>',
        'Start counting', () => countAction('countStart', { label: label, at: fmtMin(clock().min) }, 'Counting started'));
      break;
    }

    case 'count-submit': {
      const row = Number(el.dataset.row);
      const input = el.parentNode.querySelector('.cnt-input');
      const v = input ? input.value.trim() : '';
      if (!/^\d+$/.test(v)) { toast(ERR.bad_count, 'error'); break; }
      el.disabled = true;
      countAction('countSubmit', { sessionId: D.countSession.id, row: row, count: Number(v) }, 'Thank you! Number sent: ' + v)
        .then(ok => { if (ok) { delete S.countDraft[row]; delete S.countDraft['m' + row]; render(); } });
      break;
    }

    case 'count-manual': {
      const k = 'm' + el.dataset.row;
      if (S.countDraft[k]) delete S.countDraft[k]; else S.countDraft[k] = ' ';
      render();
      break;
    }

    case 'count-end':
      confirmBox('End counting?', '<p class="muted">Nobody can send numbers for this count any more. The result stays available under “Summary” today.</p>',
        'End counting', () => { S.countSummary = false; countAction('countEnd', {}, 'Counting ended · total ' + countTotal(countJobsNow())); });
      break;

    case 'count-summary':
      S.countSummary = !S.countSummary;
      render();
      break;

    case 'count-copy': {
      const text = el.dataset.mode === 'day' ? countDayText() : countSummaryText();
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
        .then(() => toast('Summary copied – paste it into WhatsApp'))
        .catch(() => { confirmBox('Summary', '<pre class="cnt-pre">' + esc(text) + '</pre>', 'OK', null); });
      break;
    }

    case 'setcounttimes': {
      const mo = ($('#countMorning') || {}).value || '';
      const af = ($('#countAfternoon') || {}).value || '';
      if ((mo && !/^\d{2}:\d{2}$/.test(mo)) || (af && !/^\d{2}:\d{2}$/.test(af)) || (!mo && !af)) { toast(ERR.bad_time, 'error'); break; }
      (async () => {
        try {
          await api('setCountTimes', { morning: mo, afternoon: af, by: myId() });
          buzz(60);
          toast('Counting times saved');
          await load(true);
          renderPanel(clock(), true);
        } catch (err) {
          if (err.code === 'unauthorized') { logout(ERR.unauthorized); return; }
          toast(errorText(err), 'error');
        }
      })();
      break;
    }

    case 'help-request': {
      const row = Number(el.dataset.row);
      confirmBox('Ask everyone for help?',
        '<p class="muted">All attendants will see this shift. Whoever is free can offer to take it. You confirm before anything changes.</p>',
        'Send request', () => helpAction('requestHelp', { row: row }, 'Help request sent to all attendants'));
      break;
    }

    case 'help-offer': {
      const r = D.requests.find(x => x.id === el.dataset.id);
      const slot = r && findSlot(r.row);
      if (!slot) break;
      confirmBox('Take this shift?',
        '<p class="muted"><strong>' + esc(slot.pos.label) + ' · ' + esc(timeText(slot)) + '</strong><br>' + esc(slot.pos.area) +
        '<br>The attendant department will confirm it. Your team stays the same.</p>',
        'Yes, I can take it', () => helpAction('offerHelp', { reqId: r.id }, 'Thank you! Waiting for confirmation.'));
      break;
    }

    case 'help-confirm': {
      const r = D.requests.find(x => x.id === el.dataset.id);
      const slot = r && findSlot(r.row);
      if (!slot) break;
      const from = fromTeam({ id: r.offerId }, slot.pos);
      confirmBox('Assign ' + nameOf(r.offerId) + '?',
        '<p class="muted">' + esc(slot.pos.label) + ' · ' + esc(timeText(slot)) + '<br>Currently: ' + esc(slotName(slot)) +
        (from ? '<br>He helps out from team ' + esc(from) + ' – his team stays the same.' : '') + '</p>',
        'Confirm', () => helpAction('confirmHelp', { reqId: r.id }, nameOf(r.offerId) + ' assigned'));
      break;
    }

    case 'help-decline':
      helpAction('declineHelp', { reqId: el.dataset.id }, 'Offer declined – the request is open again');
      break;

    case 'help-cancel':
      confirmBox('Cancel this help request?', '<p class="muted">Nobody will see it any more.</p>', 'Cancel request',
        () => helpAction('cancelHelp', { reqId: el.dataset.id }, 'Help request cancelled'));
      break;

    case 'resetcheckins':
      confirmBox('Reset all check-ins?',
        '<p class="muted">Every attendant will be shown as not checked in. This cannot be undone.</p>',
        'Reset all', () => resetCheckins());
      break;

    case 'seteventdate': {
      const input = $('#eventDateInput');
      const v = input ? input.value : '';
      if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { toast(ERR.bad_date, 'error'); break; }
      if (D.event && v === D.event.date) { toast('This is already the assembly day'); break; }
      confirmBox('Change the assembly day?',
        '<p class="muted">New date: <strong>' + esc(fmtDate(v, true)) + '</strong><br>' +
        'Positions!D89 in the sheet is updated and Next Shift is recalculated.</p>',
        'Change date', () => saveEventDate(v));
      break;
    }

    case 'clearpin': {
      const r = el.dataset.role;
      confirmBox('Remove the ' + ROLE_LABEL[r] + ' code?',
        '<p class="muted">Nobody can use this access level until a new code is set.</p>',
        'Remove', () => savePin(r, ''));
      break;
    }

    case 'signout':
      confirmBox('Sign out on this phone?',
        '<p class="muted">The access code will be needed again. The chosen name stays saved.</p>',
        'Sign out', () => logout(''));
      break;

    case 'refresh': if (!S.busy && S.pin) load(true); break;

    case 'togglemap':
      S.panelMap = !S.panelMap;
      renderPanel(clock());
      break;

    case 'zoom': openOverlay(el.dataset.src, el.dataset.alt); break;
    case 'overlay-close': closeOverlay(); break;

    case 'modal-ok': {
      const f = modalAction;
      hideModal();
      if (f) f();
      break;
    }
    case 'modal-cancel': hideModal(); break;
  }
});

let DEMO_SRC = null;
let DEMO_PINS = { admin: true, editor: false, checkin: false, viewer: true };

function demoApi(action, p) {
  if (!DEMO_SRC) DEMO_SRC = demoData();
  return new Promise((resolve, reject) => setTimeout(() => {
    try {
      switch (action) {
        case 'bootstrap':
          resolve(Object.assign(JSON.parse(JSON.stringify(DEMO_SRC)), { role: 'admin' }));
          break;
        case 'checkin': {
          const a = DEMO_SRC.attendants.find(x => x.id === p.id);
          if (!a) throw apiError('not_found');
          a.checkedIn = p.value !== false;
          resolve({ ok: true });
          break;
        }
        case 'assign': {
          let slot = null;
          DEMO_SRC.positions.forEach(x => x.slots.forEach(s => { if (s.row === p.row) slot = s; }));
          if (!slot) throw apiError('not_a_shift');
          if ((slot.id || '') !== (p.expectedId || '')) throw apiError('conflict');
          slot.id = p.newId || '';
          let team = '';
          const a = DEMO_SRC.attendants.find(x => x.id === p.newId);
          if (a && p.setTeam && isReserve(a.team)) { a.team = p.setTeam; team = p.setTeam; }
          resolve({ ok: true, team: team });
          break;
        }
        case 'requestHelp': {
          DEMO_SRC.requests = DEMO_SRC.requests || [];
          if (DEMO_SRC.requests.some(r => r.row === p.row && (r.status === 'open' || r.status === 'offered'))) throw apiError('already_requested');
          DEMO_SRC.requests.push({ id: 'r' + Date.now(), row: p.row, status: 'open', offerId: '' });
          resolve({ ok: true });
          break;
        }
        case 'offerHelp': {
          const r = (DEMO_SRC.requests || []).find(x => x.id === p.reqId);
          if (!r) throw apiError('request_not_found');
          if (!p.by) throw apiError('identify_first');
          if (r.status !== 'open') throw apiError('already_offered');
          r.status = 'offered'; r.offerId = p.by;
          resolve({ ok: true });
          break;
        }
        case 'confirmHelp': {
          const r = (DEMO_SRC.requests || []).find(x => x.id === p.reqId);
          if (!r || r.status !== 'offered') throw apiError('request_not_offered');
          DEMO_SRC.positions.forEach(x => x.slots.forEach(s => { if (s.row === r.row) s.id = r.offerId; }));
          r.status = 'done';
          resolve({ ok: true });
          break;
        }
        case 'declineHelp': {
          const r = (DEMO_SRC.requests || []).find(x => x.id === p.reqId);
          if (r) { r.status = 'open'; r.offerId = ''; }
          resolve({ ok: true });
          break;
        }
        case 'cancelHelp': {
          const r = (DEMO_SRC.requests || []).find(x => x.id === p.reqId);
          if (r) r.status = 'cancelled';
          resolve({ ok: true });
          break;
        }
        case 'countStart':
          if (DEMO_SRC.countSession && DEMO_SRC.countSession.status === 'open') throw apiError('count_open');
          DEMO_SRC.countSession = { id: 'c' + Date.now(), label: p.label, at: p.at, status: 'open', started: tzNow().date + 'T' + p.at };
          DEMO_SRC.counts = [];
          resolve({ ok: true });
          break;
        case 'countSubmit': {
          if (!DEMO_SRC.countSession || DEMO_SRC.countSession.status !== 'open') throw apiError('count_closed');
          DEMO_SRC.counts = (DEMO_SRC.counts || []).filter(x => x.row !== p.row).concat([{ row: p.row, count: p.count }]);
          resolve({ ok: true });
          break;
        }
        case 'countEnd':
          if (!DEMO_SRC.countSession || DEMO_SRC.countSession.status !== 'open') throw apiError('count_closed');
          DEMO_SRC.countSession.status = 'closed';
          DEMO_SRC.countDay = (DEMO_SRC.countDay || []).filter(x => x.session.label !== DEMO_SRC.countSession.label)
            .concat([{ session: Object.assign({}, DEMO_SRC.countSession), counts: (DEMO_SRC.counts || []).slice() }]);
          resolve({ ok: true });
          break;
        case 'setContacts':
          DEMO_SRC.contacts = {};
          ['overseer', 'assistant', 'firstaid'].forEach(k => { if (p[k]) DEMO_SRC.contacts[k] = p[k]; });
          resolve({ ok: true, contacts: DEMO_SRC.contacts });
          break;
        case 'setCountTimes':
          if (p.morning) DEMO_SRC.counting.morning = p.morning;
          if (p.afternoon) DEMO_SRC.counting.afternoon = p.afternoon;
          resolve({ ok: true, counting: DEMO_SRC.counting });
          break;
        case 'resetCheckins': {
          let n = 0;
          DEMO_SRC.attendants.forEach(a => { if (a.checkedIn) { a.checkedIn = false; n++; } });
          resolve({ ok: true, count: n });
          break;
        }
        case 'setEventDate':
          if (!/^\d{4}-\d{2}-\d{2}$/.test(p.date || '')) throw apiError('bad_date');
          DEMO_SRC.event.date = p.date;
          resolve({ ok: true, date: p.date });
          break;
        case 'adminStatus':
          resolve({ ok: true, pins: Object.assign({}, DEMO_PINS) });
          break;
        case 'setPin':
          if (p.newPin && (p.newPin.length < 4 || (p.target === 'admin' && p.newPin.length < 6))) throw apiError('too_short');
          DEMO_PINS[p.target] = !!p.newPin;
          resolve({ ok: true, pins: Object.assign({}, DEMO_PINS) });
          break;
        default:
          throw apiError('unknown_action');
      }
    } catch (err) {
      reject(err);
    }
  }, 200));
}

function demoData() {
  const today = tzNow('Europe/Berlin').date;
  const first = ['John', 'Samuel', 'David', 'Daniel', 'Michael', 'Peter', 'Thomas', 'Andrew'];
  const last = ['Adams', 'Baker', 'Clarke', 'Davies', 'Evans', 'Fischer', 'Green', 'Hughes', 'Ibrahim',
    'Johnson', 'Kowalski', 'Lee', 'Mensah', 'Novak', 'Owusu', 'Peters', 'Quinn', 'Richter', 'Silva',
    'Turner', 'Usman', 'Vogel', 'Walker', 'Young', 'Zimmer', 'Bauer', 'Okafor', 'Rossi', 'Keller', 'Wagner',
    'Hoffmann', 'Schmidt'];
  const teamsPlan = [['AUDITORIUM', 15], ['LOBBY', 6], ['WELCOME', 3], ['CAFETERIA', 6], ['STAGE', 2], ['Unassigned', 3]];

  const attendants = [];
  const pools = {};
  let n = 0;
  teamsPlan.forEach(([team, count]) => {
    pools[team] = [];
    for (let i = 0; i < count; i++) {
      const id = String(101 + n);
      attendants.push({ id, name: last[n % last.length] + ', ' + first[(n * 3) % first.length], team, checkedIn: n % 4 !== 0, row: n + 2 });
      pools[team].push(id);
      n++;
    }
  });

  const times = ['07:30 - 09:00', '09:00 - 10:30', '10:30 - 12:00', '12:00 - 13:30', '13:30 - 15:00', '15:00 - 16:30'];
  const plan = [
    ['Auditorium', '1 - Block A', 'AUDITORIUM'], ['Auditorium', '2 - Block A', 'AUDITORIUM'],
    ['Auditorium', '3 - Block B', 'AUDITORIUM'], ['Auditorium', '4 - Block C', 'AUDITORIUM'],
    ['Main Entrance / Lobby', 'Lobby 10', 'LOBBY'], ['Auditorium', '30 - Block J', 'LOBBY'],
    ['Welcome', 'Welcome 20', 'WELCOME', 3],
    ['Cafeteria', 'Cafeteria 33', 'CAFETERIA'], ['Cafeteria', 'Cafeteria 34', 'CAFETERIA'],
    ['Balcony', '42 - Balcony', 'AUDITORIUM']
  ];

  const counters = {};
  const positions = [];
  let row = 3;

  positions.push({
    key: 'Main Entrance / Lobby||TEAM CAPTAIN', area: 'Main Entrance / Lobby', label: 'TEAM CAPTAIN', no: 'TC', type: 'tc', row: 2,
    slots: [{ start: null, end: null, allDay: true, raw: '', id: pools.LOBBY[0], remark: 'counting Lobby / Block J', row: 2 }]
  });

  plan.forEach(([area, label, team, limit]) => {
    const pool = pools[team];
    counters[team] = counters[team] || 0;
    const slots = times.slice(0, limit || times.length).map(t => {
      const k = counters[team]++;
      const id = pool[(k + Math.floor(k / pool.length)) % pool.length];
      const [start, end] = t.split(' - ');
      return { start, end, allDay: false, raw: t, id, remark: '', row: row++ };
    });
    positions.push({ key: area + '||' + label, area, label, no: (label.match(/\d+/) || ['?'])[0], type: 'position', row: slots[0].row, slots });
    row++;
  });

  positions[9].slots[5].id = '';
  positions[1].slots[0].remark = 'Doors open at 07:30';

  positions.push({
    key: 'Stage||Team Captain', area: 'Stage', label: 'Team Captain', no: 'TC', type: 'tc', row: row,
    slots: pools.STAGE.map((id, i) => ({ start: null, end: null, allDay: true, raw: '', id, remark: i ? 'Backup' : '', row: row + i }))
  });

  return {
    ok: true,
    version: 'demo',
    generatedAt: new Date().toISOString(),
    event: { date: today, timeZone: 'Europe/Berlin', soonMinutes: 15 },
    counting: { morning: '10:15', afternoon: '14:30' },
    areas: ['Main Entrance / Lobby', 'Auditorium', 'Welcome', 'Cafeteria', 'Balcony', 'Stage'],
    attendants,
    positions
  };
}

(function start() {
  applyTheme(store.get(KEY.theme) || 'auto');
  store.del('aa-cache-v1'); // alte, ungeschützte Zwischenablage entfernen
  const h = location.hash.slice(1);
  if (TABS.indexOf(h) >= 0) S.tab = h;

  if (S.pin && !DEMO) {
    const cached = readCache();
    if (cached) {
      D = indexData(cached.data);
      S.role = cached.data.role || null;
      S.loadedAt = cached.at;
    }
  }
  render();
  if (S.pin) load(false);
})();
</script>
