<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" id="themeLight">
  <meta name="theme-color" content="#15181c" media="(prefers-color-scheme: dark)" id="themeDark">

  <!-- Icons + Manifest -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="manifest" href="site.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Attendant Assignments">
  <meta name="application-name" content="Attendant Assignments">

  <!-- Link-Vorschau -->
  <meta name="description" content="Shift schedule, positions and Check-in during an Assembly Day">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Attendant Assignments">
  <meta property="og:description" content="Shift schedule, positions and Check-in during an Assembly Day">
  <meta property="og:url" content="https://kaffeetrinker80.github.io/theocratic/attendant-assignments/">
  <meta property="og:image" content="https://kaffeetrinker80.github.io/theocratic/attendant-assignments/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>Attendant Assignments</title>
  <script>
    try {
      var t = localStorage.getItem('aa-theme-v1');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>

  <style>
    :root {
      color-scheme: light;
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #202124;
      --muted: #6b7280;
      --border: #e1e4e8;
      --chip: #eef1f4;
      --accent: #315f7d;
      --accent-soft: #edf4f8;
      --accent-border: #b8cbd7;
      --on: #39734a;
      --on-soft: #edf7ef;
      --on-border: #b8d9bf;
      --soon: #a85a0c;
      --soon-soft: #fdf0e2;
      --soon-border: #f0cfa6;
      --done: #8a8f98;
      --warn-soft: #fff7e0;
      --warn-border: #ecd9a0;
      --tabbar: rgba(255, 255, 255, .92);
      --danger: #b3261e;
      --danger-soft: #fbeceb;
      --danger-border: #efc2be;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #15181c;
      --card: #1e2227;
      --text: #e8eaed;
      --muted: #9aa3ad;
      --border: #2e343b;
      --chip: #2a2f35;
      --accent: #8cb8d6;
      --accent-soft: #22303a;
      --accent-border: #3b5566;
      --on: #7fc497;
      --on-soft: #1b2b21;
      --on-border: #2f5a3d;
      --soon: #f0a860;
      --soon-soft: #33271a;
      --soon-border: #5e4526;
      --done: #6f7780;
      --warn-soft: #2f2a1a;
      --warn-border: #5a4d26;
      --tabbar: rgba(30, 34, 39, .94);
      --danger: #f2b8b5;
      --danger-soft: #3a2120;
      --danger-border: #6a3532;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #15181c;
        --card: #1e2227;
        --text: #e8eaed;
        --muted: #9aa3ad;
        --border: #2e343b;
        --chip: #2a2f35;
        --accent: #8cb8d6;
        --accent-soft: #22303a;
        --accent-border: #3b5566;
        --on: #7fc497;
        --on-soft: #1b2b21;
        --on-border: #2f5a3d;
        --soon: #f0a860;
        --soon-soft: #33271a;
        --soon-border: #5e4526;
        --done: #6f7780;
        --warn-soft: #2f2a1a;
        --warn-border: #5a4d26;
        --tabbar: rgba(30, 34, 39, .94);
        --danger: #f2b8b5;
        --danger-soft: #3a2120;
        --danger-border: #6a3532;
      }
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
    }

    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    .wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: 0 16px; }

    /* HEADER */

    .top {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
      padding-top: env(safe-area-inset-top, 0px);
      border-bottom: 1px solid transparent;
    }
    .top.scrolled { border-bottom-color: var(--border); }

    .top-in {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-top: 14px;
      padding-bottom: 12px;
    }

    .brand { flex: 1; min-width: 0; }
    .brand-mark { display: block; flex: 0 0 auto; height: 34px; width: auto; border-radius: 8px; }
    .d-short { display: none; }
    @media (max-width: 479px) {
      .d-long { display: none; }
      .d-short { display: inline; }
      .top-in { gap: 10px; }
      .top-actions { gap: 6px; }
      .icon-btn { width: 38px; height: 38px; border-radius: 11px; }
      .brand h1 { font-size: 16px; letter-spacing: -.015em; }
      .brand-mark { height: 30px; border-radius: 7px; }
    }
    @media (min-width: 620px) {
      .brand-mark { height: 40px; border-radius: 10px; }
      .brand h1 { font-size: 21px; }
    }
    .lock-logo { display: block; width: 100%; max-width: 300px; margin: 0 auto 10px; border-radius: 22px; box-shadow: 0 8px 28px rgba(19, 75, 157, .28); }

    .brand h1 {
      margin: 0;
      font-size: 17px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.15;
      letter-spacing: -.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .version {
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--chip);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .event-line { margin-top: 2px; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .event-line strong { color: var(--text); font-weight: 650; }

    .icon-btn {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      color: var(--accent);
    }
    .icon-btn svg { width: 20px; height: 20px; }
    .icon-btn.busy svg { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    svg.i { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* BANNER */

    .banner { display: grid; gap: 8px; margin: 4px 0 14px; }
    .banner:empty { display: none; }
    .note {
      padding: 10px 13px;
      border-radius: 12px;
      background: var(--warn-soft);
      border: 1px solid var(--warn-border);
      font-size: 13px;
      line-height: 1.4;
    }

    /* GENERIC */

    .h3 { margin: 26px 2px 10px; color: var(--muted); font-size: 14px; font-weight: 700; }
    .empty { padding: 34px 12px; color: var(--muted); text-align: center; line-height: 1.5; }
    .empty strong { display: block; color: var(--text); font-size: 17px; margin-bottom: 4px; }
    .btn {
      min-height: 46px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      font-weight: 650;
    }
    .btn.primary { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); }
    .btn.block { width: 100%; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }

    /* SEARCH */

    .search { margin: 2px 0 14px; }
    .search input {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
      font-size: 17px;
      outline: none;
    }
    .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    .results { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .result {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 62px;
      padding: 12px 16px;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: none;
      text-align: left;
    }
    .result:last-child { border-bottom: 0; }
    .result:active { background: var(--accent-soft); }
    .result-name { display: block; font-size: 16px; font-weight: 650; }
    .result-sub { display: block; margin-top: 2px; color: var(--muted); font-size: 14px; }

    /* PERSON */

    .person-head { display: flex; align-items: flex-start; gap: 12px; margin: 4px 2px 12px; }
    .person-head h2 { margin: 0 0 4px; font-size: 20px; line-height: 1.2; letter-spacing: -.01em; }
    .team-line { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 14px; }
    .person-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; color: var(--muted); font-size: 14px; }
    .person-meta .linkish { padding: 2px 0; font-size: 14px; }
    .person-meta .checked { margin-left: 0; padding: 2px 9px; font-size: 12px; }
    .checked { margin-left: auto; padding: 5px 10px; border-radius: 999px; background: var(--on-soft); color: var(--on); font-size: 13px; font-weight: 700; white-space: nowrap; }

    /* The one bold element: the live status of a person */
    .hero {
      position: relative;
      padding: 14px 16px 14px 20px;
      border-radius: 18px;
      background: var(--card);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .hero::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--accent); }
    .hero-label { color: var(--muted); font-size: 14px; font-weight: 600; }
    .hero-big { margin: 2px 0 4px; font-size: 34px; line-height: 1.05; font-weight: 800; letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
    .hero-pos { font-size: 18px; font-weight: 700; }
    .hero-sub { margin-top: 2px; color: var(--muted); font-size: 15px; }
    .hero.k-on { background: var(--on-soft); border-color: var(--on-border); }
    .hero.k-on::before { background: var(--on); }
    .hero.k-on .hero-big { color: var(--on); }
    .hero.k-soon { background: var(--soon-soft); border-color: var(--soon-border); }
    .hero.k-soon::before { background: var(--soon); }
    .hero.k-soon .hero-big { color: var(--soon); }
    .hero.k-done::before, .hero.k-none::before { background: var(--done); }
    .hero.k-done .hero-big, .hero.k-none .hero-big { color: var(--done); font-size: 30px; }

    .me-row { display: flex; gap: 10px; margin-top: 12px; }
    .me-row .btn { flex: 1; }
    .me-saved { flex: 1; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
    .linkish { border: 0; background: none; color: var(--accent); font-weight: 650; padding: 10px 4px; }

    .slot {
      display: block;
      width: 100%;
      margin-bottom: 8px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
      text-align: left;
    }
    .slot:active { background: var(--accent-soft); }
    .slot-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .slot-time { font-size: 16px; font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .slot-pos { font-size: 15px; font-weight: 650; text-align: right; }
    .slot-area { margin-top: 1px; color: var(--muted); font-size: 13px; }
    .slot-remark { margin-top: 3px; color: var(--muted); font-size: 12px; font-style: italic; }
    .slot.now { background: var(--on-soft); border-color: var(--on-border); }
    .slot.past { opacity: .55; }

    .tag { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; vertical-align: 2px; }
    .tag.now { background: var(--on); color: var(--card); }
    .tag.sel { background: var(--accent); color: var(--card); }
    .tag.open { background: var(--soon-soft); color: var(--soon); border: 1px solid var(--soon-border); }

    /* POSITIONS */

    .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 0 14px; }
    .chip {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 0 15px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--card);
      font-weight: 650;
    }
    .chip.active { background: var(--accent); border-color: var(--accent); color: var(--card); }
    .chips.sub { margin-top: -4px; padding-bottom: 12px; }
    .chips.sub .chip { min-height: 36px; padding: 0 13px; font-size: 14px; background: var(--chip); border-color: transparent; }
    .chips.sub .chip.active { background: var(--text); color: var(--bg); }
    .block-head { margin: 18px 2px 8px; font-size: 15px; font-weight: 800; letter-spacing: .01em; }
    .block-head span { margin-left: 6px; color: var(--muted); font-weight: 600; font-size: 13px; }

    .pos-card {
      margin-bottom: 10px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      overflow: hidden;
    }
    .pos-card.tc { background: var(--accent-soft); border-color: var(--accent-border); }
    .pos-head {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 11px 14px 0;
      border: 0;
      background: none;
      text-align: left;
    }
    .pos-title { flex: 1; min-width: 0; font-size: 16px; font-weight: 750; }
    .pos-chev { flex: 0 0 auto; color: var(--muted); font-size: 13px; font-weight: 650; white-space: nowrap; }
    .pos-card .duo { margin: 8px 14px 12px; }
    .pos-card .single { margin: 8px 14px 12px; }
    .pos-list { margin: 0 14px 12px; border-top: 1px solid var(--border); padding-top: 8px; }
    .pos-line { display: flex; align-items: baseline; gap: 10px; width: 100%; padding: 6px 2px; border: 0; background: none; text-align: left; font-size: 14px; }
    .pos-line.now { color: var(--on); font-weight: 750; }
    .pos-line.past { opacity: .5; }
    .pos-line .t { flex: 0 0 96px; font-variant-numeric: tabular-nums; }
    .pos-line .n { flex: 1; min-width: 0; font-weight: 650; }
    .pos-line .n.open { color: var(--soon); }
    .pos-more { display: block; width: 100%; margin-top: 6px; padding: 9px; border: 1px solid var(--accent-border); border-radius: 10px; background: var(--card); color: var(--accent); font-weight: 650; font-size: 14px; }
    .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .duo > div, .single { padding: 8px 11px; border-radius: 11px; background: var(--chip); min-width: 0; }
    .single.now { background: var(--on-soft); }
    .single.now .duo-label { color: var(--on); }
    .single .duo-name + .duo-name { margin-top: 4px; }
    .duo > div.now { background: var(--on-soft); }
    .duo-label { color: var(--muted); font-size: 12px; font-weight: 650; }
    .duo > div.now .duo-label { color: var(--on); }
    .duo-name { margin-top: 2px; font-weight: 700; overflow-wrap: anywhere; }
    .duo-time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

    /* TEAMS */

    .team-block { margin-bottom: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; }
    .team-head { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--border); border-left: 6px solid var(--team, var(--done)); }
    .team-name { flex: 1; font-size: 17px; font-weight: 750; }
    .team-count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
    .member {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 56px;
      padding: 10px 16px;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: none;
      text-align: left;
    }
    .member:last-child { border-bottom: 0; }
    .member:active { background: var(--accent-soft); }
    .member-main { flex: 1; min-width: 0; }
    .member-name { display: block; font-weight: 650; }
    .member-status { display: block; margin-top: 1px; color: var(--muted); font-size: 13px; }
    .member-status.k-on { color: var(--on); font-weight: 650; }
    .member-status.k-soon { color: var(--soon); font-weight: 650; }
    .member-status.k-done { color: var(--done); }
    .tick { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; background: var(--on-soft); color: var(--on); font-weight: 800; font-size: 14px; }
    .tick.no { background: var(--chip); color: transparent; }

    /* MAPS */

    .maps { display: grid; gap: 12px; }
    .map { overflow: hidden; background: var(--card); border: 1px solid var(--border); border-radius: 18px; }
    .map button { display: block; width: 100%; padding: 0; border: 0; background: var(--chip); }
    .map img { display: block; width: 100%; height: 190px; object-fit: cover; }
    .map.no-img img { display: none; }
    .map.no-img button::after { content: "Map image not found"; display: block; padding: 40px 10px; color: var(--muted); font-size: 14px; }
    .map-info { padding: 13px 16px 15px; }
    .map-title { font-size: 17px; font-weight: 750; }
    .map-text { margin-top: 2px; color: var(--muted); font-size: 14px; line-height: 1.4; }

    /* POSITION PANEL */

    .panel {
      position: fixed;
      inset: 0;
      z-index: 40;
      overflow-y: auto;
      background: var(--bg);
      transform: translateX(100%);
      transition: transform .22s ease;
      visibility: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: calc(30px + env(safe-area-inset-bottom, 0px));
    }
    .panel.open { transform: none; visibility: visible; }
    .panel-bar { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 12px 0; }
    .panel h2 { margin: 6px 2px 2px; font-size: 27px; letter-spacing: -.01em; }
    .panel .sub { margin: 0 2px 16px; color: var(--muted); }
    .now-box { margin-bottom: 14px; padding: 15px; border-radius: 16px; background: var(--on-soft); border: 1px solid var(--on-border); }
    .now-box .duo-label { color: var(--on); }
    .now-name { margin-top: 2px; font-size: 19px; font-weight: 750; }
    .trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
    .trio > div { padding: 11px; border-radius: 13px; background: var(--card); border: 1px solid var(--border); min-width: 0; }
    .trio > div.sel { background: var(--accent-soft); border-color: var(--accent-border); }
    .trio .duo-name { font-size: 14px; }
    .map-inline { margin: 10px 0 4px; }
    .map-inline img { display: block; width: 100%; border-radius: 14px; border: 1px solid var(--border); cursor: zoom-in; }

    .rot {
      display: flex;
      align-items: stretch;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
      overflow: hidden;
    }
    .rot-main {
      flex: 1;
      min-width: 0;
      display: grid;
      grid-template-columns: 108px 1fr;
      gap: 12px;
      align-items: center;
      padding: 13px 14px;
      border: 0;
      background: none;
      text-align: left;
    }
    .rot.now { background: var(--on-soft); border-color: var(--on-border); }
    .rot.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .rot.past { opacity: .55; }
    .rot-time { font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .rot-name { font-weight: 650; }
    .rot-name.open { color: var(--soon); }
    .rot-name.noshift, .pos-line .n.noshift { color: var(--muted); font-style: italic; font-weight: 600; }
    .rot-remark { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .rot-edit {
      flex: 0 0 auto;
      margin: 8px 8px 8px 0;
      padding: 0 12px;
      border: 1px solid var(--accent-border);
      border-radius: 10px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 14px;
      font-weight: 650;
    }

    /* IMAGE OVERLAY */

    .overlay { display: none; position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .9); align-items: center; justify-content: center; padding: 14px; }
    .overlay.open { display: flex; }
    .overlay img { max-width: 100%; max-height: 92vh; object-fit: contain; }
    .overlay-close {
      position: absolute;
      top: calc(14px + env(safe-area-inset-top, 0px));
      right: 14px;
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      color: #222;
      font-size: 26px;
      font-weight: 700;
      line-height: 1;
    }

    /* TAB BAR */

    .tabbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: var(--tabbar);

    .tabbar-in { display: grid; grid-template-columns: repeat(var(--tabs, 4), 1fr); max-width: 760px; margin: 0 auto; }
    .tab {
      position: relative;

      align-items: center;
      gap: 3px;
      min-height: 64px;
      padding: 8px 2px 8px;

      color: var(--muted);

    }

      display: grid;

    .tab.active svg { stroke-width: 2.2; }
    .tab.active::before {
      content: "";
      position: absolute;
      top: -1px;
      left: 22%;
      right: 22%;
      height: 3px;
      border-radius: 0 0 3px 3px;
      background: var(--accent);
    }

    /* FOOTER */

    .footer { margin: 34px 2px 10px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; line-height: 1.6; }

    @media (min-width: 620px) {
      .wrap { padding: 0 24px; }
      .maps { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .map img { height: 160px; }
      .hero-big { font-size: 46px; }

    /* DESKTOP / LAPTOP */

    .pos-flow { display: block; }
    .block-head:first-child { margin-top: 4px; }

        top: 0;
        right: auto;
        bottom: 0;
        width: 216px;

      }

      .top-in { padding-top: 20px; padding-bottom: 16px; }
      .brand h1 { font-size: 24px; }

      .pos-flow { columns: 320px 4; column-gap: 16px; }
      .pos-sec { margin-bottom: 6px; }
      .pos-sec.blocked { break-inside: avoid; }
      .pos-card { break-inside: avoid; }
      .block-head { margin-top: 10px; break-after: avoid; }

    }

    @media (prefers-reduced-motion: reduce) {
      .panel { transition: none; }
      .icon-btn.busy svg { animation: none; }
    }
  
    /* ACCESS / LOCK */

    body.locked .tabbar, body.locked .top-actions, body.locked .em-fab { display: none; }
    body.locked { padding-bottom: 24px; }
    .top-actions { display: flex; gap: 8px; }
    .lock { max-width: 380px; margin: 36px auto 0; text-align: center; }
    .lock-icon { font-size: 34px; }
    .lock h2 { margin: 8px 0 6px; font-size: 24px; }
    .lock input:not([type="checkbox"]), .field {

    body.locked .brand-mark { display: none; }
    .show-code { display: inline-flex; align-items: center; gap: 8px; margin: 12px 0 16px; color: var(--muted); font-size: 14px; }
    .lock-error { min-height: 1.4em; margin-top: 12px; color: var(--danger); font-size: 14px; line-height: 1.4; }
    .muted { color: var(--muted); font-size: 14px; line-height: 1.45; }
    .intro h2 { margin: 6px 2px 4px; font-size: 24px; }

    .role-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 700; }
    .form-card { margin-bottom: 12px; padding: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; }
    .form-card p { margin: 6px 0 0; }
    .form-row { display: flex; gap: 8px; margin-top: 12px; }

      flex: 1;

    .code-state { font-size: 13px; font-weight: 700; }
    .code-state.set { color: var(--on); }
    .code-state.unset { color: var(--muted); }
    .btn.danger { background: var(--danger-soft); border-color: var(--danger-border); color: var(--danger); }
    .btn[disabled] { opacity: .6; }
    .chip .dot { margin-right: 6px; }
    .chip-count { margin-left: 4px; opacity: .7; font-weight: 600; }

    /* CHECK-IN */

    .ci-summary { margin-bottom: 14px; padding: 16px 18px; background: var(--card); border: 1px solid var(--border); border-radius: 18px; }
    .ci-big { font-size: 34px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .ci-big span { color: var(--muted); font-size: 18px; font-weight: 650; letter-spacing: 0; }
    .bar { height: 8px; margin-top: 10px; border-radius: 999px; background: var(--chip); overflow: hidden; }
    .bar span { display: block; height: 100%; background: var(--on); border-radius: 999px; }
    .seg { display: inline-flex; margin-bottom: 12px; padding: 3px; border-radius: 12px; background: var(--chip); }
    .seg button { min-height: 38px; padding: 0 16px; border: 0; border-radius: 10px; background: none; color: var(--muted); font-weight: 650; }
    .seg button.active { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
    .ci-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 16px; border-bottom: 1px solid var(--border); }
    .ci-row:last-child { border-bottom: 0; }

    .ci-main .dot { width: 8px; height: 8px; margin-right: 4px; }
    .ci-btn {
      flex: 0 0 auto;
      min-width: 108px;
      min-height: 48px;
      border: 1px solid var(--accent-border);

    .check-line { display: flex; align-items: flex-start; gap: 10px; margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); border: 1px solid var(--accent-border); font-size: 15px; font-weight: 600; }

    .guest-box { margin-top: 26px; padding: 16px; border: 1px dashed var(--border); border-radius: 16px; }
    .guest-box p { margin: 4px 0 12px; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .stat { padding: 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); min-width: 0; }
    .stat-big { font-size: 26px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .stat-big span { color: var(--muted); font-size: 15px; font-weight: 650; }
    .stat-label { margin-top: 2px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .stat.on { background: var(--on-soft); border-color: var(--on-border); }
    .stat.on .stat-big { color: var(--on); }
    .stat.soon .stat-big { color: var(--soon); }

    .map-print {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 7px 12px;
      border: 1px solid var(--accent-border);
      border-radius: 10px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 14px;
      font-weight: 650;
    }
    .map-print svg { width: 17px; height: 17px; }
    #printArea { display: none; }

    /* Druck: genau eine Seite A4 quer – Überschrift + Plan */
    @page { size: A4 landscape; margin: 10mm; }
    @media print {
      html, body {
        height: auto !important;
        min-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
      }
      body > *:not(#printArea) { display: none !important; }
      #printArea {
        display: block !important;
        color: #000;
        font-family: inherit;
        break-inside: avoid;
        page-break-inside: avoid;
        page-break-after: avoid;
      }
      #printArea h1 { margin: 0 0 2mm; font-size: 16pt; line-height: 1.2; }
      #printArea p { margin: 0 0 4mm; font-size: 9pt; color: #444; }
      /* A4 quer: 190 mm nutzbare Höhe – abzüglich Überschrift bleiben ~165 mm für den Plan */
      #printArea img {
        display: block;
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 162mm;
        margin: 0 auto;
        object-fit: contain;
      }
    }

    .help-box { margin: 0 0 16px; padding: 12px 14px; border-radius: 16px; background: var(--soon-soft); border: 1px solid var(--soon-border); }

    .help-btns .btn { flex: 1; min-height: 42px; }

    .tag.from { background: var(--chip); color: var(--muted); border: 1px solid var(--border); font-weight: 650; }
    .tab-ico { position: relative; }
    .tab-dot { position: absolute; top: 1px; right: 12px; width: 10px; height: 10px; border-radius: 50%; background: var(--soon); border: 2px solid var(--card); }

    .count-card { margin-top: 10px; padding: 11px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); }
    .count-card.soon { background: var(--soon-soft); border-color: var(--soon-border); }
    .count-card.now { background: var(--on-soft); border-color: var(--on-border); }

    .cnt-box, .cnt-admin { margin: 0 0 16px; padding: 12px 14px; border-radius: 16px; background: var(--on-soft); border: 1px solid var(--on-border); }

    .icon-btn[hidden] { display: none; }
    /* HEADER (Handy): Titel oben über die volle Breite, Datum + Symbole in der zweiten Zeile */
    @media (max-width: 619px) {
      .top-in {
        display: grid;
        grid-template-columns: auto 1fr auto;
        grid-template-areas: "logo title title" "logo date actions";
        align-items: center;

    /* EMERGENCY */
    .em-fab {
      position: fixed;
      right: 14px;
      bottom: calc(80px + env(safe-area-inset-bottom, 0px));
      z-index: 35;
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: #c62828;
      color: #fff;
      box-shadow: 0 6px 18px rgba(198, 40, 40, .35);
    }

    body { padding-bottom: calc(136px + env(safe-area-inset-bottom, 0px)); }
    .em-first { margin: 4px 0 14px; padding: 14px 16px; border-radius: 16px; background: #fff4e5; border: 1px solid #f3c98b; color: #3d2a06; font-size: 16px; font-weight: 700; line-height: 1.7; }

    .ap-W { background: #2e7d32; }
    .ap-E { background: #c62828; }
    .evac-card { margin-bottom: 8px; padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); }
    .evac-card.current { border-color: var(--on-border); background: var(--on-soft); }

    .evac-pos { font-weight: 750; }
    .evac-t { margin-top: 4px; font-size: 15px; line-height: 1.45; }

    .evac-plans .linkish { padding: 2px 0; }
    .em-report { padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); font-size: 15px; line-height: 1.7; }
    .em-case { margin-bottom: 8px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); }
    .em-case summary { padding: 12px 14px; font-weight: 750; cursor: pointer; list-style: none; }

    .evac-line { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 10px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); font-size: 14px; font-weight: 650; text-align: left; }

    @media (min-width: 1000px) {
      .em-fab { bottom: 28px; right: 28px; }
      body { padding-bottom: 0; }
    }

    /* MODAL + TOAST */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));

    .modal-box h3 { margin: 0 0 6px; font-size: 20px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(86px + env(safe-area-inset-bottom, 0px));

function esc(t) {
  return String(t == null ? '' : t).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function norm(t) {
  return String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function toMin(t) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || '').trim());
  return m ? Number(m[1]) * 60 + Number(m[2]) : null;
}

function fmtMin(m) {
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
}

const byName = (a, b) => a.name.localeCompare(b.name);

function nameMatch(name, q) {
  const words = norm(q).split(/[\s,]+/).filter(Boolean);
  if (!words.length) return false;
  const n = norm(name);
  return words.every(w => n.includes(w));
}

function applyTheme(theme) {
  const root = document.documentElement;
  if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
  else delete root.dataset.theme;
  const light = $('#themeLight'), dark = $('#themeDark');
  if (theme === 'light' || theme === 'dark') {
    const color = theme === 'dark' ? '#15181c' : '#f4f5f7';
    light.setAttribute('content', color); light.removeAttribute('media');
    dark.setAttribute('content', color); dark.removeAttribute('media');
  } else {
    light.setAttribute('content', '#f4f5f7'); light.setAttribute('media', '(prefers-color-scheme: light)');
    dark.setAttribute('content', '#15181c'); dark.setAttribute('media', '(prefers-color-scheme: dark)');
  }
}

function can(min) {

function tzNow(tz) {
  try {
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: tz || 'Europe/Berlin',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
    }).formatToParts(new Date());
    const g = type => parts.find(p => p.type === type).value;
    return {
      date: g('year') + '-' + g('month') + '-' + g('day'),
      min: (Number(g('hour')) % 24) * 60 + Number(g('minute'))
    };
  } catch (e) {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return { date: d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()), min: d.getHours() * 60 + d.getMinutes() };
  }
}

// Aktuelle Zeit in der Zeitzone der Tabelle.
// Testen: ?now=10:30  oder  ?now=2026-11-15T10:30
function clock() {
  const ev = (D && D.event) || {};
  let c = tzNow(ev.timeZone);
  if (NOW_PARAM) {
    const m = /^(?:(\d{4}-\d{2}-\d{2})[T ]?)?(\d{1,2}:\d{2})$/.exec(NOW_PARAM.trim());
    if (m) c = { date: m[1] || ev.date || c.date, min: toMin(m[2]) };
  }
  let mode = 'live';
  if (ev.date) {
    if (c.date < ev.date) mode = 'before';
    else if (c.date > ev.date) mode = 'after';
  }
  return { date: c.date, min: c.min, mode: mode, noDate: !ev.date };
}

function dayDiff(a, b) {
  const p = s => { const x = s.split('-').map(Number); return Date.UTC(x[0], x[1] - 1, x[2]); };
  return Math.round((p(b) - p(a)) / 86400000);
}

function fmtDate(iso, long) {
  const x = iso.split('-').map(Number);
  const opts = long
    ? { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }
    : { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' };
  return new Date(Date.UTC(x[0], x[1] - 1, x[2])).toLocaleDateString('en-GB', opts);
}

  return !s.id && !isNoShift(s);
}

function slotName(s) {
  if (s.id) return nameOf(s.id);
  return isNoShift(s) ? 'No shift' : 'Open';
}

function nameClass(s) {
  return s.id ? '' : (isNoShift(s) ? ' noshift' : ' open');
}

// Browser-Autofill (gespeicherte Logins anderer Tools auf derselben Domain) fernhalten:
// Suchfelder sind bis zur ersten Berührung schreibgeschützt, Passwort-Manager überspringen sie.
function guardSearch(input) {
  if (!input || input.dataset.guarded) return;
  input.dataset.guarded = '1';
  const unlock = () => { input.readOnly = false; };
  input.addEventListener('pointerdown', unlock);
  input.addEventListener('focus', unlock);
  input.addEventListener('keydown', unlock);
  // falls ein Browser trotzdem etwas einträgt: sofort wieder leeren
  const wipe = () => {
    if (/@/.test(input.value)) { input.value = ''; input.dispatchEvent(new Event('input')); }
  };
  setTimeout(wipe, 400);
  setTimeout(wipe, 1500);
}

// Namen enthalten nie ein @ – eine E-Mail-Adresse kommt nur vom Autofill
function cleanQuery(input) {
  if (/@/.test(input.value)) input.value = '';
  return input.value;
}

function timeText(s) {
  if (s.allDay) return 'All day';
  if (s.start && s.end && s.start !== s.end) return s.start + '–' + s.end;
  return s.start || s.raw || '—';
}

function mapFor(pos) {
  const label = norm(pos.label).replace(/\s+/g, ' ').trim();
  for (const k in MAP_OVERRIDES) {
    if (norm(k) === label) return MAPS.find(m => m.id === MAP_OVERRIDES[k]) || null;
  }
  const text = norm(pos.label + ' ' + pos.area);
  for (const id of MAP_KEYWORD_ORDER) {
    const m = MAPS.find(x => x.id === id);
    if (m && m.keywords.some(k => text.includes(k))) return m;
  }
  const n = Number((String(pos.label).match(/\d+/) || [])[0]);
  if (n) return MAPS.find(m => n >= m.from && n <= m.to) || null;
  return null;
}

function friendly(err) {
  const t = String(err && err.message || err);
  if (/Failed to fetch|NetworkError|Load failed/i.test(t)) return 'No connection to the schedule';
  return 'Something went wrong (' + t + ')';
}

function errorText(err) {
  const code = err && err.code;
  return code && ERR[code] ? ERR[code] : friendly(err);
}

function apiError(code) {
  const e = new Error(code);
  e.code = code;
  return e;
}

let toastTimer = null;
function toast(msg, kind) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (kind === 'error' ? ' error' : '');

  toastTimer = setTimeout(() => { t.className = 'toast'; }, 3200);
}

function indexData(src) {
  const d = {
    event: src.event || {},
    areas: Array.isArray(src.areas) ? src.areas.slice() : [],
    attendants: src.attendants || [],
    positions: src.positions || [],
    att: {},
    byId: {},
    counting: src.counting || {},
    countSession: src.countSession || null,
    countDay: src.countDay || [],
    contacts: src.contacts || {},
    countByRow: {},
    requests: (src.requests || []).filter(r => r.status === 'open' || r.status === 'offered'),
    reqByRow: {}
  };
  d.requests.forEach(r => { d.reqByRow[r.row] = r; });
  (src.counts || []).forEach(x => { d.countByRow[x.row] = x; });

  d.attendants.forEach(a => { d.att[a.id] = a; });

  d.positions.forEach(p => {
    if (!p.area) p.area = 'Other';
    if (!p.key) p.key = p.area + '||' + p.label;
    p.slots.forEach(s => {
      s.pos = p;
      s.s = toMin(s.start);
      s.e = toMin(s.end);
      if (s.e === null) s.e = s.s;
      if (s.id) (d.byId[s.id] = d.byId[s.id] || []).push(s);
    });
    if (d.areas.indexOf(p.area) < 0) d.areas.push(p.area);
  });

  const order = s => (s.allDay ? -1 : (s.s === null ? 9999 : s.s));
  Object.keys(d.byId).forEach(id => d.byId[id].sort((a, b) => order(a) - order(b)));
  d.areas = d.areas.filter(a => d.positions.some(p => p.area === a));
  return d;
}

// ---------- ZÄHLEN ----------
// Wer in Spalte E "counting …" stehen hat, bekommt die Zählzeiten angezeigt.
// Ganztags-Einteilung → beide Zeiten; Rotationsschicht → nur Zeiten innerhalb der Schicht.
const COUNT_LABEL = { morning: 'Morning', afternoon: 'Afternoon' };

function countReminders(id) {
  const jobs = (D.byId[id] || []).filter(s => /count/i.test(s.remark || ''));
  if (!jobs.length) return [];
  const out = [];
  ['morning', 'afternoon'].forEach(k => {
    const t = D.counting[k] || null;
    const m = toMin(t);
    const job = jobs.find(s => s.allDay || s.s === null || m === null || (s.s <= m && m < s.e));
    if (job) out.push({ key: k, label: COUNT_LABEL[k], time: t, m: m, what: job.remark });
  });
  return out;
}

function countState(r, c) {
  if (r.m === null) return { cls: '', text: 'time not set yet' };
  if (c.mode === 'after') return { cls: 'done', text: 'done' };
  if (c.mode === 'before') return { cls: '', text: '' };
  const d = r.m - c.min;
  if (d > 60) return { cls: '', text: 'in ' + Math.floor(d / 60) + ' h ' + (d % 60 ? (d % 60) + ' min' : '') };
  if (d > 15) return { cls: '', text: 'in ' + d + ' min' };
  if (d > 0) return { cls: 'soon', text: 'in ' + d + ' min – get ready' };
  if (d >= -15) return { cls: 'now', text: 'now – please count' };
  return { cls: 'done', text: 'done ✓' };
}

function countCardHtml(id, c) {
  const list = countReminders(id);
  if (!list.length) return '';
  const states = list.map(r => ({ r: r, st: countState(r, c) }));
  const top = states.some(x => x.st.cls === 'now') ? 'now' : (states.some(x => x.st.cls === 'soon') ? 'soon' : '');
  const what = Array.from(new Set(list.map(r => r.what))).join(' · ');
  return '<div class="count-card ' + top + '"><div class="count-head">🔢 Counting · <span>' + esc(what) + '</span></div>' +
    states.map(x =>
      '<div class="count-row ' + x.st.cls + '"><span class="count-label">' + x.r.label + '</span>' +
      '<span class="count-time">' + esc(x.r.time || '–') + '</span>' +
      '<span class="count-st">' + esc(x.st.text) + '</span></div>'
    ).join('') + '</div>';
}

// 5 Minuten vorher einmal vibrieren + Hinweis (nur am Kongresstag, nur einmal je Zeit)
function countAlerts() {
  if (!D || !S.pin || isGuest() || !myId()) return;
  const c = clock();
  if (c.mode !== 'live') return;
  let done = [];
  try { done = JSON.parse(store.get(KEY.countAlert) || '[]'); } catch (e) { done = []; }
  countReminders(myId()).forEach(r => {
    if (r.m === null) return;
    const d = r.m - c.min;
    const key = c.date + ':' + r.key;
    if (d <= 5 && d >= -2 && done.indexOf(key) < 0) {
      done.push(key);
      buzz([220, 110, 220, 110, 220]);
      toast('🔢 Counting ' + (d > 0 ? 'in ' + d + ' min' : 'now') + ' · ' + r.what);
    }
  });
  store.set(KEY.countAlert, JSON.stringify(done.slice(-10)));
}

function evacFor(pos) {

  const txt = norm(pos.label + ' ' + pos.area);

    if (/lobby|entrance/.test(txt)) return { ap: 'W', lead: true, t: 'Evacuation leader WEST: secure the routes, coordinate the direction and lead the assembly point WEST.' };
    if (/auditorium/.test(txt)) return { ap: 'E', lead: true, t: 'Evacuation leader EAST: secure the routes, coordinate the direction and lead the assembly point EAST.' };
    return { ap: '', t: 'Team captain: make sure your team follows their routes, then join the leader of your assembly point.' };
  }
  const n = Number(pos.no);
  const e = EVAC[n];
  if (!e) return null;
  return { ap: e.ap, t: e.t, map: e.map || (n === 42 || n === 43 || n === 44 ? '' : 'evac-eg') };

  const out = {};

function countOpen() {
  return !!(D && D.countSession && D.countSession.status === 'open');

// Zähl-Einteilungen für die laufende Zählung.
// Maßgeblich ist die eingestellte Zählzeit (Morning/Afternoon), nicht der Startzeitpunkt.
// Je Position: ganztags immer; sonst die Schicht, die die Zählzeit abdeckt,
// notfalls die nächstgelegene (bis 90 Min. Abstand).
function countJobsNow() {
  return countJobsFor(D.countSession);
}

function countJobsFor(sess) {
  if (!sess) return [];
  const ref = toMin(D.counting[sess.label]) !== null ? toMin(D.counting[sess.label]) : toMin(sess.at);
  const jobs = [];
  D.positions.forEach(p => {
    const cs = p.slots.filter(s => /count/i.test(s.remark || ''));
    if (!cs.length) return;
    cs.filter(s => s.allDay || s.s === null).forEach(s => jobs.push(s));
    const timed = cs.filter(s => !s.allDay && s.s !== null);
    if (!timed.length) return;
    if (ref === null) { timed.forEach(s => jobs.push(s)); return; }
    const cover = timed.filter(s => s.s <= ref && ref < s.e);
    if (cover.length) { cover.forEach(s => jobs.push(s)); return; }
    const dist = s => (ref < s.s ? s.s - ref : ref - s.e);
    const best = timed.slice().sort((a, b) => dist(a) - dist(b))[0];
    if (dist(best) <= 90) jobs.push(best);
  });
  return jobs;
}

function countTotal(jobs) {
  return jobs.reduce((n, s) => n + (D.countByRow[s.row] ? D.countByRow[s.row].count : 0), 0);
}

function countInput(s, label) {

    'data-row="' + s.row + '" value="' + esc(draft) + '" placeholder="' + (sent ? esc(sent.count) : 'Number') + '" aria-label="Count ' + esc(s.remark) + '">' +
    '<button class="btn primary" type="button" data-act="count-submit" data-row="' + s.row + '">' + (label || (sent ? 'Update' : 'Send')) + '</button></div>';
}

// Tagesübersicht: je Zählposition Vormittag | Nachmittag, Summen und Grand total
function countDayData() {
  const cols = ['morning', 'afternoon'].map(k => {
    const entry = D.countDay.find(x => x.session.label === k) || null;
    return { key: k, head: D.counting[k] || (entry ? entry.session.at : COUNT_LABEL[k]), entry: entry, total: 0 };
  });
  const rows = {};
  const order = [];
  const ensure = (key, name, sortRow) => {
    if (!rows[key]) { rows[key] = { name: name, sort: sortRow, vals: {} }; order.push(key); }
    return rows[key];
  };
  cols.forEach(col => {
    if (!col.entry) return;
    countJobsFor(col.entry.session).forEach(s => ensure(s.pos.key, s.remark, s.pos.row));
    col.entry.counts.forEach(x => {
      const s = findSlot(x.row);
      const r = ensure(s ? s.pos.key : 'row' + x.row, s ? s.remark : 'Row ' + x.row, s ? s.pos.row : 99999);
      r.vals[col.key] = x.count;
      col.total += x.count;
    });
  });
  order.sort((a, b) => rows[a].sort - rows[b].sort);
  return { cols: cols, rows: order.map(k => rows[k]), grand: cols.reduce((n, c) => n + c.total, 0) };
}

function countDayHtml() {
  const d = countDayData();

  return '<div class="cnt-table-wrap"><table class="cnt-table"><thead><tr><th></th>' +

function teamsMap() {

  D.attendants.forEach(a => {

    if (!t || t.toUpperCase() === 'N.A.') return;
    (g[t] = g[t] || []).push(a);
  });
  Object.keys(g).forEach(t => g[t].sort(byName));
  return g;
}

function findSlot(row) {
  for (const p of D.positions) {
    const s = p.slots.find(x => x.row === row);
    if (s) return s;
  }
  return null;
}

// Heimat-Team einer Position – unabhängig davon, wer gerade aushilft:
// 1. Teamname in der Positionsbezeichnung ("Lobby 10", "Cafeteria 33")
// 2. feste Regeln (GROUP_RULES, z. B. Block J → Lobby)
// 3. Teamname in der Sheet-Überschrift ("Auditorium", "Main Entrance / Lobby")
// 4. sonst: Team der meisten eingeteilten Brüder
function positionTeam(p) {
  if (p._team !== undefined) return p._team;
  const teams = {};
  D.attendants.forEach(a => {
    const t = String(a.team || '').trim();
    if (t && !isReserve(t)) teams[t.toUpperCase()] = t;
  });
  const findIn = text => {
    const n = norm(text);
    const hit = Object.keys(teams).find(T => new RegExp('\\b' + norm(T) + '\\b').test(n));
    return hit ? teams[hit] : null;
  };
  const rule = GROUP_RULES.find(r => r.match.test(p.label + ' ' + p.area));
  p._team = findIn(p.label) ||
    (rule ? (teams[rule.team.toUpperCase()] || rule.team) : null) ||
    findIn(p.area) ||
    majorityTeam(p);
  return p._team;
}

function majorityTeam(p) {
  const count = {};
  p.slots.forEach(s => {
    const a = s.id && D.att[s.id];
    if (a && a.team && !isReserve(a.team)) count[a.team] = (count[a.team] || 0) + 1;
  });
  let best = null;
  Object.keys(count).forEach(t => { if (!best || count[t] > count[best]) best = t; });
  return best;
}

function overlaps(id, slot) {
  if (slot.s === null) return [];
  return (D.byId[id] || []).filter(x => x !== slot && x.s !== null && x.s < slot.e && slot.s < x.e);
}

function isCaptain(id) {
  return (D.byId[id] || []).some(s => s.pos.type === 'tc');
}

    return c && c.data ? c : null;
  } catch (e) { return null; }
}

async function api(action, payload, pinOverride) {
  if (DEMO) return demoApi(action, payload || {});

  const body = JSON.stringify(Object.assign({ action: action, pin: pinOverride || S.pin }, payload || {}));
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: body,
    cache: 'no-store'
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (!json.ok) throw apiError(json.error || 'unknown');
  return json;
}

async function load(force) {
  if (!S.pin) { render(); return; }

  setBusy(true);
  try {
    const json = await api('bootstrap', { nocache: !!force });
    S.role = json.role || S.role;
    if (!DEMO) {
      store.set(KEY.pin, S.pin);
      store.set(KEY.cache, JSON.stringify({ at: Date.now(), data: json }));

    D = indexData(json);
    S.loadedAt = Date.now();
    S.error = null;
    S.lockError = '';
    notifyRequests();
    countAlerts();
    notifyCount();
  } catch (err) {
    if (err.code === 'unauthorized') {
      logout('This access code is not valid. Please enter the current code.');
    } else if (err.code === 'locked' && !D) {
      S.pin = null;
      S.lockError = ERR.locked;
    } else {
      S.error = errorText(err);
    }
  } finally {
    setBusy(false);
    render();
  }
}

// =====================================================
// STATUS LOGIC
// =====================================================

function personStatus(id, c) {
  const list = D.byId[id] || [];
  if (!list.length) return { kind: 'none' };

  const timed = list.filter(s => s.s !== null);
  const allDay = list.find(s => s.allDay);

  if (c.mode === 'after') return { kind: 'done' };

  if (c.mode === 'before') {
    if (timed[0]) return { kind: 'first', slot: timed[0] };
    if (allDay) return { kind: 'allday', slot: allDay };
    return { kind: 'none' };
  }

  const running = timed.find(s => s.s <= c.min && c.min < s.e);
  if (running) return { kind: 'on', slot: running };

  const next = timed.find(s => s.s > c.min);
  if (next) {
    const soon = next.s - c.min <= (D.event.soonMinutes || 15);
    return { kind: soon ? 'soon' : 'next', slot: next };
  }

  if (allDay) return { kind: 'allday', slot: allDay };
  return { kind: 'done' };
}

function statusLine(st) {
  const s = st.slot;
  switch (st.kind) {
    case 'on': return 'On duty at ' + s.pos.label + ' until ' + s.end;
    case 'soon': return 'Starts ' + s.start + ' at ' + s.pos.label;
    case 'next': return 'Next ' + s.start + ' at ' + s.pos.label;
    case 'first': return 'First shift ' + s.start + ' at ' + s.pos.label;
    case 'allday': return 'All day at ' + s.pos.label;
    case 'done': return 'Done for today';
    default: return 'No assignment';
  }
}

function slotState(s, c) {
  if (c.mode === 'after') return 'past';
  if (c.mode === 'before') return '';
  if (s.allDay) return 'now';
  if (s.s === null) return '';
  if (c.min >= s.e) return 'past';
  if (s.s <= c.min) return 'now';
  return '';
}

function positionNowNext(p, c) {
  const timed = p.slots.filter(s => s.s !== null).sort((a, b) => a.s - b.s);
  const allDay = p.slots.find(s => s.allDay) || null;

  if (c.mode === 'after') return { now: null, next: null };
  if (c.mode === 'before') return { now: null, next: timed[0] || allDay };

  return {
    now: timed.find(s => s.s <= c.min && c.min < s.e) || allDay,
    next: timed.find(s => s.s > c.min) || null
  };
}

  return '<div class="h3">Helping today · from other teams</div><section class="team-block helpers"><div class="members">' +

function teamBlock(team, members, c) {
  members = members.slice().sort((a, b) =>
    ((D.byId[a.id] || []).length ? 0 : 1) - ((D.byId[b.id] || []).length ? 0 : 1) || a.name.localeCompare(b.name));
  const inCount = members.filter(m => m.checkedIn).length;
  return '<section class="team-block" style="--team:' + teamColor(team) + '">' +
    '<div class="team-head"><span class="team-name">' + esc(team) + '</span>' +
    '<span class="team-count">' + inCount + ' of ' + members.length + ' checked in</span></div>' +
    '<div class="members">' + members.map(m => memberRow(m, c, false)).join('') + '</div></section>';
}

function resultsHtml(list, act) {
  return '<div class="results">' + list.map(a =>
    '<button class="result" type="button" data-act="' + act + '" data-id="' + esc(a.id) + '">' +
    '<span class="dot" style="background:' + teamColor(a.team) + '"></span>' +
    '<span><span class="result-name">' + esc(a.name) + '</span>' +
    '<span class="result-sub">' + esc(a.team || 'No team') + '</span></span></button>'
  ).join('') + '</div>';
}

function backBar() {
  return '<div class="panel-bar"><button class="btn" type="button" data-act="back">← Back</button></div>';
}

// =====================================================
// RENDER
// =====================================================

function render() {
  const locked = !S.pin;
  document.body.classList.toggle('locked', locked);

  renderHeader();
  renderBanner();
  renderFooter();
  renderTabbar();

  if (locked) { renderLock(); return; }

  if (!D) {
    main.dataset.view = 'loading';
    main.innerHTML = S.error
      ? '<div class="empty"><strong>' + esc(S.error) + '</strong>Check the connection and try again.<br><br>' +
        '<button class="btn primary" type="button" data-act="refresh">Try again</button></div>'
      : '<div class="empty">Loading the schedule…</div>';
    return;
  }

  const c = clock();
  if (S.tab === 'checkin' && !can('checkin')) S.tab = 'me';

  if (S.tab === 'me') renderMe(c);
  else if (S.tab === 'positions') renderPositions(c);
  else if (S.tab === 'teams') renderTeams(c);
  else if (S.tab === 'checkin') renderCheckin(c);
  else renderMaps();

  if (S.stack.length) renderPanel(c);
}

function renderHeader() {
  $('#findBtn').hidden = !(S.pin && D && can('checkin'));
  const line = $('#eventLine');
  if (!S.pin) { line.textContent = 'Please enter your access code'; return; }
  if (!D) { line.textContent = S.error ? 'Schedule not available' : 'Loading the schedule…'; return; }

  const c = clock();
  if (c.noDate) { line.textContent = 'No event date set'; return; }

  let rel = 'today';
  if (c.mode === 'after') rel = 'finished';
  else if (c.mode === 'before') {
    const n = dayDiff(c.date, D.event.date);
    rel = n === 1 ? 'tomorrow' : 'in ' + n + ' days';
  }
  line.innerHTML = '<strong><span class="d-long">' + esc(fmtDate(D.event.date, true)) + '</span>' +
    '<span class="d-short">' + esc(fmtDate(D.event.date)) + '</span></strong> · ' + esc(rel);
}

function renderBanner() {
  const notes = [];
  if (DEMO) notes.push(API_URL
    ? 'Demo data. Remove ?demo from the address to load the live schedule.'
    : 'Demo data. Add the Apps Script address (API_URL) in the file to load the live schedule.');
  if (S.pin && D) {
    const c = clock();
    if (NOW_PARAM) notes.push('Test time: ' + fmtDate(c.date) + ', ' + fmtMin(c.min) + '. Remove ?now from the address for the real time.');
    if (S.error) notes.push(S.error + '. Showing the schedule from ' + fmtClock(S.loadedAt) + '.');
    if (c.noDate && !DEMO) notes.push('No event date in the sheet. Times are shown as if the event were today.');
  }
  $('#banner').innerHTML = notes.map(n => '<div class="note">' + esc(n) + '</div>').join('');
}

function renderFooter() {
  $('#footer').innerHTML =
    (S.loadedAt && S.pin ? 'Schedule updated ' + esc(fmtClock(S.loadedAt)) +
      (S.role ? ' · Access: ' + esc(ROLE_LABEL[S.role]) : '') + '<br>' : '') +
    esc(APP_NAME) + ' · V' + esc(VERSION) + ' · Made with Love ©';
}

function renderTabbar() {
  const tabs = TABS.filter(t => t !== 'checkin' || can('checkin'));
  const countDot = !!(D && S.pin && countOpen() && myId() && countJobsNow().some(s => s.id === myId() && !D.countByRow[s.row]));
  const helpDot = countDot || !!(D && S.pin && !isGuest() && activeRequests(clock()).some(x =>
    can('editor') ? x.r.status === 'offered' : (x.r.status === 'open' && myId() && x.slot.id !== myId() && !overlaps(myId(), x.slot).length)));
  const bar = $('#tabbarIn');
  bar.style.setProperty('--tabs', tabs.length);
  bar.innerHTML = tabs.map(t =>
    '<button class="tab' + (t === S.tab ? ' active' : '') + '" type="button" data-act="tab" data-tab="' + t + '">' +
    '<span class="tab-ico">' + TAB_ICON[t] + (t === 'me' && helpDot ? '<span class="tab-dot"></span>' : '') + '</span>' +
    (t === 'me' && isGuest() ? 'Overview' : TAB_LABEL[t]) + '</button>'
  ).join('');
}

    main.dataset.view = 'lock';

      '<form class="lock" id="lockForm" autocomplete="off">' +

function renderGuest(c) {
  main.dataset.view = 'guest';
  const all = D.attendants.filter(a => {
    const t = String(a.team || '').trim();
    return t && t.toUpperCase() !== 'N.A.';
  });
  const inCount = all.filter(a => a.checkedIn).length;
  const groups = positionGroups();
  const teams = teamsMap();

  let onDuty = 0, openTotal = 0;
  groups.forEach(g => g.positions.forEach(p => {
    const nn = positionNowNext(p, c);
    if (nn.now && nn.now.id) onDuty++;
    openTotal += p.slots.filter(isOpen).length;
  }));

  const stat = (big, label, cls) => '<div class="stat' + (cls ? ' ' + cls : '') + '"><div class="stat-big">' + big + '</div><div class="stat-label">' + label + '</div></div>';

  let html =
    '<div class="intro"><h2>Overview</h2>' +
    '<p class="muted">Guest view · <button class="linkish" type="button" data-act="change-me">Choose a name instead</button></p></div>' +
    '<div class="stats">' +
      stat(c.mode === 'live' ? onDuty : '—', c.mode === 'live' ? 'On duty now' : (c.mode === 'before' ? 'Event not started' : 'Event finished'), c.mode === 'live' ? 'on' : '') +
      stat(inCount + '<span> / ' + all.length + '</span>', 'Checked in') +
      stat(openTotal, 'Open shifts', openTotal ? 'soon' : '') +
    '</div>';

  html += '<div class="h3">Teams</div><div class="team-block"><div class="members">' + groups.map(g => {
    const staffed = g.positions.filter(p => { const nn = positionNowNext(p, c); return nn.now && nn.now.id; }).length;
    const members = teams[g.label] || [];
    const ci = members.filter(m => m.checkedIn).length;
    return '<button class="member" type="button" data-act="goto-pos" data-area="' + esc(g.key) + '">' +
      '<span class="dot" style="background:' + teamColor(g.label) + '"></span>' +
      '<span class="member-main"><span class="member-name">' + esc(g.label) + '</span>' +
      '<span class="member-status">' +
        (c.mode === 'live' ? staffed + ' of ' + g.positions.length + ' positions staffed now' : g.positions.length + ' positions') +
        (members.length ? ' · ' + ci + ' of ' + members.length + ' checked in' : '') +
      '</span></span><span class="pos-chev">›</span></button>';
  }).join('') + '</div></div>';

  const captains = [];
  D.positions.filter(p => p.type === 'tc').forEach(p => p.slots.forEach(s => { if (s.id) captains.push({ s: s, p: p }); }));
  if (captains.length) {
    html += '<div class="h3">Team captains</div><div class="team-block"><div class="members">' + captains.map(x => {
      const a = D.att[x.s.id];
      return '<button class="member" type="button" data-act="person" data-id="' + esc(x.s.id) + '">' +
        '<span class="dot" style="background:' + teamColor(a && a.team) + '"></span>' +
        '<span class="member-main"><span class="member-name">' + esc(slotName(x.s)) + '</span>' +
        '<span class="member-status">' + esc((a && a.team) || x.p.area) + '</span></span>' +
        '<span class="tick' + (a && a.checkedIn ? '' : ' no') + '">✓</span></button>';
    }).join('') + '</div></div>';
  }

  main.innerHTML = html;
}

// ---------- POSITIONS ----------

// Positionen werden nach dem Team der eingeteilten Brüder gruppiert
// (Block J mit Lobby-Brüdern landet so automatisch bei Lobby).
// Ist eine Position noch ganz offen, zählt die Überschrift im Sheet.
function blockOf(p) {
  const m = /\bblock\s*([A-Z])\b/i.exec(p.label + ' ' + (p.area || ''));
  return m ? m[1].toUpperCase() : '';
}

function positionGroups() {
  const list = [];
  const map = {};
  const teams = {};
  D.attendants.forEach(a => { if (a.team) teams[String(a.team).trim().toUpperCase()] = String(a.team).trim(); });

  D.positions.forEach(p => {
    const team = positionTeam(p);
    const key = team || p.area;
    if (!map[key]) {
      map[key] = { key: key, label: team || p.area, positions: [] };
      list.push(map[key]);
    }
    map[key].positions.push(p);
  });
  return list;
}

// Rotationsposition = mindestens eine Schicht mit Uhrzeit.
// Team Captain und Block-Attendants (ganztags, nur eine Person) sind keine Rotation.
function isRotation(p) {
  return p.slots.some(s => s.s !== null);
}

function posCard(p, c) {
  const open = p.slots.filter(isOpen).length;
  const expanded = !!S.openPos[p.key];
  const rotation = isRotation(p);

  let html = '<div class="pos-card' + (p.type === 'tc' ? ' tc' : '') + '">' +
    '<button class="pos-head" type="button" data-act="ptoggle" data-key="' + esc(p.key) + '" aria-expanded="' + expanded + '">' +
      '<span class="pos-title">' + esc(p.label) + (open ? '<span class="tag open">' + open + ' open</span>' : '') +
        (p.slots.some(x => D.reqByRow[x.row]) ? '<span class="tag help">Help needed</span>' : '') + '</span>' +
      '<span class="pos-chev">' + (expanded ? 'Hide ▴' : (rotation ? 'All shifts ▾' : 'Details ▾')) + '</span>' +
    '</button>';

  if (rotation) {
    const nn = positionNowNext(p, c);
    const cell = (label, s, isNow) =>
      '<div' + (isNow && s ? ' class="now"' : '') + '><div class="duo-label">' + label + '</div>' +
      (s ? '<div class="duo-name">' + esc(slotName(s)) + '</div><div class="duo-time">' + esc(timeText(s)) + '</div>'
         : '<div class="duo-name">—</div>') + '</div>';
    html += '<div class="duo">' + cell('Now', nn.now, true) + cell(c.mode === 'before' ? 'First' : 'Next', nn.next, false) + '</div>';
  } else {
    const live = c.mode === 'live';
    html += '<div class="single' + (live ? ' now' : '') + '"><div class="duo-label">' + (live ? 'On this position today' : 'Assigned') + ' · All day</div>' +
      p.slots.map(s => '<div class="duo-name">' + esc(slotName(s)) + '</div>').join('') + '</div>';
  }

  if (expanded) {
    html += '<div class="pos-list">';
    if (rotation) {
      html += p.slots.map(s => {
        const state = slotState(s, c);
        const from = fromTeam(s, p);
        const inner = '<span class="t">' + esc(timeText(s)) + '</span><span class="n' + nameClass(s) + '">' + esc(slotName(s)) +
          (from ? '<span class="tag from">from ' + esc(from) + '</span>' : '') +
          (D.reqByRow[s.row] ? '<span class="tag help">Help</span>' : '') + '</span>';
        return s.id
          ? '<button class="pos-line ' + state + '" type="button" data-act="person" data-id="' + esc(s.id) + '">' + inner + '</button>'
          : '<div class="pos-line ' + state + '">' + inner + '</div>';
      }).join('');
    } else {
      html += p.slots.filter(s => s.remark).map(s =>
        '<div class="pos-line"><span class="n">' + esc(slotName(s)) + '</span><span class="muted">' + esc(s.remark) + '</span></div>'
      ).join('');
    }
    html += '<button class="pos-more" type="button" data-act="pos" data-key="' + esc(p.key) + '">Details, map' + (can('editor') ? ' & changes' : '') + ' →</button></div>';
  }

  return html + '</div>';
}

function renderPositions(c) {
  main.dataset.view = 'positions';
  const groups = positionGroups();
  if (!groups.length) { main.innerHTML = '<div class="empty">No positions in the schedule.</div>'; return; }

  if (!S.area || !groups.some(g => g.key === S.area)) {
    const mine = myId() && D.att[myId()].team;
    S.area = groups.some(g => g.key === mine) ? mine : groups[0].key;
    S.block = 'all';
  }
  const group = groups.find(g => g.key === S.area);

  let html = (can('editor') ? countAdminHtml() + helpBoxHtml(c) : '') + '<div class="chips">' + groups.map(g =>
    '<button class="chip' + (g.key === S.area ? ' active' : '') + '" type="button" data-act="area" data-area="' + esc(g.key) + '">' +
    '<span class="dot" style="background:' + teamColor(g.label) + '"></span>' + esc(g.label) + '</button>'
  ).join('') + '</div>';

  const blocks = Array.from(new Set(group.positions.map(blockOf).filter(Boolean))).sort();
  if (S.block !== 'all' && blocks.indexOf(S.block) < 0) S.block = 'all';

  if (blocks.length >= 2) {
    html += '<div class="chips sub">' + ['all'].concat(blocks).map(b =>
      '<button class="chip' + (b === S.block ? ' active' : '') + '" type="button" data-act="pblock" data-block="' + b + '">' +
      (b === 'all' ? 'All' : 'Block ' + b) + '</button>'
    ).join('') + '</div>';
  }

  // Am PC fließen die Abschnitte spaltenweise von oben nach unten.
  const section = (list, head) => list.length
    ? '<section class="pos-sec' + (head ? ' blocked' : '') + '">' + (head ? '<div class="block-head">' + head + '</div>' : '') +
      list.map(p => posCard(p, c)).join('') + '</section>'
    : '';

  html += '<div class="pos-flow">';
  if (S.block !== 'all') {
    html += section(group.positions.filter(p => blockOf(p) === S.block), '');
  } else if (blocks.length) {
    html += section(group.positions.filter(p => !blockOf(p)), '');
    blocks.forEach(b => {
      html += section(group.positions.filter(p => blockOf(p) === b), 'Block ' + b);
    });
  } else {
    html += section(group.positions, '');
  }
  html += '</div>';

  main.innerHTML = html;
}

function renderCheckinBody(c) {
  if (!$('#ciList')) return;
  const all = D.attendants.filter(a => {
    const t = String(a.team || '').trim();
    return t && t.toUpperCase() !== 'N.A.';
  });
  const inCount = all.filter(a => a.checkedIn).length;
  const pct = all.length ? Math.round(inCount / all.length * 100) : 0;

  $('#ciSummary').innerHTML =
    '<div class="ci-summary"><div class="ci-big">' + inCount + '<span> of ' + all.length + ' checked in</span></div>' +
    '<div class="bar"><span style="width:' + pct + '%"></span></div></div>';

  document.querySelectorAll('[data-act="cifilter"]').forEach(b =>
    b.classList.toggle('active', b.dataset.f === S.ciFilter));

  const q = norm(S.ciQuery.trim());
  let list = all;
  if (q) list = list.filter(a => nameMatch(a.name, q));
  else if (S.ciFilter === 'open') list = list.filter(a => !a.checkedIn);
  else if (S.ciFilter === 'in') list = list.filter(a => a.checkedIn);
  list = list.slice().sort(byName);

  $('#ciList').innerHTML = list.length
    ? '<div class="team-block"><div class="members">' + list.map(a => {
        const st = personStatus(a.id, c);

function topPanel() {
  return S.stack[S.stack.length - 1] || null;
}

function pushPanel(entry) {
  const top = topPanel();
  if (top && top.type === entry.type && top.id === entry.id && top.key === entry.key && top.row === entry.row) return;
  S.stack.push(entry);
  history.pushState({ aaPanel: S.stack.length }, '');
  showPanel(true);
}

function popPanel() {
  S.stack.pop();
  showPanel(true);
}

function backPanel() {
  if (history.state && history.state.aaPanel) history.back();
  else popPanel();
}

function clearPanels() {
  const n = S.stack.length;
  if (!n) return;
  S.stack = [];
  showPanel(false);
  if (history.state && history.state.aaPanel) {
    S.ignorePop = true;
    history.go(-n);
  }
}

function showPanel(scrollTop) {
  const panel = $('#panel');
  if (S.stack.length && D) {
    panel.classList.add('open');
    panel.setAttribute('aria-hidden', 'false');
    renderPanel(clock());
    if (scrollTop) panel.scrollTop = 0;
  } else {
    panel.classList.remove('open');
    panel.setAttribute('aria-hidden', 'true');
    $('#panelBody').dataset.view = '';
  }
}

function renderPanel(c, force) {
  const top = topPanel();
  if (!top || !D) return;
  const body = $('#panelBody');

  if (top.type === 'pick') { renderPick(top, c, force); return; }
  if (top.type === 'access') { renderAccess(force); return; }
  if (top.type === 'find') { renderFind(c, force); return; }
  if (top.type === 'emergency') {
    if (body.dataset.view === 'emergency' && !force) return;   // aufgeklappte Fälle bleiben offen
    body.dataset.view = 'emergency';
    body.innerHTML = emergencyHtml(c);
    return;
  }

  body.dataset.view = top.type;
  body.innerHTML = top.type === 'person' ? personPanelHtml(top, c) : posPanelHtml(top, c);
}

function personPanelHtml(top, c) {
  const a = D.att[top.id];
  if (!a) return backBar() + '<div class="empty">This attendant is no longer in the schedule.</div>';

  let html = backBar() +
    '<div class="person-head"><div><h2>' + esc(a.name) + '</h2>' + teamLine(a.team) + '</div>' +
    (a.checkedIn ? '<span class="checked">✓ Checked in</span>' : '') + '</div>' +
    heroHtml(a.id, c);

  if (can('checkin')) {
    const pend = !!S.pending[a.id];
    html += '<div class="me-row"><button class="btn ' + (a.checkedIn ? '' : 'primary') + ' block" type="button" data-act="ci" data-id="' + esc(a.id) + '"' + (pend ? ' disabled' : '') + '>' +
      (pend ? '…' : (a.checkedIn ? 'Undo check-in' : 'Check in')) + '</button></div>';
  }

  return html + '<div class="h3">Assignments</div>' + slotsHtml(a.id, c);
}

function posPanelHtml(top, c) {
  const p = D.positions.find(x => x.key === top.key);
  if (!p) return backBar() + '<div class="empty">This position is no longer in the schedule.</div>';

  const nn = positionNowNext(p, c);
  const rotation = isRotation(p);
  const selIndex = top.row && rotation ? p.slots.findIndex(s => s.row === top.row) : -1;
  const map = mapFor(p);
  const editable = can('editor');

  let html = backBar() + '<h2>' + esc(p.label) + '</h2><p class="sub">' + esc(p.area) + '</p>';
  if (evacFor(p)) html += evacCardHtml({ pos: p }, false);

  if (nn.now && rotation) {
    html += '<div class="now-box"><div class="duo-label">On this position now</div>' +
      '<div class="now-name">' + esc(slotName(nn.now)) + '</div>' +
      '<div class="duo-time">' + esc(timeText(nn.now)) + '</div></div>';
  }

  if (selIndex >= 0) {
    const cell = (label, s, cls) => '<div class="' + cls + '"><div class="duo-label">' + label + '</div>' +
      (s ? '<div class="duo-name">' + esc(slotName(s)) + '</div><div class="duo-time">' + esc(timeText(s)) + '</div>'
         : '<div class="duo-name">—</div>') + '</div>';
    html += '<div class="trio">' +
      cell('Before', p.slots[selIndex - 1], '') +
      cell('Selected', p.slots[selIndex], 'sel') +
      cell('After', p.slots[selIndex + 1], '') + '</div>';
  }

  if (map) {
    html += '<button class="btn primary block" type="button" data-act="togglemap">' +
      (S.panelMap ? 'Hide position map' : 'Show position map') + '</button>';
    if (S.panelMap) {
      html += '<div class="map-inline"><img src="' + esc(map.file) + '" alt="' + esc(map.title) + ' position map" ' +
        'data-act="zoom" data-src="' + esc(map.file) + '" data-alt="' + esc(map.title) + ' position map">' +
        '<button class="map-print" type="button" data-act="print-map" data-src="' + esc(map.file) + '" data-title="' + esc(map.title) + '">' +
        '<svg class="i" viewBox="0 0 24 24"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>Print map</button></div>';
    }
  }

  html += '<div class="h3">' + (rotation ? 'Full rotation' : 'Assigned · all day') + '</div>' + p.slots.map((s, i) => {
    const state = slotState(s, c);
    const cls = ['rot', state, i === selIndex ? 'sel' : ''].join(' ');
    const from = fromTeam(s, p);
    const tags = (state === 'now' ? '<span class="tag now">Now</span>' : '') +
      (i === selIndex ? '<span class="tag sel">Selected</span>' : '') +
      (from ? '<span class="tag from">from ' + esc(from) + '</span>' : '') +
      (D.reqByRow[s.row] ? '<span class="tag help">Help needed</span>' : '');
    const inner = '<span class="rot-time">' + esc(timeText(s)) + '</span>' +
      '<span><span class="rot-name' + nameClass(s) + '">' + esc(slotName(s)) + tags + '</span>' +
      (s.remark ? '<span class="rot-remark" style="display:block">' + esc(s.remark) + '</span>' : '') + '</span>';
    const mainPart = s.id
      ? '<button class="rot-main" type="button" data-act="person" data-id="' + esc(s.id) + '">' + inner + '</button>'
      : '<div class="rot-main">' + inner + '</div>';
    const edit = editable
      ? '<button class="rot-edit" type="button" data-act="edit-slot" data-row="' + s.row + '">Change</button>'
      : '';
    return '<div class="' + cls + '">' + mainPart + edit + '</div>';
  }).join('');

  return html;
}

    guardSearch(q);

// Position passt, wenn jedes Suchwort in Bezeichnung, Bereich oder Bemerkung vorkommt.
// Zahlen müssen als ganze Zahl passen ("12" findet "12 - Block A", aber nicht "112").
function posMatch(p, q) {
  const words = norm(q).split(/[\s,]+/).filter(Boolean);
  if (!words.length) return false;
  const label = norm(p.label);
  const text = norm(p.label + ' ' + p.area + ' ' + p.slots.map(s => s.remark || '').join(' '));
  return words.every(w => /^\d+$/.test(w)
    ? new RegExp('(^|\\D)' + w + '(\\D|$)').test(label)
    : text.includes(w));
}

function findPosCard(p, c) {
  const nn = positionNowNext(p, c);
  const lead = isRotation(p)
    ? (nn.now ? 'Now: ' + slotName(nn.now) : '') + (nn.next ? (nn.now ? ' · ' : '') + (c.mode === 'before' ? 'First: ' : 'Next: ') + slotName(nn.next) : '')
    : p.slots.map(slotName).join(', ') + ' · all day';
  return '<button class="find-card" type="button" data-act="pos" data-key="' + esc(p.key) + '">' +
    '<div class="find-top"><span class="member-name">' + esc(p.label) + '</span>' +
      '<span class="find-area">' + esc(p.area) + '</span></div>' +
    (lead ? '<div class="member-status">' + esc(lead) + '</div>' : '') +
    (isRotation(p)
      ? '<div class="find-slots">' + p.slots.map(x =>
          '<span class="find-slot ' + slotState(x, c) + '"><b>' + esc(timeText(x)) + '</b> ' + esc(slotName(x)) + '</span>'
        ).join('') + '</div>'
      : '') +
    '</button>';
}

function renderFindList(c) {
  const box = $('#findList');
  if (!box) return;
  const q = S.findQuery.trim();
  const nq = norm(q);
  if (nq.length < 2 && !/^\d+$/.test(nq)) {
    box.innerHTML = '<div class="empty">Type a name or a position.</div>';
    return;
  }
  const hits = /^[\d\s]+$/.test(nq) ? [] : D.attendants.filter(a => nameMatch(a.name, q)).sort(byName).slice(0, 25);
  const posHits = D.positions.filter(p => posMatch(p, q)).slice(0, 20);
  if (!hits.length && !posHits.length) { box.innerHTML = '<div class="empty">Nothing found.</div>'; return; }

  box.innerHTML =
    (posHits.length ? '<div class="h3" style="margin-top:4px">Positions</div>' + posHits.map(p => findPosCard(p, c)).join('') : '') +
    (hits.length ? '<div class="h3"' + (posHits.length ? '' : ' style="margin-top:4px"') + '>Attendants</div>' : '') +
    hits.map(a => {
    const list = D.byId[a.id] || [];
    const st = personStatus(a.id, c);
    return '<button class="find-card" type="button" data-act="person" data-id="' + esc(a.id) + '">' +
      '<div class="find-top"><span class="member-name">' + esc(a.name) + '</span>' +
        (a.checkedIn ? '<span class="checked">✓ In</span>' : '') + '</div>' +
      '<div class="member-status k-' + st.kind + '"><span class="dot" style="background:' + teamColor(a.team) + '"></span> ' +
        esc(a.team || 'No team') + ' · ' + esc(statusLine(st)) + '</div>' +
      (list.length
        ? '<div class="find-slots">' + list.map(x =>
            '<span class="find-slot ' + slotState(x, c) + '"><b>' + esc(timeText(x)) + '</b> ' + esc(x.pos.label) + '</span>'
          ).join('') + '</div>'
        : '<div class="find-slots"><span class="find-slot">No assignment</span></div>') +
      '</button>';
  }).join('');
}

function renderPick(top, c, force) {
  const body = $('#panelBody');
  const slot = findSlot(top.row);
  if (!slot) {
    body.dataset.view = '';
    body.innerHTML = backBar() + '<div class="empty">This shift is no longer in the schedule.</div>';
    return;
  }

  const key = 'pick:' + top.row + ':' + slot.id + ':' + (D.reqByRow[slot.row] ? D.reqByRow[slot.row].status : '');
  if (body.dataset.view !== key || force) {
    body.dataset.view = key;
    body.innerHTML = backBar() +
      '<h2>Change shift</h2>' +
      '<p class="sub">' + esc(timeText(slot)) + ' · ' + esc(slot.pos.label) + ' · ' + esc(slot.pos.area) + '</p>' +
      '<div class="form-card"><div class="duo-label">Currently</div><div class="now-name">' + esc(slotName(slot)) + '</div></div>' +
      (D.reqByRow[slot.row]
        ? '<div class="note" style="margin-bottom:12px">A help request for this shift is ' + (D.reqByRow[slot.row].status === 'offered' ? 'answered – confirm it under My duty.' : 'open. Waiting for volunteers.') + '</div>'
        : '<button class="btn block" type="button" data-act="help-request" data-row="' + slot.row + '" style="margin-bottom:6px">🙋 Ask everyone for help</button>' +
          '<p class="muted" style="margin:0 2px 14px">All attendants see this shift. Whoever is free can offer to take it, then you confirm. His team stays the same.</p>') +
