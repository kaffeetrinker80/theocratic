<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Attendant Assignments</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #f4f5f7;
      color: #202124;
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e2e5e9;
      border-radius: 18px;
      padding: 22px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    p {
      margin: 0 0 20px;
      color: #6b7280;
      line-height: 1.5;
    }

    .button {
      display: block;
      width: 100%;
      padding: 14px 16px;

      text-align: center;
      text-decoration: none;

      background: #315f7d;
      color: white;

      border-radius: 12px;
      font-weight: 700;
    }

    .button:active {
      opacity: .85;
    }

    .note {
      margin-top: 16px;
      font-size: 13px;
      color: #6b7280;
    }
  </style>
</head>

<body>

  <div class="wrap">

    <div class="card">

      <h1>Attendant Assignments</h1>

      <p>
        Search your assignments, check your next shift
        and view position details.
      </p>

      <a
        class="button"
        href="https://script.google.com/macros/s/AKfycbwjv-uTZOon8OiP_8NXhEz89wY_eESLNLwODDIZ5OME/dev"
      >
        Open Attendant Assignment Tool
      </a>

      <div class="note">
        Optimized for smartphone and tablet use.
      </div>

    </div>

  </div>

</body>
</html>
