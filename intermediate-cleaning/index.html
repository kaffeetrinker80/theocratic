<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Intermediate Cleaning Planner</title>
<style>
:root{
  --ink:#172033;--muted:#667085;--brand:#1f4f7a;--brand-soft:#eaf2f8;
  --line:#d9e1e8;--paper:#fff;--app:#eef2f6;--yellow:#fff0b8;
  --yellow-line:#e6bb37;--danger:#b42318;--shadow:0 12px 28px rgba(30,50,70,.10)
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--app);color:var(--ink);font-size:13px}
button,select,input{font:inherit} button{cursor:pointer}
.appbar{position:sticky;top:0;z-index:20;display:flex;justify-content:center;background:rgba(238,242,246,.95);backdrop-filter:blur(8px);border-bottom:1px solid #dde5ec;padding:10px 12px}
.controls{width:min(1200px,100%);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.control-set{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.control-label{font-size:12px;color:var(--muted);font-weight:700}
select,input[type="text"]{border:1px solid #cfd8e1;border-radius:8px;background:#fff;color:var(--ink);padding:7px 9px;outline:none}
button{border:1px solid #cfd8e1;border-radius:8px;background:#fff;color:var(--ink);padding:7px 10px;font-weight:700}button:hover{background:#f7f9fb}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}.subtle{background:var(--brand-soft);border-color:#cbddea;color:var(--brand)}
button.danger{color:var(--danger);border-color:#f1c2bd;background:#fff}button:disabled{opacity:.45;cursor:not-allowed}
.lang-switch{display:inline-flex;border:1px solid #cfd8e1;border-radius:9px;overflow:hidden;background:#fff}.lang-switch button{border:0;border-radius:0;padding:7px 10px;min-width:42px;background:transparent}.lang-switch button.active{background:var(--brand);color:#fff}
.page-wrap{padding:16px 10px 28px}
.sheet{width:210mm;height:297mm;margin:0 auto;background:var(--paper);box-shadow:var(--shadow);padding:7mm 8mm 6mm;display:grid;grid-template-rows:auto auto 1fr auto;gap:3mm;overflow:hidden}
header{text-align:center;border-bottom:1px solid var(--line);padding-bottom:2.5mm}.congregation-name{font-size:19px;line-height:1.1;margin:0;color:var(--brand);font-weight:800}
.titleline{font-size:14px;font-weight:750;margin-top:1.1mm}.title-year{color:var(--muted);font-weight:600}
.instructions{display:grid;grid-template-columns:1fr 1fr;gap:3mm;border:1px solid #b7cadd;border-radius:7px;padding:2.6mm 3mm;background:#fbfdff;font-size:10.3px;line-height:1.32}
.instruction-title{font-weight:800}.instruction-extra .instruction-title{color:#8a6710}.legend-dot{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--yellow);border:1px solid var(--yellow-line);margin-right:4px;vertical-align:middle}.legend{margin-top:1.2mm;color:var(--muted);font-size:9.2px}
.schedule{min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:2.2mm}
.month{min-width:0;min-height:0;border:1px solid var(--line);border-radius:6px;background:#fff;padding:2mm;display:flex;flex-direction:column;overflow:hidden}.month.extra{background:var(--yellow);border-color:var(--yellow-line)}
.month-header{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-bottom:1mm;min-height:19px;flex:0 0 auto}.month-title{font-size:10.5px;font-weight:850}.responsibility{font-size:7.5px;font-weight:850;color:#7c5a08;background:rgba(255,255,255,.58);padding:2px 5px;border-radius:999px;white-space:nowrap}.month-actions{margin-left:auto}.month-actions select{font-size:8px;padding:2px 4px;border-radius:5px;max-width:105px}
.rows{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:0}.row{display:grid;grid-template-columns:15.5mm 21mm minmax(0,1fr);gap:1mm;align-items:center;min-height:4.2mm;border-bottom:1px solid rgba(217,225,232,.55);padding:.35mm 0}.row:last-child{border-bottom:0}.day{font-size:7.8px;color:var(--muted);text-align:right;white-space:nowrap}.date{font-size:7.8px;white-space:nowrap;color:#344054;text-align:center}.group-select{width:100%;padding:1px 4px;min-height:4mm;border:1px solid #dfe5eb;border-radius:4px;background:rgba(255,255,255,.9);font-size:8px;font-weight:700}
footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:1.5mm;font-size:8.5px;color:var(--muted)}.footer-strong{color:#344054;font-weight:700}
dialog{border:0;border-radius:12px;padding:0;box-shadow:0 20px 60px rgba(20,30,45,.25);width:min(580px,calc(100vw - 28px))}dialog::backdrop{background:rgba(16,24,40,.45)}
.modal-head{padding:16px 18px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{font-size:17px;margin:0}.modal-body{padding:16px 18px;display:grid;gap:12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:750;color:#475467}.group-editor{display:grid;grid-template-columns:1fr 1fr;gap:8px}.day-editor{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.day-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:#fff;font-size:11px}.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line)}.hint{font-size:11px;color:var(--muted);line-height:1.4}
@media(max-width:900px){.sheet{width:100%;height:auto;min-height:100vh;padding:18px 14px;overflow:visible}.schedule{grid-template-columns:repeat(2,1fr);grid-template-rows:none}.month{min-height:210px}}
@media(max-width:560px){.schedule{grid-template-columns:1fr}.instructions{grid-template-columns:1fr}.form-grid,.group-editor{grid-template-columns:1fr}.day-editor{grid-template-columns:repeat(2,1fr)}}
@page{size:A4 portrait;margin:0}
@media print{
  html,body{width:210mm;height:297mm;background:#fff}.no-print{display:none!important}.page-wrap{padding:0}.sheet{width:210mm;height:297mm;margin:0;box-shadow:none;padding:5mm 6mm 4.5mm;gap:2mm;overflow:hidden;grid-template-rows:auto auto minmax(0,1fr) auto}
  header{padding-bottom:1.7mm}.congregation-name{font-size:15.5px}.titleline{font-size:11.5px;margin-top:.5mm}
  .instructions{padding:1.8mm 2.2mm;gap:2mm;font-size:8.6px;line-height:1.2}.legend{font-size:7.8px;margin-top:.6mm}
  .schedule{gap:1.5mm;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr))}
  .month{padding:1.35mm;border-radius:4px;break-inside:avoid;overflow:hidden}.month.extra{-webkit-print-color-adjust:exact;print-color-adjust:exact;background:var(--yellow)!important}
  .month-header{margin-bottom:.4mm;min-height:10px}.month-title{font-size:8.5px}.responsibility{font-size:6.2px;padding:1px 3px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rows{justify-content:space-evenly}.row{grid-template-columns:14mm 20mm minmax(0,1fr);gap:.8mm;min-height:3.45mm;border-bottom:.2mm solid #edf1f4;padding:.18mm 0}.row:last-child{border-bottom:0}.day,.date,.group-select{font-size:6.65px}.day{text-align:right}.date{text-align:center}.group-select{border:.2mm solid #dfe5eb;border-radius:2.5px;padding:.15mm .9mm;min-height:3.1mm;appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.86);text-align:left;font-weight:700}
  footer{font-size:7px;padding-top:.8mm}
}
</style>
</head>
<body>
<div class="appbar no-print"><div class="controls">
  <div class="control-set"><span class="control-label" data-i18n="year">Jahr</span><select id="yearSelect"></select><button id="autoAssignBtn" class="subtle" data-i18n="autoAssign">Gruppen automatisch verteilen</button><button id="alternateBtn" data-i18n="alternate">Markierte Monate abwechseln</button></div>
  <div class="control-set"><button id="undoBtn" title="Undo">↶ <span data-i18n="undo">Zurück</span></button><div class="lang-switch"><button data-lang="de" class="active">DE</button><button data-lang="en">EN</button><button data-lang="ru">RU</button></div><button id="settingsBtn" data-i18n="settings">Einstellungen</button><button id="resetBtn" class="danger" data-i18n="reset">Reset</button><button id="exportBtn" data-i18n="export">Export</button><input type="file" id="importFile" accept="application/json" hidden><button id="importBtn" data-i18n="import">Import</button><button id="printBtn" class="primary" data-i18n="print">A4 drucken</button></div>
</div></div>
<div class="page-wrap"><main class="sheet">
<header><h1 class="congregation-name" id="congregationDisplay"></h1><div class="titleline"><span data-i18n="title">Plan für die Zwischenreinigung</span> <span class="title-year">· <span id="yearDisplay"></span></span></div></header>
<section class="instructions"><div><span class="instruction-title" data-i18n="standardTitle"></span><span data-i18n="standardText"></span></div><div class="instruction-extra"><span class="instruction-title" data-i18n="extraTitle"></span><span data-i18n="extraText"></span><div class="legend"><span class="legend-dot"></span><span data-i18n="legend"></span></div></div></section>
<section class="schedule" id="schedule"></section>
<footer><div><span data-i18n="coordinator"></span>: <span class="footer-strong" id="coordinatorDisplay"></span></div><div><span data-i18n="planFor"></span> <span id="footerCongregation"></span></div></footer>
</main></div>

<dialog id="settingsDialog"><div class="modal-head"><h2 data-i18n="settingsTitle"></h2><button class="closeSettings">×</button></div><div class="modal-body"><div class="form-grid">
<div class="field full"><label data-i18n="congregation"></label><input id="congregationInput" type="text"></div>
<div class="field full"><label data-i18n="cleaningCoordinator"></label><input id="coordinatorInput" type="text"></div>
<div class="field full"><label data-i18n="meetingDays"></label><div class="day-editor" id="dayEditor"></div><div class="hint" data-i18n="meetingDaysHint"></div></div>
<div class="field full"><label data-i18n="groupNames"></label><div class="group-editor" id="groupEditor"></div></div>
</div><div class="hint" data-i18n="settingsHint"></div></div><div class="modal-foot"><button class="closeSettings" data-i18n="cancel"></button><button id="saveSettings" class="primary" data-i18n="save"></button></div></dialog>
<dialog id="startGroupDialog"><div class="modal-head"><h2 data-i18n="startGroupTitle"></h2><button class="closeStart">×</button></div><div class="modal-body"><div class="field"><label data-i18n="startWith"></label><select id="startGroupSelect"></select></div></div><div class="modal-foot"><button class="closeStart" data-i18n="cancel"></button><button id="confirmAutoAssign" class="primary" data-i18n="apply"></button></div></dialog>
<dialog id="alternateDialog"><div class="modal-head"><h2 data-i18n="alternateTitle"></h2><button class="closeAlternate">×</button></div><div class="modal-body"><div class="field"><label data-i18n="firstHighlighted"></label><select id="firstHighlightedSelect"><option value="0"></option><option value="1"></option></select></div><div class="hint" data-i18n="alternateHint"></div></div><div class="modal-foot"><button class="closeAlternate" data-i18n="cancel"></button><button id="confirmAlternate" class="primary" data-i18n="apply"></button></div></dialog>

<script>
const I18N={
 de:{year:'Jahr',autoAssign:'Gruppen automatisch verteilen',alternate:'Markierte Monate abwechseln',undo:'Zurück',settings:'Einstellungen',reset:'Reset',export:'Export',import:'Import',print:'A4 drucken',title:'Plan für die Zwischenreinigung',standardTitle:'Standard (Räume 3+4):',standardText:' Schmutz von Sitzen und Boden entfernen (bei Bedarf Staubsauger verwenden), Stuhlreihen ausrichten, Abfalleimer leeren, Fundsachen im Untergeschoss abgeben.',extraTitle:'Zusätzlich – Toiletten & Foyer:',extraText:' Toiletten und Foyer kontrollieren, bei Bedarf reinigen, Seife und Papierhandtücher prüfen und auffüllen, Mülleimer leeren und Mülltrennung beachten.',legend:'Gelb markierter Monat = diese Versammlung ist für Toiletten & Foyer zuständig.',coordinator:'Reinigungskoordinator',planFor:'Plan für',settingsTitle:'Einstellungen für den Plan',congregation:'Versammlung',cleaningCoordinator:'Reinigungskoordinator',meetingDays:'Versammlungstage',meetingDaysHint:'Wähle alle Wochentage aus, an denen regulär eine Zusammenkunft stattfindet.',groupNames:'Namen der Dienstgruppen',settingsHint:'Die Datei enthält keine Versammlungsdaten. Einstellungen und Einteilungen werden nur lokal im Browser gespeichert oder über Export/Import übertragen.',cancel:'Abbrechen',save:'Speichern',startGroupTitle:'Automatische Verteilung starten',startWith:'Beginnen mit',apply:'Übernehmen',alternateTitle:'Zuständigkeitsmonate abwechseln',firstHighlighted:'Erster gelb markierter Monat',alternateHint:'Jeder zweite Monat wird markiert. Einzelne Monate können danach weiterhin geändert werden.',standard:'Standard',extra:'Toiletten & Foyer',responsible:'Unsere Zuständigkeit',none:'—',invalidFile:'Ungültige Planer-Datei.',imported:'Plan wurde importiert.',resetConfirm:'Wirklich alle lokal gespeicherten Daten dieses Planers löschen und mit einem leeren Beispiel starten?',noMeetingDays:'Bitte mindestens einen Versammlungstag auswählen.',groupAbbr:'DG',exampleCong:'Beispiel-Versammlung',months:['Januar','Februar',  en:{year:'Year',autoAssign:'Auto-assign groups',alternate:'Alternate highlighted months',undo:'Undo',settings:'Settings',reset:'Reset',export:'Export',import:'Import',print:'Print A4',title:'Intermediate Cleaning Schedule',standardTitle:'Standard (Rooms 3+4):',standardText:' Remove dirt from seats and floor (use vacuum cleaners if necessary), straighten seating rows, empty waste basket, deposit lost items in basement.',extraTitle:'Additional – Toilets & Lobby:',extraText:' Visual check of toilets and foyer, clean as necessary, check soap and paper towels and refill if needed, empty trash cans and observe waste separation.',legend:'Highlighted month = this congregation is responsible for toilets & lobby.',coordinator:'Cleaning Coordinator',planFor:'Plan for',settingsTitle:'Planner settings',congregation:'Congregation',cleaningCoordinator:'Cleaning coordinator',meetingDays:'Meeting days',meetingDaysHint:'Select every weekday on which a regular congregation meeting takes place.',groupNames:'Field service group names',settingsHint:'The file itself contains no congregation data. Settings and assignments are stored only in this browser or transferred via Export/Import.',cancel:'Cancel',save:'Save',startGroupTitle:'Start auto-assignment',startWith:'Start with',apply:'Apply',alternateTitle:'Alternate responsibility months',firstHighlighted:'First highlighted month',alternateHint:'Every other month will be highlighted. Individual months can still be changed afterwards.',standard:'Standard',extra:'Toilets & Lobby',responsible:'Our responsibility',none:'—',invalidFile:'Invalid planner file.',imported:'Planner imported.',resetConfirm:'Delete all locally stored data for this planner and start with a blank example?',noMeetingDays:'Please select at least one meeting day.',groupAbbr:'FSG',exampleCong:'Example Congregation',months:['January','February','March','April','May','June','July','August','September','October','November','December'],days:['Sunday','Monday','Tuesday','Wednes };
const NS='icp3-'; const SETTINGS_KEY=NS+'settings'; const UNDO_KEY=NS+'undo';
function defaultsFor(l='de'){return {congregation:I18N[l].exampleCong,coordinator:'',groups:Array.from({length:4},(_,i)=>`${I18N[l].groupAbbr} ${i+1}`),meetingDays:[0,3],lang:l}}
function loadSettings(){try{return {...defaultsFor('de'),...JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}}catch{return defaultsFor('de')}}
let settings=loadSettings(),lang=settings.lang||'de';
const $=id=>document.getElementById(id),yearSelect=$('yearSelect'),yearDisplay=$('yearDisplay'),schedule=$('schedule'),congregationDisplay=$('congregationDisplay'),coordinatorDisplay=$('coordinatorDisplay'),footerCongregation=$('footerCongregation'),undoBtn=$('undoBtn');
function t(k){return I18N[lang][k]??I18N.en[k]??k} function pad2(n){return String(n).padStart(2,'0')} function key(year,type,s=''){return `${NS}${year}-${type}${s!==''?'-'+s:''}`}
function saveSettings(){localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))}
function namespaceSnapshot(){const data={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(NS)&&k!==UNDO_KEY)data[k]=localStorage.getItem(k)}return data}
function pushUndo(){localStorage.setItem(UNDO_KEY,JSON.stringify(namespaceSnapshot()));updateUndo()}
function updateUndo(){undoBtn.disabled=!localStorage.getItem(UNDO_KEY)}
function undoLast(){const raw=localStorage.getItem(UNDO_KEY);if(!raw)return;let snap;try{snap=JSON.parse(raw)}catch{return}for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k&&k.startsWith(NS)&&k!==UNDO_KEY)localStorage.removeItem(k)}Object.entries(snap).forEach(([k,v])=>localStorage.setItem(k,v));localStorage.removeItem(UNDO_KEY);settings=loadSettings();lang=settings.lang||lang;applyLanguage();updateUndo()}
function initYears(){const c=new Date().getFullYear();for(let y=c-1;y<=c+10;y++){const o=document.createElement('option');o.value=y;o.textContent=y;o.selected=y===c;yearSelect.appendChild(o)}}
function getDates(year){const out=[],meeting=new Set((settings.meetingDays||[0,3]).map(Number));let d=new Date(year,0,1);while(d.getFullYear()===year){const wd=d.getDay();if(meeting.has(wd))out.push({day:wd,month:d.getMonth(),date:`${pad2(d.getDate())}.${pad2(d.getMonth()+1)}`,full:`${pad2(d.getDate())}.${pad2(d.getMonth()+1)}.${year}`});d.setDate(d.getDate()+1)}return out}
function isExtra(y,m){return localStorage.getItem(key(y,'extra',m))==='1'} function setExtra(y,m,v){localStorage.setItem(key(y,'extra',m),v?'1':'0')} function getGroup(y,f){return localStorage.getItem(key(y,'group',f))||''} function setGroup(y,f,v){localStorage.setItem(key(y,'group',f),v)}
function maybeTranslateDefaultGroups(oldLang,newLang){const old=I18N[oldLang]?.groupAbbr||'FSG',neu=I18N[newLang].groupAbbr;settings.groups=(settings.groups||[]).map(g=>{const m=g.match(new RegExp(`^${old.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\s+(\\d+)$`));return m?`${neu} ${m[1]}`:g})}
function applyLanguage(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('.lang-switch button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));congregationDisplay.textContent=settings.congregation||t('exampleCong');coordinatorDisplay.textContent=settings.coordinator||'—';footerCongregation.textContent=settings.congregation||t('exampleCong');buildCalendar(+yearSelect.value);updateUndo()}
function buildCalendar(year){yearDisplay.textContent=year;schedule.innerHTML='';const by=Array.from({length:12},()=>[]);getDates(year).forEach(d=>by[d.month].push(d));by.forEach((dates,m)=>schedule.appendChild(buildMonth(year,m,dates)))}
function buildMonth(year,m,dates){const box=document.createElement('section');box.className='month'+(isExtra(year,m)?' extra':'');const head=document.createElement('div');head.className='month-header';const title=document.createElement('div');title.className='month-title';title.textContent=I18N[lang].months[m];const badge=document.createElement('span');badge.className='responsibility';badge.textContent=t('responsible');badge.style.display=isExtra(year,m)?'inline-block':'none';const actions=document.createElement('div');actions.className='month-actions no-print';const mode=document.createElement('select');[['0',t('standard')],['1',t('extra')]].forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;mode.appendChild(o)});mode.value=isExtra(year,m)?'1':'0';mode.addEventListener('change',()=>{pushUndo();setExtra(year,m,mode.value==='1');box.classList.toggle('extra',mode.value==='1');badge.style.display=mode.value==='1'?'inline-block':'none'});actions.appendChild(mode);head.append(title,badge,actions);box.appendChild(head);const rows=document.createElement('div');rows.className='rows';dates.forEach(d=>{const row=document.createElement('div');row.className='row';const day=document.createElement('div');day.className='day';day.textContent=I18N[lang].days[d.day];const date=document.createElement('div');date.className='date';date.textContent=d.full;const sel=document.createElement('select');sel.className='group-select';let o=document.createElement('option');o.value='';o.textContent=t('none');sel.appendChild(o);(settings.groups||[]).filter(Boolean).forEach(g=>{o=document.createElement('option');o.value=g;o.textContent=g;sel.appendChild(o)});const stored=getGroup(year,d.full);if(stored&&!settings.groups.includes(stored)){o=document.createElement('option');o.value=stored;o.textContent=stored;sel.appendChild(o)}sel.value=stored;sel.addEventListener('change',()=>{pushUndo();setGroup(year,d.full,sel.value)});row.append(day,date,sel);rows.appendChild(row)});box.appendChild(rows);return box}
function rebuildGroupEditor(){const e=$('groupEditor');e.innerHTML='';const a=[...(settings.groups||[])];while(a.length<8)a.push('');a.slice(0,8).forEach((g,i)=>{const inp=document.createElement('input');inp.type='text';inp.value=g;inp.placeholder=`${t('groupAbbr')} ${i+1}`;e.appendChild(inp)})}
function rebuildDayEditor(){const e=$('dayEditor');e.innerHTML='';for(let d=0;d<7;d++){const label=document.createElement('label');label.className='day-chip';const cb=document.createElement('input');cb.type='checkbox';cb.value=d;cb.checked=(settings.meetingDays||[]).map(Number).includes(d);label.append(cb,document.createTextNode(I18N[lang].days[d]));e.appendChild(label)}}
function openSettings(){ $('congregationInput').value=settings.congregation||'';$('coordinatorInput').value=settings.coordinator||'';rebuildDayEditor();rebuildGroupEditor();$('settingsDialog').showModal()}
function saveSettingsFromDialog(){const days=[...document.querySelectorAll('#dayEditor input:checked')].map(x=>+x.value);if(!days.length){alert(t('noMeetingDays'));return}pushUndo();settings.congregation=$('congregationInput').value.trim()||t('exampleCong');settings.coordinator=$('coordinatorInput').value.trim();settings.groups=[...document.querySelectorAll('#groupEditor input')].map(i=>i.value.trim()).filter(Boolean);if(!settings.groups.length)settings.groups=defaultsFor(lang).groups;settings.meetingDays=days;settings.lang=lang;saveSettings();$('settingsDialog').close();applyLanguage()}
function openAutoAssign(){const s=$('startGroupSelect');s.innerHTML='';settings.groups.forEach((g,i)=>{const o=document.createElement('option');o.value=i;o.textContent=g;s.appendChild(o)});$('startGroupDialog').showModal()}
function doAutoAssign(){const year=+yearSelect.value,groups=settings.groups;if(!groups.length)return;pushUndo();let idx=+$('startGroupSelect').value||0;getDates(year).forEach(d=>{setGroup(year,d.full,groups[idx]);idx=(idx+1)%groups.length});$('startGroupDialog').close();buildCalendar(year)}
function openAlternate(){const s=$('firstHighlightedSelect');s.options[0].textContent=I18N[lang].months[0];s.options[1].textContent=I18N[lang].months[1];$('alternateDialog').showModal()}
function doAlternate(){pushUndo();const y=+yearSelect.value,start=+$('firstHighlightedSelect').value;for(let m=0;m<12;m++)setExtra(y,m,m%2===start);$('alternateDialog').close();buildCalendar(y)}
function exportPlan(){
  const y=+yearSelect.value,now=new Date();
  const p={version:4,year:y,exportedAt:now.toISOString(),exportLanguage:lang,settings:{...settings,lang},months:[],assignments:{}};
  for(let m=0;m<12;m++)p.months.push({monthIndex:m,extra:isExtra(y,m)});
  getDates(y).forEach(d=>p.assignments[d.full]=getGroup(y,d.full));
  const stamp=`${now.getFullYear()}-${pad2(now.getMonth()+1)}-${pad2(now.getDate())}_${pad2(now.getHours())}-${pad2(now.getMinutes())}-${pad2(now.getSeconds())}`;
  const names={de:'Zwischenreinigung',en:'Intermediate-Cleaning',ru:'Промежуточная-уборка'};
  const b=new Blob([JSON.stringify(p,null,2)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=`${names[lang]||names.en}-${y}_${stamp}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)
}
function importPlan(file){const r=new FileReader();r.onload=e=>{try{const data=JSON.parse(e.target.result);if(!data.year)throw new Error('missing year');pushUndo();const y=+data.year;if(data.settings){settings={...defaultsFor(data.settings.lang||lang),...data.settings};lang=settings.lang||lang;saveSettings()}(data.months||[]).forEach(m=>setExtra(y,+m.monthIndex,m.extra!==undefined?!!m.extra:m.type==='yellow'));if(data.assignments)Object.entries(data.assignments).forEach(([date,g])=>setGroup(y,date,g||''));else (data.months||[]).forEach(m=>(m.rows||[]).forEach(row=>setGroup(y,row.date,row.group||'')));if(![...yearSelect.options].some(o=>+o.value===y)){const o=document.createElement('option');o.value=y;o.textContent=y;yearSelect.appendChild(o)}yearSelect.value=y;applyLanguage();alert(t('imported'))}catch(err){alert(t('invalidFile')+' '+err.message)}};r.readAsText(file)}
function resetAll(){if(!confirm(t('resetConfirm')))return;pushUndo();for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k&&k.startsWith(NS)&&k!==UNDO_KEY)localStorage.removeItem(k)}settings=defaultsFor(lang);saveSettings();applyLanguage()}
initYears();yearSelect.addEventListener('change',()=>buildCalendar(+yearSelect.value));document.querySelectorAll('.lang-switch button').forEach(b=>b.addEventListener('click',()=>{const old=lang,newLang=b.dataset.lang;if(old===newLang)return;pushUndo();maybeTranslateDefaultGroups(old,newLang);lang=newLang;settings.lang=lang;if(settings.congregation===I18N[old].exampleCong)settings.congregation=I18N[newLang].exampleCong;saveSettings();applyLanguage()}));$('undoBtn').addEventListener('click',undoLast);$('settingsBtn').addEventListener('click',openSettings);document.querySelectorAll('.closeSettings').forEach(b=>b.addEventListener('click',()=>$('settingsDialog').close()));$('saveSettings').addEventListener('click',saveSettingsFromDialog);$('autoAssignBtn').addEventListener('click',openAutoAssign);document.querySelectorAll('.closeStart').forEach(b=>b.addEventListener('click',()=>$('startGroupDialog').close()));$('confirmAutoAssign').addEventListener('click',doAutoAssign);$('alternateBtn').addEventListener('click',openAlternate);document.querySelectorAll('.closeAlternate').forEach(b=>b.addEventListener('click',()=>$('alternateDialog').close()));$('confirmAlternate').addEventListener('click',doAlternate);$('resetBtn').addEventListener('click',resetAll);$('printBtn').addEventListener('click',()=>window.print());$('exportBtn').addEventListener('click',exportPlan);$('importBtn').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',e=>{if(e.target.files[0])importPlan(e.target.files[0]);e.target.value=''});applyLanguage();
</script>
</body></html>
