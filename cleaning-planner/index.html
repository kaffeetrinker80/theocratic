<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Icons + Manifest -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#f1f4f9">
<meta name="apple-mobile-web-app-title" content="Cleaning Planner">
<meta name="application-name" content="Assembly &amp; Convention Cleaning Planner">

<!-- Link-Vorschau -->
<meta property="og:type" content="website">
<meta property="og:title" content="Assembly &amp; Convention Cleaning Planner">
<meta property="og:description" content="Helps to organize the cleaning of the Assembly Hall during assemblies and conventions">
<meta property="og:url" content="https://kaffeetrinker80.github.io/theocratic/cleaning-planner/">
<meta property="og:image" content="https://kaffeetrinker80.github.io/theocratic/cleaning-planner/og-image.png">
<meta name="twitter:card" content="summary_large_image">

  <title>Cleaning Planner</title>
  <style>
    :root{
      color-scheme:light;
      --bg:#f3f5f7;
      --surface:#ffffff;
      --surface-2:#f8fafc;
      --text:#1f2937;
      --muted:#6b7280;
      --line:#d8e1ea;
      --primary:#1565c0;
      --primary-soft:#eaf2fd;
      --accent:#2e7d32;
      --warn:#ef6c00;
      --danger:#c62828;
      --chip:#eef3f8;
      --shadow:0 10px 28px rgba(15,23,42,.08);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
    body{padding:18px}
    .app{max-width:1800px;margin:0 auto}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .hero{padding:22px;margin-bottom:16px;background:linear-gradient(135deg,#fff 0%,#f4f8ff 100%)}
    .hero-top{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
    .hero-top > :first-child{flex:1 1 560px;min-width:0}
    .hero-top > :last-child{flex:0 0 340px}
    .hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:18px}
    .hero-simple{display:grid;gap:14px}
    .event-stack{display:grid;gap:12px}
    .hero-title-input{width:100%;border:0;border-bottom:2px solid #d7e4f2;border-radius:0;padding:0 0 8px;background:transparent;font-size:32px;font-weight:800;line-height:1.15;color:var(--text)}
    .hero-title-area{resize:none;overflow:hidden;white-space:normal;word-break:break-word;min-height:84px;font-family:Arial,Helvetica,sans-serif}
    .hero-title-input:focus{box-shadow:none;border-color:#90caf9}
    .hero-title-input::placeholder{color:#7b8794;opacity:1}
    .top-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-bottom:10px}
    .lang-switch{display:flex;gap:8px;justify-content:flex-end}
    .lang-btn{border:1px solid #cfe1f7;background:#fff;color:var(--primary);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer}
    .lang-btn.active{background:var(--primary);color:#fff}
    .event-stack input{font-size:18px;font-weight:700;padding:13px 14px}
    h2{margin:0 0 14px;font-size:18px}
    h3{margin:0 0 12px;font-size:16px}
    .sub{color:var(--muted);font-size:15px;margin-top:8px}
    .badge{display:grid;gap:6px;padding:14px 16px;border-radius:16px;border:1px solid #cfe1f7;background:var(--primary-soft);color:var(--primary);font-size:13px;font-weight:700;min-width:0;width:100%}
    .badge .big{font-size:14px;font-weight:800}
    .badge .small{font-size:12px;color:#35506f;font-weight:600}
    .section{padding:18px;margin-bottom:16px}
    .grid{display:grid;gap:14px}
    .grid-2{grid-template-columns:repeat(2,minmax(280px,1fr))}
    .summary{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:12px}
    .metric{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2)}
    .metric .k{color:var(--muted);font-size:12px;text-transform:uppercase;font-weight:700}
    .metric .v{font-size:26px;font-weight:800;margin-top:6px}
    .split{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}
    .overview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
    body.mode-rc{--primary:#00695c;--primary-soft:#e0f2ef}
    body.mode-rc .hero{background:linear-gradient(135deg,#fff 0%,#effaf7 100%)}
    .mode-switch{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 8px;box-shadow:var(--shadow);flex-wrap:wrap}
    .mode-label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 4px 0 10px}
    .mode-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:800;cursor:pointer}
    .mode-btn b{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--chip);color:var(--muted);align-items:center;justify-content:center;font-size:12px}
    .mode-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
    .mode-btn.active b{background:rgba(255,255,255,.28);color:#fff}
    .mode-ribbon{display:inline-flex;align-items:center;gap:10px;margin-top:12px;padding:9px 16px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-weight:800;font-size:13px;border:1px solid var(--primary);letter-spacing:.03em}
    .mode-ribbon .dot{width:9px;height:9px;border-radius:50%;background:var(--primary)}
    .msg-grid{display:grid;gap:14px}
    .msg-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
    .msg-nav{display:flex;align-items:center;gap:8px}
    .msg-status{display:flex;gap:8px;flex-wrap:wrap}
    .msg-status button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:8px 14px;font-size:12px;font-weight:800;cursor:pointer}
    .msg-status button.active{background:var(--primary);border-color:var(--primary);color:#fff}
    .cong-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .cong-form .full{grid-column:1/-1}
    .cong-form label{margin-bottom:6px}
    @media (max-width:700px){.cong-form{grid-template-columns:1fr}}
    @keyframes rowFlash{0%{background:#fff3b0}70%{background:#fff8d6}100%{background:transparent}}
    tr.row-flash > td{animation:rowFlash 2.2s ease-out}
    .slot-pill{padding:8px 10px;border-radius:999px;background:var(--primary-soft);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--primary)}
    .day-card{padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface-2)}
    .day-total{font-size:24px;font-weight:800;margin-bottom:8px}
    label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px}
    option,optgroup{background:#fff;color:#1f2937}
    input,textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14px;background:#fff;color:var(--text);outline:none}
    input:focus,textarea:focus,select:focus{border-color:#90caf9;box-shadow:0 0 0 3px rgba(21,101,192,.12)}
    textarea{min-height:110px;resize:vertical}
    button,.file-label{border:0;border-radius:12px;padding:11px 14px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .08s ease}
    button:hover,.file-label:hover{transform:translateY(-1px)}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    .primary{background:var(--primary);color:#fff}
    .secondary{background:#eef3f8;color:var(--text)}
    .success{background:#e8f5e9;color:var(--accent)}
    .warn{background:#fff3e0;color:var(--warn)}
    .danger{background:#ffebee;color:var(--danger)}
    .file-label input{display:none}
    .mini{font-size:12px;color:var(--muted)}
    .footer-note{color:var(--muted);font-size:12px;margin-top:12px}
    .search-row{display:grid;grid-template-columns:1.2fr .75fr .75fr 1fr 160px;gap:12px;align-items:end;margin-bottom:14px}
    .table-wrap,.schedule-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fff}
    table,.schedule-table{width:100%;border-collapse:collapse;min-width:980px}
    thead th,.schedule-table thead th{position:sticky;top:0;z-index:2;background:#edf4fb;color:#26415f;font-size:12px;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:12px 10px;border-bottom:1px solid var(--line)}
    tbody td,.schedule-table td{border-bottom:1px solid #edf1f4;padding:8px;vertical-align:top;font-size:14px}
    tbody tr:hover{background:#fafcff}
    .planner-table{table-layout:fixed;min-width:1180px}
    .planner-table col.c-cong{width:16%}
    .planner-table col.c-type{width:9%}
    .planner-table col.c-contact{width:20.5%}
    .planner-table col.c-pub{width:8%}
    .planner-table col.c-area{width:19%}
    .planner-table col.c-sugg{width:6.5%}
    .planner-table col.c-help{width:7%}
    .planner-table col.c-status{width:8.5%}
    .planner-table col.c-actions{width:5.5%}
    .planner-table th{white-space:normal;line-height:1.3}
    .planner-table input[type=number],.schedule-table input[type=number]{text-align:center;padding-left:6px;padding-right:6px}
    .planner-table .type-select{padding-left:8px;padding-right:8px}
    .schedule-table{table-layout:fixed}
    .schedule-table col.s-cong{width:20%}
    .schedule-table col.s-type{width:10%}
    .schedule-table col.s-help{width:7%}
    .schedule-table col.s-area{width:21%}
    .schedule-table col.s-slot{width:21%}
    .compact-stack,.stack{display:grid;gap:8px}
    .chips{display:flex;flex-wrap:wrap;gap:10px}
    .chip{border:1px solid var(--line);background:var(--chip);padding:12px;border-radius:14px;min-width:220px;display:grid;gap:8px}
    .chip b{display:block;font-size:14px}
    .chip span{color:var(--muted);font-size:12px}
    .tag-box{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
    .tag{padding:8px 10px;border-radius:999px;background:#eef3f8;border:1px solid var(--line);font-size:12px;font-weight:700}
    .message-box{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14px;line-height:1.5;min-height:190px}
    .tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
    .tab-btn{background:#eef3f8;color:var(--text)}
    .tab-btn.active{background:var(--primary);color:#fff}
    .tab-panel{display:none}
    .tab-panel.active{display:block}
    .type-select{font-weight:700;border-radius:999px;padding:9px 12px;text-align:center;border:1px solid var(--line);appearance:none;-webkit-appearance:none}
    .type-select.cong{background:#e3f2fd;color:#1565c0}
    .type-select.group{background:#fff8e1;color:#8d6e00}
    .status-select.no-reply{background:#eceff1;color:#455a64}
    .status-select.replied{background:#fff3e0;color:#ef6c00}
    .status-select.confirmed{background:#e8f5e9;color:#2e7d32}
    .small-btn{font-size:12px;padding:8px 10px}
    .scroll-top-btn{position:fixed;right:22px;bottom:22px;z-index:40;width:48px;height:48px;border-radius:999px;border:1px solid #cfe1f7;background:var(--primary);color:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:20px}
    .print-only{display:none}
    .day-section{padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface-2);margin-bottom:16px}
    .day-header{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
    .day-meta{color:var(--muted);font-size:13px}
    .assigned-badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#e8f5e9;color:#2e7d32;font-size:12px;font-weight:700}
    .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:5000}
    .modal-backdrop.show{display:flex}
    .modal{max-width:920px;width:100%;max-height:90vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
    .modal-header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
    .modal-body{padding:20px}
    .help-grid{display:grid;gap:14px}
    .help-card{border:1px solid var(--line);border-radius:16px;background:var(--surface-2);padding:14px}
    .help-card h4{margin:0 0 10px;font-size:15px}
    .help-card ul{margin:0;padding-left:18px}
    .help-card li{margin:6px 0}
    .close-btn{background:#eef3f8;color:var(--text)}

    .field-with-actions{position:relative}
    .field-with-actions input{padding-right:40px}
    .field-actions{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:6px}
    .mini-copy{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:8px;border:1px solid #d4dde7;background:#f7f9fc;color:#35506f;cursor:pointer;font-size:13px;line-height:1}
    .mini-copy:hover{background:#edf4fb}
    .preview-contact-card{margin-top:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#f8fafc}
    .preview-contact-title{font-size:13px;font-weight:800;color:#35506f;margin-bottom:10px}
    .preview-contact-grid{display:grid;gap:8px}
    .preview-contact-row{display:grid;grid-template-columns:120px 1fr 28px;gap:8px;align-items:center}
    .preview-contact-row .label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
    .preview-contact-value{min-height:38px;display:flex;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .footer-bar{margin:18px 0 4px;text-align:center;color:var(--muted);font-size:12px}
    @media(max-width:1280px){
      .hero-grid,.grid-2,.summary,.search-row,.split,.overview-grid{grid-template-columns:1fr}
      .hero-top > :last-child{flex:1 1 100%}
      body{padding:10px}
      .hero-title-input{font-size:24px}
    }
    @media print{
      body{background:#fff;padding:0}
      .card{box-shadow:none;border-color:#cfd8dc}
      .toolbar,.tabs,.hero,#tab-dashboard,#tab-areas,#tab-backup,.no-print,.modal-backdrop{display:none !important}
      .print-only{display:block}
      #tab-schedule{display:block !important}
      #tab-schedule .card{border:none}
      input,textarea,select{border:none;padding:0;background:transparent}
      .table-wrap,.schedule-wrap{overflow:visible;border-radius:0;border:none}
      table,.schedule-table{min-width:0;font-size:11.5px}
      .planner-table{table-layout:auto;min-width:0}
      thead th{position:static}
      .day-section{break-inside:avoid;page-break-inside:avoid;border:1px solid #cfd8dc;background:#fff}
    }
  </style>
</head>
<body>
<div class="app">
  <section class="card hero">
    <div class="top-actions no-print">
      <div class="mode-switch" id="modeSwitch">
        <span class="mode-label" id="modeLabelText"></span>
        <button class="mode-btn" id="modeBtn-assembly" onclick="setMode('assembly')"><b>1</b><span id="modeBtnText-assembly"></span></button>
        <button class="mode-btn" id="modeBtn-rc" onclick="setMode('rc')"><b>3</b><span id="modeBtnText-rc"></span></button>
      </div>
      <div class="lang-switch">
        <button class="lang-btn active" id="langBtn-en" onclick="setLanguage('en')">EN</button>
        <button class="lang-btn" id="langBtn-de" onclick="setLanguage('de')">DE</button>
      </div>
      <button class="secondary" onclick="openHelp()" data-i18n="helpButton">Help</button>
    </div>

    <div class="hero-top">
      <div>
        <textarea id="plannerTitle" class="hero-title-input hero-title-area" rows="2">Assembly Cleaning Planner</textarea>
        <div class="sub" id="heroSubline"></div>
        <div class="mode-ribbon no-print" id="modeRibbon"><span class="dot"></span><span id="modeRibbonText"></span></div>
      </div>
      <div class="badge" id="badgePreview">
        <div class="big" id="badgeBig"></div>
        <div class="small" id="badgeLine1"></div>
        <div class="small" id="badgeLine2"></div>
      </div>
    </div>

    <div class="hero-grid">
      <div class="hero-simple">
        <div class="event-stack">
          <div>
            <label for="eventName" data-i18n="eventNameLabel"></label>
            <input id="eventName" value="Circuit Assembly 2026">
          </div>
          <div>
            <label for="eventDate" data-i18n="eventDateLabel"></label>
            <input id="eventDate">
          </div>
        </div>
        <div class="grid grid-2">
          <div>
            <label for="venue" data-i18n="venueLabel"></label>
            <input id="venue" value="Assembly Hall">
          </div>
          <div>
            <label for="targetHelpers" data-i18n="targetHelpersLabel"></label>
            <input id="targetHelpers" type="number" min="0" value="100">
          </div>
        </div>
      </div>

      <div class="card section" style="margin:0">
        <h3 data-i18n="toolNoteTitle"></h3>
        <div class="mini" data-i18n="toolNoteText"></div>
        <div style="margin-top:14px">
          <label for="assemblySubtitle" data-i18n="subtitleLabel"></label>
          <input id="assemblySubtitle" value="Simple overview for congregation and group coordination">
        </div>
        <div class="footer-note" id="privacyNote"></div>
      </div>
    </div>

    <div class="toolbar no-print">
      <button class="primary" onclick="openCongModal()" data-i18n="addRow" title="N"></button>
      <button class="secondary" onclick="sortRowsManual()" id="sortAzBtn"></button>
      <button class="secondary" onclick="printDayOverview()" data-i18n="printOverview"></button>
      <button class="warn" onclick="resetPlanning()" data-i18n="resetPlanning"></button>
      <button class="danger" onclick="clearAllRows()" data-i18n="clearAllRows"></button>
    </div>
  </section>

  <div class="tabs no-print">
    <button class="tab-btn active" id="tabBtn-dashboard" onclick="showTab('dashboard')"></button>
    <button class="tab-btn" id="tabBtn-areas" onclick="showTab('areas')"></button>
    <button class="tab-btn" id="tabBtn-schedule" onclick="showTab('schedule')"></button>
    <button class="tab-btn" id="tabBtn-backup" onclick="showTab('backup')"></button>
  </div>

  <div class="tab-panel active" id="tab-dashboard">
    <section class="card section">
      <h2 data-i18n="quickOverview"></h2>
      <div class="summary">
        <div class="metric"><div class="k" id="metricEntriesLabel"></div><div class="v" id="mEntries">0</div></div>
        <div class="metric"><div class="k" id="metricCongsLabel"></div><div class="v" id="mCongs">0</div></div>
        <div class="metric"><div class="k" id="metricGroupsLabel"></div><div class="v" id="mGroups">0</div></div>
        <div class="metric"><div class="k" id="metricPublishersLabel"></div><div class="v" id="mPublishers">0</div></div>
        <div class="metric"><div class="k" id="metricSuggestedLabel"></div><div class="v" id="mSuggested">0</div></div>
        <div class="metric"><div class="k" id="metricHelpersLabel"></div><div class="v" id="mHelpers">0</div></div>
        <div class="metric"><div class="k" id="metricOpenLabel"></div><div class="v" id="mOpen">0</div></div>
      </div>
    </section>

    <section class="card section">
      <h2 data-i18n="plannerSection"></h2>
      <div class="search-row no-print">
        <div>
          <label for="searchBox" data-i18n="searchLabel"></label>
          <input id="searchBox" oninput="renderTable()">
        </div>
        <div>
          <label for="filterType" data-i18n="typeLabel"></label>
          <select id="filterType" onchange="renderTable()"></select>
        </div>
        <div>
          <label for="filterStatus" data-i18n="statusLabel"></label>
          <select id="filterStatus" onchange="renderTable()"></select>
        </div>
        <div>
          <label for="bulkArea" data-i18n="bulkAreaLabel"></label>
          <input id="bulkArea" list="areas">
        </div>
        <div>
          <button class="secondary" style="margin-top:22px" onclick="fillEmptyAreas()" id="fillEmptyAreasBtn"></button>
        </div>
      </div>

      <div class="table-wrap">
        <table class="planner-table">
          <colgroup>
            <col class="c-cong"><col class="c-type"><col class="c-contact"><col class="c-pub"><col class="c-area">
            <col class="c-sugg"><col class="c-help"><col class="c-status"><col class="c-actions no-print">
          </colgroup>
          <thead>
            <tr>
              <th id="thCong"></th>
              <th id="thType"></th>
              <th id="thContact"></th>
              <th id="thPublishers"></th>
              <th id="thArea"></th>
              <th id="thSuggested"></th>
              <th id="thHelpers"></th>
              <th id="thStatus"></th>
              <th class="no-print" id="thActions"></th>
            </tr>
          </thead>
          <tbody id="plannerBody"></tbody>
        </table>
      </div>
      <div class="footer-note" id="plannerFootnote"></div>
    </section>

    <section class="card section">
      <h2 data-i18n="areaOverview"></h2>
      <div class="chips" id="areaSummary"></div>
      <div class="footer-note" id="areaOverviewFootnote"></div>
    </section>

    <section class="card section">
      <h2 data-i18n="messageTemplate"></h2>
      <div class="split">
        <div>

function md(lang, key){
  const o = MODE_I18N[MODE] && MODE_I18N[MODE][lang];
  return (o && o[key] !== undefined) ? o[key] : I18N[lang][key];
}
function t(key){
  const lang = (state && state.meta && state.meta.language) || 'en';
  return md(lang, key) ?? key;
}
function el(id){ return document.getElementById(id); }
function esc(str){ return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function js(str){ return String(str ?? '').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' '); }
function statusClass(status){ return String(status || 'No reply').toLowerCase().replace(/\s+/g,'-'); }
function autoResizeTitle(){ const t = el('plannerTitle'); if(!t) return; t.style.height='auto'; t.style.height=Math.max(92, t.scrollHeight) + 'px'; }

function getDefaultMessageTemplate(lang){
  const l = lang || 'en';
  return `${md(l,'messageDear')}\n\n${md(l,'messageLine1')}\n\n${md(l,'messageLine2')}\n\n${md(l,'messageLine3')}\n\n${md(l,'messageLine4')}\n[RESPONSIBLE]`;
}

function defaultState(){
  return {
    meta:{
      language:'en',
      plannerTitle: MODE === 'rc' ? 'Cleaning Department Planner - RC Edition' : 'Assembly Cleaning Planner',
      eventName: MODE === 'rc' ? 'Regional Convention 2026' : 'Circuit Assembly 2026',
      eventDate:'',
      venue: MODE === 'rc' ? 'Convention venue' : 'Assembly Hall',
      targetHelpers:100,
      assemblySubtitle:I18N.en.heroSublineDefault,
      generalInstructions:'Congregations and groups can be assigned to seating sections, corridors, offices, restrooms, exterior grounds and similar cleaning areas for the Assembly. Cleaning should be organized, loving and safety-conscious.',
      defaultMessageEn:getDefaultMessageTemplate('en'),
      defaultMessageDe:getDefaultMessageTemplate('de'),
      notesBox:'',
      responsibleName:'Cleaning Department',
      lastImportText:'',
      lastSavedAt:''
    },
    areaOptions: structuredClone(DEFAULT_AREA_OPTIONS),
    slotOptions: defaultSlotOptions('en'),
    rows: structuredClone(INITIAL_ROWS),
    dayPlan: {}
  };
}

let state = loadState();
let selectedRowIndex = null;
normalizeState();

function loadState(){
  const raw = localStorage.getItem(STORAGE());
  if(!raw) return defaultState();
  try{
    return stateFromData(JSON.parse(raw));
  }catch{
    return defaultState();
  }
}

function stateFromData(data){
  const def = defaultState();
  return {
    meta: { ...def.meta, ...(data.meta || {}) },
    areaOptions: Array.isArray(data.areaOptions) && data.areaOptions.length ? data.areaOptions : structuredClone(DEFAULT_AREA_OPTIONS),
    slotOptions: Array.isArray(data.slotOptions) && data.slotOptions.length ? data.slotOptions : defaultSlotOptions((data.meta && data.meta.language) || 'en'),
    rows: Array.isArray(data.rows) && data.rows.length ? data.rows.map(normalizeRow) : structuredClone(INITIAL_ROWS),
    dayPlan: extractDayPlan(data)
  };
}

/* accepts the new dayPlan format and both legacy formats
   (v1.5 assembly: data.dayOverview / v1.5 RC edition: friArea, satTime1 ... on each row) */
function extractDayPlan(data){
  const plan = {};
  if(data && data.dayPlan && typeof data.dayPlan === 'object'){
    Object.keys(data.dayPlan).forEach(k => { if(Array.isArray(data.dayPlan[k])) plan[k] = data.dayPlan[k].map(normalizePlanRow); });
  }
  if(Array.isArray(data?.dayOverview) && !plan.d1) plan.d1 = data.dayOverview.map(normalizePlanRow);
  const rows = Array.isArray(data?.rows) ? data.rows : [];
  ['fri','sat','sun'].forEach(k => {
    if(plan[k]) return;
    const has = rows.some(r => (r?.[k+'Area'] || r?.[k+'Time1'] || r?.[k+'Time2']));
    if(has) plan[k] = rows.map(r => ({ area: r?.[k+'Area'] || '', time1: r?.[k+'Time1'] || '', time2: r?.[k+'Time2'] || '' }));
  });
  return plan;
}

function planKeysInData(data){
  const plan = extractDayPlan(data);
  return Object.keys(plan).filter(k => plan[k].some(p => p.area || p.time1 || p.time2));
}

function normalizeState(){
  const def = defaultState();
  state.meta = { ...def.meta, ...(state.meta || {}) };
  state.meta.language = ['en','de'].includes(state.meta.language) ? state.meta.language : 'en';
  state.meta.defaultMessageEn = state.meta.defaultMessageEn || getDefaultMessageTemplate('en');
  state.meta.defaultMessageDe = state.meta.defaultMessageDe || getDefaultMessageTemplate('de');
  state.areaOptions = Array.isArray(state.areaOptions) && state.areaOptions.length ? [...new Set(state.areaOptions.map(v => String(v || '').trim()).filter(Boolean))] : structuredClone(DEFAULT_AREA_OPTIONS);
  state.slotOptions = Array.isArray(state.slotOptions) && state.slotOptions.length ? [...new Set(state.slotOptions.map(v => String(v || '').trim()).filter(Boolean))] : defaultSlotOptions();
  state.rows = Array.isArray(state.rows) && state.rows.length ? state.rows.map(normalizeRow) : structuredClone(INITIAL_ROWS).map(normalizeRow);
  normalizeDayPlan();
}

function normalizeDayPlan(){
  if(!state.dayPlan || typeof state.dayPlan !== 'object') state.dayPlan = {};
  dayKeys().forEach(key => {
    const arr = Array.isArray(state.dayPlan[key]) ? state.dayPlan[key].map(normalizePlanRow) : [];
    while(arr.length < state.rows.length) arr.push(normalizePlanRow({}));
    state.dayPlan[key] = arr.slice(0, state.rows.length);
  });
}

function planFor(key){ if(!Array.isArray(state.dayPlan[key])) normalizeDayPlan(); return state.dayPlan[key]; }
function planRow(key, index){ const arr = planFor(key); if(!arr[index]) arr[index] = normalizePlanRow({}); return arr[index]; }
function eachDay(fn){ dayKeys().forEach(fn); }

function normalizeRow(row){
  return {
    congregation: row.congregation || '',
    type: row.type === 'Group' ? 'Group' : 'Congregation',
    congJwpub: row.congJwpub || '',
    coordinator: row.coordinator || '',
    jwpub: row.jwpub || '',
    mobile: row.mobile || '',
    publishers: Number(row.publishers || 0),
    area: row.area || '',
    helpers: Number(row.helpers || 0),
    status: ['No reply','Replied','Confirmed'].includes(row.status) ? row.status : 'No reply'
  };
}

function normalizePlanRow(row){
  return { area: row?.area || '', time1: row?.time1 || '', time2: row?.time2 || '' };
}

function currentTemplate(){ return state.meta.language === 'de' ? state.meta.defaultMessageDe : state.meta.defaultMessageEn; }
function setCurrentTemplate(value){ if(state.meta.language === 'de') state.meta.defaultMessageDe = value; else state.meta.defaultMessageEn = value; }
function getPublisherRows(){ return state.rows.filter(r => Number(r.publishers || 0) > 0); }
function calcSuggestedHelpers(row){
  const publisherRows = getPublisherRows();
  const totalPublishers = publisherRows.reduce((sum,r)=>sum + Number(r.publishers || 0),0);
  const target = Number(state.meta.targetHelpers || 0);
  const publishers = Number(row?.publishers || 0);
  if(!totalPublishers || !target || !publishers) return 0;
  return Math.round((publishers / totalPublishers) * target);
}
function formatStamp(iso){ if(!iso) return t('notYet'); try{return new Date(iso).toLocaleString(state.meta.language === 'de' ? 'de-DE' : 'en-GB');}catch{return iso;} }

function writeMetaToInputs(){
  ['plannerTitle','eventName','eventDate','venue','targetHelpers','assemblySubtitle','generalInstructions','notesBox'].forEach(id => { if(el(id)) el(id).value = state.meta[id] ?? ''; });
  el('defaultMessage').value = currentTemplate();
  el('areaEditor').value = state.areaOptions.join('\n');
  el('slotEditor').value = state.slotOptions.join('\n');
}

function syncMetaFromInputs(){
  ['plannerTitle','eventName','eventDate','venue','targetHelpers','assemblySubtitle','generalInstructions','notesBox'].forEach(id => {
    if(el(id)) state.meta[id] = id === 'targetHelpers' ? Number(el(id).value || 0) : el(id).value;
  });
  if(el('defaultMessage')) setCurrentTemplate(el('defaultMessage').value);
}

function saveState(){
  syncMetaFromInputs();
  state.meta.lastSavedAt = new Date().toISOString();
  localStorage.setItem(STORAGE(), JSON.stringify(state, null, 2));
  refreshHeader();
  updateMetrics();
  renderAreaSummary();
  renderAreaEditorPreview();
  renderSlotEditorPreview();
  refreshAreaDatalist();
  refreshSlotDatalist();
  renderScheduleTab();
  updateBackupInfo();
}

function renderScheduleTab(){
  normalizeDayPlan();

  const areaFilter = (el('dayOverviewAreaFilter')?.value || '').trim().toLowerCase();
  const wrap = el('daySectionsWrap');
  if(!wrap) return;

  let assigned = 0, helperSum = 0;
  const coveredAreas = new Set();
  const dayStats = {};

  const sections = dayKeys().map(key => {
    const plan = planFor(key);
    let dayAssigned = 0, dayHelpers = 0;
    const bodyRows = [];

    state.rows.forEach((row,index) => {
      const p = plan[index] || normalizePlanRow({});
      const hay = [row.congregation,row.type,p.area,p.time1,p.time2].join(' ').toLowerCase();
      const visible = (!q || hay.includes(q)) && (!areaFilter || (p.area || '').toLowerCase().includes(areaFilter));
      const helpers = Number(row.helpers || 0);
      if(isPlanned(p)){
        dayAssigned += 1; dayHelpers += helpers;

      }
      if(!visible) return;
      bodyRows.push(`

          <td><b>${esc(row.congregation || t('previewFallbackCong'))}</b></td>

          <td><input list="slots" value="${esc(p.time1 || '')}" oninput="updateDayPlan('${key}', ${index}, 'time1', this.value, this)" placeholder="${esc(t('slotPlaceholder'))}"></td>

        </tr>`);
    });

    assigned += dayAssigned; helperSum += dayHelpers;
    dayStats[key] = { assigned: dayAssigned, helpers: dayHelpers };
    const plural = dayAssigned === 1 ? t('assignment') : t('assignments');

    return `
      <div class="day-section">
        <div class="day-header">
          <div>
            <h3>${esc(t('day_' + key))}</h3>
            <div class="day-meta">${dayAssigned} ${esc(plural)} \u00b7 ${dayHelpers} ${esc(t('assignedHelpers'))}</div>
          </div>
          <div class="assigned-badge">${esc(t('anchoredBadge'))}</div>
        </div>
        <div class="schedule-wrap">
          <table class="schedule-table">
            <colgroup><col class="s-cong"><col class="s-type"><col class="s-help"><col class="s-area"><col class="s-slot"><col class="s-slot"></colgroup>
            <thead>
              <tr>
                <th>${esc(t('thCong'))}</th>
                <th>${esc(t('thType'))}</th>
                <th>${esc(t('thHelpers'))}</th>
                <th>${esc(t('areaWhere'))}</th>
                <th>${esc(t('timeSlot1'))}</th>
                <th>${esc(t('timeSlot2'))}</th>
              </tr>
            </thead>
            <tbody>${bodyRows.join('')}</tbody>
          </table>
        </div>
      </div>`;
  });

  wrap.innerHTML = sections.join('');

  const cards = el('dayCards');
  if(cards){
    cards.innerHTML = dayKeys().map(key => `
      <div class="day-card">
        <h3>${esc(t('day_' + key))}</h3>
        <div class="day-total">${dayStats[key].helpers}</div>
        <div class="mini">${dayStats[key].assigned} ${esc(t('dayCardAssignments'))} \u00b7 ${esc(t('assignedHelpersMini'))}</div>
      </div>`).join('');
  }

  const dayCount = dayKeys().length;
  el('dAssigned').textContent = assigned;
  el('dHelpers').textContent = helperSum;
  el('dAreas').textContent = coveredAreas.size;
  el('dOpen').textContent = Math.max(0, state.rows.length * dayCount - assigned);

  el('printScheduleTitle').textContent = state.meta.plannerTitle || (state.meta.language === 'de' ? 'Reinigungs-Planer' : 'Cleaning Planner');
  const bits = [state.meta.eventName || '', state.meta.eventDate || '', state.meta.venue || ''].filter(Boolean);
  const metaBits = [];
  if(bits.length) metaBits.push(bits.join(' \u00b7 '));
  metaBits.push(`${assigned} ${assigned === 1 ? t('assignment') : t('assignments')}`);
  metaBits.push(`${helperSum} ${t('metricHelpers').toLowerCase()}`);
  el('printScheduleSubtitle').textContent = metaBits.join(' \u00b7 ');
}

function renderScheduleSummaryOnly(){
  let assigned = 0, helperSum = 0;
  const coveredAreas = new Set();
  const stats = {};
  dayKeys().forEach(key => {
    const plan = planFor(key);
    let a = 0, h = 0;
    state.rows.forEach((row,index) => {
      const p = plan[index];
      if(isPlanned(p)){ a += 1; h += Number(row.helpers || 0); if((p.area || '').trim()) coveredAreas.add((p.area || '').trim()); }
    });
    stats[key] = { assigned:a, helpers:h }; assigned += a; helperSum += h;
  });
  el('dAssigned').textContent = assigned;
  el('dHelpers').textContent = helperSum;
  el('dAreas').textContent = coveredAreas.size;
  el('dOpen').textContent = Math.max(0, state.rows.length * dayKeys().length - assigned);

  if(cards) cards.innerHTML = dayKeys().map(key => `
      <div class="day-card">
        <h3>${esc(t('day_' + key))}</h3>
        <div class="day-total">${stats[key].helpers}</div>

  });
}

/* ===================== A-Z sorting (rows + all day plans stay in sync) ===================== */
function sortRows(){
  const collator = new Intl.Collator('de', { sensitivity:'base', numeric:true });
  const order = state.rows.map((_, i) => i).sort((a, b) => {
    const A = String(state.rows[a].congregation || '').trim();
    const B = String(state.rows[b].congregation || '').trim();
    if(!A && B) return 1;
    if(A && !B) return -1;
    return collator.compare(A, B) || a - b;
  });
  state.rows = order.map(i => state.rows[i]);
  Object.keys(state.dayPlan || {}).forEach(k => {
    const arr = state.dayPlan[k];
    if(Array.isArray(arr)) state.dayPlan[k] = order.map(i => arr[i] || normalizePlanRow({}));
  });
  if(selectedRowIndex !== null){
    const pos = order.indexOf(selectedRowIndex);
    selectedRowIndex = pos < 0 ? null : pos;
  }
  return order;
}

}

function buildMessage(row){
  const tpl = currentTemplate();
  const suggested = calcSuggestedHelpers(row);
  const areaLine = row.area ? t('messageAreaLine').replace('[AREA]', row.area) : t('messageAreaLater');
  return tpl
    .replaceAll('[TARGET]', Number(state.meta.targetHelpers || 0))
    .replaceAll('[SUGGESTED]', suggested)
    .replaceAll('[AREA_LINE]', areaLine)
    .replaceAll('[RESPONSIBLE]', state.meta.responsibleName || 'Cleaning Department');
}

function flashBadge(msg){ const line = el('badgeLine1'); const old = line.textContent; line.textContent = msg; setTimeout(() => { line.textContent = state.meta.lastImportText || t('noImportYet'); }, 900); }

function slugify(value){
  return String(value || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\u00df/g, 'ss')
    .replace(/[^a-zA-Z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 48);
}

function saveJson(){
  syncMetaFromInputs();
  const payload = { exportedAt: new Date().toISOString(), app: 'Cleaning Planner', mode: MODE, version: APP_VERSION, ...state };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  a.href = URL.createObjectURL(blob);
  a.download = `${MODE === 'rc' ? 'RC' : 'Assembly'}-${slugify(state.meta.eventName) || 'event'}-cleaning-planner-${stamp}.json`;
  a.click(); URL.revokeObjectURL(a.href);
}

let pendingImport = null;
let importTarget = MODE;

function loadJsonFile(event){
  const file = event.target.files?.[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const data = JSON.parse(String(e.target.result));
      pendingImport = { data, name: file.name };
      importTarget = detectMode(data) || MODE;
      openImportModal();
    }catch{ alert(t('invalidJson')); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function detectMode(data){
  if(data?.mode === 'rc' || data?.mode === 'assembly') return data.mode;
  const keys = planKeysInData(data);
  if(keys.some(k => ['fri','sat','sun'].includes(k))) return 'rc';
  if(keys.includes('d1')) return 'assembly';
  if(Array.isArray(data?.dayOverview)) return 'assembly';
  return null;
}

  if(!pendingImport) return;
  const data = pendingImport.data;
  const detected = detectMode(data);
  const keys = planKeysInData(data);
  const dayNames = keys.length ? keys.map(k => t('day_' + k)).join(', ') : '\u2014';
  el('importModalTitle').textContent = t('importTitle');
  el('importModalSub').textContent = t('importSub');

    [t('importDays'), dayNames],
    [t('importDetected'), detected ? (detected === 'rc' ? t('modeRc') : t('modeAssembly')) : '\u2014']
  ];
  el('importFileInfo').innerHTML = info.map(([label, value]) => `

/* keeps a single-day plan usable when restored into the 3-day slot and vice versa */
function remapPlanForMode(plan){
  const filled = k => Array.isArray(plan[k]) && plan[k].some(p => p.area || p.time1 || p.time2);
  const out = {};
  dayKeys().forEach(k => { if(Array.isArray(plan[k])) out[k] = plan[k]; });
  if(MODE === 'assembly' && !filled('d1')){
    const src = ['fri','sat','sun'].find(filled);
    if(src) out.d1 = plan[src];
  }
  if(MODE === 'rc' && !filled('fri') && filled('d1')) out.fri = plan.d1;
  return out;
}

function confirmImport(){
  if(!pendingImport) return;
  const { data, name } = pendingImport;
  const target = importTarget;
  closeImportModal();
  if(target !== MODE) applyMode(target);
  state = stateFromData(data);
  state.dayPlan = remapPlanForMode(extractDayPlan(data));
  state.meta.lastImportText = `${t('imported')}: ${name}`;
  selectedRowIndex = null;

      ]};
  return [extra[0], ...middle, extra[1], extra[2], congCard];
}
function openHelp(){ el('helpModal').classList.add('show'); }
function closeHelp(){ el('helpModal').classList.remove('show'); }
function setLanguage(lang){
  if(!['en','de'].includes(lang)) return;
  syncMetaFromInputs();
  state.meta.language = lang;
  if(!state.meta.assemblySubtitle || state.meta.assemblySubtitle === I18N.en.heroSublineDefault || state.meta.assemblySubtitle === I18N.de.heroSublineDefault){ state.meta.assemblySubtitle = t('heroSublineDefault'); }
  writeMetaToInputs();
  applyTranslations();
  refreshHeader();
  renderTable();
  renderScheduleTab();
  if(selectedRowIndex !== null && state.rows[selectedRowIndex]) previewRowBox(selectedRowIndex); else el('previewBox').textContent = t('previewDefault');
  refreshSlotDatalist();
  renderSlotEditorPreview();
  applyModeStyles();
  if(msgOpen) renderMsgModal();
  saveState();
}

writeMetaToInputs();
autoResizeTitle();
['plannerTitle','eventName','eventDate','venue','targetHelpers','assemblySubtitle','generalInstructions','notesBox','defaultMessage'].forEach(id => {
  if(el(id)) el(id).addEventListener('input', () => { if(id === 'plannerTitle') autoResizeTitle(); if(id === 'defaultMessage') setCurrentTemplate(el('defaultMessage').value); saveState(); if(selectedRowIndex !== null && state.rows[selectedRowIndex]) previewRowBox(selectedRowIndex); });
});

window.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeHelp(); closeMsgModal(); closeImportModal(); closeCongModal(); return; }
  if(congOpen){
    if(e.key === 'Enter' && (e.target.tagName || '').toLowerCase() === 'input'){ e.preventDefault(); saveCongModal(false); }
    return;
  }
  const typing = ['input','textarea','select'].includes((e.target && e.target.tagName || '').toLowerCase()) || (e.target && e.target.isContentEditable);
  const anyModal = document.querySelector('.modal-backdrop.show');
  if(!typing && !anyModal && (e.key === 'n' || e.key === 'N') && !e.ctrlKey && !e.metaKey && !e.altKey){
    e.preventDefault(); openCongModal(); return;
  }
  if(!msgOpen) return;
  const tag = (e.target && e.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if(e.key === 'ArrowLeft'){ e.preventDefault(); msgNav(-1); }
  if(e.key === 'ArrowRight'){ e.preventDefault(); msgNav(1); }
});
el('helpModal').addEventListener('click', e => { if(e.target === el('helpModal')) closeHelp(); });
el('msgModal').addEventListener('click', e => { if(e.target === el('msgModal')) closeMsgModal(); });
el('importModal').addEventListener('click', e => { if(e.target === el('importModal')) closeImportModal(); });
el('congModal').addEventListener('click', e => { if(e.target === el('congModal')) closeCongModal(); });

applyModeStyles();
applyTranslations();
refreshHeader();
refreshAreaDatalist();
refreshSlotDatalist();
renderAreaEditorPreview();
renderSlotEditorPreview();
renderTable();
renderScheduleTab();
el('previewBox').textContent = t('previewDefault');
el('previewBox').textContent = t('previewDefault');
clearPreviewContacts();
saveState();
</script>
</body>
</html>
